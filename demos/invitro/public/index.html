<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Vitro · CustomERP</title>
<meta name="description" content="Sistema de gestión para producción de embriones bovinos in vitro: OPU, FIV, embriones, transferencia y diagnóstico de preñez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23262D33'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2300A5CE' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2300A5CE'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F1F5F8; --panel:#FFFFFF; --panel-2:#F7FAFC;
  --ink:#16222A; --ink-2:#51636E; --ink-3:#8496A1;
  --line:#E2EAEF; --line-2:#CFDCE4;
  --brand:#00A5CE; --brand-deep:#0A7A99; --brand-dark:#065C74;
  --brand-soft:#E2F4FA; --brand-soft-2:#C4E9F4;
  --carbon:#262D33; --carbon-2:#333C44; --carbon-3:#98A6B0; --carbon-line:#3C464E;
  --ok:#0F9B76; --ok-soft:#E0F4EE;
  --warn:#C9821A; --warn-soft:#FBF0DC;
  --bad:#CE4F48; --bad-soft:#FAE5E3;
  --info:#4372C4; --info-soft:#E8EEFA;
  --r-sm:7px; --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(22,34,42,.05);
  --sh-md:0 4px 14px rgba(22,34,42,.08);
  --sh-lg:0 14px 44px rgba(22,34,42,.20);
  --nav-w:250px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-deep);text-decoration:none}
a:hover{text-decoration:underline}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.16em;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-lg{width:1.6em;height:1.6em}
.ic-xl{width:2.4em;height:2.4em;stroke-width:1.5}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%;overflow:hidden}
.cuerpo{display:grid;grid-template-columns:var(--nav-w) 1fr;overflow:hidden;min-height:0}
.main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.contenido{padding:20px 24px 12px;flex:1}
.contenido>section{margin-bottom:18px}

/* ---------- barra superior ---------- */
.topbar{background:var(--carbon);color:#fff;display:flex;align-items:center;gap:14px;
  padding:0 16px;height:58px;position:relative;z-index:30;min-width:0}
.topbar>*{min-width:0}
.marca{display:flex;align-items:center;gap:9px;padding-right:14px;margin-right:2px;
  border-right:1px solid var(--carbon-line);height:34px}
.marca .logo{width:28px;height:28px;flex:none}
.marca b{font-weight:800;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.marca small{display:block;color:var(--carbon-3);font-size:9.5px;letter-spacing:.1em;
  font-weight:600;margin-top:-3px}
.topbar .sep{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;background:var(--carbon-2);color:#E6ECF0;
  border:1px solid var(--carbon-line);border-radius:var(--r);padding:7px 11px;cursor:pointer;
  font-size:12.5px;font-weight:600;transition:background .15s,border-color .15s;white-space:nowrap}
.tb-btn:hover{background:#3E4951;border-color:#4E5961}
.tb-buscar{display:flex;align-items:center;gap:8px;background:var(--carbon-2);
  border:1px solid var(--carbon-line);border-radius:var(--r);padding:0 11px;height:34px;
  color:var(--carbon-3);cursor:pointer;min-width:230px;transition:border-color .15s}
.tb-buscar:hover{border-color:#5A666F}
.tb-buscar span{flex:1;text-align:left;font-size:12.5px}
.tb-buscar kbd{background:#454F57;border-radius:5px;padding:2px 6px;font-size:10.5px;
  font-family:inherit;font-weight:600;color:#C7D0D6}
.modo{display:flex;background:var(--carbon-2);border:1px solid var(--carbon-line);
  border-radius:var(--r);padding:3px;gap:2px}
.modo button{background:none;border:0;border-radius:7px;padding:5px 11px;cursor:pointer;
  color:var(--carbon-3);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;
  transition:background .15s,color .15s}
.modo button:hover{color:#fff}
.modo button[aria-pressed="true"]{background:var(--brand);color:#fff}
.hamb{display:none;background:var(--carbon-2);border:1px solid var(--carbon-line);
  border-radius:var(--r);width:34px;height:34px;align-items:center;justify-content:center;
  color:#fff;cursor:pointer}

/* ---------- navegación ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;
  padding:12px 10px 26px;min-height:0}
.nav-grupo{margin-bottom:14px}
.nav-tit{font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--ink-3);
  padding:0 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:0;
  padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-size:13px;
  font-weight:500;text-align:left;transition:background .13s,color .13s;position:relative}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--brand-soft);color:var(--brand-dark);font-weight:700}
.nav-item .txt{flex:1;min-width:0;line-height:1.28}
.nav-item .ic,.nav-item .paso-n{margin-top:1px}
.nav-item .pill{background:var(--line);margin-top:1px;color:var(--ink-2);border-radius:999px;padding:1px 7px;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.nav-item[aria-current="page"] .pill{background:var(--brand);color:#fff}
.nav-item .pill.alerta{background:var(--bad-soft);color:var(--bad)}
.paso-n{width:20px;height:20px;flex:none;border-radius:6px;background:var(--carbon);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.nav-item[aria-current="page"] .paso-n{background:var(--brand)}
.nav-proceso{border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 6px;
  background:linear-gradient(180deg,var(--brand-soft) 0%,#fff 62%)}
.nav-proceso .nav-tit{padding-left:8px}

/* ---------- encabezado de vista ---------- */
.vista-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:18px 24px 0}
.vista-head .tit h1{font-size:21px}
.vista-head .tit p{color:var(--ink-2);font-size:12.5px;margin-top:3px;max-width:78ch}
.vista-head .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.miga{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11.5px;
  font-weight:600;margin-bottom:5px}
.miga button{background:none;border:0;padding:0;color:var(--brand-deep);cursor:pointer;
  font-weight:600;font-size:11.5px}
.miga button:hover{text-decoration:underline}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--ink);border-radius:var(--r);padding:8px 13px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:background .14s,border-color .14s,box-shadow .14s;
  white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--line-2);box-shadow:var(--sh)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.carbon{background:var(--carbon);border-color:var(--carbon);color:#fff}
.btn.carbon:hover{background:var(--carbon-2)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ico{width:32px;height:32px;padding:0;justify-content:center}

/* ---------- tarjetas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px}
.card-h p{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.card-h .acc{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px 18px}
.card-b.p0{padding:0}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}

/* ---------- indicadores ---------- */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
  box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .et{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:11px;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.kpi.acento{background:linear-gradient(135deg,var(--brand-deep),var(--brand));border-color:transparent;color:#fff}
.kpi.acento .et,.kpi.acento .d{color:rgba(255,255,255,.82)}
.kpi.clic{cursor:pointer;transition:transform .14s,box-shadow .14s}
.kpi.clic:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}

/* ---------- tablas ---------- */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:700;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--panel-2);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
tr.clic{cursor:pointer;transition:background .12s}
tr.clic:hover{background:var(--brand-soft)}
.t-compacta td,.t-compacta th{padding:7px 10px}
.t-cero th{position:static}
td b{font-weight:600}
.sub{color:var(--ink-3);font-size:11px;display:block;line-height:1.35}

/* ---------- píldoras y chips ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;
  font-size:11px;font-weight:700;white-space:nowrap;background:var(--line);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.brand{background:var(--brand-soft);color:var(--brand-dark)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.carbon{background:var(--carbon);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2);transition:all .13s}
.chip:hover{border-color:var(--brand);color:var(--brand-deep)}
.chip[aria-pressed="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
.punto{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ---------- avisos ---------- */
.aviso{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;background:var(--panel-2);font-size:12.5px}
.aviso .ic{color:var(--ink-3);margin-top:1px}
.aviso b{display:block;margin-bottom:1px}
.aviso.warn{background:var(--warn-soft);border-color:#EFDCB6;color:#6B4A0E}
.aviso.warn .ic{color:var(--warn)}
.aviso.bad{background:var(--bad-soft);border-color:#F2CBC8;color:#7A2621}
.aviso.bad .ic{color:var(--bad)}
.aviso.brand{background:var(--brand-soft);border-color:var(--brand-soft-2);color:var(--brand-dark)}
.aviso.brand .ic{color:var(--brand-deep)}
.aviso.ok{background:var(--ok-soft);border-color:#BFE6D9;color:#0A5F48}
.aviso.ok .ic{color:var(--ok)}
.nota-valor{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);
  border:1px solid #EFDCB6;color:#6B4A0E;border-radius:999px;padding:3px 11px;font-size:11px;
  font-weight:600}

/* ---------- listas de actividad ---------- */
.lista{display:flex;flex-direction:column}
.lista>*{display:flex;gap:11px;align-items:flex-start;padding:11px 18px;
  border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;
  border-top:0;width:100%;font:inherit;color:inherit}
.lista>*:last-child{border-bottom:0}
.lista button{cursor:pointer;transition:background .12s}
.lista button:hover{background:var(--brand-soft)}
.lista .ava{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--brand-soft);color:var(--brand-deep)}
.lista .ava.warn{background:var(--warn-soft);color:var(--warn)}
.lista .ava.bad{background:var(--bad-soft);color:var(--bad)}
.lista .ava.ok{background:var(--ok-soft);color:var(--ok)}
.lista .ava.gris{background:var(--line);color:var(--ink-2)}
.lista .cpo{flex:1;min-width:0}
.lista .cpo b{font-size:12.5px;font-weight:600;display:block}
.lista .cpo span{font-size:11.5px;color:var(--ink-2);display:block;line-height:1.4}
.lista .der{margin-left:auto;text-align:right;flex:none;font-size:11px;color:var(--ink-3);
  font-weight:600;white-space:nowrap}

/* ---------- línea de tiempo ---------- */
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i .pt{position:absolute;left:-30px;top:1px;width:24px;height:24px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--ink-3)}
.tl-i.hecho .pt{border-color:var(--brand);background:var(--brand);color:#fff}
.tl-i.alerta .pt{border-color:var(--bad);background:var(--bad);color:#fff}
.tl-i.futuro .pt{border-style:dashed}
.tl-i h4{font-size:12.5px}
.tl-i .cuando{font-size:11px;color:var(--ink-3);font-weight:600}
.tl-i .det{font-size:12px;color:var(--ink-2);margin-top:3px}

/* ---------- proceso (4 etapas) ---------- */
.proceso{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.proceso .et{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;
  position:relative;overflow:hidden}
.proceso .et:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--brand-soft-2)}
.proceso .et::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand)}
.proceso .et .n{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:11px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.proceso .et .n i{background:var(--carbon);color:#fff;width:19px;height:19px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;font-weight:700}
.proceso .et h4{font-size:13.5px;margin-top:7px}
.proceso .et .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:6px;
  font-variant-numeric:tabular-nums;color:var(--brand-dark)}
.proceso .et small{color:var(--ink-3);font-size:11px;display:block}

/* ---------- kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:11px;overflow-x:auto;
  padding-bottom:6px}
.kb-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);
  display:flex;flex-direction:column;min-height:180px;transition:background .15s,border-color .15s}
.kb-col.sobre{background:var(--brand-soft);border-color:var(--brand)}
.kb-col h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding:11px 12px 8px;display:flex;align-items:center;gap:7px}
.kb-col h4 span{margin-left:auto;background:var(--line);border-radius:999px;padding:1px 7px;
  font-size:10.5px;color:var(--ink-2)}
.kb-body{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;
  cursor:grab;box-shadow:var(--sh);transition:box-shadow .14s,transform .14s}
.kb-card:hover{box-shadow:var(--sh-md)}
.kb-card:active{cursor:grabbing}
.kb-card.arrastrando{opacity:.4}
.kb-card b{font-size:12px;font-weight:600;display:block}
.kb-card .cl{font-size:11px;color:var(--ink-2);display:block;margin-top:1px}
.kb-card .pie{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10.5px;
  color:var(--ink-3);font-weight:600}

/* ---------- gráficos ---------- */
.gr{width:100%;display:block;overflow:visible}
.gr text{font-family:inherit;font-size:10px;fill:var(--ink-3);font-weight:600}
.gr .eje{stroke:var(--line);stroke-width:1}
.gr .barra{fill:var(--brand);transition:fill .15s}
.gr .barra:hover{fill:var(--brand-deep)}
.gr .barra2{fill:var(--brand-soft-2)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);font-weight:600;
  margin-top:10px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.barrita{height:7px;border-radius:999px;background:var(--line);overflow:hidden;min-width:60px}
.barrita i{display:block;height:100%;background:var(--brand);border-radius:999px}
.barrita i.ok{background:var(--ok)} .barrita i.warn{background:var(--warn)} .barrita i.bad{background:var(--bad)}

/* ---------- modal ---------- */
.velo{position:fixed;inset:0;background:rgba(22,34,42,.46);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 16px 16px;z-index:60;overflow-y:auto}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;
  max-width:560px;overflow:hidden;animation:sube .16s ease-out}
.modal.ancho{max-width:900px}
.modal.angosto{max-width:430px}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px}
.modal-h p{font-size:11.5px;color:var(--ink-3)}
.modal-b{padding:18px;max-height:64vh;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);
  background:var(--panel-2);flex-wrap:wrap}

/* ---------- formularios ---------- */
.campo{margin-bottom:13px}
.campo label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--line-2);
  border-radius:var(--r);padding:9px 11px;background:var(--panel);font-size:13px;transition:border-color .14s}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--brand);outline:none;
  box-shadow:0 0 0 3px var(--brand-soft)}
.campo .ayuda{font-size:11px;color:var(--ink-3);margin-top:4px}
.campos2{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}

/* ---------- buscador ---------- */
.buscador{position:fixed;inset:0;background:rgba(22,34,42,.46);z-index:80;display:flex;
  align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.buscador .caja{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;
  max-width:620px;overflow:hidden;animation:sube .14s ease-out}
.buscador .ent{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line)}
.buscador .ent input{flex:1;border:0;outline:none;font-size:15.5px;background:none}
.buscador .res{max-height:52vh;overflow-y:auto}
.buscador .res .gr-t{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:11px 17px 5px}
.buscador .res button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:9px 17px;cursor:pointer;text-align:left;color:inherit}
.buscador .res button:hover,.buscador .res button.sel{background:var(--brand-soft)}
.buscador .res button b{font-size:13px;font-weight:600;display:block}
.buscador .res button span{font-size:11.5px;color:var(--ink-2)}
.buscador .pie{padding:9px 17px;border-top:1px solid var(--line);background:var(--panel-2);
  font-size:11px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.buscador .pie kbd{background:var(--line);border-radius:4px;padding:1px 5px;font-family:inherit;
  font-size:10.5px;font-weight:700}

/* ---------- avisos flotantes ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;
  gap:9px;max-width:370px}
.toast{background:var(--carbon);color:#fff;border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--sh-lg);display:flex;gap:11px;align-items:flex-start;animation:entra .2s ease-out;
  font-size:12.5px}
@keyframes entra{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast .ic{color:var(--brand);margin-top:1px}
.toast b{display:block;font-weight:600}
.toast span{color:#C2CDD4;font-size:11.5px;display:block;line-height:1.4}
.toast button{margin-left:auto;background:none;border:0;color:var(--carbon-3);cursor:pointer;
  padding:0;flex:none}
.toast button:hover{color:#fff}
.toast.accion{cursor:pointer}

/* ---------- estado vacío ---------- */
.vacio{text-align:center;padding:38px 20px;color:var(--ink-3)}
.vacio .ic-xl{color:var(--line-2);margin-bottom:9px}
.vacio b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}
.vacio p{font-size:12.5px;max-width:44ch;margin:0 auto 13px}

/* ---------- pie ---------- */
.pie-app{background:var(--carbon);color:var(--carbon-3);padding:16px 24px;font-size:11.5px;
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pie-app b{color:#fff;font-weight:700;letter-spacing:.1em}
.pie-app .sep{flex:1}
.pie-app button{background:none;border:0;color:var(--carbon-3);cursor:pointer;font-size:11.5px;
  font-weight:600;padding:0}
.pie-app button:hover{color:#fff;text-decoration:underline}

/* ---------- tour ---------- */
.tour{position:fixed;inset:0;z-index:85;background:rgba(22,34,42,.5);display:flex;
  align-items:center;justify-content:center;padding:20px}
.tour .caja{background:var(--panel);border-radius:var(--r-lg);max-width:470px;width:100%;
  box-shadow:var(--sh-lg);overflow:hidden;animation:sube .18s ease-out}
.tour .cab{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;padding:20px}
.tour .cab h3{font-size:17px}
.tour .cab p{color:rgba(255,255,255,.85);font-size:12.5px;margin-top:4px}
.tour .cue{padding:18px}
.tour .pasos{display:flex;gap:6px;margin-bottom:14px}
.tour .pasos i{height:4px;flex:1;border-radius:999px;background:var(--line)}
.tour .pasos i.on{background:var(--brand)}

/* ---------- portal del cliente ---------- */
.portal-hero{background:linear-gradient(135deg,var(--carbon) 0%,#1A2A32 55%,var(--brand-dark) 100%);
  color:#fff;border-radius:var(--r-lg);padding:22px 24px;display:flex;gap:22px;align-items:center;
  flex-wrap:wrap}
.portal-hero h2{font-size:20px}
.portal-hero p{color:rgba(255,255,255,.78);font-size:12.5px;margin-top:4px;max-width:58ch}
.portal-hero .num{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap}
.portal-hero .num div{text-align:right}
.portal-hero .num b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.portal-hero .num span{font-size:10.5px;color:rgba(255,255,255,.72);font-weight:600;
  text-transform:uppercase;letter-spacing:.05em}

/* ---------- utilidades ---------- */
.fila{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fila.entre{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:9px}
.dim{color:var(--ink-3)}
.dim2{color:var(--ink-2)}
.mini{font-size:11px}
.b6{font-weight:600}.b7{font-weight:700}.b8{font-weight:800}
.nowrap{white-space:nowrap}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt14{margin-top:14px}.mb8{margin-bottom:8px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px;align-items:baseline}
.dl dt{color:var(--ink-3);font-weight:600;white-space:nowrap}
.dl dd{margin:0;font-weight:600;text-align:right}
.solo-lectura{border:1px dashed var(--line-2);border-radius:var(--r);padding:8px 12px;
  font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px}

@media (max-width:1100px){
  .g4,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g23,.g32{grid-template-columns:minmax(0,1fr)}
  .proceso{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .cuerpo{grid-template-columns:1fr}
  .side{position:fixed;top:58px;bottom:0;left:0;width:264px;z-index:40;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:var(--sh-lg)}
  .side.abierto{transform:none}
  .hamb{display:flex}
  .tb-buscar{min-width:0;width:34px;padding:0;justify-content:center}
  .tb-buscar span,.tb-buscar kbd{display:none}
  .marca small{display:none}
  .marca{padding-right:10px}
  .marca b{font-size:13.5px;letter-spacing:.1em}
  .topbar{gap:8px;padding:0 10px}
  #btn-unidad span,#btn-unidad .ic:last-child{display:none}
  #btn-unidad{padding:7px 9px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .contenido{padding:16px 14px 10px}
  .vista-head{padding:14px 14px 0}
  .modo button .txt{display:none}
}
@media (max-width:700px){
  #btn-unidad{display:none}
}
@media (max-width:560px){
  .kpis,.g4,.proceso{grid-template-columns:minmax(0,1fr)}
  .campos2{grid-template-columns:1fr}
  .vista-head .acc{width:100%}
  .marca .logo{width:24px;height:24px}
}

    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

})();

/* ==========================================================================
   HISTORIA — 18 meses de trabajos, con pico en primavera-verano
   ========================================================================== */

const SESIONES = [], PARTIDAS = [], EMBRIONES = [], TRANSFERENCIAS = [],
      DIAGNOSTICOS = [], PARICIONES = [], TRABAJOS = [], GARANTIAS = [],
      FACTURAS = [], PROYECTOS = [], EXPORTACIONES = [], MOVIMIENTOS = [];

const ETAPAS = ['Programado','OPU hecha','En laboratorio','Embriones listos','TE realizada','En diagnóstico','Cerrado'];

// Cada técnico tiene su propia mano. Sirve para que el tablero de gerencia
// muestre diferencias reales entre equipos.
TECNICOS.forEach(t => { t.factor = dec(0.90, 1.10); });

const bolsaClientes = [];
CLIENTES.forEach(c => { for (let i = 0; i < c.peso; i++) bolsaClientes.push(c); });

let seqEmb = 0, seqOS = 0, seqSes = 0, seqPart = 0, seqTE = 0;

function etapaPorFecha(fechaOPU){
  const t = desdeHoy(fechaOPU);
  if (t < 0)  return 'Programado';
  if (t < 1)  return 'OPU hecha';
  if (t < 7)  return 'En laboratorio';
  if (t < 9)  return 'Embriones listos';
  if (t < 30) return 'TE realizada';
  if (t < 62) return 'En diagnóstico';
  return 'Cerrado';
}

function nuevaOS(fechaOPU, cliente, opciones){
  opciones = opciones || {};
  seqOS++;
  const anio = fechaOPU.getFullYear();
  const os = {
    id: 'OS-' + anio + '-' + String(seqOS).padStart(3,'0'),
    clienteId: cliente.id,
    unidad: cliente.unidad,
    fechaOPU,
    fechaFIV: sumar(fechaOPU, 1),
    fechaD7: sumar(fechaOPU, 1 + SUPUESTOS.diasCultivoD7),
    etapa: etapaPorFecha(fechaOPU),
    sesionIds: [], partidaIds: [], embrionIds: [], transferenciaIds: [],
    establecimientoId: null,
    tecnicoId: null,
    pobre: !!opciones.pobre,
    observaciones: '',
  };
  TRABAJOS.push(os);
  return os;
}

function generarTrabajo(fechaOPU, cliente, opciones){
  opciones = opciones || {};
  const os = nuevaOS(fechaOPU, cliente, opciones);
  const ests = ESTABLECIMIENTOS.filter(e => e.clienteId === cliente.id);
  const est = elegir(ests);
  const tecnicosU = TECNICOS.filter(t => t.unidad === cliente.unidad && t.rol.indexOf('OPU') >= 0);
  const tec = elegir(tecnicosU.length ? tecnicosU : TECNICOS);
  os.establecimientoId = est.id;
  os.tecnicoId = tec.id;

  // --- 1. Aspiración folicular (OPU) ---
  const disponibles = (DONANTES_POR_CLIENTE.get(cliente.id) || []).filter(d => {
    if (d.baja) return false;
    const edadM = dif(d.nacimiento, fechaOPU) / 30.4;
    return edadM >= SUPUESTOS.edadMinimaAspiracionMeses;
  });
  if (!disponibles.length) { os.etapa = 'Cerrado'; os.observaciones = 'Sin donantes elegibles.'; return os; }
  const cuantas = Math.min(disponibles.length, cliente.peso >= 7 ? ent(5,8) : ent(3,6));
  const elegidas = mezclar(disponibles).slice(0, cuantas);

  seqSes++;
  const ses = {
    id: 'OPU-' + String(seqSes).padStart(3,'0'),
    trabajoId: os.id, clienteId: cliente.id, establecimientoId: est.id,
    fecha: fechaOPU, tecnicoId: tec.id, unidad: cliente.unidad,
    detalle: [], ovocitos: 0, viables: 0,
    duracionHs: 0, observaciones: '',
  };
  elegidas.forEach(d => {
    let ov = Math.round(rango(SUPUESTOS.ovocitosPorDonante) + (quizas(0.18) ? ent(-7, 11) : 0));
    ov = Math.max(3, ov);
    const vi = Math.max(1, Math.round(ov * rango(SUPUESTOS.tasaViables)));
    ses.detalle.push({ donanteId: d.id, ovocitos: ov, viables: vi, grado1: Math.round(vi*dec(0.4,0.7)) });
    ses.ovocitos += ov; ses.viables += vi;
    if (desdeHoy(fechaOPU) >= 0) {
      d.aspiraciones++; d.ovocitosAcum += ov; d.viablesAcum += vi;
      if (!d.ultimaAspiracion || fechaOPU > d.ultimaAspiracion) d.ultimaAspiracion = fechaOPU;
    }
  });
  ses.duracionHs = Math.round((elegidas.length * dec(0.35, 0.6) + 1) * 10) / 10;
  SESIONES.push(ses);
  os.sesionIds.push(ses.id);

  if (os.etapa === 'Programado') return os;

  // --- 2. Fertilización (FIV) — una pajuela rinde entre 10 y 14 donantes ---
  const torosPosibles = TOROS.filter(t => t.raza === cliente.raza);
  const nToros = Math.min(torosPosibles.length, elegidas.length >= 5 ? ent(2,3) : ent(1,2));
  const torosUsados = mezclar(torosPosibles).slice(0, Math.max(1, nToros));
  const reparto = new Map(torosUsados.map(t => [t.id, []]));
  elegidas.forEach((d, i) => reparto.get(torosUsados[i % torosUsados.length].id).push(d));

  torosUsados.forEach(toro => {
    const susDonantes = reparto.get(toro.id);
    if (!susDonantes.length) return;
    const viables = suma(susDonantes, d => ses.detalle.find(x => x.donanteId === d.id).viables);
    const rendPajuela = Math.round(rango(SUPUESTOS.donantesPorPajuela));
    const pajuelas = Math.max(1, Math.ceil(susDonantes.length / rendPajuela));
    const clivaje = dec(0.68, 0.86);
    let tasa = rango(SUPUESTOS.tasaD7);
    if (os.pobre) tasa = dec(0.09, 0.15);
    const d7 = Math.max(os.pobre ? 1 : 2, Math.round(viables * tasa));
    seqPart++;
    const part = {
      id: 'FIV-' + String(seqPart).padStart(3,'0'),
      trabajoId: os.id, sesionId: ses.id, clienteId: cliente.id,
      toroId: toro.id, fecha: os.fechaFIV, fechaD7: os.fechaD7,
      donanteIds: susDonantes.map(d => d.id),
      ovocitosIngresados: viables,
      clivaje, clivados: Math.round(viables * clivaje),
      d7, tasaD7: d7 / viables,
      pajuelasUsadas: pajuelas, rendimientoPajuela: rendPajuela,
      sexado: toro.tipo === 'Sexado',
      responsable: elegir(LABORATORIO).nombre,
      observaciones: os.pobre ? 'Rendimiento por debajo del rango esperado. Se revisó el lote de medio de cultivo.' : '',
    };
    toro.usos++;
    toro.pajuelas = Math.max(0, toro.pajuelas - pajuelas);
    PARTIDAS.push(part);
    os.partidaIds.push(part.id);

    // --- 3. Producción de embriones ---
    for (let i = 0; i < d7; i++) {
      const donante = susDonantes[i % susDonantes.length];
      seqEmb++;
      const modalidad = (function(){
        const r = R();
        if (r < 0.44) return 'Fresco';
        if (r < 0.79) return 'Vitrificado';
        return 'DT';
      })();
      const emb = {
        id: 'EM-' + String(os.fechaD7.getFullYear()).slice(2) + '-' + String(seqEmb).padStart(4,'0'),
        partidaId: part.id, trabajoId: os.id, sesionId: ses.id,
        donanteId: donante.id, toroId: toro.id, clienteId: cliente.id,
        fechaProduccion: os.fechaD7,
        modalidad,
        sexo: part.sexado ? (quizas(0.88) ? 'Hembra' : 'Macho') : 'Sin sexar',
        grado: elegir(['1','1','1','2','2','3']),
        estado: 'En stock',
        ubicacion: null,
        transferenciaId: null,
        exportacionId: null,
      };
      donante.embrionesAcum++;
      EMBRIONES.push(emb);
      os.embrionIds.push(emb.id);
    }
  });
  return os;
}

/* ----------------------------- calendario 18 meses ----------------------- */
(function generarHistoria(){
  const pico = [8,9,10,11,0,1,2]; // set a mar: primavera-verano
  let pobreAsignada = false;
  for (let m = 17; m >= 0; m--) {
    const ref = new Date(HOY.getFullYear(), HOY.getMonth() - m, 1);
    const esPico = pico.indexOf(ref.getMonth()) >= 0;
    const cant = esPico ? ent(5,7) : ent(2,4);
    for (let k = 0; k < cant; k++) {
      const diaMes = ent(1, 27);
      const f = new Date(ref.getFullYear(), ref.getMonth(), diaMes);
      if (f > HOY) continue;
      const cliente = elegir(bolsaClientes);
      const pobre = (!pobreAsignada && m === 9 && k === 0);
      if (pobre) pobreAsignada = true;
      generarTrabajo(f, cliente, { pobre });
    }
  }
  // Trabajos agendados hacia adelante, para que la agenda de campo tenga qué mostrar.
  for (let i = 0; i < 9; i++) {
    const f = dias(ent(1, 46));
    generarTrabajo(f, elegir(bolsaClientes));
  }
  TRABAJOS.sort((a,b) => a.fechaOPU - b.fechaOPU);
})();

const TRABAJOS_POR_ID = porId(TRABAJOS);
const SESIONES_POR_ID = porId(SESIONES);
const PARTIDAS_POR_ID = porId(PARTIDAS);
const EMBRIONES_POR_ID = porId(EMBRIONES);
const DONANTES_POR_ID = porId(DONANTES);
const TOROS_POR_ID = porId(TOROS);
const CLIENTES_POR_ID = porId(CLIENTES);
const EST_POR_ID = porId(ESTABLECIMIENTOS);
const REC_POR_ID = porId(RECEPTORAS);
const TEC_POR_ID = porId(TECNICOS.concat(LABORATORIO));

/* ==========================================================================
   4. TRANSFERENCIA EMBRIONARIA + DIAGNÓSTICO DE PREÑEZ
   ========================================================================== */

function receptoraLibre(clienteId, fecha){
  const pool = (RECEPTORAS_POR_CLIENTE.get(clienteId) || []).filter(r => {
    if (!r.apta) return false;
    if (!r.ocupadaHasta) return true;
    return fecha > r.ocupadaHasta;
  });
  if (!pool.length) return null;
  return pool[Math.floor(R() * pool.length)];
}

function transferir(emb, fecha, os){
  const cliente = CLIENTES_POR_ID.get(emb.clienteId);
  const rec = receptoraLibre(emb.clienteId, fecha);
  if (!rec) return null;
  const tecnicosU = TECNICOS.filter(t => t.unidad === cliente.unidad && t.rol.indexOf('TE') >= 0);
  const tec = elegir(tecnicosU.length ? tecnicosU : TECNICOS);
  seqTE++;
  const te = {
    id: 'TE-' + String(seqTE).padStart(4,'0'),
    embrionId: emb.id, receptoraId: rec.id, clienteId: emb.clienteId,
    establecimientoId: rec.establecimientoId,
    trabajoId: os ? os.id : emb.trabajoId,
    fecha, tecnicoId: tec.id, unidad: cliente.unidad,
    modalidad: emb.modalidad,
    protocolo: rec.protocolo,
    d0: sumar(fecha, -8),
    resultado: 'Sin diagnosticar',
    diagnosticoId: null,
    fpp: sumar(fecha, SUPUESTOS.diasGestacion - SUPUESTOS.diasCultivoD7),
  };
  TRANSFERENCIAS.push(te);
  emb.estado = 'Transferido';
  emb.transferenciaId = te.id;
  emb.ubicacion = null;
  rec.transferencias++;
  rec.d0 = te.d0;
  rec.ocupadaHasta = sumar(fecha, 40);
  rec.estado = 'Transferida';
  const trabajo = TRABAJOS_POR_ID.get(te.trabajoId);
  if (trabajo) trabajo.transferenciaIds.push(te.id);

  // Diagnóstico a los 30 días y reconfirmación a los 60.
  const fDx = sumar(fecha, SUPUESTOS.diagnosticoDias);
  if (fDx <= HOY) {
    const base = emb.modalidad === 'Fresco' ? rango(SUPUESTOS.prenezFresco) : rango(SUPUESTOS.prenezCongelado);
    const p = Math.min(0.72, base * tec.factor * (emb.grado === '1' ? 1.06 : emb.grado === '3' ? 0.84 : 1));
    const prenada = quizas(p);
    const dx = {
      id: 'DX-' + String(TRANSFERENCIAS.length).padStart(4,'0'),
      transferenciaId: te.id, embrionId: emb.id, receptoraId: rec.id,
      clienteId: emb.clienteId, trabajoId: te.trabajoId,
      fecha: fDx, diaGestacion: SUPUESTOS.diagnosticoDias + SUPUESTOS.diasCultivoD7,
      tecnicoId: tec.id, metodo: 'Ecografía',
      resultado: prenada ? 'Preñada' : 'Vacía',
      reconfirmacion: null,
    };
    if (prenada) {
      const fRec = sumar(fecha, SUPUESTOS.reconfirmacionDias);
      if (fRec <= HOY) {
        const perdio = quizas(SUPUESTOS.perdidaD30aD60);
        dx.reconfirmacion = { fecha: fRec, resultado: perdio ? 'Pérdida' : 'Preñada', diaGestacion: SUPUESTOS.reconfirmacionDias + SUPUESTOS.diasCultivoD7 };
        if (perdio) dx.resultado = 'Pérdida';
      }
    }
    DIAGNOSTICOS.push(dx);
    te.diagnosticoId = dx.id;
    te.resultado = dx.resultado;
    if (dx.resultado === 'Preñada') {
      rec.prenecesLogradas++;
      rec.estado = 'Preñada';
      rec.ocupadaHasta = sumar(fecha, SUPUESTOS.diasGestacion);
      // Parto
      if (te.fpp <= HOY) {
        const sexoCria = emb.sexo === 'Sin sexar' ? (quizas(0.5) ? 'Hembra' : 'Macho') : emb.sexo;
        PARICIONES.push({
          id: 'PA-' + String(PARICIONES.length + 1).padStart(3,'0'),
          transferenciaId: te.id, embrionId: emb.id, receptoraId: rec.id,
          donanteId: emb.donanteId, toroId: emb.toroId, clienteId: emb.clienteId,
          fecha: te.fpp, sexo: sexoCria,
          rp: String(ent(100, 9899)),
          pesoNacer: Math.round(dec(28, 44) * 10) / 10,
          observaciones: quizas(0.12) ? 'Parto asistido, sin complicaciones.' : 'Parto normal.',
        });
        rec.estado = 'Parida';
        rec.ocupadaHasta = sumar(te.fpp, 60);
      }
    } else {
      rec.estado = 'Disponible';
      rec.ocupadaHasta = sumar(fecha, 45);
    }
  } else {
    rec.estado = 'Transferida';
  }
  return te;
}

/* ----- los frescos se transfieren el mismo día D7 ----- */
TRABAJOS.forEach(os => {
  if (os.etapa === 'Programado' || os.etapa === 'OPU hecha' || os.etapa === 'En laboratorio') return;
  os.embrionIds.forEach(eid => {
    const emb = EMBRIONES_POR_ID.get(eid);
    if (emb.modalidad !== 'Fresco') return;
    if (quizas(0.05)) { emb.estado = 'Descartado'; emb.motivo = 'Grado 3, no apto para transferir'; return; }
    transferir(emb, os.fechaD7, os);
  });
});

/* ----- los congelados salen del termo más adelante ----- */
EMBRIONES.forEach(emb => {
  if (emb.estado !== 'En stock') return;
  if (emb.modalidad === 'Fresco') { emb.estado = 'Descartado'; emb.motivo = 'Fresco no transferido en el día'; return; }
  const desde = sumar(emb.fechaProduccion, 21);
  if (desde > HOY) return;
  const prob = emb.modalidad === 'DT' ? 0.46 : 0.58;
  if (!quizas(prob)) return;
  const margen = Math.max(1, dif(desde, HOY) - 4);
  const f = sumar(desde, ent(0, margen));
  transferir(emb, f, TRABAJOS_POR_ID.get(emb.trabajoId));
});

TRANSFERENCIAS.sort((a,b) => a.fecha - b.fecha);
DIAGNOSTICOS.sort((a,b) => a.fecha - b.fecha);
PARICIONES.sort((a,b) => a.fecha - b.fecha);
const TE_POR_ID = porId(TRANSFERENCIAS);
const DX_POR_ID = porId(DIAGNOSTICOS);

/* ==========================================================================
   INVENTARIO CRIOGÉNICO DISTRIBUIDO
   Lo vitrificado queda en el laboratorio. Lo DT se entrega y vive en el
   termo del cliente, en el campo: eso es lo que hoy nadie controla.
   ========================================================================== */
(function ubicarStock(){
  const labTermos = TERMOS.filter(t => t.ambito === 'Laboratorio');
  EMBRIONES.forEach(emb => {
    if (emb.estado !== 'En stock') return;
    if (emb.modalidad === 'DT') {
      const propio = TERMOS.filter(t => t.ambito === 'Campo' && t.clienteId === emb.clienteId);
      if (propio.length) {
        const termo = elegir(propio);
        emb.ubicacion = posicionLibre(termo);
        emb.enCampo = true;
        emb.fechaEntrega = sumar(emb.fechaProduccion, ent(2, 16));
        if (emb.fechaEntrega > HOY) emb.fechaEntrega = emb.fechaProduccion;
        emb.remito = 'RE-' + String(emb.fechaEntrega.getFullYear()).slice(2) + '-' + String(ent(100,899));
        termo.contenido.push(emb.id);
        return;
      }
    }
    const termo = elegir(labTermos);
    emb.ubicacion = posicionLibre(termo);
    emb.enCampo = false;
    emb.fechaIngresoTermo = sumar(emb.fechaProduccion, 1);
    termo.contenido.push(emb.id);
  });
})();

/* ------------------- remates de embriones y de DDA ----------------------- */
const REMATES = [];
(function generarRemates(){
  const firmas = ['Escritorio Rural del Este','Consignaciones del Litoral','Rematadora Campo Abierto'];
  for (let i = 0; i < 3; i++) {
    const fecha = dias(-[248, 121, -18][i]);
    const cliente = CLIENTES[[0, 2, 1][i]];
    const stock = EMBRIONES.filter(e => e.estado === 'En stock' && e.clienteId === cliente.id && !e.enCampo);
    const lote = mezclar(stock).slice(0, ent(5, 12));
    const rem = {
      id: 'RM-' + P2(i + 1), fecha, firma: firmas[i], clienteId: cliente.id,
      tipo: i === 2 ? 'Derechos de aspiración (DDA)' : 'Embriones',
      lotes: i === 2 ? ent(3, 6) : lote.length,
      embrionIds: i === 2 ? [] : lote.map(e => e.id),
      donanteIds: i === 2 ? mezclar(DONANTES_POR_CLIENTE.get(cliente.id) || []).slice(0, 3).map(d => d.id) : [],
      estado: fecha > HOY ? 'Programado' : 'Realizado',
      condiciones: [
        'La aspiración se hace exclusivamente con el servicio técnico de In Vitro.',
        'Transferencia incluida en el valor del lote.',
        'Viáticos e insumos de sincronización no incluidos.',
      ],
    };
    if (rem.estado === 'Realizado') lote.forEach(e => { e.estado = 'Vendido'; e.remateId = rem.id; });
    REMATES.push(rem);
  }
})();

/* ==========================================================================
   SITUACIONES DE DONANTES Y RECEPTORAS — de acá salen las alertas
   ========================================================================== */
(function situarDonantes(){
  const conAsp = DONANTES.filter(d => d.ultimaAspiracion);
  // Alguna recién aspirada, todavía no elegible.
  mezclar(conAsp).slice(0, 4).forEach(d => { d.ultimaAspiracion = dias(-ent(2, 11)); });
  // Alguna gestando, y una pasada del 4.º mes.
  const gestantes = mezclar(DONANTES).slice(0, 9);
  gestantes.forEach((d, i) => {
    if (dif(d.nacimiento, HOY) / 30.4 < 18) return;
    d.estado = 'Gestando';
    d.fechaServicio = dias(-(i < 3 ? ent(132, 168) : ent(24, 104)));
  });
  // Un par de bajas, para que el listado no sea plano.
  mezclar(DONANTES.filter(d => d.estado === 'Vacía')).slice(0, 2).forEach(d => {
    d.baja = true; d.estado = 'Baja'; d.motivoBaja = elegir(['Problema ovárico, se retira del programa','Vendida por la cabaña']);
  });
})();

function edadMesesDonante(d, ref){ return dif(d.nacimiento, ref || HOY) / 30.4; }
function mesGestacion(d, ref){ return d.fechaServicio ? dif(d.fechaServicio, ref || HOY) / 30.4 : null; }

function estadoAspiracion(d){
  if (d.baja) return { clave:'baja', tag:'bad', texto:'Baja del programa', detalle: d.motivoBaja || '' };
  const edad = edadMesesDonante(d);
  if (edad < SUPUESTOS.edadMinimaAspiracionMeses) {
    const faltan = Math.ceil((SUPUESTOS.edadMinimaAspiracionMeses - edad) * 30.4);
    return { clave:'joven', tag:'warn', texto:'Entra en edad en ' + faltan + ' días',
             detalle:'Se puede aspirar desde los ' + SUPUESTOS.edadMinimaAspiracionMeses + ' meses. Nació el ' + fFecha(d.nacimiento) + '.' };
  }
  if (edad < SUPUESTOS.edadMinimaAspiracionMeses + 1.2) {
    return { clave:'recien-habilitada', tag:'brand', texto:'Donante joven recién habilitada',
             detalle:'Cumplió los ' + SUPUESTOS.edadMinimaAspiracionMeses + ' meses el ' + fFecha(sumar(d.nacimiento, Math.round(SUPUESTOS.edadMinimaAspiracionMeses*30.4))) + '.' };
  }
  const mg = mesGestacion(d);
  if (d.estado === 'Gestando' && mg != null) {
    if (mg > SUPUESTOS.mesGestacionMaximoAspiracion) {
      return { clave:'gestacion-pasada', tag:'bad', texto:'Pasada del 4.º mes de gestación',
               detalle:'Va por el mes ' + D1(mg) + '. No se aspira hasta después del parto.' };
    }
    return { clave:'gestando', tag:'info', texto:'Gestando, mes ' + D1(mg),
             detalle:'Se puede aspirar hasta el 4.º mes de gestación.' };
  }
  if (d.ultimaAspiracion) {
    const pasaron = desdeHoy(d.ultimaAspiracion);
    if (pasaron < SUPUESTOS.diasEntreAspiraciones) {
      return { clave:'espera', tag:'warn', texto:'Vuelve a estar disponible en ' + (SUPUESTOS.diasEntreAspiraciones - pasaron) + ' días',
               detalle:'Se aspiró el ' + fFecha(d.ultimaAspiracion) + '. Intervalo mínimo: ' + SUPUESTOS.diasEntreAspiraciones + ' días.' };
    }
    return { clave:'disponible', tag:'ok', texto:'Disponible para aspirar',
             detalle:'Última aspiración el ' + fFecha(d.ultimaAspiracion) + ', hace ' + pasaron + ' días.' };
  }
  return { clave:'disponible', tag:'ok', texto:'Disponible para aspirar', detalle:'Todavía no fue aspirada.' };
}

/* ------------------- protocolo de sincronización de receptoras ----------- */
const PROTOCOLO_DIAS = [
  { d:-11, et:'D-11', que:'Colocación del dispositivo intravaginal + benzoato' },
  { d:-3,  et:'D-3',  que:'Retiro del dispositivo + prostaglandina' },
  { d:0,   et:'D0',   que:'Celo / momento cero' },
  { d:8,   et:'D8',   que:'Revisión de cuerpo lúteo y descarte de vacías' },
  { d:8,   et:'TE',   que:'Ventana de transferencia embrionaria (D8 a D9)' },
];

(function liberarReceptoras(){
  // Una receptora vacía o que ya parió vuelve al rodeo disponible. Sin esto,
  // el rodeo receptor queda congelado en el último estado de cada vientre.
  RECEPTORAS.forEach(r => {
    if (!r.apta) return;
    if (r.ocupadaHasta && r.ocupadaHasta <= HOY && r.estado !== 'Preñada') {
      r.estado = 'Disponible'; r.ocupadaHasta = null;
    }
  });
})();

(function sincronizarLote(){
  // Lotes sincronizados ahora mismo, para la agenda y para las alertas.
  const futuros = TRABAJOS.filter(t => t.etapa === 'Programado');
  futuros.forEach(os => {
    const pool = (RECEPTORAS_POR_CLIENTE.get(os.clienteId) || []).filter(r => r.estado === 'Disponible');
    const lote = mezclar(pool).slice(0, ent(8, 22));
    const teFecha = sumar(os.fechaD7, 0);
    lote.forEach(r => {
      r.d0 = sumar(teFecha, -8);
      r.estado = 'En protocolo';
      r.trabajoPrevistoId = os.id;
    });
    os.receptorasSincronizadas = lote.map(r => r.id);
  });
  // Un lote que se pasó de ventana: se sincronizó y la TE no se hizo.
  const c = CLIENTES[4];
  const pool = (RECEPTORAS_POR_CLIENTE.get(c.id) || []).filter(r => r.estado === 'Disponible');
  mezclar(pool).slice(0, 11).forEach(r => {
    r.d0 = dias(-ent(12, 19));
    r.estado = 'En protocolo';
    r.sinTE = true;
  });
})();

function estadoSincronizacion(r){
  if (!r.apta) return { clave:'descartada', tag:'bad', texto:'Descartada', detalle: r.motivoDescarte || '' };
  if (r.estado === 'Preñada') return { clave:'prenada', tag:'ok', texto:'Preñada', detalle:'' };
  if (r.estado === 'Parida')  return { clave:'parida', tag:'brand', texto:'Parida', detalle:'' };
  if (r.estado === 'En protocolo' && r.d0) {
    const d = desdeHoy(r.d0); // días transcurridos desde D0
    if (d < 0)  return { clave:'protocolo', tag:'info', texto:'D' + d + ' · en protocolo', detalle:'Momento cero el ' + fFecha(r.d0) + '.' };
    if (d <= 7) return { clave:'protocolo', tag:'info', texto:'D+' + d + ' · en protocolo', detalle:'Ventana de TE entre el ' + fFecha(sumar(r.d0,8)) + ' y el ' + fFecha(sumar(r.d0,9)) + '.' };
    if (d <= 9) return { clave:'ventana', tag:'ok', texto:'D+' + d + ' · en ventana de TE', detalle:'Hay que transferir hoy o mañana.' };
    return { clave:'fuera', tag:'bad', texto:'Fuera de ventana (D+' + d + ')',
             detalle:'Se sincronizó para el ' + fFecha(sumar(r.d0,8)) + ' y no se transfirió. Hay que resincronizar.' };
  }
  if (r.estado === 'Transferida') return { clave:'transferida', tag:'info', texto:'Transferida, sin diagnosticar', detalle:'' };
  return { clave:'disponible', tag:'', texto:'Disponible', detalle:'' };
}

/* ==========================================================================
   RESUMEN DE UN TRABAJO — la función que reemplaza al Excel armado a mano.
   Todo sale de lo que ya se cargó en cada etapa. Nadie transcribe nada.
   ========================================================================== */
function resumenTrabajo(os){
  const sesiones = os.sesionIds.map(id => SESIONES_POR_ID.get(id)).filter(Boolean);
  const partidas = os.partidaIds.map(id => PARTIDAS_POR_ID.get(id)).filter(Boolean);
  const embriones = os.embrionIds.map(id => EMBRIONES_POR_ID.get(id)).filter(Boolean);
  const tes = os.transferenciaIds.map(id => TE_POR_ID.get(id)).filter(Boolean);
  const dxs = tes.map(t => t.diagnosticoId ? DX_POR_ID.get(t.diagnosticoId) : null).filter(Boolean);

  const donantes = [];
  sesiones.forEach(s => s.detalle.forEach(x => {
    let e = donantes.find(y => y.donanteId === x.donanteId);
    if (!e) { e = { donanteId:x.donanteId, ovocitos:0, viables:0, embriones:0, transferidos:0, preneces:0 }; donantes.push(e); }
    e.ovocitos += x.ovocitos; e.viables += x.viables;
  }));
  embriones.forEach(emb => {
    const e = donantes.find(y => y.donanteId === emb.donanteId);
    if (e) e.embriones++;
  });
  tes.forEach(te => {
    const emb = EMBRIONES_POR_ID.get(te.embrionId);
    const e = donantes.find(y => y.donanteId === emb.donanteId);
    if (e) { e.transferidos++; if (te.resultado === 'Preñada') e.preneces++; }
  });

  const ovocitos = suma(sesiones, s => s.ovocitos);
  const viables  = suma(sesiones, s => s.viables);
  const frescos      = cuenta(embriones, e => e.modalidad === 'Fresco');
  const vitrificados = cuenta(embriones, e => e.modalidad === 'Vitrificado');
  const dt           = cuenta(embriones, e => e.modalidad === 'DT');
  const diagnosticadas = dxs.length;
  const preneces = cuenta(dxs, d => d.resultado === 'Preñada');
  const perdidas = cuenta(dxs, d => d.resultado === 'Pérdida');
  const pariciones = PARICIONES.filter(p => tes.some(t => t.id === p.transferenciaId));

  return {
    os, sesiones, partidas, embriones, tes, dxs, donantes, pariciones,
    donantesAspiradas: donantes.length,
    ovocitos, viables,
    tasaViables: ovocitos ? viables/ovocitos : 0,
    embrionesD7: embriones.length,
    tasaD7: viables ? embriones.length/viables : 0,
    ovocitosPorDonante: donantes.length ? ovocitos/donantes.length : 0,
    embrionesPorDonante: donantes.length ? embriones.length/donantes.length : 0,
    frescos, vitrificados, dt, congelados: vitrificados + dt,
    enStock: cuenta(embriones, e => e.estado === 'En stock'),
    transferidos: tes.length,
    diagnosticadas, preneces, perdidas,
    vacias: cuenta(dxs, d => d.resultado === 'Vacía'),
    tasaPrenez: diagnosticadas ? preneces/diagnosticadas : 0,
    pendientesDx: tes.length - diagnosticadas,
    pajuelas: suma(partidas, p => p.pajuelasUsadas),
    jornadas: sesiones.length,
  };
}
const RESUMEN_CACHE = new Map();
function resumen(os){
  if (!RESUMEN_CACHE.has(os.id)) RESUMEN_CACHE.set(os.id, resumenTrabajo(os));
  return RESUMEN_CACHE.get(os.id);
}

/* ==========================================================================
   GARANTÍAS — paquetes vendidos con preñeces comprometidas
   ========================================================================== */
(function generarGarantias(){
  // Una garantía por cliente: es habitual vender paquetes con preñez garantizada,
  // y si un cliente no tuviera ninguna su portal quedaría con una tabla vacía.
  const candidatos = [];
  CLIENTES.forEach(c => {
    const suyos = TRABAJOS.filter(t => t.clienteId === c.id && t.etapa === 'Cerrado' && t.embrionIds.length >= 5)
      .sort((a, b) => b.embrionIds.length - a.embrionIds.length);
    if (suyos.length) candidatos.push(suyos[0]);
  });
  candidatos.forEach((os, i) => {
    const r = resumen(os);
    const embrionesPaquete = Math.min(r.transferidos || 5, ent(5, 12));
    let comprometidas = Math.max(1, Math.round(embrionesPaquete * 0.4));
    let logradas = Math.min(r.preneces, comprometidas + ent(-1, 2));
    if (i === 0) { comprometidas = Math.max(2, comprometidas); logradas = Math.max(0, comprometidas - 2); } // el caso feo
    if (i === 1) { logradas = comprometidas; }
    logradas = Math.max(0, logradas);
    const saldo = Math.max(0, comprometidas - logradas);
    GARANTIAS.push({
      id: 'GA-' + String(os.fechaOPU.getFullYear()).slice(2) + '-' + P2(i + 1),
      trabajoId: os.id, clienteId: os.clienteId,
      fecha: os.fechaOPU,
      embrionesPaquete, comprometidas, logradas, saldo,
      estado: saldo > 0 ? (desdeHoy(os.fechaD7) > 150 ? 'Vencida con saldo' : 'Con saldo abierto') : 'Cumplida',
      condicion: embrionesPaquete + ' embriones garantizando ' + comprometidas + ' preñeces',
      reposicion: saldo > 0 ? Math.ceil(saldo / 0.4) : 0,
    });
  });
  GARANTIAS.sort((a,b) => b.fecha - a.fecha);
})();

/* ==========================================================================
   PROYECTOS GENÉTICOS — el objetivo anual acordado con el cliente
   ========================================================================== */
(function generarProyectos(){
  CLIENTES.forEach(c => {
    if (c.peso < 4) return;
    const desde = new Date(HOY.getFullYear(), 0, 1);
    const logradas = DIAGNOSTICOS.filter(d => d.clienteId === c.id && d.resultado === 'Preñada' && d.fecha >= desde).length;
    const objetivo = Math.max(12, Math.round(logradas * dec(1.15, 1.9)));
    const donantes = (DONANTES_POR_CLIENTE.get(c.id) || []).filter(d => !d.baja);
    const receptoras = (RECEPTORAS_POR_CLIENTE.get(c.id) || []).filter(r => r.apta);
    PROYECTOS.push({
      id: 'PG-' + HOY.getFullYear() + '-' + c.id,
      clienteId: c.id, anio: HOY.getFullYear(),
      objetivo, logradas,
      avance: objetivo ? logradas/objetivo : 0,
      donanteIds: donantes.map(d => d.id),
      rodeoReceptor: receptoras.length,
      receptorasNecesarias: Math.ceil(objetivo / 0.40),
      objetivoTexto: c.tipo === 'leche'
        ? 'Multiplicar las mejores vacas del tambo y bajar la edad al primer parto.'
        : 'Multiplicación a gran escala de las donantes de punta de la cabaña.',
      referente: (UNIDADES.find(u => u.id === c.unidad) || UNIDADES[0]).referente,
      acordado: dias(-ent(190, 320)),
    });
  });
})();
const PROYECTO_POR_CLIENTE = new Map(PROYECTOS.map(p => [p.clienteId, p]));

/* ==========================================================================
   FACTURACIÓN — cada línea nace de un resultado, y lo dice
   ========================================================================== */
function lineasDeTrabajo(os){
  const r = resumen(os);
  const L = [];
  const push = (t, cant, tar, origen, refs) => {
    if (!cant) return;
    L.push({ concepto: t, cantidad: cant, unitario: tar.v, unidad: tar.u,
             importe: cant * tar.v, origen, refs: refs || null });
  };
  push('Embriones producidos (D7)', r.embrionesD7, TARIFAS.embrionProducido,
       r.embrionesD7 + ' embriones de ' + r.partidas.length + ' partidas FIV', { vista:'embriones', filtro:{ trabajoId: os.id } });
  const sexados = cuenta(r.embriones, e => e.sexo !== 'Sin sexar');
  push('Adicional por semen sexado', sexados, TARIFAS.embrionSexado,
       sexados + ' embriones de partidas con semen sexado', { vista:'embriones', filtro:{ trabajoId: os.id } });
  push('Transferencias embrionarias', r.transferidos, TARIFAS.transferencia,
       r.transferidos + ' TE registradas por el equipo técnico', { vista:'te', filtro:{ trabajoId: os.id } });
  push('Preñeces confirmadas a los 30 días', r.preneces, TARIFAS.prenezConfirmada,
       r.preneces + ' de ' + r.diagnosticadas + ' diagnósticos dieron preñada', { vista:'prenez', filtro:{ trabajoId: os.id } });
  push('Viáticos del equipo técnico', r.jornadas + (r.transferidos ? 1 : 0), TARIFAS.viatico,
       r.jornadas + ' jornada(s) de OPU' + (r.transferidos ? ' + 1 jornada de TE' : ''), { vista:'agenda' });
  const recs = new Set(r.tes.map(t => t.receptoraId));
  push('Insumos de sincronización', recs.size, TARIFAS.insumoSincro,
       recs.size + ' receptoras sincronizadas para este trabajo', { vista:'receptoras', filtro:{ clienteId: os.clienteId } });
  return L;
}

(function generarFacturas(){
  TRABAJOS.filter(t => t.etapa === 'Cerrado' || t.etapa === 'En diagnóstico').forEach(os => {
    const L = lineasDeTrabajo(os);
    if (!L.length) return;
    const neto = suma(L, l => l.importe);
    const emision = sumar(os.fechaD7, os.etapa === 'Cerrado' ? 34 : 12);
    if (emision > HOY) return;
    const vence = sumar(emision, 30);
    const antiguedad = desdeHoy(emision);
    let estado = 'Pendiente';
    if (antiguedad > 60) estado = quizas(0.90) ? 'Pagada' : 'Vencida';
    else if (antiguedad > 30) estado = quizas(0.72) ? 'Pagada' : 'Vencida';
    else estado = quizas(0.42) ? 'Pagada' : 'Pendiente';
    FACTURAS.push({
      id: 'A-' + String(emision.getFullYear()).slice(2) + String(FACTURAS.length + 1).padStart(4,'0'),
      tipo: 'Factura de servicios',
      trabajoId: os.id, clienteId: os.clienteId, unidad: os.unidad,
      emision, vence, lineas: L, neto,
      estado,
      pago: estado === 'Pagada' ? sumar(emision, ent(8, 44)) : null,
      parcial: os.etapa !== 'Cerrado',
    });
  });
  // Mantenimiento mensual del material de terceros guardado en termo.
  CLIENTES.forEach((c, i) => {
    const enTermo = EMBRIONES.filter(e => e.estado === 'En stock' && e.clienteId === c.id && !e.enCampo).length;
    if (enTermo < 4) return;
    const emision = new Date(HOY.getFullYear(), HOY.getMonth(), 1);
    const L = [{ concepto:'Mantenimiento de material congelado en termo', cantidad: enTermo,
                 unitario: TARIFAS.mantenimientoTermo.v, unidad: TARIFAS.mantenimientoTermo.u,
                 importe: enTermo * TARIFAS.mantenimientoTermo.v,
                 origen: enTermo + ' embriones en custodia en el laboratorio',
                 refs:{ vista:'criogenia' } }];
    FACTURAS.push({
      id: 'A-' + String(emision.getFullYear()).slice(2) + String(900 + i).padStart(4,'0'),
      tipo: 'Factura de mantenimiento',
      trabajoId: null, clienteId: c.id, unidad: c.unidad,
      emision, vence: sumar(emision, 30), lineas: L, neto: L[0].importe,
      estado: i % 3 === 0 ? 'Pendiente' : (i % 3 === 1 ? 'Pagada' : 'Vencida'),
      pago: null, parcial: false,
    });
  });
  FACTURAS.sort((a,b) => b.emision - a.emision);
})();

function saldoCliente(clienteId){
  const fs = FACTURAS.filter(f => f.clienteId === clienteId);
  return {
    facturas: fs,
    total: suma(fs, f => f.neto),
    pagado: suma(fs.filter(f => f.estado === 'Pagada'), f => f.neto),
    pendiente: suma(fs.filter(f => f.estado === 'Pendiente'), f => f.neto),
    vencido: suma(fs.filter(f => f.estado === 'Vencida'), f => f.neto),
  };
}

/* ==========================================================================
   ALERTAS — todas calculadas mirando los datos, ninguna escrita a mano
   ========================================================================== */
function calcularAlertas(){
  const A = [];
  const enUnidad = (x) => !UI.unidad || UI.unidad === 'TODAS' || x === UI.unidad;
  const clientesU = CLIENTES.filter(c => enUnidad(c.unidad)).map(c => c.id);
  const dn = DONANTES.filter(d => clientesU.indexOf(d.clienteId) >= 0);

  const disponibles = dn.filter(d => estadoAspiracion(d).clave === 'disponible' && d.aspiraciones > 0);
  if (disponibles.length) A.push({ nivel:'ok', icono:'i-opu', titulo: disponibles.length + ' donantes vuelven a estar disponibles',
    detalle:'Pasaron los ' + SUPUESTOS.diasEntreAspiraciones + ' días desde la última aspiración.', ir:['donantes',{ filtro:'disponible' }] });

  const pasadas = dn.filter(d => estadoAspiracion(d).clave === 'gestacion-pasada');
  if (pasadas.length) A.push({ nivel:'bad', icono:'i-alerta', titulo: pasadas.length + ' donantes pasaron el 4.º mes de gestación',
    detalle:'Salen del programa de aspiración hasta después del parto.', ir:['donantes',{ filtro:'gestacion-pasada' }] });

  const jovenes = dn.filter(d => ['joven','recien-habilitada'].indexOf(estadoAspiracion(d).clave) >= 0);
  if (jovenes.length) A.push({ nivel:'warn', icono:'i-donante', titulo: jovenes.length + ' donantes jóvenes entrando en edad',
    detalle:'Se puede aspirar desde los ' + SUPUESTOS.edadMinimaAspiracionMeses + ' meses de vida.', ir:['donantes',{ filtro:'joven' }] });

  const fuera = RECEPTORAS.filter(r => clientesU.indexOf(r.clienteId) >= 0 && estadoSincronizacion(r).clave === 'fuera');
  if (fuera.length) A.push({ nivel:'bad', icono:'i-receptora', titulo: fuera.length + ' receptoras quedaron fuera de ventana',
    detalle:'Se sincronizaron y la TE no se hizo. Hay que resincronizar el lote.', ir:['receptoras',{ filtro:'fuera' }] });

  const ventana = RECEPTORAS.filter(r => clientesU.indexOf(r.clienteId) >= 0 && estadoSincronizacion(r).clave === 'ventana');
  if (ventana.length) A.push({ nivel:'warn', icono:'i-te', titulo: ventana.length + ' receptoras en ventana de TE',
    detalle:'Hay que transferir hoy o mañana.', ir:['receptoras',{ filtro:'ventana' }] });

  const dtSinReportar = EMBRIONES.filter(e => e.enCampo && e.estado === 'En stock' &&
    e.fechaEntrega && desdeHoy(e.fechaEntrega) > 75 && clientesU.indexOf(e.clienteId) >= 0);
  if (dtSinReportar.length) A.push({ nivel:'bad', icono:'i-termo', titulo: dtSinReportar.length + ' embriones DT entregados y nunca reportados',
    detalle:'Están en termos de clientes hace más de 75 días sin que nadie informe la transferencia.', ir:['criogenia',{ filtro:'dt-sin-reportar' }] });

  const impagos = TERMOS.filter(t => t.mantenimiento === 'Impago' && enUnidad(t.unidad));
  if (impagos.length) A.push({ nivel:'warn', icono:'i-plata', titulo: impagos.length + ' termos con mantenimiento impago',
    detalle:'Material de terceros en custodia con la cuota atrasada.', ir:['criogenia',{ filtro:'impago' }] });

  const quietos = EMBRIONES.filter(e => e.estado === 'En stock' && !e.enCampo &&
    desdeHoy(e.fechaProduccion) > 400 && clientesU.indexOf(e.clienteId) >= 0);
  if (quietos.length) A.push({ nivel:'warn', icono:'i-nieve', titulo: quietos.length + ' embriones sin movimiento hace más de un año',
    detalle:'Ocupan lugar en el termo y siguen generando mantenimiento.', ir:['criogenia',{ filtro:'sin-movimiento' }] });

  const garSaldo = GARANTIAS.filter(g => g.saldo > 0 && clientesU.indexOf(g.clienteId) >= 0);
  if (garSaldo.length) A.push({ nivel:'bad', icono:'i-garantia', titulo: garSaldo.length + ' garantías con saldo de preñeces a reponer',
    detalle: suma(garSaldo, g => g.saldo) + ' preñeces comprometidas y todavía no logradas.', ir:['garantias',{}] });

  const vencidas = FACTURAS.filter(f => f.estado === 'Vencida' && enUnidad(f.unidad));
  if (vencidas.length) A.push({ nivel:'bad', icono:'i-factura', titulo: vencidas.length + ' facturas vencidas por ' + $$(suma(vencidas, f => f.neto)),
    detalle:'Con más de 30 días desde la emisión.', ir:['facturacion',{ filtro:'Vencida' }] });

  const sinDx = TRANSFERENCIAS.filter(t => t.resultado === 'Sin diagnosticar' &&
    desdeHoy(t.fecha) >= SUPUESTOS.diagnosticoDias && clientesU.indexOf(t.clienteId) >= 0);
  if (sinDx.length) A.push({ nivel:'warn', icono:'i-prenez', titulo: sinDx.length + ' transferencias esperando ecografía',
    detalle:'Pasaron los ' + SUPUESTOS.diagnosticoDias + ' días y todavía no se cargó el diagnóstico.', ir:['prenez',{ filtro:'pendiente' }] });

  const expPend = EXPORTACIONES.filter(e => e.estado !== 'Entregado');
  if (expPend.length) A.push({ nivel:'warn', icono:'i-exportar', titulo: expPend.length + ' expedientes de exportación abiertos',
    detalle:'Con documentación o envío en curso.', ir:['exportacion',{}] });

  const n2 = TERMOS.filter(t => t.ambito === 'Campo' && desdeHoy(t.ultimaCarga) > 90 && enUnidad(t.unidad));
  if (n2.length) A.push({ nivel:'bad', icono:'i-nieve', titulo: n2.length + ' termos en el campo sin carga de nitrógeno hace más de 90 días',
    detalle:'El cliente es el responsable, pero el material adentro es trazabilidad nuestra.', ir:['criogenia',{ filtro:'campo' }] });

  const orden = { bad:0, warn:1, ok:2 };
  A.sort((a,b) => orden[a.nivel] - orden[b.nivel]);
  return A;
}

function toast(titulo, detalle, opts){

  d.className = 'toast' + (opts.ir ? ' accion' : '');
  d.innerHTML = ico(opts.icono || 'i-check-circ') +
    '<div style="flex:1;min-width:0"><b>' + esc(titulo) + '</b>' +
    (detalle ? '<span>' + esc(detalle) + '</span>' : '') + '</div>' +
    '<button aria-label="Cerrar el aviso">' + ico('i-cerrar') + '</button>';

let focoPrevio = null;

  velo.className = 'velo';
  velo.setAttribute('role','dialog');

    '<div class="modal ' + (cfg.tamano || '') + '">' +
      '<div class="modal-h">' +
        (cfg.icono ? '<span style="color:var(--brand-deep)">' + ico(cfg.icono,'ic-lg') + '</span>' : '') +

        '<button class="btn btn-ico ghost" data-cerrar aria-label="Cerrar">' + ico('i-cerrar') + '</button>' +
      '</div>' +

      (cfg.pie === false ? '' : '<div class="modal-f">' + (cfg.pie || '<button class="btn" data-cerrar>Cerrar</button>') + '</div>') +

function cerrarModal(){

function preguntar(cfg){

      titulo: cfg.titulo, sub: cfg.sub, icono: cfg.icono || 'i-info', tamano:'angosto',

/* ------------------------------ descargas -------------------------------- */
function descargar(nombre, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportarCSV(nombre, encabezados, filas){
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const txt = [encabezados.map(q).join(';')].concat(filas.map(f => f.map(q).join(';'))).join('\r\n');
  descargar(nombre + '.csv', new Blob(['﻿' + txt], { type:'text/csv;charset=utf-8' }));
  toast('Archivo descargado', nombre + '.csv · ' + filas.length + ' filas', { icono:'i-descargar' });
}
function exportarExcel(nombre, hojas){
  const xe = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const celda = (v) => {
    const num = (typeof v === 'number' && isFinite(v));
    return '<Cell><Data ss:Type="' + (num ? 'Number' : 'String') + '">' + xe(num ? v : v) + '</Data></Cell>';
  };
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<?mso-application progid="Excel.Sheet"?>\n' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n' +
    '<Styles><Style ss:ID="tit"><Font ss:Bold="1" ss:Size="12"/></Style>' +
    '<Style ss:ID="enc"><Font ss:Bold="1" ss:Color="#FFFFFF"/>' +
    '<Interior ss:Color="#0A7A99" ss:Pattern="Solid"/></Style></Styles>\n';
  hojas.forEach(h => {
    xml += '<Worksheet ss:Name="' + xe(h.nombre.slice(0,31)) + '"><Table>\n';
    if (h.titulo) xml += '<Row><Cell ss:StyleID="tit"><Data ss:Type="String">' + xe(h.titulo) + '</Data></Cell></Row><Row></Row>\n';
    if (h.encabezados) xml += '<Row>' + h.encabezados.map(e => '<Cell ss:StyleID="enc"><Data ss:Type="String">' + xe(e) + '</Data></Cell>').join('') + '</Row>\n';
    (h.filas || []).forEach(f => { xml += '<Row>' + f.map(celda).join('') + '</Row>\n'; });
    xml += '</Table></Worksheet>\n';
  });
  xml += '</Workbook>';
  descargar(nombre + '.xls', new Blob([xml], { type:'application/vnd.ms-excel;charset=utf-8' }));
  toast('Excel descargado', nombre + '.xls · ' + hojas.length + ' hoja(s)', { icono:'i-excel' });
}

/* ------------------------------ PDF propio ------------------------------- */
/* Escribe un PDF 1.4 real, sin librerías: texto Helvetica y rectángulos. */
function nuevoPDF(){
  const ANCHO = 595.28, ALTO = 841.89, MARGEN = 42;
  const paginas = [];
  let p = null, y = 0;
  function pagina(){ p = { ops: [] }; paginas.push(p); y = ALTO - MARGEN; return p; }
  function esc1(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
  function espacio(n){ if (y - n < MARGEN + 26) { pagina(); return true; } return false; }
  const api = {
    ANCHO, ALTO, MARGEN,
    get y(){ return y; }, set y(v){ y = v; },
    pagina, espacio,
    texto(t, x, tam, negrita, color){
      const c = color || [0.09,0.13,0.16];
      p.ops.push('BT /' + (negrita ? 'F2' : 'F1') + ' ' + tam + ' Tf ' +
        c[0].toFixed(3) + ' ' + c[1].toFixed(3) + ' ' + c[2].toFixed(3) + ' rg ' +
        x.toFixed(2) + ' ' + y.toFixed(2) + ' Td (' + esc1(t) + ') Tj ET');
      return api;
    },
    textoDer(t, xDer, tam, negrita, color){
      const ancho = t.length * tam * 0.5;
      return api.texto(t, xDer - ancho, tam, negrita, color);
    },
    rect(x, yy, w, h, color){
      const c = color || [0.90,0.94,0.96];
      p.ops.push(c[0].toFixed(3) + ' ' + c[1].toFixed(3) + ' ' + c[2].toFixed(3) + ' rg ' +
        x.toFixed(2) + ' ' + yy.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re f');
      return api;
    },
    linea(x1, y1, x2, y2, color){
      const c = color || [0.85,0.89,0.92];
      p.ops.push(c[0].toFixed(3) + ' ' + c[1].toFixed(3) + ' ' + c[2].toFixed(3) + ' RG 0.7 w ' +
        x1.toFixed(2) + ' ' + y1.toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l S');
      return api;
    },
    bajar(n){ y -= n; return api; },
    blob(){
      const objs = [];
      const fuentes = '<< /F1 5 0 R /F2 6 0 R >>';
      const idsPag = paginas.map((_, i) => (7 + i*2) + ' 0 R');
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[2] = '<< /Type /Pages /Kids [' + idsPag.join(' ') + '] /Count ' + paginas.length + ' >>';
      objs[3] = '<< >>'; objs[4] = '<< >>';
      objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      paginas.forEach((pg, i) => {
        const n = 7 + i*2;
        const stream = pg.ops.join('\n');
        objs[n] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + ANCHO.toFixed(2) + ' ' + ALTO.toFixed(2) +
                  '] /Resources << /Font ' + fuentes + ' >> /Contents ' + (n+1) + ' 0 R >>';
        objs[n+1] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
      });
      let out = '%PDF-1.4\n';
      const offsets = [];
      for (let i = 1; i < objs.length; i++) {
        offsets[i] = out.length;
        out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
      }
      const inicioXref = out.length;
      out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
      for (let i = 1; i < objs.length; i++) out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
      out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + inicioXref + '\n%%EOF';
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return new Blob([bytes], { type:'application/pdf' });
    }
  };
  pagina();
  return api;
}

/* ------------------------------ gráficos --------------------------------- */
function grBarras(datos, opts){
  opts = opts || {};
  const W = 100, H = opts.alto || 150, pb = 18, pl = 0;
  const alturaCSS = opts.alto || 150;
  const max = Math.max(1, ...datos.map(d => d.v));
  const n = datos.length || 1;
  const bw = (W - pl) / n;
  let s = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' +
          alturaCSS + 'px" role="img" aria-label="' + esc(opts.titulo || 'Gráfico de barras') + '">';
  datos.forEach((d, i) => {
    const h = (H - pb - 14) * (d.v / max);
    const x = pl + i*bw + bw*0.16, w = bw*0.68;
    s += '<rect class="' + (d.destacar ? 'barra2' : 'barra') + '" x="' + x.toFixed(2) + '" y="' + (H - pb - h).toFixed(2) +
         '" width="' + w.toFixed(2) + '" height="' + Math.max(0.6, h).toFixed(2) + '" rx="1"><title>' + esc(d.et + ': ' + d.v) + '</title></rect>';
  });
  s += '</svg>';
  const etiquetas = '<div style="display:grid;grid-template-columns:repeat(' + n + ',1fr);gap:0;margin-top:5px">' +
    datos.map(d => '<span style="font-size:9.5px;color:var(--ink-3);text-align:center;font-weight:600">' + esc(d.corta || d.et) + '</span>').join('') + '</div>';
  return '<div>' + s + etiquetas + '</div>';
}
function grLineas(series, etiquetas, opts){
  opts = opts || {};
  const W = 760, H = opts.alto || 190, pl = 34, pb = 20, pt = 10;
  const max = Math.max(1, ...series.map(s => Math.max(...s.datos)));
  const n = etiquetas.length || 1;
  const px = (i) => pl + (W - pl - 6) * (n === 1 ? 0.5 : i/(n-1));
  const py = (v) => pt + (H - pt - pb) * (1 - v/max);
  let s = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" style="max-height:' + H +
          'px" role="img" aria-label="' + esc(opts.titulo || 'Gráfico de líneas') + '">';
  [0, 0.5, 1].forEach(f => {
    const yy = py(max*f);
    s += '<line class="eje" x1="' + pl + '" y1="' + yy.toFixed(1) + '" x2="' + (W-6) + '" y2="' + yy.toFixed(1) + '"/>' +
         '<text x="' + (pl-4) + '" y="' + (yy+3).toFixed(1) + '" text-anchor="end">' + Math.round(max*f) + '</text>';
  });
  series.forEach(se => {
    const d = se.datos.map((v, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1)).join(' ');
    s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    se.datos.forEach((v, i) => { s += '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="2.2" fill="' + se.color + '"><title>' + esc(etiquetas[i] + ': ' + v) + '</title></circle>'; });
  });
  etiquetas.forEach((e, i) => {
    if (n > 12 && i % 2) return;
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H-5) + '" text-anchor="middle">' + esc(e) + '</text>';
  });
  s += '</svg>';
  const leyenda = '<div class="leyenda">' + series.map(se => '<span><i style="background:' + se.color + '"></i>' + esc(se.nombre) + '</span>').join('') + '</div>';
  return s + leyenda;
}
function grDona(partes, opts){
  opts = opts || {};
  const total = suma(partes, p => p.v) || 1;
  const R0 = 52, R1 = 34, C = 60;
  let ang = -Math.PI/2, s = '<svg class="gr" viewBox="0 0 120 120" style="max-width:150px;margin:0 auto" role="img" aria-label="' + esc(opts.titulo || 'Distribución') + '">';
  partes.forEach(p => {
    const a = (p.v/total) * Math.PI*2;
    if (a <= 0) return;
    const x1 = C + R0*Math.cos(ang), y1 = C + R0*Math.sin(ang);
    const x2 = C + R0*Math.cos(ang+a), y2 = C + R0*Math.sin(ang+a);
    const x3 = C + R1*Math.cos(ang+a), y3 = C + R1*Math.sin(ang+a);
    const x4 = C + R1*Math.cos(ang), y4 = C + R1*Math.sin(ang);
    const grande = a > Math.PI ? 1 : 0;
    s += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A' + R0 + ' ' + R0 + ' 0 ' + grande + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
         ' L' + x3.toFixed(2) + ' ' + y3.toFixed(2) + ' A' + R1 + ' ' + R1 + ' 0 ' + grande + ' 0 ' + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z" fill="' + p.color + '">' +
         '<title>' + esc(p.et + ': ' + p.v) + '</title></path>';
    ang += a;
  });
  s += '<text x="60" y="58" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--ink)">' + N(total) + '</text>';
  s += '<text x="60" y="70" text-anchor="middle" style="font-size:8px">' + esc(opts.centro || '') + '</text></svg>';
  const leyenda = '<div class="leyenda" style="justify-content:center">' +
    partes.map(p => '<span><i style="background:' + p.color + '"></i>' + esc(p.et) + ' · <b>' + N(p.v) + '</b></span>').join('') + '</div>';
  return s + leyenda;
}

function contadorNav(v){

    case 'garantias':  return GARANTIAS.filter(g => g.saldo > 0 && s.has(g.clienteId)).length || null;

/* ------------------------------- router ---------------------------------- */
function ir(vista, params){
  if (!VISTAS[vista]) { toast('Esa pantalla todavía no está en la maqueta', vista, { icono:'i-info' }); return; }
  if (UI.vista !== vista || JSON.stringify(UI.params) !== JSON.stringify(params || {})) {
    UI.historial.push({ vista: UI.vista, params: UI.params });
    if (UI.historial.length > 40) UI.historial.shift();
  }
  UI.vista = vista;
  UI.params = params || {};
  $('#side').classList.remove('abierto');
  pintar();
  elMain().scrollTop = 0;
}
function volver(){
  const prev = UI.historial.pop();
  if (!prev) { ir(UI.modo === 'interno' ? 'inicio' : 'p-inicio', {}); return; }
  UI.vista = prev.vista; UI.params = prev.params;
  pintar(); elMain().scrollTop = 0;
}

function pintar(){
  const v = VISTAS[UI.vista];
  const cab = [];
  if (v.miga) {
    cab.push('<div class="miga"><button data-volver>' + ico('i-volver') + ' Volver</button>' +
      '<span>·</span><span>' + esc(v.miga(UI.params)) + '</span></div>');
  }
  const tit = typeof v.tit === 'function' ? v.tit(UI.params) : v.tit;
  const sub = typeof v.sub === 'function' ? v.sub(UI.params) : v.sub;
  $('#vista-head').innerHTML =
    '<div class="tit">' + cab.join('') + '<h1>' + esc(tit) + '</h1>' +
    (sub ? '<p>' + sub + '</p>' : '') + '</div>' +
    (v.acciones ? '<div class="acc">' + v.acciones(UI.params) + '</div>' : '');
  $('#contenido').innerHTML = v.render(UI.params);
  pintarNav();
  $('#tb-unidad').textContent = UI.unidad === 'TODAS' ? 'Toda la red' : (UNIDADES.find(u => u.id === UI.unidad) || {}).nombre;
  const al = calcularAlertas();
  $('#tb-alertas').textContent = String(al.length);
  if (v.listo) v.listo(UI.params);
  document.title = tit + ' · In Vitro · CustomERP';
}

document.addEventListener('click', (e) => {
  const irEl = e.target.closest('[data-ir]');
  if (irEl) {
    let p = {};
    try { p = JSON.parse(irEl.getAttribute('data-params') || '{}'); } catch(err) { p = {}; }
    ir(irEl.getAttribute('data-ir'), p);
    return;
  }
  if (e.target.closest('[data-volver]')) { volver(); return; }
  const acc = e.target.closest('[data-accion]');
  if (acc) {
    const fn = ACCIONES[acc.getAttribute('data-accion')];
    if (fn) {
      let p = {};
      try { p = JSON.parse(acc.getAttribute('data-arg') || '{}'); } catch(err) { p = {}; }
      fn(p, acc);
    }
    return;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-ir]')) { e.target.click(); }
});

function seriesEmbrionesMes(n){
  const s = idsClientesVisibles();
  const out = [];
  for (let m = n - 1; m >= 0; m--) {
    const ref = new Date(HOY.getFullYear(), HOY.getMonth() - m, 1);
    const fin = new Date(ref.getFullYear(), ref.getMonth() + 1, 1);
    const v = cuenta(EMBRIONES, e => s.has(e.clienteId) && e.fechaProduccion >= ref && e.fechaProduccion < fin);
    out.push({ et: fMes(ref), corta: MESES[ref.getMonth()], v });
  }
  return out;
}

          '<b>' + esc(t.id) + '</b><span class="cl">' + esc(nombreCliente(t.clienteId)) + '</span>' +
