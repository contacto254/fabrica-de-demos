          'data-accion="mover-os" data-arg=\'{"id":"' + t.id + '"}\' ' +
          'aria-label="Pasar a la etapa siguiente" title="Pasar a la etapa siguiente">' + ico('i-chevron') + '</button>' +
          '</div></div>';
      }).join('') : '<div style="padding:12px;text-align:center;color:var(--ink-3);font-size:11.5px">Sin trabajos</div>') +
      '</div></div>';
  }).join('');
}
function activarKanban(){
  const kb = $('#kanban');
  if (!kb) return;
  let arrastrada = null;
  kb.querySelectorAll('.kb-card').forEach(c => {
    c.addEventListener('dragstart', () => { arrastrada = c; c.classList.add('arrastrando'); });
    c.addEventListener('dragend', () => { c.classList.remove('arrastrando'); arrastrada = null;
      kb.querySelectorAll('.kb-col').forEach(x => x.classList.remove('sobre')); });
    c.addEventListener('click', (e) => {
      if (e.target.closest('[data-accion]')) return;
      ir('informe', { id: c.getAttribute('data-os') });
    });
  });
  kb.querySelectorAll('.kb-col').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', () => col.classList.remove('sobre'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('sobre');
      if (!arrastrada) return;
      const osId = arrastrada.getAttribute('data-os');
      const os = TRABAJOS_POR_ID.get(osId);
      const nueva = col.getAttribute('data-col');
      if (!os || os.etapa === nueva) return;
      const anterior = os.etapa;
      os.etapa = nueva;
      pintar();
      toast('Trabajo ' + osId + ' movido', 'De «' + anterior + '» a «' + nueva + '» · ' + nombreCliente(os.clienteId),
        { icono:'i-trabajo', ir:['informe', { id: osId }] });
    });
  });
}

/* --------------------------- exportaciones del informe ------------------- */
function datosInforme(os){
  const r = resumen(os);
  const c = CLIENTES_POR_ID.get(os.clienteId);
  const est = EST_POR_ID.get(os.establecimientoId);
  const resumenFilas = [
    ['Donantes aspiradas', r.donantesAspiradas],
    ['Ovocitos recuperados', r.ovocitos],
    ['Ovocitos viables', r.viables],
    ['% de viabilidad', D1(r.tasaViables*100) + '%'],
    ['Embriones D7 producidos', r.embrionesD7],
    ['% de viables que llegó a D7', D1(r.tasaD7*100) + '%'],
    ['Embriones frescos', r.frescos],
    ['Embriones vitrificados', r.vitrificados],
    ['Embriones DT', r.dt],
    ['Transferencias realizadas', r.transferidos],
    ['Diagnósticos hechos', r.diagnosticadas],
    ['Preñeces confirmadas', r.preneces],
    ['% de preñez', D1(r.tasaPrenez*100) + '%'],
    ['Pérdidas entre día 30 y 60', r.perdidas],
    ['Pariciones registradas', r.pariciones.length],
  ];
  const donFilas = r.donantes.map(d => {
    const dn = DONANTES_POR_ID.get(d.donanteId);
    return [dn.nombre, dn.rp, dn.raza, d.ovocitos, d.viables, d.embriones, d.transferidos, d.preneces];
  });
  const teFilas = r.tes.map(te => {
    const emb = EMBRIONES_POR_ID.get(te.embrionId);
    const rec = REC_POR_ID.get(te.receptoraId);
    const par = PARICIONES.find(x => x.transferenciaId === te.id);
    return [te.embrionId, nombreDonante(emb.donanteId), nombreToro(emb.toroId), emb.modalidad, emb.sexo,
      rec.id, rec.rp, fFecha(te.fecha), nombreTec(te.tecnicoId), te.resultado,
      te.resultado === 'Preñada' ? fFecha(te.fpp) : '', par ? fFecha(par.fecha) + ' (' + par.sexo + ')' : ''];
  });
  const anteriores = TRABAJOS.filter(t => t.clienteId === os.clienteId && t.fechaOPU < os.fechaOPU && t.embrionIds.length)
    .sort((a,b) => b.fechaOPU - a.fechaOPU).slice(0, 4);
  const compFilas = [[os.id + ' (este trabajo)', fFecha(os.fechaOPU), r.donantesAspiradas,
      Math.round(r.ovocitosPorDonante*10)/10, r.embrionesD7, Math.round(r.embrionesPorDonante*10)/10,
      D1(r.tasaPrenez*100) + '%']]
    .concat(anteriores.map(t => { const ra = resumen(t);
      return [t.id, fFecha(t.fechaOPU), ra.donantesAspiradas, Math.round(ra.ovocitosPorDonante*10)/10,
        ra.embrionesD7, Math.round(ra.embrionesPorDonante*10)/10, ra.diagnosticadas ? D1(ra.tasaPrenez*100) + '%' : '—']; }));
  return { r, c, est, resumenFilas, donFilas, teFilas, compFilas };
}

ACCIONES['informe-pdf'] = (arg) => {
  const os = TRABAJOS_POR_ID.get(arg.id);
  const d = datosInforme(os);
  const doc = nuevoPDF();
  const M = doc.MARGEN, W = doc.ANCHO;
  const CIAN = [0.0, 0.647, 0.807], CARBON = [0.149, 0.176, 0.200], GRIS = [0.40,0.47,0.52];

  function encabezadoPagina(){
    doc.rect(0, doc.ALTO - 76, W, 76, CARBON);
    doc.y = doc.ALTO - 34;
    doc.texto('IN VITRO', M, 16, true, [1,1,1]);
    doc.y = doc.ALTO - 48;
    doc.texto('INFORME DE TRABAJO', M, 8, false, [0.6,0.68,0.72]);
    doc.y = doc.ALTO - 62;
    doc.texto(os.id + '  ·  ' + d.c.razon, M, 10, true, [1,1,1]);
    doc.y = doc.ALTO - 34;
    doc.texto('Guarambare 1385, Montevideo', W - M - 150, 7.5, false, [0.6,0.68,0.72]);
    doc.y = doc.ALTO - 46;
    doc.texto('Emitido el ' + fFecha(HOY), W - M - 150, 7.5, false, [0.6,0.68,0.72]);
    doc.y = doc.ALTO - 100;
  }
  function titulo(t){
    if (doc.y < 130) { doc.pagina(); encabezadoPagina(); }
    doc.bajar(6);
    doc.rect(M, doc.y - 3, 3, 12, CIAN);
    doc.texto(t, M + 9, 11, true, CARBON);
    doc.bajar(16);
  }
  function filaTabla(cols, anchos, negrita, fondo){
    if (doc.espacio(16)) { encabezadoPagina(); }
    if (fondo) doc.rect(M, doc.y - 4, W - M*2, 14, fondo);
    let x = M + 3;
    cols.forEach((c, i) => {
      const txt = String(c);
      if (i > 0 && anchos[i] > 0) doc.textoDer(txt, x + anchos[i] - 6, 8, negrita, negrita ? CARBON : GRIS);
      else doc.texto(txt.length > 40 ? txt.slice(0, 39) : txt, x, 8, negrita, CARBON);
      x += anchos[i];
    });
    doc.bajar(14);
  }

  encabezadoPagina();
  doc.texto(d.est.nombre + '  ·  ' + d.est.paraje + ', ' + d.est.depto, M, 9, false, GRIS); doc.bajar(13);
  doc.texto('OPU ' + fFecha(os.fechaOPU) + '   ·   FIV ' + fFecha(os.fechaFIV) + '   ·   D7 ' + fFecha(os.fechaD7) +
            '   ·   Tecnico: ' + nombreTec(os.tecnicoId), M, 9, false, GRIS); doc.bajar(6);

  titulo('Resumen del trabajo');
  const anchoCol = (W - M*2) / 3;
  d.resumenFilas.forEach((f, i) => {
    const col = i % 3, fila = Math.floor(i / 3);
    if (col === 0 && fila > 0) doc.bajar(30);
    if (col === 0 && doc.espacio(34)) encabezadoPagina();
    const x = M + col*anchoCol;
    const yGuardado = doc.y;
    doc.texto(String(f[0]).toUpperCase().slice(0,30), x, 6.5, false, GRIS);
    doc.y = yGuardado - 13;
    doc.texto(String(f[1]), x, 14, true, CARBON);
    doc.y = yGuardado;
  });
  doc.bajar(40);

  titulo('Detalle por donante');
  const aDon = [128, 46, 58, 52, 62, 68, 58, 0];
  filaTabla(['Donante','RP','Ovocitos','Viables','Embriones','Transferidos','Preneces'], aDon, true, [0.89,0.95,0.98]);

function datosPortal(){
  const c = clienteActual();
  const donantes = (DONANTES_POR_CLIENTE.get(c.id) || []);
  const embriones = EMBRIONES.filter(e => e.clienteId === c.id);
  const stock = embriones.filter(e => e.estado === 'En stock');
  const tes = TRANSFERENCIAS.filter(t => t.clienteId === c.id);
  const preneces = tes.filter(t => t.resultado === 'Preñada' && !PARICIONES.some(p => p.transferenciaId === t.id));
  const pariciones = PARICIONES.filter(p => p.clienteId === c.id);
  const trabajos = TRABAJOS.filter(t => t.clienteId === c.id && t.embrionIds.length).sort((a,b) => b.fechaOPU - a.fechaOPU);
  const garantias = GARANTIAS.filter(g => g.clienteId === c.id);
  const cuenta = saldoCliente(c.id);
  const proyecto = PROYECTO_POR_CLIENTE.get(c.id);
  return { c, donantes, embriones, stock, tes, preneces, pariciones, trabajos, garantias, cuenta, proyecto };
}

      kpi('Viabilidad promedio', pc(suma(doce, x => x.viables) / Math.max(1, suma(doce, x => x.ovocitos))), 'Supuesto: ' + pc(SUPUESTOS.tasaViables[0]) + ' a ' + pc(SUPUESTOS.tasaViables[1]), { icono:'i-tendencia' }) +

        tarjeta('Ovocitos recuperados por mes', grBarras(porMes, { titulo:'Ovocitos por mes' }),
          { icono:'i-tendencia', sub:'El pico de trabajo es primavera-verano' }) +

          [['No requiere tratamiento hormonal', 'La donante va a la manga sólo el día de la aspiración.'],

           ['Hasta el ' + SUPUESTOS.mesGestacionMaximoAspiracion + '.º mes de gestación', 'Pasado ese mes sale del programa hasta parir.']].map(x =>
            '<div><span class="ava">' + ico('i-check') + '</span><span class="cpo"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></span></div>').join('') +

/* ==========================================================================
   FICHA DE EMBRIÓN CON TRAZABILIDAD
   Para atrás: donante, toro y fecha de aspiración.
   Para adelante: receptora, preñez y parto.
   ========================================================================== */
function fichaEmbrion(p, soloLectura){
  const e = EMBRIONES_POR_ID.get(p.id);
  if (!e) return vacio('No encontré ese embrión','Puede venir de un enlace viejo.','i-embrion');
  const part = PARTIDAS_POR_ID.get(e.partidaId);
  const ses = SESIONES_POR_ID.get(e.sesionId);
  const dn = DONANTES_POR_ID.get(e.donanteId);
  const toro = TOROS_POR_ID.get(e.toroId);
  const os = TRABAJOS_POR_ID.get(e.trabajoId);
  const te = e.transferenciaId ? TE_POR_ID.get(e.transferenciaId) : null;
  const dx = te && te.diagnosticoId ? DX_POR_ID.get(te.diagnosticoId) : null;
  const par = te ? PARICIONES.find(x => x.transferenciaId === te.id) : null;
  const rec = te ? REC_POR_ID.get(te.receptoraId) : null;
  const exp = e.exportacionId ? EXPORTACIONES.find(x => x.id === e.exportacionId) : null;
  const ir0 = (v, pr, txt, icono) => soloLectura
    ? '<span class="b6">' + esc(txt) + '</span>'
    : '<button class="btn sm" data-ir="' + v + '" data-params=\'' + JSON.stringify(pr) + '\'>' + ico(icono) + ' ' + esc(txt) + '</button>';

  const pasos = [];
  pasos.push({ estado:'hecho', icono:'i-donante', t:'Donante seleccionada por el cliente',
    cuando:'', det:'<b>' + esc(dn.nombre) + '</b> · RP ' + esc(dn.rp) + ' · ' + esc(dn.raza) + ' · ' + esc(dn.pedigri) +
    '<br><span class="dim">Propiedad de ' + esc(nombreCliente(dn.clienteId)) + '. La selección de donantes la hace el cliente; In Vitro asesora.</span>' +
    '<div class="mt8">' + ir0('donante', { id: dn.id }, 'Ver la ficha de la donante', 'i-donante') + '</div>' });
  pasos.push({ estado:'hecho', icono:'i-opu', t:'1 · Aspiración folicular (OPU)', cuando: fFecha(ses.fecha),
    det: 'Sesión <b>' + esc(ses.id) + '</b> en ' + esc(nombreEst(ses.establecimientoId)) + ', por ' + esc(nombreTec(ses.tecnicoId)) + '.<br>' +
    (function(){ const d = ses.detalle.find(x => x.donanteId === dn.id) || {};
      return '<span class="dim">De esta donante salieron ' + N(d.ovocitos) + ' ovocitos, ' + N(d.viables) + ' viables.</span>'; })() +
    '<div class="mt8">' + ir0('sesion', { id: ses.id }, 'Ver la sesión completa', 'i-opu') + '</div>' });
  pasos.push({ estado:'hecho', icono:'i-fiv', t:'2 · Fertilización (FIV)', cuando: fFecha(part.fecha),
    det: 'Partida <b>' + esc(part.id) + '</b> con <b>' + esc(toro.nombre) + '</b> (' + esc(toro.tipo) + ', ' + esc(toro.raza) + ').<br>' +
    '<span class="dim">' + N(part.ovocitosIngresados) + ' ovocitos ingresados · ' + pc(part.clivaje) + ' de clivaje · ' +
    part.pajuelasUsadas + ' pajuela(s) repartida(s) entre ' + part.donanteIds.length + ' donantes.</span>' +
    '<div class="mt8">' + ir0('partida', { id: part.id }, 'Ver la partida', 'i-fiv') + ' ' + ir0('toro', { id: toro.id }, 'Ver el toro', 'i-toro') + '</div>' });
  pasos.push({ estado:'hecho', icono:'i-embrion', t:'3 · Embrión transferible (D7)', cuando: fFecha(e.fechaProduccion),
    det: 'Embrión <b>' + esc(e.id) + '</b> · ' + esc(e.sexo) + ' · grado ' + esc(e.grado) + ' · modalidad <b>' + esc(e.modalidad) + '</b>.<br>' +
    '<span class="dim">' + SUPUESTOS.diasCultivoD7 + ' días de cultivo desde la fertilización.</span>' });

  if (e.modalidad !== 'Fresco') {
    pasos.push({ estado: e.estado === 'En stock' ? 'hecho' : 'hecho', icono:'i-nieve',
      t: e.modalidad === 'DT' ? 'Congelado y entregado como DT' : 'Vitrificado en el laboratorio',
      cuando: e.fechaEntrega ? fFecha(e.fechaEntrega) : (e.fechaIngresoTermo ? fFecha(e.fechaIngresoTermo) : fFecha(e.fechaProduccion)),
      det: e.ubicacion
        ? ('Posición <b>' + esc(e.ubicacion.texto) + '</b>' + (e.enCampo ? ', en el termo del cliente, en el campo' : ', en el laboratorio de Montevideo') + '.' +
           (e.remito ? '<br><span class="dim">Entregado con remito ' + esc(e.remito) + '.</span>' : '') +
           '<div class="mt8">' + ir0('termo', { id: e.ubicacion.termoId }, 'Ver el termo', 'i-termo') + '</div>')
        : 'Salió del termo el día de la transferencia.' });
  }

  if (te) {
    pasos.push({ estado:'hecho', icono:'i-te', t:'4 · Transferencia embrionaria', cuando: fFecha(te.fecha),
      det: 'Receptora <b>' + esc(rec.id) + '</b> (RP ' + esc(rec.rp) + ', ' + esc(rec.cruza) + '), protocolo ' + esc(te.protocolo) + '.<br>' +
      '<span class="dim">Momento cero del protocolo el ' + fFecha(te.d0) + '. Transferida por ' + esc(nombreTec(te.tecnicoId)) + ' en ' + esc(nombreEst(te.establecimientoId)) + '.</span>' +
      '<div class="mt8">' + ir0('receptora', { id: rec.id }, 'Ver la receptora', 'i-receptora') + '</div>' });
    if (dx) {
      pasos.push({ estado: dx.resultado === 'Preñada' ? 'hecho' : 'alerta', icono:'i-prenez',
        t:'Diagnóstico de preñez · ' + dx.resultado, cuando: fFecha(dx.fecha),
        det: esc(dx.metodo) + ' al día ' + dx.diaGestacion + ' de gestación, por ' + esc(nombreTec(dx.tecnicoId)) + '.' +
        (dx.reconfirmacion ? '<br><span class="dim">Reconfirmación el ' + fFecha(dx.reconfirmacion.fecha) + ': ' + esc(dx.reconfirmacion.resultado) + '.</span>' : '') });
    } else {
      pasos.push({ estado:'futuro', icono:'i-reloj', t:'Diagnóstico de preñez',
        cuando: fFecha(sumar(te.fecha, SUPUESTOS.diagnosticoDias)),
        det:'Ecografía prevista a los ' + SUPUESTOS.diagnosticoDias + ' días de la transferencia.' });
    }
    if (par) {
      pasos.push({ estado:'hecho', icono:'i-paricion', t:'Parición · el círculo cerrado', cuando: fFecha(par.fecha),
        det: 'Nació un ternero <b>' + esc(par.sexo.toLowerCase()) + '</b>, RP ' + esc(par.rp) + ', ' + D1(par.pesoNacer) + ' kg.<br>' +
        '<span class="dim">' + esc(par.observaciones) + ' Hijo de ' + esc(dn.nombre) + ' x ' + esc(toro.nombre) + '.</span>' });
    } else if (te.resultado === 'Preñada') {
      pasos.push({ estado:'futuro', icono:'i-paricion', t:'Parto previsto', cuando: fFecha(te.fpp),
        det:'Faltan ' + (-desdeHoy(te.fpp)) + ' días. Gestación de ' + SUPUESTOS.diasGestacion + ' días menos los ' + SUPUESTOS.diasCultivoD7 + ' de cultivo.' });
    }
  } else if (exp) {
    pasos.push({ estado:'hecho', icono:'i-exportar', t:'Exportado', cuando: fFecha(exp.fecha),
      det:'Expediente <b>' + esc(exp.id) + '</b> con destino ' + esc(exp.destino) + '. ' + esc(exp.requisito) + '.' +
      '<div class="mt8">' + ir0('exportacion', {}, 'Ver el expediente', 'i-exportar') + '</div>' });
  } else if (e.estado === 'Vendido') {
    pasos.push({ estado:'hecho', icono:'i-plata', t:'Vendido en remate', cuando:'',
      det:'Salió en un remate de embriones con firma rematadora.' +
      '<div class="mt8">' + ir0('remates', {}, 'Ver los remates', 'i-plata') + '</div>' });
  } else if (e.estado === 'En stock') {
    pasos.push({ estado:'futuro', icono:'i-te', t:'Esperando transferencia',
      cuando:'hace ' + desdeHoy(e.fechaProduccion) + ' días',
      det: e.enCampo
        ? 'Está en el termo del cliente. In Vitro no tiene forma de saber si se transfirió, salvo que el cliente lo informe. Esto es exactamente lo que el módulo criogénico viene a resolver.'
        : 'En custodia en el laboratorio, generando mantenimiento mensual.' });
  }

  const cab = '<section class="card"><div class="card-b"><div class="fila" style="gap:18px;align-items:flex-start">' +
    '<div style="width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;flex:none">' + ico('i-embrion','ic-xl') + '</div>' +
    '<div style="flex:1;min-width:0"><h2 style="font-size:19px">' + esc(e.id) + '</h2>' +
    '<p class="dim2 mini">' + esc(dn.nombre) + ' <span class="dim">x</span> ' + esc(toro.nombre) + ' · producido el ' + fFecha(e.fechaProduccion) + ' · ' + esc(nombreCliente(e.clienteId)) + '</p>' +
    '<div class="chips mt8">' + tagModalidad(e.modalidad) + tagEmbrion(e.estado) +
    tagEstado(e.sexo, e.sexo === 'Sin sexar' ? '' : 'info') + tagEstado('Grado ' + e.grado, '') +
    (e.enCampo ? tagEstado('En termo del cliente','warn') : '') + '</div></div>' +
    (soloLectura ? '' : '<div class="col" style="flex:none">' +
      '<button class="btn" data-ir="informe" data-params=\'{"id":"' + e.trabajoId + '"}\'>' + ico('i-informe') + ' Informe del trabajo</button>' +
      '<button class="btn" data-accion="exportar-trazabilidad" data-arg=\'{"id":"' + e.id + '"}\'>' + ico('i-csv') + ' Bajar la trazabilidad</button></div>') +
    '</div></div></section>';

  const linea = '<div class="tl">' + pasos.map(x =>
    '<div class="tl-i ' + x.estado + '"><span class="pt">' + ico(x.icono) + '</span>' +
    '<h4>' + esc(x.t) + '</h4>' + (x.cuando ? '<div class="cuando">' + esc(x.cuando) + '</div>' : '') +
    '<div class="det">' + x.det + '</div></div>').join('') + '</div>';

  return cab +
    '<section class="grid g23">' +
      tarjeta('Línea de tiempo completa', linea, { icono:'i-enlace',
        sub:'Para atrás hasta la donante y la fecha de aspiración; para adelante hasta la receptora, la preñez y el parto' }) +
      tarjeta('Ficha técnica', '<dl class="dl">' +
        '<dt>Código</dt><dd>' + esc(e.id) + '</dd>' +
        '<dt>Partida FIV</dt><dd>' + esc(e.partidaId) + '</dd>' +
        '<dt>Trabajo</dt><dd>' + esc(e.trabajoId) + '</dd>' +
        '<dt>Donante</dt><dd>' + esc(dn.nombre) + '</dd>' +
        '<dt>Toro</dt><dd>' + esc(toro.nombre) + '</dd>' +
        '<dt>Sexo</dt><dd>' + esc(e.sexo) + '</dd>' +
        '<dt>Grado</dt><dd>' + esc(e.grado) + '</dd>' +
        '<dt>Modalidad</dt><dd>' + esc(e.modalidad) + '</dd>' +
        '<dt>Estado</dt><dd>' + esc(e.estado) + '</dd>' +
        '<dt>Propietario</dt><dd>' + esc(nombreCliente(e.clienteId)) + '</dd>' +
        '<dt>Ubicación</dt><dd>' + (e.ubicacion ? esc(e.ubicacion.texto) : '—') + '</dd>' +
        '<dt>Producido</dt><dd>' + fFecha(e.fechaProduccion) + '</dd>' +
        (e.fechaEntrega ? '<dt>Entregado</dt><dd>' + fFecha(e.fechaEntrega) + '</dd>' : '') +
        '</dl>' +
        (e.modalidad === 'DT' ? '<div class="aviso warn mt14">' + ico('i-info') + '<div><b>DT: habilitado para exportación</b>' +
          'La transferencia directa permite que el cliente lo guarde en su termo y lo descongele en el campo al momento de transferir.</div></div>' : ''),
        { icono:'i-lista' }) +
    '</section>';
}
VISTAS.embrion = {

/* ------------------------------- DONANTE --------------------------------- */
function fichaDonante(p, soloLectura){
  const d = DONANTES_POR_ID.get(p.id);
  if (!d) return vacio('No encontré esa donante','','i-donante');
  const est = estadoAspiracion(d);
  const ses = SESIONES.filter(s => s.detalle.some(x => x.donanteId === d.id)).sort((a,b) => b.fecha - a.fecha);
  const embs = EMBRIONES.filter(e => e.donanteId === d.id);
  const tes = TRANSFERENCIAS.filter(t => embs.some(e => e.id === t.embrionId));
  const pren = cuenta(tes, t => t.resultado === 'Preñada');
  const par = PARICIONES.filter(x => x.donanteId === d.id);
  const filasS = ses.map(s => {
    const det = s.detalle.find(x => x.donanteId === d.id);
    const misEmb = embs.filter(e => e.sesionId === s.id);
    const f = [fFecha(s.fecha), esc(s.id), esc(nombreEst(s.establecimientoId)), esc(nombreTec(s.tecnicoId)),
      N(det.ovocitos), N(det.viables), N(misEmb.length),
      cuenta(misEmb, e => tes.some(t => t.embrionId === e.id && t.resultado === 'Preñada'))];
    f.__ir = soloLectura ? null : ['sesion', { id: s.id }];
    if (!f.__ir) delete f.__ir;
    return f;
  });
  const filasE = embs.sort((a,b) => b.fechaProduccion - a.fechaProduccion).slice(0, 60).map(e => {
    const f = ['<b>' + esc(e.id) + '</b>', fFecha(e.fechaProduccion), esc(nombreToro(e.toroId)),
      tagModalidad(e.modalidad), esc(e.sexo), tagEmbrion(e.estado),
      e.ubicacion ? esc(e.ubicacion.texto) : '<span class="dim">—</span>'];
    f.__ir = [soloLectura ? 'p-embrion' : 'embrion', { id: e.id }];
    return f;
  });
  return '<section class="kpis">' +
    kpi('Aspiraciones', N(d.aspiraciones), d.ultimaAspiracion ? 'Última el ' + fFecha(d.ultimaAspiracion) : 'Todavía sin aspirar', { icono:'i-opu' }) +
    kpi('Ovocitos acumulados', N(d.ovocitosAcum), d.aspiraciones ? D1(d.ovocitosAcum/d.aspiraciones) + ' por sesión' : '', { icono:'i-fiv' }) +
    kpi('Embriones producidos', N(embs.length), d.aspiraciones ? D1(embs.length/d.aspiraciones) + ' por aspiración' : '', { icono:'i-embrion', acento:true }) +
    kpi('Preñeces logradas', N(pren), par.length + ' terneros nacidos', { icono:'i-paricion' }) +
    '</section>' +
    '<section><div class="aviso ' + (est.tag === 'bad' ? 'bad' : est.tag === 'warn' ? 'warn' : est.tag === 'ok' ? 'ok' : 'brand') + '">' +
    ico(est.tag === 'ok' ? 'i-check-circ' : 'i-alerta') + '<div><b>' + esc(est.texto) + '</b>' + esc(est.detalle) + '</div></div></section>' +
    '<section class="grid g23">' +
      tarjeta('Historial de aspiraciones', tabla(
        [{ t:'Fecha' },{ t:'Sesión' },{ t:'Establecimiento' },{ t:'Técnico' },{ t:'Ovocitos', num:true },
         { t:'Viables', num:true },{ t:'Embriones', num:true },{ t:'Preñeces', num:true }], filasS,
        { compacta:true, vacioTitulo:'Todavía no fue aspirada', vacioTexto:'Cuando entre en una jornada de OPU aparece acá.', vacioIcono:'i-opu' }),
        { icono:'i-opu', p0:true, sub:'Se puede aspirar cada ' + SUPUESTOS.diasEntreAspiraciones + ' días' }) +
      tarjeta('Ficha', '<dl class="dl">' +
        '<dt>Nombre</dt><dd>' + esc(d.nombre) + '</dd>' +
        '<dt>RP</dt><dd>' + esc(d.rp) + '</dd>' +
        '<dt>Caravana</dt><dd>' + esc(d.caravana) + '</dd>' +
        '<dt>Raza</dt><dd>' + esc(d.raza) + '</dd>' +
        '<dt>Pedigrí</dt><dd>' + esc(d.pedigri) + '</dd>' +
        '<dt>Nacimiento</dt><dd>' + fFecha(d.nacimiento) + '</dd>' +
        '<dt>Edad</dt><dd>' + D1(edadMesesDonante(d)) + ' meses</dd>' +
        '<dt>Propietario</dt><dd>' + esc(nombreCliente(d.clienteId)) + '</dd>' +
        '<dt>Estado</dt><dd>' + esc(d.estado) + '</dd>' +
        (d.fechaServicio ? '<dt>Servicio</dt><dd>' + fFecha(d.fechaServicio) + '</dd>' : '') +
        '</dl>', { icono:'i-lista' }) +
    '</section>' +
    '<section>' + tarjeta('Embriones de esta donante', tabla(
      [{ t:'Embrión' },{ t:'Producido' },{ t:'Toro' },{ t:'Modalidad' },{ t:'Sexo' },{ t:'Estado' },{ t:'Ubicación' }],
      filasE, { compacta:true, vacioTitulo:'Sin embriones todavía', vacioTexto:'Los embriones aparecen a los 7 días de la fertilización.', vacioIcono:'i-embrion' }),
      { icono:'i-embrion', p0:true }) + '</section>' +
    (par.length ? '<section>' + tarjeta('Terneros nacidos de esta donante', tabla(
      [{ t:'Fecha' },{ t:'RP' },{ t:'Sexo' },{ t:'Peso', num:true },{ t:'Toro' },{ t:'Receptora' }],
      par.map(x => [fFecha(x.fecha), '<b>' + esc(x.rp) + '</b>', esc(x.sexo), D1(x.pesoNacer) + ' kg',
        esc(nombreToro(x.toroId)), esc(x.receptoraId)]), { compacta:true }),
      { icono:'i-paricion', p0:true, sub:'El círculo cerrado: de la donante al ternero' }) + '</section>' : '');
}
VISTAS.donante = { miga: () => 'Donante', tit: (p) => (DONANTES_POR_ID.get(p.id) || {}).nombre || 'Donante',
  sub: (p) => { const d = DONANTES_POR_ID.get(p.id); return d ? 'RP ' + esc(d.rp) + ' · ' + esc(d.raza) + ' · ' + esc(nombreCliente(d.clienteId)) : ''; },
  render: (p) => fichaDonante(p, false) };

/* ------------------------------ RECEPTORA -------------------------------- */
VISTAS.receptora = {
  miga: () => 'Receptora',
  tit: (p) => 'Receptora ' + p.id,
  sub: (p) => { const r = REC_POR_ID.get(p.id); return r ? 'RP ' + esc(r.rp) + ' · ' + esc(r.cruza) + ' · ' + esc(nombreEst(r.establecimientoId)) : ''; },
  render: (p) => {
    const r = REC_POR_ID.get(p.id);
    if (!r) return vacio('No encontré esa receptora','','i-receptora');
    const sync = estadoSincronizacion(r);
    const tes = TRANSFERENCIAS.filter(t => t.receptoraId === r.id).sort((a,b) => b.fecha - a.fecha);
    const par = PARICIONES.filter(x => x.receptoraId === r.id);
    const filas = tes.map(t => {
      const emb = EMBRIONES_POR_ID.get(t.embrionId);
      const f = [fFecha(t.fecha), esc(t.id), '<b>' + esc(t.embrionId) + '</b>',
        esc(nombreDonante(emb.donanteId)) + ' <span class="dim">x</span> ' + esc(nombreToro(emb.toroId)),
        tagModalidad(t.modalidad), esc(t.protocolo), esc(nombreTec(t.tecnicoId)), tagResultado(t.resultado)];
      f.__ir = ['embrion', { id: t.embrionId }];
      return f;
    });
    const linea = r.d0 ? '<div class="tl">' + PROTOCOLO_DIAS.map(x => {
      const f = sumar(r.d0, x.d);
      const pasado = f <= HOY;
      return '<div class="tl-i ' + (pasado ? 'hecho' : 'futuro') + '"><span class="pt">' + ico(pasado ? 'i-check' : 'i-reloj') + '</span>' +
        '<h4>' + esc(x.et) + ' · ' + esc(x.que) + '</h4><div class="cuando">' + fFecha(f) + '</div></div>';
    }).join('') + '</div>' : vacio('Sin protocolo activo','Se sincroniza cuando entra en un lote de transferencia.','i-calendario-chk');
    return '<section><div class="aviso ' + (sync.tag === 'bad' ? 'bad' : sync.tag === 'ok' ? 'ok' : sync.tag === 'warn' ? 'warn' : 'brand') + '">' +
      ico(sync.tag === 'bad' ? 'i-alerta' : 'i-info') + '<div><b>' + esc(sync.texto) + '</b>' + esc(sync.detalle || 'Protocolo: ' + r.protocolo) + '</div></div></section>' +
      '<section class="kpis">' +
      kpi('Transferencias', N(r.transferencias), 'En toda su historia', { icono:'i-te' }) +
      kpi('Preñeces logradas', N(r.prenecesLogradas), r.transferencias ? pc(r.prenecesLogradas/r.transferencias) + ' de efectividad' : '', { icono:'i-prenez', acento:true }) +
      kpi('Pariciones', N(par.length), 'Terneros que llevó a término', { icono:'i-paricion' }) +
      kpi('Edad', N(r.edad) + ' años', esc(r.cruza), { icono:'i-receptora' }) +
      '</section>' +
      '<section class="grid g23">' +
        tarjeta('Historial de transferencias', tabla(
          [{ t:'Fecha' },{ t:'TE' },{ t:'Embrión' },{ t:'Genética' },{ t:'Modalidad' },{ t:'Protocolo' },{ t:'Técnico' },{ t:'Resultado' }],
          filas, { compacta:true, vacioTitulo:'Todavía sin transferencias', vacioTexto:'Está en el rodeo receptor, disponible.', vacioIcono:'i-te' }),
          { icono:'i-te', p0:true }) +

VISTAS.agenda = {

      if (desdeHoy(t.fechaOPU) > 45 || desdeHoy(t.fechaOPU) < -21) return;

        d: (t.receptorasSincronizadas || []).length + ' receptoras sincronizadas · ' + nombreEst(t.establecimientoId),
        ir:['informe',{ id:t.id }], os:t });
    });
    TRANSFERENCIAS.forEach(t => {
      const d = desdeHoy(t.fecha);
      if (d > 30 || d < -1) return;
      eventos.push({ f: t.fecha, tipo:'TE', icono:'i-te', t: 'TE realizada · ' + nombreCliente(t.clienteId),
        d: 'Receptora ' + t.receptoraId + ' · ' + nombreTec(t.tecnicoId), ir:['embrion',{ id:t.embrionId }] });
    });
    TRANSFERENCIAS.forEach(t => {
      const fx = sumar(t.fecha, SUPUESTOS.diagnosticoDias);

      if (d > 14 || d < -30 || t.resultado !== 'Sin diagnosticar') return;
      eventos.push({ f: fx, tipo:'Ecografía', icono:'i-prenez', t: 'Ecografía · ' + nombreCliente(t.clienteId),
        d: 'Receptora ' + t.receptoraId + ' · día ' + (SUPUESTOS.diagnosticoDias + SUPUESTOS.diasCultivoD7) + ' de gestación',
        ir:['prenez',{}] });
    });
    eventos.sort((a,b) => a.f - b.f);
    const porDia = agrupar(eventos, e => e.f.getTime());

    const sincronizando = RECEPTORAS.filter(r => s.has(r.clienteId) && r.estado === 'En protocolo' && r.d0);
    const porLote = agrupar(sincronizando, r => (r.trabajoPrevistoId || 'sin-trabajo') + '|' + r.clienteId);

      const [osId, cid] = k.split('|');

      kpi('En ventana de TE', N(cuenta(RECEPTORAS, r => s.has(r.clienteId) && estadoSincronizacion(r).clave === 'ventana')), 'Hay que transferir hoy o mañana', { icono:'i-te', color:'warn' }) +
      kpi('Fuera de ventana', N(cuenta(RECEPTORAS, r => s.has(r.clienteId) && estadoSincronizacion(r).clave === 'fuera')), 'Se pasaron: hay que resincronizar', { icono:'i-alerta', color:'bad', ir:['receptoras',{ filtro:'fuera' }] }) +
      '</section>' +
      '<section class="grid g23">' +
        tarjeta('Calendario', clavesDia.length ? '<div class="lista" style="margin:0">' + clavesDia.map(k => {
          const f = new Date(k);

          const hoy = dif(f, HOY) === 0;
          return '<div style="display:block;padding:0">' +
            '<div style="padding:9px 18px;background:' + (hoy ? 'var(--brand-soft)' : 'var(--panel-2)') +
            ';font-size:11.5px;font-weight:700;color:' + (hoy ? 'var(--brand-dark)' : 'var(--ink-2)') + ';border-bottom:1px solid var(--line)">' +
            esc(DIAS_S[f.getDay()]) + ' ' + f.getDate() + ' de ' + MESES_L[f.getMonth()] + (hoy ? ' · HOY' : '') + '</div>' +
            evs.map(e => '<button style="width:100%;border:0;border-bottom:1px solid var(--line);background:none;display:flex;gap:11px;align-items:flex-start;padding:11px 18px;text-align:left;cursor:pointer;color:inherit;font:inherit" data-ir="' + e.ir[0] + '" data-params="' + esc(JSON.stringify(e.ir[1])) + '">' +
              '<span class="ava ' + (e.tipo === 'OPU' ? '' : e.tipo === 'TE' ? 'ok' : 'warn') + '">' + ico(e.icono) + '</span>' +
              '<span class="cpo"><b>' + esc(e.t) + '</b><span>' + esc(e.d) + '</span></span>' +
              '<span class="der">' + esc(e.tipo) + '</span></button>').join('') + '</div>';
        }).join('') + '</div>' : vacio('No hay eventos en la ventana','Ampliá el período o agendá una salida.','i-agenda'),
          { icono:'i-agenda', p0:true, sub:'De las últimas tres semanas a 45 días para adelante' }) +
        tarjeta('Lotes de receptoras en protocolo', lotes.length ? '<div class="col">' + lotes.slice(0, 6).map(l => {
          const est = estadoSincronizacion(l.rs[0]);
          return '<div style="border:1px solid var(--line);border-radius:var(--r);padding:12px">' +
            '<div class="fila entre"><b style="font-size:12.5px">' + esc(nombreCliente(l.cid)) + '</b>' +

            '<div class="mini dim mt8">' + l.rs.length + ' receptoras · protocolo ' + esc(l.rs[0].protocolo) +

            '<div class="fila mt8" style="gap:5px;flex-wrap:wrap">' + PROTOCOLO_DIAS.map(x => {
              const f = sumar(l.d0, x.d);
              const pasado = f <= HOY;
              return '<span class="tag ' + (pasado ? 'brand' : '') + '" title="' + esc(x.que) + '">' + esc(x.et) + ' ' + fCorta(f) + '</span>';
            }).join('') + '</div></div>';
        }).join('') + '</div>' : vacio('Sin lotes sincronizándose','Los lotes se arman cuando se agenda una transferencia.','i-receptora'),
          { icono:'i-calendario-chk', sub:'D-11 colocación · D-3 retiro · D0 celo · D8 revisión y ventana de TE' }) +
      '</section>' +
      '<section>' + tarjeta('Carga por equipo técnico', tabla(

      (dtSinReportar.length ? '<section><div class="aviso bad">' + ico('i-alerta') + '<div><b>Hay ' + dtSinReportar.length +

        impagos.map(t => t.rotulo + ' (' + (t.clienteId ? nombreCliente(t.clienteId) : 'laboratorio') + ')').join(', ') + '.</div></div></section>' : '') +
      '<section><div class="grid g3">' + termos.map(t => {

        const diasCarga = desdeHoy(t.ultimaCarga);

VISTAS.gerencia = {
  tit:'Tablero de gerencia',
  sub:'Producción, tasas de preñez cruzadas y comparativo entre las unidades de la red regional.',
  acciones: () => '<button class="btn" data-accion="exportar-gerencia">' + ico('i-csv') + ' Exportar CSV</button>',
  render: () => {
    const s = idsClientesVisibles();
    const desde = dias(-365);
    const dxs = DIAGNOSTICOS.filter(d => s.has(d.clienteId) && d.fecha >= desde);
    const tasa = (arr) => arr.length ? cuenta(arr, d => d.resultado === 'Preñada')/arr.length : 0;

    const porRaza = RAZAS_CARNE.concat(RAZAS_LECHE).map(raza => {
      const sub = dxs.filter(d => (EMBRIONES_POR_ID.get(d.embrionId) || {}).clienteId &&
        (CLIENTES_POR_ID.get(d.clienteId) || {}).raza === raza);
      return { et: raza, corta: raza, v: Math.round(tasa(sub)*100), n: sub.length };
    }).filter(x => x.n > 3);

    const porToro = TOROS.map(t => {
      const sub = dxs.filter(d => (EMBRIONES_POR_ID.get(d.embrionId) || {}).toroId === t.id);
      return { nombre: t.nombre, tipo: t.tipo, raza: t.raza, n: sub.length, tasa: tasa(sub),
        embriones: cuenta(EMBRIONES, e => e.toroId === t.id) };
    }).filter(x => x.n > 3).sort((a,b) => b.tasa - a.tasa);

    const porModalidad = ['Fresco','Vitrificado','DT'].map(m => {
      const sub = dxs.filter(d => (EMBRIONES_POR_ID.get(d.embrionId) || {}).modalidad === m);
      return { et: m, corta: m, v: Math.round(tasa(sub)*100), n: sub.length };
    });

    const porTecnico = TECNICOS.filter(t => enUnidad(t.unidad)).map(t => {
      const sub = dxs.filter(d => d.tecnicoId === t.id);
      return { nombre: t.nombre, unidad: t.unidad, n: sub.length, tasa: tasa(sub),
        opu: cuenta(SESIONES, x => x.tecnicoId === t.id && x.fecha >= desde) };
    }).sort((a,b) => b.tasa - a.tasa);

    const porCliente = clientesVisibles().map(c => {
      const fs = FACTURAS.filter(f => f.clienteId === c.id && f.emision >= desde);
      return { c, monto: suma(fs, f => f.neto), docs: fs.length,
        embriones: cuenta(EMBRIONES, e => e.clienteId === c.id && e.fechaProduccion >= desde) };
    }).sort((a,b) => b.monto - a.monto);

    const porUnidad = UNIDADES.map(u => {
      const cli = CLIENTES.filter(c => c.unidad === u.id).map(c => c.id);
      const set = new Set(cli);
      const d = DIAGNOSTICOS.filter(x => set.has(x.clienteId) && x.fecha >= desde);
      return { u, clientes: cli.length,
        embriones: cuenta(EMBRIONES, e => set.has(e.clienteId) && e.fechaProduccion >= desde),
        te: cuenta(TRANSFERENCIAS, t => set.has(t.clienteId) && t.fecha >= desde),
        preneces: cuenta(d, x => x.resultado === 'Preñada'), tasa: tasa(d),
        facturado: suma(FACTURAS.filter(f => set.has(f.clienteId) && f.emision >= desde), f => f.neto) };
    });

    const serieEmb = seriesEmbrionesMes(18);
    const seriePren = [];
    for (let m = 17; m >= 0; m--) {
      const ini = new Date(HOY.getFullYear(), HOY.getMonth()-m, 1), fin = new Date(HOY.getFullYear(), HOY.getMonth()-m+1, 1);
      seriePren.push(cuenta(DIAGNOSTICOS, d => s.has(d.clienteId) && d.resultado === 'Preñada' && d.fecha >= ini && d.fecha < fin));

      kpi('Embriones · 12 meses', N(cuenta(EMBRIONES, e => s.has(e.clienteId) && e.fechaProduccion >= desde)), 'Producción del período', { icono:'i-embrion', acento:true }) +

          '<div class="leyenda">' + porModalidad.map(m => '<span>' + esc(m.et) + ': <b>' + m.v + '%</b> · ' + m.n + ' TE</span>').join('') + '</div>',
          { icono:'i-nieve', sub:'Fresco contra congelado' }) +

          '<div class="leyenda">' + porRaza.map(m => '<span>' + esc(m.et) + ': <b>' + m.v + '%</b> · ' + m.n + '</span>').join('') + '</div>'

let buscadorAbierto = false, resultadosBusqueda = [], seleccionBusqueda = 0;
function indiceBusqueda(){
  const idx = [];
  const agregar = (t, s, g, ico_, ir_) => idx.push({ t, s, g, i: ico_, ir: ir_, k: (t + ' ' + s).toLowerCase() });
  (UI.modo === 'interno' ? NAV_INTERNO : NAV_PORTAL).forEach(gr => gr.items.forEach(it =>
    agregar(it.t, 'Ir a la pantalla', 'Pantallas', it.i, [it.v, {}])));
  CLIENTES.forEach(c => agregar(c.razon, c.depto + ' · ' + c.raza + ' · RUT ' + c.rut, 'Clientes', 'i-cliente', ['cliente', { id:c.id }]));
  DONANTES.forEach(d => agregar(d.nombre, 'Donante · RP ' + d.rp + ' · ' + d.raza + ' · ' + nombreCliente(d.clienteId), 'Donantes', 'i-donante', ['donante', { id:d.id }]));
  TOROS.forEach(t => agregar(t.nombre, 'Toro · ' + t.raza + ' · ' + t.tipo, 'Toros', 'i-toro', ['toro', { id:t.id }]));
  TRABAJOS.filter(t => t.embrionIds.length).slice(-60).forEach(t => agregar(t.id, 'Trabajo de ' + nombreCliente(t.clienteId) + ' · OPU ' + fFecha(t.fechaOPU), 'Trabajos', 'i-trabajo', ['informe', { id:t.id }]));
  EMBRIONES.slice(-160).forEach(e => agregar(e.id, 'Embrión · ' + nombreDonante(e.donanteId) + ' x ' + nombreToro(e.toroId) + ' · ' + e.modalidad, 'Embriones', 'i-embrion', ['embrion', { id:e.id }]));
  TERMOS.forEach(t => agregar(t.rotulo, t.ambito + ' · ' + t.ubicacion, 'Termos', 'i-termo', ['termo', { id:t.id }]));
  RECEPTORAS.slice(0, 120).forEach(r => agregar(r.id, 'Receptora · RP ' + r.rp + ' · ' + nombreCliente(r.clienteId), 'Receptoras', 'i-receptora', ['receptora', { id:r.id }]));
  FACTURAS.slice(0, 60).forEach(f => agregar(f.id, f.tipo + ' · ' + nombreCliente(f.clienteId) + ' · ' + $$(f.neto), 'Facturas', 'i-factura', ['factura', { id:f.id }]));
  agregar('Exportar el informe a PDF', 'Acción · desde la pantalla de un trabajo', 'Acciones', 'i-pdf', ['trabajos', {}]);
  agregar('Ver los supuestos de los datos', 'Acción · parámetros a validar', 'Acciones', 'i-info', ['config', {}]);
  agregar('Cambiar de unidad regional', 'Acción · Uruguay, Argentina, Paraguay, Río Grande do Sul', 'Acciones', 'i-red', ['config', {}]);
  return idx;
}

  const capa = $('#capa-buscador');

    '<div class="ent">' + ico('i-buscar','ic-lg') +
    '<input id="q" type="search" placeholder="Buscar donante, embrión, cliente, trabajo, termo…" aria-label="Buscar">' +
    '<button class="btn btn-ico ghost" id="q-cerrar" aria-label="Cerrar">' + ico('i-cerrar') + '</button></div>' +
    '<div class="res" id="q-res"></div>' +
    '<div class="pie"><span><kbd>Flechas</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span>' +
    '<span><kbd>Esc</kbd> cerrar</span></div></div></div>';
  const inp = $('#q'), res = $('#q-res');
  const pintarRes = () => {
    const q = inp.value.trim().toLowerCase();
    resultadosBusqueda = (q ? idx.filter(x => x.k.indexOf(q) >= 0) : idx.filter(x => x.g === 'Pantallas')).slice(0, 24);
    seleccionBusqueda = 0;
    if (!resultadosBusqueda.length) {
      res.innerHTML = '<div class="vacio" style="padding:26px">' + ico('i-buscar','ic-xl') +
        '<b>Nada con «' + esc(inp.value) + '»</b><p>Probá con el nombre de una donante, un código de embrión o una cabaña.</p></div>';
      return;
    }
    let g = '', h = '';
    resultadosBusqueda.forEach((x, i) => {
      if (x.g !== g) { g = x.g; h += '<div class="gr-t">' + esc(g) + '</div>'; }
      h += '<button data-i="' + i + '"' + (i === 0 ? ' class="sel"' : '') + '>' +
        '<span style="color:var(--brand-deep)">' + ico(x.i) + '</span>' +
        '<span style="flex:1;min-width:0"><b>' + esc(x.t) + '</b><span>' + esc(x.s) + '</span></span>' +
        ico('i-chevron') + '</button>';
    });
    res.innerHTML = h;
    res.querySelectorAll('[data-i]').forEach(b => b.onclick = () => abrir(parseInt(b.getAttribute('data-i'), 10)));
  };
  const abrir = (i) => { const x = resultadosBusqueda[i]; if (!x) return; cerrarBuscador(); ir(x.ir[0], x.ir[1]); };
  const mover = (d) => {
    const btns = res.querySelectorAll('[data-i]');
    if (!btns.length) return;
    seleccionBusqueda = (seleccionBusqueda + d + btns.length) % btns.length;
    btns.forEach(b => b.classList.remove('sel'));
    btns[seleccionBusqueda].classList.add('sel');
    btns[seleccionBusqueda].scrollIntoView({ block:'nearest' });
  };
  inp.addEventListener('input', pintarRes);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); mover(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); mover(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); abrir(seleccionBusqueda); }
    else if (e.key === 'Escape') { cerrarBuscador(); }
  });
  $('#q-cerrar').onclick = cerrarBuscador;
  capa.querySelector('.buscador').addEventListener('click', (e) => { if (e.target.classList.contains('buscador')) cerrarBuscador(); });
  pintarRes();
  inp.focus();
}
function cerrarBuscador(){ buscadorAbierto = false; $('#capa-buscador').innerHTML = ''; }

/* ==========================================================================
   TOUR
   ========================================================================== */
const PASOS_TOUR = [
  { t:'El informe que hoy se arma a mano', p:'Cada trabajo cerrado tiene su informe con el resumen, el detalle por donante, el detalle por transferencia y la comparación contra los trabajos anteriores del mismo cliente. Se exporta a PDF y a Excel de verdad, y nadie transcribe nada.', ir:['trabajos',{}], b:'Ver las órdenes de servicio' },
  { t:'El portal del cliente', p:'La cabaña o el tambo entra y ve sus donantes, su stock congelado con la posición exacta en el termo, sus preñeces con fecha probable de parto y su estado de cuenta. En vivo, no un adjunto.', ir:['p-inicio',{}], b:'Entrar al portal', modo:'cliente' },
  { t:'De un embrión a todo lo demás', p:'Desde la ficha de cualquier embrión se llega para atrás hasta la donante, el toro y la fecha de aspiración; y para adelante hasta la receptora, la preñez y el ternero nacido.', ir:['embriones',{}], b:'Ver los embriones' },
];
let pasoTour = 0;
function abrirTour(i){
  pasoTour = i || 0;
  const p = PASOS_TOUR[pasoTour];
  const capa = $('#capa-tour');
  capa.innerHTML = '<div class="tour"><div class="caja">' +
    '<div class="cab"><div class="mini b7" style="letter-spacing:.14em;opacity:.8">RECORRIDO · PASO ' + (pasoTour+1) + ' DE ' + PASOS_TOUR.length + '</div>' +
    '<h3 style="margin-top:6px">' + esc(p.t) + '</h3><p>' + esc(p.p) + '</p></div>' +
    '<div class="cue"><div class="pasos">' + PASOS_TOUR.map((_, i2) => '<i class="' + (i2 <= pasoTour ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="fila entre"><button class="btn ghost" id="t-salir">Salir del recorrido</button>' +
    '<div class="fila">' + (pasoTour > 0 ? '<button class="btn" id="t-ant">Anterior</button>' : '') +
    '<button class="btn pri" id="t-sig">' + esc(p.b) + '</button></div></div></div></div></div>';
  $('#t-salir').onclick = cerrarTour;
  const ant = $('#t-ant'); if (ant) ant.onclick = () => abrirTour(pasoTour - 1);
  $('#t-sig').onclick = () => {
    if (p.modo) cambiarModo(p.modo); else if (UI.modo !== 'interno') cambiarModo('interno');
    ir(p.ir[0], p.ir[1]);
    if (pasoTour < PASOS_TOUR.length - 1) abrirTour(pasoTour + 1);
    else { cerrarTour(); toast('Listo', 'Podés volver a abrir el recorrido desde el pie de página.', { icono:'i-check-circ' }); }
  };
}
function cerrarTour(){ $('#capa-tour').innerHTML = ''; }
ACCIONES['tour'] = () => abrirTour(0);

/* ==========================================================================
   COSAS QUE PASAN SOLAS MIENTRAS MIRAN
   ========================================================================== */
function eventoEnVivo(){
  const opciones = [];
  const pend = TRANSFERENCIAS.filter(t => t.resultado === 'Sin diagnosticar' && desdeHoy(t.fecha) >= SUPUESTOS.diagnosticoDias);
  if (pend.length) opciones.push(() => {
    const te = elegir(pend);
    const prenada = quizas(0.42);
    const dx = { id:'DX-' + String(DIAGNOSTICOS.length + 1).padStart(4,'0'), transferenciaId: te.id,
      embrionId: te.embrionId, receptoraId: te.receptoraId, clienteId: te.clienteId, trabajoId: te.trabajoId,
      fecha: HOY, diaGestacion: dif(te.fecha, HOY) + SUPUESTOS.diasCultivoD7, tecnicoId: te.tecnicoId,
      metodo:'Ecografía', resultado: prenada ? 'Preñada' : 'Vacía', reconfirmacion:null };
    DIAGNOSTICOS.push(dx); DX_POR_ID.set(dx.id, dx);
    te.diagnosticoId = dx.id; te.resultado = dx.resultado;
    const rec = REC_POR_ID.get(te.receptoraId);
    if (prenada) { rec.estado = 'Preñada'; rec.prenecesLogradas++; } else { rec.estado = 'Disponible'; }
    RESUMEN_CACHE.delete(te.trabajoId);
    toast('Entró un diagnóstico del campo · ' + dx.resultado,
      nombreCliente(te.clienteId) + ' · receptora ' + te.receptoraId + (prenada ? ' · parto previsto el ' + fFecha(te.fpp) : ''),
      { icono:'i-prenez', ir:['embrion', { id: te.embrionId }], ms:9000 });
  });
  const campo = EMBRIONES.filter(e => e.enCampo && e.estado === 'En stock');
  if (campo.length) opciones.push(() => {
    const e = elegir(campo);
    toast('Un cliente reportó una transferencia de DT',
      nombreCliente(e.clienteId) + ' informó que transfirió el embrión ' + e.id + ' de su termo. Antes esto no se enteraba nadie.',
      { icono:'i-termo', ir:['embrion', { id: e.id }], ms:9000 });
  });
  const term = TERMOS.filter(t => t.ambito === 'Campo');
  if (term.length) opciones.push(() => {
    const t = elegir(term);
    toast('Carga de nitrógeno registrada',
      t.rotulo + ' · ' + t.ubicacion + '. Nivel al ' + ent(85, 99) + '%.',
      { icono:'i-nieve', ir:['termo', { id: t.id }], ms:8000 });
  });
  const abiertos = TRABAJOS.filter(t => t.etapa === 'En laboratorio' || t.etapa === 'Embriones listos');
  if (abiertos.length) opciones.push(() => {
    const os = elegir(abiertos);
    const r = resumen(os);
    toast('El laboratorio cerró una partida',
      os.id + ' · ' + nombreCliente(os.clienteId) + ' · ' + r.embrionesD7 + ' embriones D7 listos',
      { icono:'i-lab', ir:['informe', { id: os.id }], ms:8000 });
  });
  if (!opciones.length) return;
  elegir(opciones)();
  if (['inicio','prenez','te','criogenia'].indexOf(UI.vista) >= 0) pintar();
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); abrirBuscador(); return; }
  if (e.key === 'Escape') {
    if (buscadorAbierto) { cerrarBuscador(); return; }
    if ($('#capa-modal').firstChild) { cerrarModal(); return; }
    if ($('#capa-tour').firstChild) { cerrarTour(); return; }
  }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) { e.preventDefault(); abrirBuscador(); }
});

$('#btn-buscar').onclick = abrirBuscador;
$('#btn-alertas').onclick = () => ACCIONES['ver-alertas']();
$('#btn-unidad').onclick = menuUnidad;
$('#hamb').onclick = () => $('#side').classList.toggle('abierto');
$('#modo-interno').onclick = () => { if (UI.modo === 'interno') return; cambiarModo('interno'); ir('inicio', {}); };
$('#modo-cliente').onclick = () => { if (UI.modo === 'cliente') { elegirClientePortal(); return; } cambiarModo('cliente'); ir('p-inicio', {}); };
$('#pie-tour').onclick = () => abrirTour(0);
$('#pie-supuestos').onclick = () => ACCIONES['supuestos']();

cambiarModo('interno');
ir('inicio', {});
setTimeout(() => abrirTour(0), 900);
setInterval(eventoEnVivo, 38000);

console.log('[In Vitro · CustomERP] datos en memoria — ' +
  CLIENTES.length + ' clientes · ' + DONANTES.length + ' donantes · ' + TOROS.length + ' toros · ' +
  RECEPTORAS.length + ' receptoras · ' + EMBRIONES.length + ' embriones · ' + TRABAJOS.length + ' trabajos · ' +
  TRANSFERENCIAS.length + ' transferencias · ' + PARICIONES.length + ' pariciones');
</script>
