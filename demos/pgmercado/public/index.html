<style>
:root{
  --bg:#F7F3EE; --panel:#FFFFFF; --ink:#2A1A17; --ink-2:#6B5550; --ink-3:#A8958F;
  --line:#EBE2DA; --brand:#8E1F1F; --brand-deep:#5E1212; --brand-soft:#F6E6E3;
  --gold:#B8893B; --gold-soft:#F7EEDC;
  --ok:#2F8A5B; --ok-soft:#E2F2E9; --warn:#D9962B; --warn-soft:#FBF0DA; --bad:#C9433B; --bad-soft:#FBE4E2;
  --r:10px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
aside{background:var(--brand-deep);color:#F3E6E1;display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo b{display:block;font-size:15px;letter-spacing:.3px}
.logo small{display:block;font-size:11px;color:#D9B9AF;letter-spacing:1.5px;text-transform:uppercase}
.navg{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:#C29A90;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:#F3E6E1;text-align:left;font-weight:600}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:#fff;color:var(--brand-deep)}
.nav .cnt{margin-left:auto;background:var(--gold);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:#D9B9AF;border-top:1px solid rgba(255,255,255,.12)}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;font-weight:800}
header .sub{color:var(--ink-3);font-size:12.5px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;color:var(--ink-3);cursor:pointer;min-width:230px;background:var(--bg)}
.search kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.content{padding:20px 24px 40px;overflow:auto;flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3 .act{margin-left:auto}
.kpi .lab{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ok);font-weight:700}
.kpi .d.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}
tr.cl:hover td{background:#FBF8F5}
.num{text-align:right}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:#9A6412}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-br{background:var(--brand-soft);color:var(--brand)}.p-gold{background:var(--gold-soft);color:#8A6425}.p-n{background:#F1ECE7;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 13px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
.btn.sm{padding:5px 9px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bar{height:8px;background:#F1ECE7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.row{display:flex;align-items:center;gap:10px}
.list-it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-it:last-child{border-bottom:0}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:#EFE8E1;border-radius:var(--r-lg);padding:10px;min-height:300px}
.col.over{outline:2px dashed var(--brand)}
.col h4{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between}
.tk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab}
.tk:active{cursor:grabbing}
.tk b{display:block;margin-bottom:3px}
.tk .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.prod:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(94,18,18,.08)}
.prod .cat{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px}
.prod b{display:block;margin:4px 0}
.prod .pr{color:var(--brand);font-weight:800}
.ticket{position:sticky;top:0}
.tline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:14px 0}
.empty{color:var(--ink-3);text-align:center;padding:30px 0}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px;transition:height .3s}
.chart .c i.alt{background:var(--gold)}
.chart .c span{font-size:11px;color:var(--ink-3)}
.overlay{position:fixed;inset:0;background:rgba(42,26,23,.42);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:var(--r-lg);width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:4px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff}
label.f input:focus,label.f select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);display:flex;gap:10px;align-items:center;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.kres{border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.kres:hover,.kres.sel{background:var(--brand-soft)}
.wa{background:#EAF6EE;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.wa.me{background:#FFF;border:1px solid var(--line);margin-left:40px}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border:0}
.hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:20px}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;color:#F1D6CF}
.hero .btn{margin-left:auto}
.temp{font-size:30px;font-weight:800}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2,.grid2e,.pos{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function agregar(id){
  const p=productos.find(x=>x.id===id);
  if(p.u==='u'){const ex=carrito.find(c=>c.id===id);ex?ex.q++:carrito.push({...p,q:1});VIEWS.mostrador();return;}
  const peso=(Math.round((0.6+Math.random()*1.2)*100)/100).toFixed(2);
  modal('Pesar '+p.n,`<p class="muted">La balanza marca el peso. Podés corregirlo a mano.</p><label class="f">Peso en kg<input id="peso" type="number" step="0.01" value="${peso}"></label><div class="stat-row"><span>Precio por kilo</span><b>${fmt(p.p)}</b></div>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="confirmPeso(${id})">Agregar</button>`);
  setTimeout(()=>{const i=$('#peso');i.focus();i.select();},50);
}
function confirmPeso(id){const p=productos.find(x=>x.id===id);const q=parseFloat($('#peso').value)||0;if(q<=0)return;carrito.push({...p,q});closeModal();VIEWS.mostrador();}
function cobrar(m){
  const tot=carrito.reduce((a,b)=>a+b.q*b.p,0);
  carrito.forEach(c=>{const p=productos.find(x=>x.id===c.id);p.st=Math.max(0,Math.round((p.st-c.q)*10)/10);});
  const now=new Date();ventasHoy.push({h:now.toTimeString().slice(0,5),d:carrito.map(c=>c.n).join(' · '),m,t:tot});
  carrito=[];VIEWS.mostrador();toast(`Cobrado ${fmt(tot)} con ${m}. e-Ticket emitido.`);
}

// ---------------- Búsqueda Ctrl+K ----------------
function openK(){
  modal('Buscar',`<input id="kq" placeholder="Picaña, Florencia, #1284..." style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px"><div id="kr"></div>`);
  const q=$('#kq');q.focus();const run=()=>{const s=q.value.toLowerCase();
    const r=[...productos.filter(p=>p.n.toLowerCase().includes(s)).map(p=>({t:p.n,d:fmt(p.p)+' / '+p.u,i:'tag',f:()=>go('catalogo')})),
      ...clientes.filter(c=>c.n.toLowerCase().includes(s)).map(c=>({t:c.n,d:c.b,i:'users',f:()=>{go('clientes');verCliente(c.id)}})),
      ...pedidos.filter(p=>('#'+p.id+' '+p.cli).toLowerCase().includes(s)).map(p=>({t:'Pedido #'+p.id,d:p.cli,i:'moto',f:()=>{go('pedidos');verPedido(p.id)}}))].slice(0,8);
    $('#kr').innerHTML=r.length?r.map((x,j)=>`<div class="kres" data-k="${j}">${ico(x.i)}<b>${x.t}</b><span class="tiny" style="margin-left:auto">${x.d}</span></div>`).join(''):'<div class="empty">Sin resultados</div>';
    document.querySelectorAll('.kres').forEach(el=>el.onclick=()=>{closeModal();r[el.dataset.k].f();});};
  q.oninput=run;run();
}
$('#openK').onclick=openK;

go('inicio');
