<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PG Mercado de Carnes · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EE; --panel:#FFFFFF; --ink:#2A1A17; --ink-2:#6B5550; --ink-3:#A8958F;
  --line:#EBE2DA; --brand:#8E1F1F; --brand-deep:#5E1212; --brand-soft:#F6E6E3;
  --gold:#B8893B; --gold-soft:#F7EEDC; --san:#EC0000; --san-soft:#FDE8E8;
  --ok:#2F8A5B; --ok-soft:#E2F2E9; --warn:#D9962B; --warn-soft:#FBF0DA; --bad:#C9433B; --bad-soft:#FBE4E2;
  --r:10px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
aside{background:var(--brand-deep);color:#F3E6E1;display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo b{display:block;font-size:15px;letter-spacing:.3px}
.logo small{display:block;font-size:11px;color:#D9B9AF;letter-spacing:1.5px;text-transform:uppercase}
.navg{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:#C29A90;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:#F3E6E1;text-align:left;font-weight:600}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:#fff;color:var(--brand-deep)}
.nav .cnt{margin-left:auto;background:var(--gold);color:#fff;border-radius:20px;font-size:10.5px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:#D9B9AF;border-top:1px solid rgba(255,255,255,.12)}
.side-foot .row{margin-top:6px}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;font-weight:800}
header .sub{color:var(--ink-3);font-size:12.5px}
.cajastate{margin-left:auto;display:flex;align-items:center;gap:8px;border-radius:30px;padding:6px 12px 6px 10px;font-weight:700;font-size:12.5px;cursor:pointer;border:1px solid var(--line)}
.cajastate .dot{width:9px;height:9px;border-radius:50%}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;color:var(--ink-3);cursor:pointer;min-width:210px;background:var(--bg)}
.search kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.user{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.content{padding:20px 24px 40px;overflow:auto;flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3 .act{margin-left:auto}
.kpi .lab{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ok);font-weight:700}
.kpi .d.neg{color:var(--bad)}.kpi .d.n{color:var(--ink-3)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}
tr.cl:hover td{background:#FBF8F5}
tr.tot td{font-weight:800;background:#FBF8F5;border-top:2px solid var(--line)}
tr.flash td{animation:fl 2.4s}
@keyframes fl{0%{background:var(--gold-soft)}100%{background:transparent}}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:#9A6412}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-br{background:var(--brand-soft);color:var(--brand)}.p-gold{background:var(--gold-soft);color:#8A6425}.p-n{background:#F1ECE7;color:var(--ink-2)}.p-san{background:var(--san-soft);color:var(--san)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 13px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--brand-deep)}
.btn.big{padding:13px 16px;font-size:15px;justify-content:center}
.btn.sm{padding:5px 9px;font-size:12px}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-6px 0 18px;overflow-x:auto}
.mtab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-2);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.mtab:hover{color:var(--ink)}
.mtab.on{color:var(--brand);border-color:var(--brand)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bar{height:8px;background:#F1ECE7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.row{display:flex;align-items:center;gap:10px}
.list-it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-it:last-child{border-bottom:0}
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.prod:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(94,18,18,.08)}
.prod .cat{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px}
.prod b{display:block;margin:4px 0;line-height:1.25}
.prod .pr{color:var(--brand);font-weight:800}
.ticket{position:sticky;top:0}
.tline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sumline{display:flex;justify-content:space-between;padding:4px 0}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;margin:10px 0 12px}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pay{border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 10px;cursor:pointer;text-align:left;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
.pay.on{border-color:var(--brand);background:var(--brand-soft)}
.pay .sq{width:22px;height:16px;border-radius:3px;flex:none}
.promo{background:var(--san-soft);border:1px solid #F7C4C4;color:#9E0B0B;border-radius:var(--r);padding:9px 11px;font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.empty{color:var(--ink-3);text-align:center;padding:30px 0}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px;transition:height .3s}
.chart .c i.alt{background:var(--gold)}
.chart .c span{font-size:11px;color:var(--ink-3)}
.overlay{position:fixed;inset:0;background:rgba(42,26,23,.42);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:var(--r-lg);width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(720px,100%)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:4px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff}
label.f input:focus,label.f select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;background:#fff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s;max-width:380px}
.toast.pos{background:#1F3B2C}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.kres{border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.kres:hover{background:var(--brand-soft)}
.stat-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border:0}
.hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;color:#F1D6CF}
.hero .btn{margin-left:auto;color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.sw{width:38px;height:22px;border-radius:20px;background:#D9CFC7;position:relative;cursor:pointer;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:19px}
.cardrule{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;margin-bottom:10px}
.cardimg{width:64px;height:42px;border-radius:7px;background:linear-gradient(135deg,#EC0000,#9E0000);position:relative;flex:none}
.cardimg.sel{background:linear-gradient(135deg,#2B2B2B,#000)}
.cardimg.deb{background:linear-gradient(135deg,#FF4A4A,#C80000)}
.cardimg::after{content:"";position:absolute;left:8px;top:14px;width:12px;height:9px;border-radius:2px;background:#E8C36A}
.cfe{border:1px solid var(--line);border-radius:12px;padding:18px;font-size:13px}
.cfe .h{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.soon{background:repeating-linear-gradient(135deg,#fff,#fff 12px,#FBF8F5 12px,#FBF8F5 24px)}
.step{display:flex;gap:12px;padding:10px 0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;flex:none}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.grid2,.grid2e,.pos{grid-template-columns:1fr}.search{display:none}}
</style>
</head>

<script>
// ================= Utilidades =================
const $ = s => document.querySelector(s);
const fmt = n => '$ ' + Math.round(n).toLocaleString('es-UY');
const kgf = n => n.toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' kg';
const pct = n => n.toLocaleString('es-UY',{maximumFractionDigits:1}) + '%';
const ico = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;
const ini = n => n.split(' ').map(x=>x[0]).slice(0,2).join('');
const hhmm = d => d.toTimeString().slice(0,5);
let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const HOY = new Date();
const fechaCorta = d => String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');

// ================= Datos =================
const productos = [

function topMargen(vs){const m={};vs.forEach(v=>{const f=v.total/v.bruto;v.items.forEach(i=>{const x=m[i.n]||(m[i.n]=[i.n,0,0]);x[1]+=i.q*i.p*f-i.q*P(i.id).costo;x[2]+=i.q*i.p*f;});});return Object.values(m).sort((a,b)=>b[1]-a[1]);}

// ---------- Vender ----------
VIEWS.vender = () => {
  if(!caja.abierta){$('#pane').innerHTML=`<div class="card empty" style="padding:60px">${ico('lock')}<h3 style="justify-content:center;margin-top:10px">La caja está cerrada</h3><p class="muted">Para vender, primero abrí la caja con el fondo inicial.</p><button class="btn pri" onclick="abrirCaja()">${ico('unlock')}Abrir caja</button></div>`;return;}

  const bruto = sum(carrito,c=>c.q*c.p), {r,d} = descuentoDe(pago,bruto,HOY.getDay()), tot = bruto-d;
  const promosHoy = Object.keys(TARJETAS).filter(t=>reglaPara(t,HOY.getDay()));
  $('#pane').innerHTML = `<div class="pos"><div>
    <div class="tabs">${cats.map(c=>`<button class="tab ${c===filtroCat?'on':''}" onclick="filtroCat='${c}';VIEWS.vender()">${c}</button>`).join('')}</div>
    <div class="prods">${lista.map(p=>`<button class="prod" onclick="agregar(${p.id})"><div class="cat">${p.c}</div><b>${p.n}</b><div class="pr">${fmt(p.p)} / ${p.u}</div><div class="tiny">${p.u==='kg'?'Bandeja al vacío':'Por unidad'}</div></button>`).join('')}</div>
  </div>

    ${carrito.length?carrito.map((c,i)=>`<div class="tline"><div><b>${c.n}</b><div class="tiny">${c.u==='kg'?kgf(c.q):c.q+' u'} x ${fmt(c.p)}</div></div><div class="row"><b>${fmt(c.q*c.p)}</b><button class="x" onclick="carrito.splice(${i},1);renderNav();VIEWS.vender()">${ico('trash')}</button></div></div>`).join(''):'<div class="empty">Tocá un producto o escaneá la etiqueta de la bandeja.</div>'}
    <div style="margin:14px 0 8px" class="tiny">¿Con qué paga?</div>
    <div class="pays">${Object.entries(TARJETAS).map(([k,t])=>`<button class="pay ${pago===k?'on':''}" onclick="pago='${k}';VIEWS.vender()"><span class="sq" style="background:${t.col}"></span>${t.n}${promosHoy.includes(k)?` <span class="pill p-san" style="margin-left:auto;padding:0 6px">${reglaPara(k,HOY.getDay()).pc}%</span>`:''}</button>`).join('')}</div>
    ${r?`<div class="promo">${ico('pct')}<span>${r.pc}% ${r.n}. Se aplica solo. Tope ${fmt(r.tope)}.</span></div>`:''}
    <div class="sumline"><span class="muted">Subtotal</span><span>${fmt(bruto)}</span></div>
    ${d?`<div class="sumline" style="color:var(--san);font-weight:700"><span>Descuento ${TARJETAS[pago].n}</span><span>- ${fmt(d)}</span></div>`:''}
    <div class="total"><span>Total</span><span>${fmt(tot)}</span></div>
    <button class="btn pri big" style="width:100%" ${carrito.length?'':'disabled'} onclick="cobrar()">${ico(pago==='efectivo'?'caja':'pos')}${pago==='efectivo'?'Cobrar en efectivo':'Enviar al POS Getnet'}</button>
    <div class="tiny" style="margin-top:10px;text-align:center">Al cobrar se emite el comprobante DGI y la venta entra a la planilla.</div>
  </div></div>`;
};
function agregar(id){
  const p=P(id);
  if(p.u==='u'){const ex=carrito.find(c=>c.id===id);ex?ex.q++:carrito.push({id,n:p.n,u:p.u,q:1,p:p.p});renderNav();VIEWS.vender();return;}
  const peso=(Math.round((0.7+Math.random()*1.1)*100)/100).toFixed(2);
  modal('Bandeja de '+p.n,`<p class="muted" style="margin-top:0">El peso se lee de la etiqueta de la bandeja. Si hace falta, lo corregís a mano.</p><label class="f">Peso de la bandeja (kg)<input id="peso" type="number" step="0.01" value="${peso}"></label><div class="stat-row"><span>Precio por kilo</span><b>${fmt(p.p)}</b></div><div class="stat-row"><span>Importe</span><b id="imp">${fmt(peso*p.p)}</b></div>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="confirmPeso(${id})">Agregar</button>`);
  setTimeout(()=>{const i=$('#peso');i.focus();i.select();i.oninput=()=>$('#imp').textContent=fmt((parseFloat(i.value)||0)*p.p);i.onkeydown=e=>{if(e.key==='Enter')confirmPeso(id)};},50);
}
function confirmPeso(id){const p=P(id);const q=parseFloat($('#peso').value)||0;if(q<=0)return;carrito.push({id,n:p.n,u:p.u,q,p:p.p});closeModal();renderNav();VIEWS.vender();}
function cobrar(){
  if(pago==='efectivo'){finalizar('Mostrador');return;}
  const bruto=sum(carrito,c=>c.q*c.p),{d}=descuentoDe(pago,bruto,HOY.getDay());
  modal('Cobrando en el POS',`<div style="text-align:center;padding:10px 0"><div style="font-size:30px;font-weight:800">${fmt(bruto-d)}</div><p class="muted">Enviado al POS Getnet. El cliente pasa la tarjeta.</p><div class="live" style="justify-content:center"><i></i>Esperando aprobación</div></div>`);
  setTimeout(()=>{closeModal();finalizar('POS Getnet');},1400);
}
function finalizar(origen){
  carrito.forEach(c=>{const p=P(c.id);p.st=Math.max(0,Math.round((p.st-c.q)*100)/100);});
  const v=armarVenta(new Date(),usuario,pago,carrito.map(c=>({...c})),origen);ventas.unshift(v);
  caja.movs.push({h:v.fecha,t:'Venta '+v.cfe,d:TARJETAS[v.tar].n+(v.desc?' · desc. '+fmt(v.desc):''),tipo:'v',m:v.total});
  carrito=[];renderNav();VIEWS.vender();
  modal('Venta registrada',`<div style="text-align:center"><div style="width:54px;height:54px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:26px">${ico('check')}</div><div style="font-size:26px;font-weight:800">${fmt(v.total)}</div><p class="muted">${TARJETAS[v.tar].n}${v.desc?' · ahorró '+fmt(v.desc):''}</p></div>
  <div class="stat-row"><span>Comprobante</span><b>${v.cfe} · aceptado DGI</b></div><div class="stat-row"><span>Planilla de ventas</span><b style="color:var(--ok)">Cargada</b></div><div class="stat-row"><span>Stock</span><b style="color:var(--ok)">Descontado</b></div><div class="stat-row"><span>Margen de esta venta</span><b>${fmt(v.margen)} (${pct(v.margen/(v.total+v.banco)*100)})</b></div>`,
  `<button class="btn" onclick="verCFE(${v.id})">${ico('doc')}Ver comprobante</button><button class="btn pri" data-close>Nueva venta</button>`);
}

    <div class="card kpi"><div class="lab">${ico('pos')}Tarjetas (POS Getnet)</div><div class="val">${fmt(tj)}</div><div class="d">Se concilia sola con el lote</div></div>
    <div class="card kpi"><div class="lab">${ico('caja')}Efectivo esperado</div><div class="val">${fmt(caja.fondo+ef-ret)}</div><div class="d n">Fondo + ventas - retiros</div></div>

    <div class="card"><h3>${ico('lock')}Cierres anteriores</h3><table><tr><th>Día</th><th>Cerró</th><th class="num">Ventas</th><th class="num">Total</th><th>Arqueo</th></tr>${[...cierres].reverse().map(c=>`<tr><td>${DIAS[c.fecha.getDay()].slice(0,3)} ${fechaCorta(c.fecha)}</td><td>${c.cajero.split(' ')[0]}</td><td class="num">${c.ventas}</td><td class="num">${fmt(c.total)}</td><td>${c.dif?`<span class="pill p-warn">${fmt(c.dif)}</span>`:'<span class="pill p-ok">Cuadra</span>'}</td></tr>`).join('')}</table></div>

function abrirCaja(){
  modal('Abrir caja',`<label class="f">¿Quién abre?<select id="acaj">${EMPLEADOS.map(e=>`<option ${e.n===usuario?'selected':''}>${e.n}</option>`).join('')}</select></label><label class="f">Fondo inicial en efectivo<input id="afondo" type="number" value="5000"></label><p class="tiny">Desde este momento todas las ventas, retiros y anulaciones quedan a nombre de quien abrió.</p>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="confirmarApertura()">${ico('unlock')}Abrir caja</button>`);
}
function confirmarApertura(){caja={abierta:true,fondo:+$('#afondo').value||0,desde:new Date(),cajero:$('#acaj').value,retiros:[],movs:[]};usuario=caja.cajero;caja.movs.push({h:caja.desde,t:'Apertura de caja',d:'Fondo '+fmt(caja.fondo)+' · '+caja.cajero,tipo:'ap'});closeModal();go(view==='inicio'||view==='vender'?view:'caja');toast('Caja abierta por '+caja.cajero.split(' ')[0]);}
function retiro(){modal('Retiro de efectivo',`<label class="f">Monto<input id="rm" type="number" value="3000"></label><label class="f">Motivo<select id="rmot"><option>Pago a proveedor</option><option>Depósito en banco</option><option>Gastos del local</option></select></label>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="confirmarRetiro()">Registrar retiro</button>`);}
function confirmarRetiro(){const m=+$('#rm').value||0;caja.retiros.push({m});caja.movs.push({h:new Date(),t:'Retiro de efectivo',d:$('#rmot').value+' · '+usuario,m:-m});closeModal();VIEWS.caja();toast('Retiro registrado');}
function cerrarCaja(){
  const vt = ventas.filter(v=>esHoy(v)&&v.fecha>=caja.desde), ef = sum(vt.filter(v=>v.tar==='efectivo'),v=>v.total), tj = sum(vt.filter(v=>v.tar!=='efectivo'),v=>v.total), esp = caja.fondo+ef-sum(caja.retiros,r=>r.m);
  const porT = Object.keys(TARJETAS).filter(t=>t!=='efectivo').map(t=>[t,sum(vt.filter(v=>v.tar===t),v=>v.total)]).filter(x=>x[1]);
  modal('Cerrar caja',`<h4 style="margin:0 0 8px">Tarjetas</h4>${porT.map(([t,m])=>`<div class="stat-row"><span>${TARJETAS[t].n}</span><b>${fmt(m)}</b></div>`).join('')}<div class="stat-row"><span><b>Lote POS Getnet</b></span><span class="pill p-ok">${ico('check')}Coincide: ${fmt(tj)}</span></div>
  <h4 style="margin:16px 0 8px">Efectivo</h4><div class="stat-row"><span>Esperado en el cajón</span><b>${fmt(esp)}</b></div><label class="f" style="margin-top:10px">Contado<input id="contado" type="number" value="${esp}"></label><div id="dif" class="promo" style="background:var(--ok-soft);color:var(--ok);border-color:#BFE3CE">${ico('check')}La caja cuadra.</div>`,
  `<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="confirmarCierre(${esp},${ef+tj},${vt.length})">${ico('lock')}Cerrar y mandar resumen</button>`);

}
function confirmarCierre(esp,tot,n){const d=(+$('#contado').value||0)-esp;cierres.push({fecha:new Date(),cajero:caja.cajero,ventas:n,total:tot,dif:d});caja.abierta=false;caja.movs.push({h:new Date(),t:'Cierre de caja',d:(d?'Diferencia '+fmt(d):'Cuadra')+' · '+usuario});closeModal();go('caja');toast('Caja cerrada. El resumen le llegó al dueño por WhatsApp y mail.');}

  ${vs.slice(0,150).map((v,i)=>`<tr class="cl ${i===0&&v.fresh?'flash':''}" onclick="verVenta(${v.id})"><td>${fechaCorta(v.fecha)}</td><td>${hhmm(v.fecha)}</td><td style="max-width:260px">${v.items.map(i=>i.n).join(', ')}</td><td>${tarPill(v.tar)}</td><td class="tiny">${v.origen}</td><td>${v.cajero.split(' ')[0]}</td><td class="num">${fmt(v.bruto)}</td><td class="num" style="color:var(--san)">${v.desc?'- '+fmt(v.desc):'—'}</td><td class="num"><b>${fmt(v.total)}</b></td><td class="num">${fmt(v.margen)}</td><td class="tiny">${v.cfe}</td></tr>`).join('')}
  <tr class="tot"><td colspan="6">Totales (${vs.length} ventas)</td><td class="num">${fmt(sum(vs,v=>v.bruto))}</td><td class="num">- ${fmt(sum(vs,v=>v.desc))}</td><td class="num">${fmt(sum(vs,v=>v.total))}</td><td class="num">${fmt(sum(vs,v=>v.margen))}</td><td></td></tr></table></div>${vs.length>150?'<p class="tiny">Se muestran las primeras 150. El Excel trae todas.</p>':''}</div>`;

function exportar(){
  const vs=ventasFiltradas();const rows=[['Fecha','Hora','Productos','Medio de pago','Origen','Vendió','Subtotal','Descuento','Total','Margen','Comprobante']].concat(vs.map(v=>[fechaCorta(v.fecha),hhmm(v.fecha),v.items.map(i=>i.n).join(' + '),TARJETAS[v.tar].n,v.origen,v.cajero,Math.round(v.bruto),v.desc,Math.round(v.total),Math.round(v.margen),v.cfe]));

  let rows=productos.map(p=>{const x=porProd[p.id]||{kg:0,venta:0,costo:0};const lista=(p.p-p.costo)/p.p*100;return {p,lista,real:x.venta?(x.venta-x.costo)/x.venta*100:lista,gan:x.venta-x.costo,venta:x.venta,q:x.kg};});
  rows.sort((a,b)=>margenOrden==='gan'?b.gan-a.gan:margenOrden==='venta'?b.venta-a.venta:a.real-b.real);

  const bajos=rows.filter(r=>r.real<32);
  $('#pane').innerHTML = `<div class="grid4"><div class="card kpi"><div class="lab">Margen bruto 7 días</div><div class="val">${pct(sum(rows,r=>r.gan)/Math.max(sum(rows,r=>r.venta),1)*100)}</div><div class="d">${fmt(sum(rows,r=>r.gan))} de ganancia</div></div><div class="card kpi"><div class="lab">Ventas 7 días</div><div class="val">${fmt(sum(rows,r=>r.venta))}</div><div class="d n">después de descuentos</div></div><div class="card kpi"><div class="lab">Lo que se comen los descuentos</div><div class="val">${fmt(sum(vs,v=>v.desc-v.banco))}</div><div class="d neg">la parte que pone el local</div></div><div class="card kpi"><div class="lab">Productos con margen bajo</div><div class="val">${bajos.length}</div><div class="d ${bajos.length?'neg':''}">debajo de 32%</div></div></div>
  <div class="grid2"><div class="card"><h3>${ico('pct')}Margen por producto<span class="act tiny">Tocá un producto para simular un precio nuevo</span></h3>
    <div class="tabs"><span class="tiny">Ordenar por</span><button class="tab ${margenOrden==='margen'?'on':''}" onclick="margenOrden='margen';VIEWS.margenes()">Menor margen</button><button class="tab ${margenOrden==='gan'?'on':''}" onclick="margenOrden='gan';VIEWS.margenes()">Más ganancia</button><button class="tab ${margenOrden==='venta'?'on':''}" onclick="margenOrden='venta';VIEWS.margenes()">Más vendido</button></div>
    <div class="tw"><table><tr><th>Producto</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Margen lista</th><th class="num">Margen real</th><th class="num">Ganancia 7 días</th></tr>${rows.map(r=>`<tr class="cl" onclick="simular(${r.p.id})"><td><b>${r.p.n}</b><div class="tiny">${r.p.c}</div></td><td class="num">${fmt(r.p.costo)}</td><td class="num">${fmt(r.p.p)}</td><td class="num">${pct(r.lista)}</td><td class="num"><span class="pill ${r.real>=38?'p-ok':r.real>=32?'p-warn':'p-bad'}">${pct(r.real)}</span></td><td class="num">${fmt(r.gan)}</td></tr>`).join('')}</table></div>
    <p class="tiny">Margen real = lo que queda después de los descuentos con tarjeta, sumando el reintegro del banco.</p></div>
  <div><div class="card" style="margin-bottom:14px"><h3>${ico('chart')}Ganancia por categoría</h3>${cats.sort((a,b)=>b[2]-a[2]).map(([c,v,g])=>`<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between"><span>${c}</span><b>${fmt(g)} <span class="tiny">${pct(g/Math.max(v,1)*100)}</span></b></div><div class="bar"><i style="width:${g/Math.max(...cats.map(x=>x[2]))*100}%"></i></div></div>`).join('')}</div>
  <div class="card"><h3>${ico('alert')}Para revisar</h3>${bajos.length?bajos.slice(0,4).map(r=>`<div class="list-it"><div style="flex:1"><b>${r.p.n}</b><div class="tiny">Margen real ${pct(r.real)}. El último costo del frigorífico subió.</div></div><button class="btn sm" onclick="simular(${r.p.id})">Ajustar</button></div>`).join(''):'<div class="empty">Todo en rango</div>'}</div></div></div>`;
};
function simular(id){const p=P(id);
  modal('Precio de '+p.n,`<div class="frow"><label class="f">Costo actual<input value="${fmt(p.costo)}" disabled></label><label class="f">Precio nuevo<input id="sp" type="number" value="${p.p}"></label></div><input id="sr" type="range" min="${Math.round(p.costo*1.05)}" max="${Math.round(p.costo*2.2)}" value="${p.p}" style="width:100%"><div class="grid2e" style="margin-top:12px;margin-bottom:0"><div class="card kpi"><div class="lab">Margen</div><div class="val" id="sm"></div></div><div class="card kpi"><div class="lab">Ganancia por ${p.u==='kg'?'kilo':'unidad'}</div><div class="val" id="sg"></div></div></div>`,
  `<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="P(${id}).p=+$('#sp').value;closeModal();VIEWS[view]();toast('Precio de ${p.n} actualizado en caja y POS')">Guardar precio</button>`);
  const upd=v=>{$('#sp').value=v;$('#sr').value=v;$('#sm').textContent=pct((v-p.costo)/v*100);$('#sg').textContent=fmt(v-p.costo);};upd(p.p);$('#sr').oninput=e=>upd(+e.target.value);$('#sp').oninput=e=>upd(+e.target.value||0);
}

  <div class="card"><h3>${ico('link')}Conexiones</h3>${[['pos','POS Getnet (Santander)','Las ventas con tarjeta entran solas'],['doc','Facturación electrónica DGI','e-Ticket y e-Factura automáticos'],['card','Promociones Santander','Reglas por tarjeta y día'],['users','WhatsApp Business','Comprobantes y resumen de caja'],['down','Excel','Planilla de ventas descargable']].map(([i,t,d])=>`<div class="list-it">${ico(i)}<div style="flex:1"><b>${t}</b><div class="tiny">${d}</div></div><span class="pill p-ok">Conectado</span></div>`).join('')}</div></div>`;
};

// ---------- Búsqueda ----------
function openK(){
  modal('Buscar',`<input id="kq" placeholder="Picaña, Florencia, e-Ticket..." style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px"><div id="kr"></div>`);
  const q=$('#kq');q.focus();const run=()=>{const s=q.value.toLowerCase();
    const r=[...productos.filter(p=>p.n.toLowerCase().includes(s)).map(p=>({t:p.n,d:fmt(p.p)+' / '+p.u,i:'tag',f:()=>{go('productos');simular(p.id)}})),
      ...clientes.filter(c=>c.n.toLowerCase().includes(s)).map((c)=>({t:c.n,d:c.b,i:'users',f:()=>{go('clientes');verCliente(clientes.indexOf(c))}})),
      ...(s.length>1?ventas.filter(v=>v.cfe.toLowerCase().includes(s)).slice(0,4).map(v=>({t:v.cfe,d:fmt(v.total),i:'doc',f:()=>verCFE(v.id)})):[]),
      ...Object.entries(TITLES).filter(([k,t])=>t[0].toLowerCase().includes(s)).map(([k,t])=>({t:t[0],d:'Ir a la sección',i:'inicio',f:()=>go(k)}))].slice(0,9);
    $('#kr').innerHTML=r.length?r.map((x,j)=>`<div class="kres" data-k="${j}">${ico(x.i)}<b>${x.t}</b><span class="tiny" style="margin-left:auto">${x.d}</span></div>`).join(''):'<div class="empty">Sin resultados</div>';
    document.querySelectorAll('.kres').forEach(el=>el.onclick=()=>{closeModal();r[el.dataset.k].f();});};
  q.oninput=run;run();
}
$('#openK').onclick=openK;

// ---------- Ventas que llegan solas del POS ----------
setInterval(()=>{
  if(!caja.abierta||$('#layer').innerHTML)return;
  const v=armarVenta(new Date(),caja.cajero,TARS[Math.floor(Math.random()*TARS.length)],itemsAzar(),'POS Getnet');v.fresh=true;ventas.unshift(v);
  caja.movs.push({h:v.fecha,t:'Venta '+v.cfe,d:TARJETAS[v.tar].n+' · POS Getnet',m:v.total});
  toast(`Nueva venta desde el POS: ${fmt(v.total)} con ${TARJETAS[v.tar].n}. Ya está en la planilla.`,'pos');
  if(['inicio','planilla','caja','facturas','estado','iva'].includes(view))VIEWS[view]();
},45000);

go('inicio');
</script>
