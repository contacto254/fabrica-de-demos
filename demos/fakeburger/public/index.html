<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Burger · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EEE6; --panel:#FFFFFF; --ink:#1F1511; --ink-2:#5E4E46; --ink-3:#8E7F77; --line:#E7DED3;
  --brand:#C52020; --brand-deep:#9E1616; --brand-soft:#FBE4E1; --brown:#4A2E22; --brown-2:#5E3D2E; --brown-soft:#EFE4DA; --cream:#F7F0E6;
  --ok:#2F8A57; --ok-soft:#E0F2E7; --warn:#C98516; --warn-soft:#FCEFD3; --bad:#C52020; --bad-soft:#FBE4E1; --sky:#3B76B5; --sky-soft:#E3EEF8;
  --r:10px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Archivo",system-ui,sans-serif;font-stretch:100%;background:var(--bg);color:var(--ink);font-size:14.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cond{font-stretch:68%;text-transform:uppercase;letter-spacing:.01em}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
aside{background:var(--brown);color:#F2E6DC;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.logo b{display:block;font-size:21px;font-weight:900;font-stretch:70%;letter-spacing:1px;line-height:1}
.logo small{display:block;font-size:11px;color:#CDB7A8;margin-top:3px}
.grp{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#B89C8A;margin:12px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8.5px 10px;border-radius:var(--r);cursor:pointer;color:#F2E6DC;text-align:left;font-weight:600;font-size:14.5px;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--brand);color:#fff}
.nav .cnt{margin-left:auto;background:#fff;color:var(--brand);border-radius:20px;font-size:11px;padding:0 7px;font-weight:800}
.nav.on .cnt{background:#fff}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:12.5px;color:#CDB7A8;border-top:1px solid rgba(255,255,255,.12)}
.side-foot .row{margin-top:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#fff}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:25px;margin:0;font-weight:900;font-stretch:70%;text-transform:uppercase;letter-spacing:.2px}
header .sub{color:var(--ink-3);font-size:13px}
.clock{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;background:var(--cream)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;color:var(--ink-3);cursor:pointer;min-width:210px;background:var(--bg)}
.search kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--brown-soft);color:var(--brown);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:var(--r);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--ink-3)}
.content{padding:18px 24px 40px;overflow:auto;flex:1}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 18px;overflow-x:auto}
.mtab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.mtab.on{color:var(--brand);border-color:var(--brand)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;font-weight:800}
.card h3 .act{margin-left:auto}
.kpi .lab{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:900;font-stretch:72%;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.kpi .d{font-size:12.5px;color:var(--ok);font-weight:700}
.kpi .d.neg{color:var(--bad)}.kpi .d.n{color:var(--ink-3)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:#FBF7F2}
tr.tot td{font-weight:800;background:#FBF7F2;border-top:2px solid var(--line)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.tiny{font-size:12.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:#8A5A07}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-n{background:#EFE8DF;color:var(--ink-2)}.p-br{background:var(--brown-soft);color:var(--brown)}.p-sky{background:var(--sky-soft);color:var(--sky)}.p-red{background:var(--brand);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 13px;cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
.btn.dk{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-2)}
.tab.on{background:var(--brown);border-color:var(--brown);color:#fff}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;background:#fff}
.bar{height:8px;background:#EFE8DF;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar.br i{background:var(--brown)}
.row{display:flex;align-items:center;gap:10px}
.list-it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-it:last-child{border-bottom:0}
.hero{background:var(--brown);color:#fff;border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:32px;font-weight:900;font-stretch:66%;text-transform:uppercase;line-height:1}
.hero p{margin:0;color:#E6D3C6;max-width:720px}
.hero .stripe{position:absolute;right:-40px;top:0;bottom:0;width:260px;background:repeating-linear-gradient(-55deg,rgba(197,32,32,.55) 0 18px,transparent 18px 36px)}
.hero .acts{margin-left:auto;display:flex;gap:8px;position:relative;flex-wrap:wrap}
.hero .btn{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(31,21,17,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:var(--r-lg);width:min(580px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h2{margin:0;font-size:22px;font-weight:900;font-stretch:72%;text-transform:uppercase}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:4px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:up .25s;max-width:440px}
.toast .ic{color:#F5A3A3}
.toast.new{background:var(--brand)}
.toast.new .ic{color:#fff}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.stat-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border:0}
.empty{color:var(--ink-3);text-align:center;padding:22px 0}
.empty .ic{width:28px;height:28px;display:block;margin:0 auto 6px;color:var(--line)}
.kres{border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.kres:hover,.kres.sel{background:var(--brand-soft)}
/* tablero */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#EDE4D9;border-radius:14px;padding:10px;min-height:420px;transition:background .15s}
.col.over{background:var(--brand-soft)}
.col h4{margin:2px 4px 10px;display:flex;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px}
.col h4 span{margin-left:auto;background:#fff;border-radius:20px;padding:0 8px;font-size:12px}
.tk{background:#fff;border-radius:11px;padding:10px 11px;margin-bottom:8px;cursor:grab;border-left:4px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tk:hover{box-shadow:0 4px 12px rgba(74,46,34,.14)}
.tk.drag{opacity:.4}
.tk .top{display:flex;align-items:center;gap:6px}
.tk b{font-size:14px}
.tk .its{font-size:12.5px;color:var(--ink-2);margin:5px 0;line-height:1.35}
.tk .bot{display:flex;align-items:center;gap:6px;font-size:12px}
.tk.nuevo{animation:flash 1.2s 2}
@keyframes flash{50%{background:var(--brand-soft)}}
.timer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.ch-web{border-left-color:var(--brand)}.ch-pya{border-left-color:#E8174B}.ch-wa{border-left-color:var(--ok)}
/* mapa */
.mapa > svg{width:100%;height:auto;display:block;border-radius:12px;background:#E8F0E8}
.mapa polygon{cursor:pointer;transition:opacity .15s}
.mapa polygon:hover{opacity:.8}
.slider{width:100%;accent-color:var(--brand)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on .lbl{text-decoration:line-through;color:var(--ink-3)}
.shift{display:grid;grid-template-columns:170px repeat(7,1fr);gap:4px;align-items:stretch}
.shift .h{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:700;text-align:center;padding:4px 0}
.shift .h.hoy{color:var(--brand)}
.shift .nm{padding:8px 4px;font-weight:700;font-size:13.5px}
.cell{border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;cursor:pointer;border:1px dashed var(--line);background:#FDFBF8;min-height:40px;display:flex;flex-direction:column;justify-content:center}
.cell.on{background:var(--brown);color:#fff;border-color:transparent}
.cell.on.prep{background:var(--brown-2)}
.cell:hover{border-color:var(--brand)}
.vbars{display:flex;align-items:flex-end;gap:4px;height:170px}
.vbars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vbars .b i{display:block;width:100%;border-radius:4px 4px 1px 1px;background:var(--brand)}
.vbars .b i.alt{background:var(--brown-2)}
.vbars .b span{font-size:10px;color:var(--ink-3)}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tour{position:fixed;inset:0;background:rgba(31,21,17,.55);z-index:70;display:grid;place-items:center;padding:20px}
.tour .tc{background:#fff;border-radius:18px;max-width:470px;width:100%;overflow:hidden}
.tour .tt{background:var(--brown);color:#fff;padding:20px 22px;position:relative;overflow:hidden}
.tour .tt h2{margin:0;font-size:30px;font-weight:900;font-stretch:66%;text-transform:uppercase}
.tour .tb{padding:18px 22px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand)}
@media (max-width:1180px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.grid2,.grid2e{grid-template-columns:1fr}.search{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{order:2;flex-direction:row;padding:6px;overflow-x:auto}
  aside .logo,aside .grp,aside .side-foot{display:none}
  #nav{display:flex;gap:4px}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;white-space:nowrap}
  .nav .cnt{display:none}
  header{padding:10px 14px;flex-wrap:wrap}.hero .acts{margin-left:0}.clock{margin-left:0}.user div div{display:none}
  .content{padding:14px}
  .shift{grid-template-columns:110px repeat(7,64px);overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const CONTEO = ['pan','carne','panceta','cheddar','papas','porto','coca','vitale','bolsa','wrap'];
VIEWS.conteo=()=>{
  $('#pane').innerHTML=`<div class="card"><h3>${ico('scale')}Conteo de cierre<span class="act tiny">Lo que debería haber sale de las ventas y las recetas. Ustedes cuentan lo que hay.</span></h3><div class="tw"><table><tr><th>Insumo</th><th class="num">Debería haber</th><th class="num" style="width:150px">Contado</th><th class="num">Diferencia</th><th class="num">En plata</th></tr>${CONTEO.map(id=>{const i=I(id);const real=+(i.teo*(id==='carne'?.965:id==='pan'?.985:id==='papas'?.97:1)).toFixed(i.u==='u'?0:2);return `<tr><td><b>${i.n}</b></td><td class="num">${NF1.format(i.teo)} ${i.u}</td><td class="num"><input class="inp" style="width:110px;text-align:right" type="number" step="0.1" value="${real}" data-c="${id}" oninput="difConteo()"></td><td class="num" id="df_${id}"></td><td class="num" id="dp_${id}"></td></tr>`}).join('')}<tr class="tot"><td>Total de la diferencia</td><td></td><td></td><td></td><td class="num" id="dtot"></td></tr></table></div>
  <div class="row" style="margin-top:12px"><span class="tiny">Una diferencia en carne o en pan suele ser burgers que salieron sin cargarse o que se tiraron. Ahí está la plata que no aparece.</span><button class="btn pri" style="margin-left:auto" onclick="cerrarConteo()">${ico('check')}Cerrar el conteo</button></div></div>`;
  difConteo();
};
function difConteo(){ let t=0; $$('[data-c]').forEach(el=>{const i=I(el.dataset.c);const d=(+el.value||0)-i.teo;const p=d*i.c;t+=p;$('#df_'+i.id).innerHTML=`<span class="pill ${Math.abs(d)<.01?'p-ok':d<0?'p-bad':'p-warn'}">${d>0?'+':''}${NF1.format(d)} ${i.u}</span>`;$('#dp_'+i.id).textContent=uy(p);}); $('#dtot').innerHTML=`<b style="color:${t<0?'var(--bad)':'inherit'}">${uy(t)}</b>`; }
function cerrarConteo(){ $$('[data-c]').forEach(el=>{const i=I(el.dataset.c);i.st=+el.value||0;i.teo=i.st;}); refrescar(); toast('Conteo cerrado. El stock quedó con lo contado y la diferencia se registró como merma de la noche.'); }

// ================= Menú y costos =================
let chMargen='web';
VIEWS.carta=()=>{
  const cats=[...new Set(MENU.map(m=>m.cat))];
  $('#pane').innerHTML=`<div class="tabs"><span class="muted">Margen vendiendo por</span>${Object.entries(CANAL).map(([k,c])=>`<button class="tab ${chMargen===k?'on':''}" onclick="chMargen='${k}';VIEWS.carta()">${k==='web'?'la web ('+DTO_WEB+'% OFF y Mercado Pago)':k==='pya'?'PedidosYa (26%)':'WhatsApp'}</button>`).join('')}<button class="btn" style="margin-left:auto" onclick="csv('menu-costos',[['Producto','Categoría','Precio','Costo','Food cost %','Neto web','Neto PedidosYa'],...MENU.map(m=>[m.n,m.cat,m.precio,Math.round(costo(m)),Math.round(costo(m)/m.precio*100),Math.round(netoCanal(m,'web')-costo(m)),Math.round(netoCanal(m,'pya')-costo(m))])])">${ico('down')}Exportar</button></div>
  ${cats.map(c=>`<div class="card" style="margin-bottom:14px"><h3>${c}</h3><div class="tw"><table><tr><th>Producto</th><th class="num">Precio</th><th class="num">Cobrás</th><th class="num">Costo</th><th class="num">Food cost</th><th class="num">Te queda</th><th class="num">Activo</th></tr>${MENU.filter(m=>m.cat===c).map(m=>{const co=costo(m),ne=netoCanal(m,chMargen),fc=co/m.precio*100,q=ne-co;return `<tr class="cl" onclick="verReceta('${m.id}')"><td><b>${m.n}</b>${m.id.startsWith('fugaz')?' <span class="pill p-red">Fugaz</span>':''}<div class="tiny">${m.desc}</div></td><td class="num">${uy(m.precio)}</td><td class="num">${uy(ne)}</td><td class="num">${uy(co)}</td><td class="num"><span class="pill ${fc>38?'p-bad':fc>32?'p-warn':'p-ok'}">${pct(fc)}</span></td><td class="num"><b>${uy(q)}</b><div class="tiny">${pct(q/m.precio*100)}</div></td><td class="num"><button class="btn sm" onclick="event.stopPropagation();togMenu('${m.id}')">${m.on?'Activo':'Pausado'}</button></td></tr>`}).join('')}</table></div></div>`).join('')}`;
};
function togMenu(id){ const m=M(id); m.on=!m.on; VIEWS[view](); toast(m.on?m.n+' vuelve a estar a la venta en la web y en PedidosYa.':m.n+' pausado en la web y en PedidosYa. Se reactiva con un clic.'); }
VIEWS.receta=()=>{
  $('#pane').innerHTML=`<div class="grid3">${Object.keys(BURG).map(k=>{const m=M(k);const co=costo(m);return `<div class="card" style="cursor:pointer" onclick="verReceta('${k}')"><h3>${ico('burger')}${m.n}</h3>${m.receta.map(([i,q])=>`<div class="stat-row"><span>${I(i).n.split(',')[0]} <span class="tiny">${I(i).u==='kg'||I(i).u==='l'?num(q*1000)+(I(i).u==='l'?' ml':' g'):q+' u'}</span></span><span class="tiny">${uy(I(i).c*q)}</span></div>`).join('')}<div class="stat-row"><b>Costo</b><b>${uy(co)}</b></div><div class="tiny">Food cost ${pct(co/m.precio*100)} sobre ${uy(m.precio)}</div></div>`}).join('')}</div>
  <p class="tiny">Las cantidades y los costos son estimados para la demo. En el sistema real se cargan las recetas de ustedes.</p>`;
};
function verReceta(id){ const m=M(id); const co=costo(m);
  modal(m.n,`<p class="muted" style="margin-top:0">${m.desc}</p><table><tr><th>Insumo</th><th class="num">Cantidad</th><th class="num">Costo</th></tr>${m.receta.map(([i,q])=>`<tr><td>${I(i).n}</td><td class="num">${I(i).u==='kg'||I(i).u==='l'?num(q*1000)+(I(i).u==='l'?' ml':' g'):q+' u'}</td><td class="num">${uy(I(i).c*q)}</td></tr>`).join('')}<tr class="tot"><td>Costo total</td><td></td><td class="num">${uy(co)}</td></tr></table>
  <div class="grid3" style="margin-top:14px;margin-bottom:0">${Object.keys(CANAL).map(k=>`<div class="card" style="padding:12px"><div class="tiny">${CANAL[k].n}</div><b style="font-size:20px">${uy(netoCanal(m,k)-co)}</b><div class="tiny">te queda por unidad</div></div>`).join('')}</div>
  <label class="f" style="margin-top:14px">Precio de lista<input id="rpr" type="number" value="${m.precio}" step="10"></label>`,
  `<button class="btn" data-close>Cerrar</button><button class="btn pri" onclick="M('${id}').precio=+$('#rpr').value||M('${id}').precio;closeModal();refrescar();toast('${esc(m.n)}: nuevo precio '+uy(M('${id}').precio)+', publicado en la web. Recordá cambiarlo también en PedidosYa.')">Guardar precio</button>`,true);}
let simIns='carne', simPct=12;
VIEWS.simulador=()=>{
  const i=I(simIns); const afect=MENU.filter(m=>m.receta.some(r=>r[0]===simIns));
  const ventasMes=sum(NOCHES.slice(-30),n=>n.ped);
  $('#pane').innerHTML=`<div class="grid2"><div class="card"><h3>${ico('alert')}¿Y si sube un insumo?</h3><div class="frow"><label class="f">Insumo<select id="sii">${INS.filter(x=>MENU.some(m=>m.receta.some(r=>r[0]===x.id))).map(x=>`<option value="${x.id}" ${x.id===simIns?'selected':''}>${x.n}</option>`).join('')}</select></label><label class="f">Sube un <b id="spv">${simPct}%</b><input class="slider" type="range" min="0" max="40" value="${simPct}" id="sip"></label></div>
  <div class="tw"><table><tr><th>Producto</th><th class="num">Costo hoy</th><th class="num">Costo nuevo</th><th class="num">Food cost</th><th class="num">Precio para mantener el margen</th></tr>${afect.map(m=>{const co=costo(m);const r=m.receta.find(x=>x[0]===simIns);const nu=co+i.c*r[1]*simPct/100;const pr=Math.ceil(m.precio*nu/co/10)*10;return `<tr><td><b>${m.n}</b></td><td class="num">${uy(co)}</td><td class="num">${uy(nu)}</td><td class="num">${pct(co/m.precio*100)} a <b>${pct(nu/m.precio*100)}</b></td><td class="num"><b>${uy(pr)}</b> <span class="tiny">hoy ${uy(m.precio)}</span></td></tr>`}).join('')}</table></div></div>
  <div class="card"><h3>${ico('cash')}Lo que pega en el mes</h3><div class="kpi"><div class="lab">Costo extra por mes, sin cambiar precios</div><div class="val" style="color:var(--bad)">${uy(i.c*simPct/100*ventasMes*(simIns==='carne'?.1*1.25:simIns==='pan'?1.25:.04))}</div></div><p class="muted">Calculado con los ${num(ventasMes)} pedidos de los últimos 30 días y la receta de cada producto. Así se decide antes de que el proveedor mande la factura nueva, no un mes después mirando el Excel.</p><button class="btn pri" onclick="toast('Precios sugeridos guardados como borrador. Se publican cuando lo confirmes.')">${ico('check')}Guardar precios sugeridos</button></div></div>`;
  $('#sii').onchange=e=>{simIns=e.target.value;VIEWS.simulador();}; $('#sip').oninput=e=>{simPct=+e.target.value;VIEWS.simulador();const s=$('#sip');s&&s.focus();};
};
VIEWS.fugaz=()=>{
  const f3=PED.reduce((s,p)=>s+sum(p.items.filter(([id])=>id.startsWith('fugaz')),x=>x[1]),0);
  const dias3=[...Array(12)].map((_,k)=>Math.round(42+k*4.2+rnd()*14)); const u3=sum(dias3,x=>x)+f3; FUGAZ[2].u=u3;
  $('#pane').innerHTML=`<div class="hero" style="margin-bottom:14px"><div class="stripe"></div><div style="position:relative"><h2>Fugaz 003</h2><p>Lleva 12 noches. Cheddar derretido, panceta, papas pay y honey mustard. Ya vendió ${num(u3)} unidades, contando ${f3} de esta noche.</p></div></div>
  <div class="grid3">${FUGAZ.map(f=>`<div class="card kpi"><div class="lab">${ico('fire')}${f.n}</div><div class="val">${num(f.u)}</div><div class="d n">${f.hasta?'Estuvo '+(f.hasta-f.desde)+' noches · pico de '+f.pico+' en una noche':'En venta desde el '+fcorta(addD(f.desde))}</div></div>`).join('')}</div>
  <div class="card"><h3>${ico('chart')}Las primeras 12 noches de cada Fugaz</h3><div class="vbars" style="height:190px">${[...Array(12)].map((_,k)=>{const a=Math.round(28+k*3.1+Math.sin(k)*6),b=Math.round(36+k*3.6+Math.cos(k)*7),c=dias3[k];return `<div class="b" style="flex-direction:row;align-items:flex-end;gap:2px"><i style="height:${a/110*100}%;background:#D9C7B8;width:30%"></i><i style="height:${b/110*100}%;background:var(--brown-2);width:30%"></i><i style="height:${c/110*100}%;width:30%"></i></div>`}).join('')}</div><div class="legend"><span><i style="background:#D9C7B8"></i>Fugaz 001</span><span><i style="background:var(--brown-2)"></i>Fugaz 002</span><span><i style="background:var(--brand)"></i>Fugaz 003</span></div><p class="tiny">La 003 arrancó un 21% arriba de la 002. Las cifras de las Fugaz anteriores son de ejemplo.</p></div>`;
};

// ================= Compras =================
VIEWS.sugerido=()=>{
  const l=INS.filter(i=>i.prov!=='prop'&&i.st<i.min*1.3);
  const porProv={};l.forEach(i=>{(porProv[i.prov]=porProv[i.prov]||[]).push(i);});
  $('#pane').innerHTML=`<p class="muted" style="margin-top:0">Lo que está por debajo del mínimo o cerca, agrupado por proveedor. La cantidad sugerida cubre hasta la próxima entrega con lo que se espera vender.</p>
  ${Object.keys(porProv).length?`<div class="grid2e">${Object.entries(porProv).map(([p,its])=>`<div class="card"><h3>${ico('truck')}${PROV[p].n}<span class="act tiny">${PROV[p].dias}</span></h3>${its.map(i=>{const q=Math.ceil((i.min*2-i.st)*(i.u==='u'?1:10))/(i.u==='u'?1:10);return `<div class="stat-row"><span>${i.n}<div class="tiny">Hay ${NF1.format(i.st)}, mínimo ${i.min}</div></span><b>${NF1.format(q)} ${i.u} · ${uy(q*i.c)}</b></div>`}).join('')}<div class="row" style="margin-top:10px"><b>${uy(sum(its,i=>Math.ceil((i.min*2-i.st)*(i.u==='u'?1:10))/(i.u==='u'?1:10)*i.c))}</b><button class="btn pri sm" style="margin-left:auto" onclick="pedirProv('${p}')">${ico('send')}Mandar por WhatsApp</button></div></div>`).join('')}</div>`:`<div class="card">${empty('check','No hay nada para pedir: todos los insumos están por encima del mínimo.','<button class="btn" data-go="insumos">Ver insumos</button>')}</div>`}`;
};
function pedirProv(p){ const its=INS.filter(i=>i.prov===p&&i.st<i.min*1.3);
  modal('Pedido a '+PROV[p].n,`<div class="card" style="background:#E7F6E9;border:0;padding:14px;font-size:14px;line-height:1.5">Hola, ¿cómo andás? Te paso el pedido para Fake Burger (Solís 5107):<br>${its.map(i=>`· ${NF1.format(Math.ceil((i.min*2-i.st)*(i.u==='u'?1:10))/(i.u==='u'?1:10))} ${i.u} de ${i.n.toLowerCase()}`).join('<br>')}<br>Lo necesitamos antes de las 18 h. ¡Gracias!</div><p class="tiny">Se manda al ${PROV[p].tel}. Cuando llega la mercadería, se confirma la entrada y el stock sube solo.</p>`,
  `<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="recibir('${p}')">${ico('send')}Mandar</button>`);}
function recibir(p){ INS.filter(i=>i.prov===p&&i.st<i.min*1.3).forEach(i=>{const q=Math.ceil((i.min*2-i.st)*(i.u==='u'?1:10))/(i.u==='u'?1:10);i.st=+(i.st+q).toFixed(2);i.teo=+(i.teo+q).toFixed(2);}); closeModal(); refrescar(); toast(`Pedido enviado a ${PROV[p].n}. En la demo lo damos por recibido: el stock ya subió.`); }
VIEWS.proveedores=()=>{
  $('#pane').innerHTML=`<div class="card"><div class="tw"><table><tr><th>Proveedor</th><th>Qué nos vende</th><th>Entrega</th><th>Teléfono</th><th class="num">Comprado en el mes</th><th class="num">Debemos</th></tr>${Object.entries(PROV).filter(([k])=>k!=='prop').map(([k,p])=>{const d=sum(FACT.filter(f=>f.prov===k&&f.est==='pendiente'),f=>f.monto);return `<tr class="cl" onclick="pedirProv('${k}')"><td><b>${p.n}</b></td><td class="tiny">${p.q}</td><td class="tiny">${p.dias}</td><td>${p.tel}</td><td class="num">${uy(sum(FACT.filter(f=>f.prov===k),f=>f.monto)*1.6)}</td><td class="num">${d?`<b>${uy(d)}</b>`:'<span class="tiny">Al día</span>'}</td></tr>`}).join('')}</table></div></div>`;
};
VIEWS.apagar=()=>{
  const pend=FACT.filter(f=>f.est==='pendiente').sort((a,b)=>a.vence-b.vence);
  const sem=pend.filter(f=>f.vence<=7);
  $('#pane').innerHTML=`<div class="grid3"><div class="card kpi"><div class="lab">${ico('alert')}Vencidas</div><div class="val" style="color:var(--bad)">${uy(sum(factVencidas(),f=>f.monto))}</div><div class="d neg">${factVencidas().length} facturas</div></div><div class="card kpi"><div class="lab">${ico('clock')}Vencen esta semana</div><div class="val">${uy(sum(sem.filter(f=>f.vence>=0),f=>f.monto))}</div><div class="d n">${sem.filter(f=>f.vence>=0).length} facturas</div></div><div class="card kpi"><div class="lab">${ico('cash')}Total a pagar</div><div class="val">${uy(sum(pend,f=>f.monto))}</div><div class="d n">${pend.length} facturas pendientes</div></div></div>
  <div class="card"><div class="tw"><table><tr><th>Proveedor</th><th>Factura</th><th>Vence</th><th class="num">Monto</th><th>Estado</th><th></th></tr>${FACT.slice().sort((a,b)=>(a.est>b.est?1:-1)||a.vence-b.vence).map(f=>`<tr><td><b>${PROV[f.prov].n}</b></td><td>${f.nro}</td><td>${fdia(addD(f.vence))}</td><td class="num"><b>${uy(f.monto)}</b></td><td>${f.est==='pagada'?'<span class="pill p-ok">Pagada</span>':f.vence<0?`<span class="pill p-bad">Vencida hace ${-f.vence} días</span>`:f.vence===0?'<span class="pill p-warn">Vence hoy</span>':`<span class="pill p-n">En ${f.vence} días</span>`}</td><td class="num">${f.est==='pendiente'?`<button class="btn sm pri" onclick="pagar(${f.id})">Pagar</button>`:''}</td></tr>`).join('')}</table></div></div>`;
};
function pagar(id){ const f=FACT.find(x=>x.id===id); modal('Pagar factura',`<div class="stat-row"><span class="muted">Proveedor</span><b>${PROV[f.prov].n}</b></div><div class="stat-row"><span class="muted">Factura</span><b>${f.nro}</b></div><div class="stat-row"><span class="muted">Monto</span><b>${uy(f.monto)}</b></div><label class="f" style="margin-top:12px">Desde<select><option>Cuenta del banco</option><option>Mercado Pago</option><option>Efectivo de la caja</option></select></label>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" onclick="FACT.find(x=>x.id===${id}).est='pagada';closeModal();refrescar();toast('Factura ${f.nro} de ${esc(PROV[f.prov].n)} pagada. Queda en los gastos del mes.')">Confirmar pago</button>`);}

// ================= Caja =================
let nocheCerrada=false;
VIEWS.cierre=()=>{
  const by=c=>PED.filter(p=>p.ch===c);
  const web=by('web'), pya=by('pya'), wa=by('wa');
  const ef=wa.filter(p=>p.pago==='Efectivo'), tr=wa.filter(p=>p.pago==='Transferencia');
  const tot=l=>sum(l,p=>totalPed(p).tot);
  const prop=sum(PED,p=>p.prop), env=sum(PED.filter(p=>p.ch!=='pya'),p=>Z(p.zona).precio);
  const cocina=EQUIPO.filter(e=>e.tipo==='cocina'&&TURNOS[e.id][(HOY.getDay()+6)%7]);
  $('#pane').innerHTML=`<div class="grid4"><div class="card kpi"><div class="lab">${ico('cash')}Vendido</div><div class="val">${uy(tot(PED))}</div><div class="d n">${PED.length} pedidos</div></div><div class="card kpi"><div class="lab">${ico('cash')}Efectivo que tiene que haber</div><div class="val">${uy(tot(ef))}</div><div class="d n">${ef.length} pedidos de WhatsApp</div></div><div class="card kpi"><div class="lab">${ico('moto')}A pagar a cadetes</div><div class="val">${uy(env+CADETES.length*450)}</div><div class="d n">envíos más fijo de la noche</div></div><div class="card kpi"><div class="lab">${ico('heart')}Propinas para repartir</div><div class="val">${uy(prop)}</div><div class="d n">entre ${cocina.length} en la cocina</div></div></div>
  <div class="grid2"><div class="card"><h3>${ico('doc')}Cierre del ${DIAS[HOY.getDay()]} ${fcorta(HOY)}${nocheCerrada?'<span class="pill p-ok act">Cerrada</span>':''}</h3><table><tr><th>Medio</th><th class="num">Pedidos</th><th class="num">Monto</th><th>Cuándo entra la plata</th></tr>
  <tr><td>Mercado Pago (web)</td><td class="num">${web.length}</td><td class="num">${uy(tot(web))}</td><td class="tiny">Al instante, menos 5,2% de comisión</td></tr>
  <tr><td>PedidosYa</td><td class="num">${pya.length}</td><td class="num">${uy(tot(pya))}</td><td class="tiny">En la liquidación quincenal, menos 26%</td></tr>
  <tr><td>Efectivo (WhatsApp)</td><td class="num">${ef.length}</td><td class="num">${uy(tot(ef))}</td><td class="tiny">En la caja</td></tr>
  <tr><td>Transferencia (WhatsApp)</td><td class="num">${tr.length}</td><td class="num">${uy(tot(tr))}</td><td class="tiny">En el banco</td></tr>
  <tr class="tot"><td>Total</td><td class="num">${PED.length}</td><td class="num">${uy(tot(PED))}</td><td></td></tr></table>
  <label class="f" style="margin-top:14px">Efectivo contado en la caja<input id="efc" type="number" value="${Math.round(tot(ef)-200)}" oninput="difCaja(${Math.round(tot(ef))})"></label><div id="dcj"></div></div>
  <div class="card"><h3>${ico('moto')}Liquidación de cadetes</h3>${CADETES.map(c=>{const v=PED.filter(p=>p.cad===c.id);const e=sum(v,p=>Z(p.zona).precio);return `<div class="stat-row"><span>${c.n}<div class="tiny">${v.length} envíos · fijo ${uy(c.fijo)}</div></span><b>${uy(e+c.fijo)}</b></div>`}).join('')}
  <h3 style="margin-top:16px">${ico('heart')}Propinas</h3>${cocina.map(e=>`<div class="stat-row"><span>${e.n}</span><b>${uy(prop/cocina.length)}</b></div>`).join('')}</div></div>
  <div class="row"><span class="muted">Al cerrar, el resumen le llega a los socios por WhatsApp y queda en el estado de resultados del mes. Sin planilla.</span><button class="btn pri" style="margin-left:auto" onclick="cerrarNoche()" ${nocheCerrada?'disabled':''}>${ico('lock')}${nocheCerrada?'Noche cerrada':'Cerrar la noche'}</button></div>`;
  difCaja(Math.round(tot(ef)));
};
function difCaja(deb){ const c=+$('#efc').value||0, d=c-deb; $('#dcj').innerHTML=`<div class="stat-row"><span>Diferencia</span><b style="color:${d<0?'var(--bad)':d>0?'var(--warn)':'var(--ok)'}">${d===0?'Cierra justo':(d>0?'Sobran ':'Faltan ')+uy(Math.abs(d))}</b></div>`; }
function cerrarNoche(){ const pend=PED.filter(p=>p.estado!=='entregado').length;

VIEWS.resultados=()=>{
  const mes=NOCHES.filter(n=>n.f.getMonth()===HOY.getMonth()), pas=NOCHES.filter(n=>n.f.getMonth()!==HOY.getMonth()).slice(-mes.length);
  const v=sum(mes,n=>n.venta), vp=sum(pas,n=>n.venta);
  const dow=[1,2,3,4,5,6,0].map(d=>{const l=NOCHES.filter(n=>n.f.getDay()===d);return [DIAS[d].slice(0,3),sum(l,n=>n.ped)/l.length];});

  <div class="card"><h3>${ico('bag')}Por canal</h3><div class="stack">${chs.map(([c,n])=>`<i style="width:${n/tch*100}%;background:${CANAL[c].c}"></i>`).join('')}</div><div style="margin-top:10px">${chs.map(([c,n])=>`<div class="stat-row"><span>${chPill(c)}</span><b>${pct(n/tch*100)}</b></div>`).join('')}</div><p class="tiny">Cada pedido que pasa de PedidosYa a la web deja unos ${uy(1100*.26-1100*.1-1100*.9*.052)} más, aun con el 10% OFF.</p></div></div>

let EDR=[];
VIEWS.estado=()=>{
  const mes=NOCHES.filter(n=>n.f.getMonth()===HOY.getMonth());
  const venta=sum(mes,n=>n.venta)+sum(PED,p=>totalPed(p).tot);
  const pyaV=sum(mes,n=>n.pya*n.tk), webV=sum(mes,n=>n.web*n.tk);
  const filas=[['Ventas',venta,1],['Costo de mercadería (31,2%)',-venta*.312],['Comisión PedidosYa (26%)',-pyaV*.26],['Comisión Mercado Pago (5,2%)',-webV*.052],['Packaging y descartables',-sum(mes,n=>n.ped)*21],['Sueldos de cocina, con aportes, aguinaldo y licencia',-1.62*sum(EQUIPO.filter(e=>e.tipo==='cocina'),e=>TURNOS[e.id].reduce((s,t)=>s+(t==='prep'?6:5),0)*e.hora)*mes.length/7],['Cadetes',-sum(mes,n=>n.ped*(1-.47))*100-CADETES.length*450*mes.length],['Gastos fijos y marketing',-sum(GASTOS,g=>g[1])*mes.length/30],['Merma y comida del personal',-venta*.021],['IVA a pagar e impuestos',-venta*.105]];
  const res=sum(filas,f=>f[1]);EDR=[...filas,['Resultado',res]];
  $('#pane').innerHTML=`<div class="grid2"><div class="card"><h3>${ico('doc')}Estado de resultados de ${MESES[HOY.getMonth()]}, hasta hoy<button class="btn sm act" onclick="csv('estado-resultados',[['Concepto','Monto'],...EDR.map(f=>[f[0],Math.round(f[1])])])">${ico('down')}Exportar</button></h3><table>${filas.map(f=>`<tr><td style="${f[2]?'font-weight:800':''}">${f[0]}</td><td class="num" style="color:${f[1]<0?'var(--ink-2)':'inherit'}">${f[1]<0?'- ':''}${uy(Math.abs(f[1]))}</td><td class="num tiny">${pct(Math.abs(f[1])/venta*100)}</td></tr>`).join('')}<tr class="tot"><td>Resultado</td><td class="num" style="color:${res>0?'var(--ok)':'var(--bad)'}">${uy(res)}</td><td class="num">${pct(res/venta*100)}</td></tr></table></div>
  <div class="card"><h3>${ico('help')}De dónde sale cada número</h3><div class="stat-row"><span>Ventas</span><span class="tiny">de los pedidos de cada noche</span></div><div class="stat-row"><span>Mercadería</span><span class="tiny">de las recetas y lo vendido</span></div><div class="stat-row"><span>Comisiones</span><span class="tiny">de PedidosYa y Mercado Pago</span></div><div class="stat-row"><span>Sueldos</span><span class="tiny">de los turnos</span></div><div class="stat-row"><span>Cadetes</span><span class="tiny">de los envíos de cada noche</span></div><div class="stat-row"><span>Gastos</span><span class="tiny">de lo que se carga en Gastos</span></div><div class="stat-row"><span>Merma</span><span class="tiny">del conteo de cierre de cada noche</span></div><p class="muted">Nadie arma esta planilla. Se arma sola, todos los días, con lo que ya pasa en el sistema.</p></div></div>`;
};

  <h3 style="margin-top:14px">${ico('bag')}Conectado con</h3><div class="row" style="flex-wrap:wrap"><span class="pill p-ok">Tienda fakeburger.uy</span><span class="pill p-ok">PedidosYa</span><span class="pill p-ok">Mercado Pago</span><span class="pill p-ok">WhatsApp</span></div></div></div>`;
};
VIEWS.importar=()=>{
  const XL=[['Costos y recetas.xlsx','Recetas, costos de insumos y precios','Menú y costos'],['Stock.xlsx','Insumos, mínimos y conteos','Stock y producción'],['Caja diaria.xlsx','Cierre de cada noche, efectivo y propinas','Caja y plata'],['Proveedores y pagos.xlsx','Facturas, vencimientos y pagos','Compras'],['Sueldos.xlsx','Horas, turnos y cadetes','Equipo'],['PedidosYa.xlsx','Liquidaciones quincenales','Caja y plata']];
  $('#pane').innerHTML=`<div class="card"><h3>${ico('excel')}Los Excel que hoy arma una persona a mano</h3><p class="muted" style="margin-top:0">Están bien hechos. El problema es que alguien tiene que llenarlos todas las noches. Se suben una sola vez y desde ahí se llenan solos.</p><div class="tw"><table><tr><th>Planilla</th><th>Qué tiene</th><th>Pasa a</th><th></th></tr>${XL.map((x,i)=>`<tr><td><b>${x[0]}</b></td><td class="tiny">${x[1]}</td><td>${x[2]}</td><td class="num"><button class="btn sm" id="xl${i}" onclick="this.outerHTML='<span class=&quot;pill p-ok&quot;>Importado</span>';toast('${x[0]} importado: los datos ya están en ${x[2]}.')">${ico('down')}Importar</button></td></tr>`).join('')}</table></div></div>`;
};

// ================= Búsqueda Ctrl K =================
function openK(){
  const ACC=[['Pedido por WhatsApp','plus',()=>nuevoPedidoWA()],['Tablero de pedidos','bag',()=>go('tablero')],['Cerrar la noche','lock',()=>go('cierre')],['Pedido sugerido a proveedores','cart',()=>go('sugerido')],['Producción de hoy','pot',()=>go('prep')],['Conteo de cierre','scale',()=>go('conteo')],['Si sube un insumo','alert',()=>go('simulador')],['Facturas a pagar','doc',()=>go('apagar')],['Ver el recorrido','help',()=>tour(0)]];
  modal('Buscar',`<input id="kq" placeholder="Pedido, cliente, producto, insumo o una acción" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px" aria-label="Buscar"><div id="kr"></div>`);
  const q=$('#kq');q.focus();let sel=0,res=[];
  const run=()=>{const s=q.value.toLowerCase().trim();
    res=[...ACC.filter(a=>!s||a[0].toLowerCase().includes(s)).map(a=>({t:a[0],d:'Acción',i:a[1],f:a[2]})),
      ...(s?PED.filter(p=>String(p.id).includes(s.replace('#',''))||nombrePed(p).toLowerCase().includes(s)).slice(0,5).map(p=>({t:'#'+p.id+' · '+nombrePed(p),d:EST_N[p.estado],i:'bag',f:()=>verPed(p.id)})):[]),
      ...(s?CLI.filter(c=>c.n.toLowerCase().includes(s)).slice(0,4).map(c=>({t:c.n,d:'Cliente',i:'heart',f:()=>verCliente(c.id)})):[]),
      ...(s?MENU.filter(m=>m.n.toLowerCase().includes(s)).slice(0,4).map(m=>({t:m.n,d:uy(m.precio),i:'burger',f:()=>verReceta(m.id)})):[]),
      ...(s?INS.filter(i=>i.n.toLowerCase().includes(s)).slice(0,4).map(i=>({t:i.n,d:NF1.format(i.st)+' '+i.u,i:'box',f:()=>verInsumo(i.id)})):[])].slice(0,10);
    sel=0;draw();};
  const draw=()=>{$('#kr').innerHTML=res.length?res.map((x,j)=>`<div class="kres ${j===sel?'sel':''}" data-k="${j}">${ico(x.i)}<b>${x.t}</b><span class="tiny" style="margin-left:auto">${x.d}</span></div>`).join(''):empty('search','No encontramos nada con eso.');$$('.kres').forEach(el=>el.onclick=()=>{const r=res[el.dataset.k];closeModal();r.f();});};
  q.oninput=run;q.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,res.length-1);draw();e.preventDefault();}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault();}if(e.key==='Enter'&&res[sel]){const r=res[sel];closeModal();r.f();}};run();
}
$('#openK').onclick=openK;$('#openK').onkeydown=e=>{if(e.key==='Enter')openK();};

// ================= Recorrido =================
const TOUR=[
  ['Todo lo de la noche, en un lugar','Los pedidos de la web, PedidosYa y WhatsApp entran al mismo tablero. Arrastralos de columna en columna: al pasar a la plancha, el stock baja solo según la receta.','tablero'],
  ['El Excel se llena solo','Costos, stock, caja, cadetes y propinas salen de lo que pasa cada noche. En Caja y plata, "Cerrar la noche" arma el cierre y se lo manda a los socios.','cierre'],
  ['Los números, antes de que duelan','En Menú y costos ves cuánto te queda de cada burger por canal, y qué pasa si sube la carne. En Resultados, el mes armado sin tocar una planilla.','simulador'],
];
function tour(i){ if(i>=TOUR.length){$('#tourLayer').innerHTML='';try{localStorage.setItem('fk_tour','1');}catch(e){}return;}
  const t=TOUR[i]; $('#tourLayer').innerHTML=`<div class="tour" onclick="if(event.target===this)tour(99)"><div class="tc" role="dialog" aria-modal="true" aria-label="Recorrido"><div class="tt"><div class="hero" style="padding:0;margin:0;background:none"><div class="stripe" style="opacity:.6"></div></div><div class="tiny" style="color:#E6D3C6;position:relative">Paso ${i+1} de ${TOUR.length}</div><h2 style="position:relative">${t[0]}</h2></div><div class="tb"><p style="margin-top:0;line-height:1.5">${t[1]}</p><div class="row"><div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="btn" style="margin-left:auto" onclick="tour(99)">Saltar</button><button class="btn" onclick="go('${t[2]}');tour(${i+1})">Ir a verlo</button><button class="btn pri" id="tnext" onclick="tour(${i+1})">${i===TOUR.length-1?'Empezar':'Siguiente'}</button></div></div></div></div>`; $('#tnext').focus(); }
$('#tourBtn').onclick=()=>tour(0);

// ================= Algo que se mueve =================
setInterval(()=>{ $('#clk').textContent=hm(ahora()); },10000);
setInterval(()=>{ if(ahora()>=24*60) return; const p=nuevoPed(ahora(),{nuevo:true}); refrescar(); toast(`Entró el pedido #${p.id} por ${p.ch==='pya'?'PedidosYa':p.ch==='web'?'la web':'WhatsApp'}: ${itemsTxt(p)}. ${uy(totalPed(p).tot)}.`,true); },38000);
setInterval(()=>{ const p=PED.filter(x=>x.estado==='plancha'&&edad(x)>14)[0]; if(p&&!$('#layer').innerHTML){ mover(p.id,'listo',true); } },26000);

$('#clk').textContent=hm(ahora());
go('hoy');
let vioTour=false; try{vioTour=!!localStorage.getItem('fk_tour');}catch(e){vioTour=true;}
if(!vioTour) setTimeout(()=>tour(0),700);
</script>
