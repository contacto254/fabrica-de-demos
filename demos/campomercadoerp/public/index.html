function exportarLiquidaciones() {
  const filas = [['Negocio', 'Fecha', 'Productor', 'Importe', 'Comisión venta', 'IVA', 'IMEBA', 'Gastos',
    'Líquido productor', 'Comprador', 'Comisión compra', 'Total comprador', 'e-Factura', 'Estado DGI']];
  vivos().filter(n => n.estado === 'liquidado' || n.estado === 'cerrado').forEach(n => {
    const k = calcNegocio(n);
    filas.push([n.id, fecha(n.fechaBase), cli(n.vendedor).nombre, num(k.importe), num(k.comVenta),
      num(redondear(k.ivaVenta + k.ivaCompra, 2)), num(k.imeba), num(k.gastosV), num(k.liquidoProductor),
      cli(n.comprador).nombre, num(k.comCompra), num(k.totalComprador),
      n.cfe ? n.cfe.serie + ' ' + n.cfe.numero : '', n.cfe ? n.cfe.estado : '']);
  });
  exportarCSV('liquidaciones-campo-mercado', filas);
}

  exportarCSV('cfe-campo-mercado', filas);
}

   Vista: Flujo de fondos
   ========================================================================== */
VISTAS.tesoreria = function () {
  const cob = cobrosPendientes(), pag = pagosPendientes();
  const sumC = redondear(cob.reduce((s, x) => s + x.imp, 0), 2);
  const sumP = redondear(pag.reduce((s, x) => s + x.imp, 0), 2);
  const vencC = cob.filter(x => dias(hoyISO(), x.venc) > 0);
  const vencP = pag.filter(x => dias(hoyISO(), x.venc) > 0);
  const saldoBanco = redondear(ST.banco.reduce((s, m) => s + m.imp, 0), 2);

  /* Proyección por quincena */
  const tramos = [];
  for (let i = 0; i < 6; i++) {
    const d0 = i * 15, d1 = d0 + 14;
    const entra = redondear(cob.filter(x => { const d = dias(x.venc, hoyISO()); return d >= d0 && d <= d1; }).reduce((s, x) => s + x.imp, 0), 2);
    const sale = redondear(pag.filter(x => { const d = dias(x.venc, hoyISO()); return d >= d0 && d <= d1; }).reduce((s, x) => s + x.imp, 0), 2);
    tramos.push({ l: fechaCorta(dia(d0)) + '–' + fechaCorta(dia(d1)), entra, sale, neto: redondear(entra - sale, 2) });
  }
  let acum = 0;
  tramos.forEach(t => { acum = redondear(acum + t.neto, 2); t.acum = acum; });

  const filaVenc = (x, tipo) => {
    const d = dias(x.venc, hoyISO());
    const vencido = d < 0;
    return `<tr class="row" onclick="abrirNegocio('${x.n.id}')">
      <td class="t-strong">${x.n.id}</td>
      <td>${esc(cli(tipo === 'c' ? x.n.comprador : x.n.vendedor).nombre)}</td>
      <td class="mono t-sm">${fecha(x.venc)}</td>
      <td class="num"><span class="tag ${vencido ? 'tag-d' : d <= 7 ? 'tag-w' : 'tag-n'}">${vencido ? 'vencido hace ' + (-d) : 'en ' + d} días</span></td>
      <td class="num t-strong">${num(x.imp)}</td></tr>`;
  };

  return {
    titulo: 'Flujo de fondos',
    sub: 'Cobrás a un plazo y pagás a otro: la diferencia es el dinero que financiás vos',
    acciones: `<button class="btn" onclick="exportarFlujo()">${ic('descarga')}CSV</button>
      <button class="btn btn-pri" onclick="irA('conciliacion')">${ic('conc')}Ir a conciliar</button>`,
    html: `
    <div class="grid g4">
      ${kpi({ lbl: 'A cobrar', icono: 'flecha-ab', val: usd(sumC), foot: cob.length + ' negocios' + (vencC.length ? ' · ' + vencC.length + ' vencidos' : ''), tono: vencC.length ? 'bad' : '' })}
      ${kpi({ lbl: 'A pagar', icono: 'flecha-ar', val: usd(sumP), foot: pag.length + ' negocios' + (vencP.length ? ' · ' + vencP.length + ' vencidos' : '') })}
      ${kpi({ lbl: 'Posición neta', icono: 'plata', val: usd(redondear(sumC - sumP, 2)),
        foot: sumC >= sumP ? 'Vas a favor' : 'Estás financiando la diferencia', tono: sumC >= sumP ? 'good' : 'warn' })}
      ${kpi({ lbl: 'Saldo del banco', icono: 'banco', val: usd(saldoBanco), foot: 'BROU cuenta en dólares' })}
    </div>

    <div class="card mt">
      <div class="card-h"><div>${ic('reporte')} <h3 style="display:inline">Proyección por quincena</h3>
        <div class="sub">Lo que entra y lo que sale según los plazos de cada punta</div></div></div>
      <div class="card-b">
        <div class="tw"><table>
          <thead><tr><th>Quincena</th><th class="num">Entra</th><th class="num">Sale</th>
            <th class="num">Neto</th><th class="num">Acumulado</th><th style="width:38%">Posición</th></tr></thead>
          <tbody>${tramos.map(t => {
            const max = Math.max(1, ...tramos.map(x => Math.abs(x.acum)));
            return `<tr><td class="t-strong">${esc(t.l)}</td>
              <td class="num money-pos">${t.entra ? num(t.entra) : '—'}</td>
              <td class="num money-neg">${t.sale ? num(t.sale) : '—'}</td>
              <td class="num ${t.neto >= 0 ? 'money-pos' : 'money-neg'}">${num(t.neto)}</td>
              <td class="num t-strong">${num(t.acum)}</td>
              <td><div class="prog"><i class="${t.acum < 0 ? 'low' : ''}" style="width:${Math.abs(t.acum) / max * 100}%"></i></div></td></tr>`;
          }).join('')}</tbody></table></div>
      </div>
    </div>

    <div class="grid g2 mt">
      <div class="card">
        <div class="card-h"><div>${ic('flecha-ab')} <h3 style="display:inline">Cobros pendientes</h3>
          <div class="sub">Lo que deben los compradores</div></div></div>
        <div class="card-b flush scroll-y">${cob.length ? `<div class="tw"><table>
          <thead><tr><th>Negocio</th><th>Comprador</th><th>Vence</th><th class="num">Plazo</th><th class="num">Importe</th></tr></thead>
          <tbody>${cob.map(x => filaVenc(x, 'c')).join('')}</tbody>
          <tfoot><tr><td colspan="4">Total</td><td class="num">${num(sumC)}</td></tr></tfoot>
        </table></div>` : vacio('check-c', 'No queda nada por cobrar', 'Todos los compradores están al día.')}</div>
      </div>
      <div class="card">
        <div class="card-h"><div>${ic('flecha-ar')} <h3 style="display:inline">Pagos pendientes</h3>
          <div class="sub">Lo que le debés a los productores</div></div></div>
        <div class="card-b flush scroll-y">${pag.length ? `<div class="tw"><table>
          <thead><tr><th>Negocio</th><th>Productor</th><th>Vence</th><th class="num">Plazo</th><th class="num">Importe</th></tr></thead>
          <tbody>${pag.map(x => filaVenc(x, 'v')).join('')}</tbody>
          <tfoot><tr><td colspan="4">Total</td><td class="num">${num(sumP)}</td></tr></tfoot>
        </table></div>` : vacio('check-c', 'No queda nada por pagar', 'Todos los productores están cobrados.')}</div>
      </div>
    </div>`,
  };
};

function exportarFlujo() {
  const filas = [['Tipo', 'Negocio', 'Contraparte', 'Vence', 'Días', 'Importe USD']];
  cobrosPendientes().forEach(x => filas.push(['Cobro', x.n.id, cli(x.n.comprador).nombre, fecha(x.venc), dias(x.venc, hoyISO()), num(x.imp)]));
  pagosPendientes().forEach(x => filas.push(['Pago', x.n.id, cli(x.n.vendedor).nombre, fecha(x.venc), dias(x.venc, hoyISO()), num(-x.imp)]));
  exportarCSV('flujo-de-fondos-campo-mercado', filas);
}

    <td class="t-strong">${m.id}</td>
    <td class="mono t-sm">${fecha(m.fecha)}</td>

  return {

    acciones: `<button class="btn" onclick="exportarBanco()">${ic('descarga')}CSV</button>

      ${kpi({ lbl: 'Esperado del sistema', icono: 'plata',
        val: usd(redondear(cobrosPendientes().reduce((s, x) => s + x.imp, 0) - pagosPendientes().reduce((s, x) => s + x.imp, 0), 2)),
        foot: 'Cobros menos pagos pendientes' })}

    <div class="panelbox acc mt">${ic('info')}
      <b>Cómo funciona.</b> El sistema ya sabe cuánto espera de cada comprador y cuánto le debe a cada productor.

      contabiliza con un asiento manual.

    <div class="card mt">
      <div class="card-h"><div>${ic('banco')} <h3 style="display:inline">Extracto sin conciliar</h3>

        <tbody>${sin.map(fila).join('')}</tbody></table></div>`

  };
};

/* Candidatos ordenados por cercanía de importe, que es como lo busca una persona. */
function candidatosPara(m) {
  const entra = m.imp >= 0;
  const base = entra
    ? cobrosPendientes().map(x => ({ n: x.n, imp: x.imp, venc: x.venc, tipo: 'cobro', quien: cli(x.n.comprador).nombre }))
    : pagosPendientes().map(x => ({ n: x.n, imp: x.imp, venc: x.venc, tipo: 'pago', quien: cli(x.n.vendedor).nombre }));
  return base.map(c => Object.assign(c, { dif: redondear(Math.abs(m.imp) - c.imp, 2) }))
    .sort((a, b) => Math.abs(a.dif) - Math.abs(b.dif)).slice(0, 8);
}

function conciliar(id) {
  const m = ST.banco.find(x => x.id === id); if (!m) return;
  const cands = candidatosPara(m);
  modal({
    titulo: 'Conciliar el movimiento ' + m.id,
    sub: fecha(m.fecha) + ' &middot; ' + esc(m.det) + ' &middot; <b>' + (m.imp >= 0 ? '' : '−') + usd(Math.abs(m.imp)) + '</b>',
    ancho: 'wide',
    cuerpo: cands.length ? `
      <div class="panelbox" style="margin-bottom:12px">${ic('conc')}
        Ordenados por cercanía de importe. Si la diferencia no es cero te la marca, y podés vincular igual:
        la diferencia queda como gasto bancario.</div>
      <div class="tw"><table>
        <thead><tr><th>Negocio</th><th>${m.imp >= 0 ? 'Comprador' : 'Productor'}</th><th>Vence</th>
          <th class="num">Esperado</th><th class="num">Diferencia</th><th></th></tr></thead>
        <tbody>${cands.map(c => `<tr class="${c.dif === 0 ? '' : ''}">
          <td class="t-strong">${c.n.id}</td>
          <td>${esc(c.quien)}</td>
          <td class="mono t-sm">${fecha(c.venc)}</td>
          <td class="num">${num(c.imp)}</td>
          <td class="num ${c.dif === 0 ? 'money-pos' : 'money-neg'}">${c.dif === 0 ? 'calza exacto' : (c.dif > 0 ? '+' : '−') + num(Math.abs(c.dif))}</td>
          <td class="num"><button class="btn btn-sm ${c.dif === 0 ? 'btn-pri' : ''}" onclick="vincular('${m.id}','${c.n.id}','${c.tipo}')">Vincular</button></td>
        </tr>`).join('')}</tbody></table></div>`
      : `<div class="panelbox warn">${ic('info')} No hay ningún cobro ni pago pendiente que pueda corresponder a este movimiento.
         Contabilizalo con un asiento manual.</div>`,
    pie: `<button class="btn" data-cerrar>Cancelar</button>
      <button class="btn" onclick="cerrarModal();asientoDesdeBanco('${m.id}')">${ic('conta')}Contabilizar con asiento manual</button>`,
  });
}

function vincular(movId, negId, tipo) {
  const m = ST.banco.find(x => x.id === movId), n = neg(negId);
  if (!m || !n) return;
  const k = calcNegocio(n);
  const esperado = tipo === 'cobro' ? k.totalComprador : k.liquidoProductor;
  const dif = redondear(Math.abs(m.imp) - esperado, 2);
  if (tipo === 'cobro') registrarCobro(n, m.fecha); else registrarPago(n, m.fecha);
  m.conciliado = true; m.negocio = n.id;
  if (dif !== 0) {
    ST.asientos.push({
      id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: m.fecha,
      detalle: 'Diferencia de conciliación ' + m.id + ' — negocio ' + n.id, origen: 'banco', negocio: n.id,
      lineas: dif < 0
        ? [{ cuenta: '5.3.01', aux: '', debe: Math.abs(dif), haber: 0 }, { cuenta: '1.1.03', aux: '', debe: 0, haber: Math.abs(dif) }]
        : [{ cuenta: '1.1.03', aux: '', debe: dif, haber: 0 }, { cuenta: '4.2.01', aux: '', debe: 0, haber: dif }],
    });
    ordenarAsientos();
  }
  cerrarTodosModales(); render();
  aviso('Movimiento <b>' + m.id + '</b> conciliado con el negocio <b>' + n.id + '</b>' +
    (dif ? ', la diferencia de ' + usd(Math.abs(dif)) + ' fue a gastos bancarios' : '. El negocio quedó ' +
      (n.estado === 'cerrado' ? 'cerrado' : tipo === 'cobro' ? 'cobrado' : 'pagado')));
}

function desconciliar(id) {
  const m = ST.banco.find(x => x.id === id); if (!m) return;
  if (m.negocio) {
    const n = neg(m.negocio);
    if (n) {
      if (m.imp >= 0) { n.cobrado = false; n.fechaCobro = null; ST.asientos = ST.asientos.filter(a => !(a.negocio === n.id && a.origen === 'cobro')); }
      else { n.pagado = false; n.fechaPago = null; ST.asientos = ST.asientos.filter(a => !(a.negocio === n.id && a.origen === 'pago')); }
      if (n.estado === 'cerrado') n.estado = 'liquidado';
    }
  }
  if (m.asiento) ST.asientos = ST.asientos.filter(a => a.id !== m.asiento);
  m.conciliado = false; m.negocio = null; m.asiento = null;
  render(); aviso('Movimiento <b>' + id + '</b> desconciliado', 'warn');
}

function conciliarAuto() {
  let n = 0;
  ST.banco.filter(m => !m.conciliado).forEach(m => {
    const c = candidatosPara(m)[0];
    if (c && c.dif === 0) { vincularSilencioso(m, c); n++; }
  });
  render();
  aviso(n ? 'Concilié <b>' + n + '</b> movimientos que calzaban exacto' : 'Ninguno calzaba exacto, hay que mirarlos de a uno', n ? '' : 'warn');
}
function vincularSilencioso(m, c) {
  if (c.tipo === 'cobro') registrarCobro(c.n, m.fecha); else registrarPago(c.n, m.fecha);
  m.conciliado = true; m.negocio = c.n.id;
}

function exportarBanco() {
  const filas = [['Movimiento', 'Fecha', 'Banco', 'Detalle', 'Referencia', 'Importe', 'Conciliado', 'Aplicado a']];
  ST.banco.forEach(m => filas.push([m.id, fecha(m.fecha), m.banco, m.det, m.ref, num(m.imp),
    m.conciliado ? 'Sí' : 'No', m.negocio ? 'Negocio ' + m.negocio : m.asiento || '']));
  exportarCSV('extracto-campo-mercado', filas);
}

let CONTA_TAB = 'diario';

function totalAsiento(a) { return redondear(a.lineas.reduce((s, l) => s + (Number(l.debe) || 0), 0), 2); }

function mayorPorCuenta() {
  const m = {};
  ST.asientos.forEach(a => a.lineas.forEach(l => {
    if (!m[l.cuenta]) m[l.cuenta] = { debe: 0, haber: 0, n: 0 };
    m[l.cuenta].debe += Number(l.debe) || 0;
    m[l.cuenta].haber += Number(l.haber) || 0;
    m[l.cuenta].n++;
  }));
  Object.keys(m).forEach(c => {
    m[c].debe = redondear(m[c].debe, 2); m[c].haber = redondear(m[c].haber, 2);
    m[c].saldo = redondear(m[c].debe - m[c].haber, 2);
  });
  return m;
}

          ? `<button class="btn btn-sm" onclick="event.stopPropagation();editarAsiento('${a.id}')">${ic('lapiz')}</button>
             <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();borrarAsiento('${a.id}')">${ic('basura')}</button>`

      <tfoot><tr><td colspan="4">${as.length} asientos</td>

    <tbody>${ST.plan.filter(p => p.t !== 'titulo' && may[p.c]).map(p => `

        <td class="num t-strong ${may[p.c].saldo < 0 ? 'money-neg' : ''}">${num(may[p.c].saldo)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Sumas iguales</td><td class="num">${num(debe)}</td><td class="num">${num(haber)}</td>
      <td class="num">${num(redondear(debe - haber, 2))}</td></tr></tfoot>
  </table></div>`;

  const bloque = (titulo, tipos) => {
    const filas = ST.plan.filter(p => tipos.indexOf(p.t) >= 0 && may[p.c]);
    const tot = redondear(filas.reduce((s, p) => s + Math.abs(may[p.c].saldo), 0), 2);
    return `<div class="panelbox" style="margin-bottom:12px">
      <div class="sec-t" style="margin-top:0">${esc(titulo)}</div>

      <hr class="sep" style="margin:8px 0">

      <div>${bloque('Pasivo y patrimonio', ['pasivo', 'patrimonio'])}</div>

  return {

    sub: ST.asientos.length + ' asientos &middot; sumas ' + usd(debe) + ' &middot; ' +

        ${[['diario', 'Libro diario'], ['mayor', 'Mayor'], ['balance', 'Balance']].map(([k, l]) =>
          `<button class="${CONTA_TAB === k ? 'on' : ''}" onclick="CONTA_TAB='${k}';render()">${l}</button>`).join('')}
      </div>
      <button class="btn" onclick="exportarDiario()">${ic('descarga')}CSV</button>
      <button class="btn" onclick="irA('plan')">${ic('plan')}Plan de cuentas</button>
      <button class="btn btn-pri" onclick="nuevoAsiento()">${ic('mas')}Nuevo asiento</button>`,
    html: `
    <div class="grid g4">

        tono: redondear(debe - haber, 2) === 0 ? 'good' : 'bad' })}
    </div>

        CONTA_TAB === 'diario' ? vistaDiario() : CONTA_TAB === 'mayor' ? vistaMayor() : vistaBalance()}</div>

};

function verAsiento(id) {
  const a = ST.asientos.find(x => x.id === id); if (!a) return;
  const d = redondear(a.lineas.reduce((s, l) => s + (Number(l.debe) || 0), 0), 2);
  const h = redondear(a.lineas.reduce((s, l) => s + (Number(l.haber) || 0), 0), 2);
  modal({
    titulo: 'Asiento ' + a.id,
    sub: fecha(a.fecha) + ' &middot; ' + esc(a.detalle),
    ancho: 'wide',
    cuerpo: `<div class="tw"><table>
      <thead><tr><th>Cuenta</th><th>Denominación</th><th>Auxiliar</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead>
      <tbody>${a.lineas.map(l => `<tr>
        <td class="mono t-strong">${esc(l.cuenta)}</td><td>${esc(cuenta(l.cuenta).n)}</td>
        <td class="t-sm t-dim">${esc(l.aux || '—')}</td>

    pie: `${a.origen === 'manual' || a.origen === 'banco'
      ? `<div class="left"><button class="btn btn-sm" onclick="editarAsiento('${a.id}')">${ic('lapiz')}Editar</button>
         <button class="btn btn-sm btn-danger" onclick="borrarAsiento('${a.id}')">${ic('basura')}Eliminar</button></div>` : ''}
      <button class="btn" data-cerrar>Cerrar</button>`,
  });
}

function verMayor(c) {
  const p = cuenta(c);
  const movs = [];
  ST.asientos.forEach(a => a.lineas.forEach(l => { if (l.cuenta === c) movs.push({ a, l }); }));
  let saldo = 0;
  modal({
    titulo: p.c + ' — ' + p.n,
    sub: movs.length + ' movimientos',
    ancho: 'wide',
    cuerpo: movs.length ? `<div class="tw"><table>
      <thead><tr><th>Asiento</th><th>Fecha</th><th>Detalle</th><th>Auxiliar</th>
        <th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead>
      <tbody>${movs.map(m => {
        saldo = redondear(saldo + (Number(m.l.debe) || 0) - (Number(m.l.haber) || 0), 2);
        return `<tr class="row" onclick="cerrarModal();verAsiento('${m.a.id}')">
          <td class="t-strong">${m.a.id}</td><td class="mono t-sm">${fecha(m.a.fecha)}</td>
          <td class="t-sm">${esc(m.a.detalle)}</td><td class="t-sm t-dim">${esc(m.l.aux || '—')}</td>
          <td class="num">${m.l.debe ? num(m.l.debe) : ''}</td><td class="num">${m.l.haber ? num(m.l.haber) : ''}</td>
          <td class="num t-strong">${num(saldo)}</td></tr>`;
      }).join('')}</tbody></table></div>`
      : vacio('conta', 'La cuenta no tiene movimientos', 'Todavía no se imputó nada acá.'),
  });
}

/* ---------- Asientos manuales ---------- */
let AS_LINEAS = [];

function nuevoAsiento(pre) {
  AS_LINEAS = (pre && pre.lineas) || [{ cuenta: '', aux: '', debe: '', haber: '' }, { cuenta: '', aux: '', debe: '', haber: '' }];
  formAsiento(null, pre);
}
function editarAsiento(id) {
  const a = ST.asientos.find(x => x.id === id); if (!a) return;
  AS_LINEAS = a.lineas.map(l => Object.assign({}, l));
  cerrarTodosModales();
  setTimeout(() => formAsiento(a), 120);
}
function borrarAsiento(id) {
  preguntar({
    titulo: 'Eliminar el asiento ' + id, tono: 'bad', peligro: true, aceptar: 'Eliminar',
    cuerpo: 'Se borra del libro diario. Si estaba vinculado a un movimiento del banco, ese movimiento vuelve a quedar sin conciliar.',
    ok: () => {
      ST.asientos = ST.asientos.filter(a => a.id !== id);
      ST.banco.forEach(m => { if (m.asiento === id) { m.asiento = null; m.conciliado = false; } });
      cerrarTodosModales(); render(); aviso('Asiento <b>' + id + '</b> eliminado', 'warn');
    },
  });
}

function formAsiento(a, pre) {
  modal({
    titulo: a ? 'Editar el asiento ' + a.id : 'Nuevo asiento manual',
    sub: 'Si el debe y el haber no dan igual, no lo guarda',

      <div class="fgrid fg2">

function agregarLineaAsiento() { AS_LINEAS.push({ cuenta: '', aux: '', debe: '', haber: '' }); pintarLineasAsiento(window.AS_OV); }
function borrarLineaAsiento(i) {
  if (AS_LINEAS.length <= 2) return aviso('Un asiento necesita al menos dos líneas', 'warn');

}

function leerLineasAsiento(ov) {
  AS_LINEAS.forEach((l, i) => {
    const g = s => { const e = $('#as' + s + i, ov); return e ? e.value : ''; };
    l.cuenta = g('Cta'); l.aux = g('Aux');

function pintarLineasAsiento(ov) {

        ${imputables.map(p => `<option value="${esc(p.c)}"${p.c === l.cuenta ? ' selected' : ''}>${esc(p.c)} — ${esc(p.n)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Auxiliar</label><input id="asAux${i}" value="${esc(l.aux || '')}" placeholder="opcional"></div>
      <div class="field"><label>Debe</label><input class="num" id="asDebe${i}" value="${l.debe || ''}"></div>
      <div class="field" style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end">
        <div><label style="display:block;font-size:11.6px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.045em;margin-bottom:4px">Haber</label>
          <input class="num" id="asHaber${i}" value="${l.haber || ''}"></div>
        <button class="iconbtn" onclick="borrarLineaAsiento(${i})" aria-label="Quitar línea">${ic('basura')}</button>
      </div>
    </div>`).join('');
  $$('#asLineas input,#asLineas select', ov).forEach(e => { e.oninput = () => totalesAsiento(ov); e.onchange = () => totalesAsiento(ov); });
  totalesAsiento(ov);
}

function totalesAsiento(ov) {
  leerLineasAsiento(ov);
  const d = redondear(AS_LINEAS.reduce((s, l) => s + (Number(l.debe) || 0), 0), 2);
  const h = redondear(AS_LINEAS.reduce((s, l) => s + (Number(l.haber) || 0), 0), 2);
  const dif = redondear(d - h, 2);
  $('#asTot', ov).className = 'panelbox ' + (dif === 0 && d > 0 ? 'brand' : 'warn');
  $('#asTot', ov).innerHTML = `<div class="dl" style="grid-template-columns:auto 1fr auto 1fr">
    <dt>Debe</dt><dd>${num(d)}</dd><dt>Haber</dt><dd>${num(h)}</dd>
    <dt>Diferencia</dt><dd>${dif === 0 ? (d > 0 ? 'cierra' : 'cargá los importes') : num(dif)}</dd></div>`;
}

function guardarAsiento(ov, a) {
  leerLineasAsiento(ov);
  const lineas = AS_LINEAS.filter(l => l.cuenta && ((Number(l.debe) || 0) || (Number(l.haber) || 0)));
  if (lineas.length < 2) return aviso('Falta cargar al menos dos líneas con cuenta e importe', 'warn');
  const d = redondear(lineas.reduce((s, l) => s + (Number(l.debe) || 0), 0), 2);
  const h = redondear(lineas.reduce((s, l) => s + (Number(l.haber) || 0), 0), 2);
  if (redondear(d - h, 2) !== 0) return aviso('No cierra: hay una diferencia de <b>' + usd(Math.abs(redondear(d - h, 2))) + '</b>', 'warn');
  const det = $('#asDet', ov).value.trim();
  if (!det) return aviso('Falta el detalle del asiento', 'warn');
  const f = $('#asFecha', ov).value || hoyISO();
  if (a) {
    a.fecha = f; a.detalle = det; a.lineas = lineas.map(l => ({ cuenta: l.cuenta, aux: l.aux, debe: Number(l.debe) || 0, haber: Number(l.haber) || 0 }));
    ordenarAsientos(); cerrarModal(); render(); aviso('Asiento <b>' + a.id + '</b> actualizado');
  } else {
    const nuevo = {
      id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: f, detalle: det,
      origen: window.AS_BANCO ? 'banco' : 'manual', negocio: null,
      lineas: lineas.map(l => ({ cuenta: l.cuenta, aux: l.aux, debe: Number(l.debe) || 0, haber: Number(l.haber) || 0 })),
    };
    ST.asientos.push(nuevo); ordenarAsientos();
    if (window.AS_BANCO) {
      const m = ST.banco.find(x => x.id === window.AS_BANCO);
      if (m) { m.conciliado = true; m.asiento = nuevo.id; }
      window.AS_BANCO = null;
    }
    cerrarModal(); render();
    aviso('Asiento <b>' + nuevo.id + '</b> guardado por ' + usd(d));
  }
}

/* El movimiento que no corresponde a ningún negocio se contabiliza a mano,
   con la línea del banco ya puesta. */
function asientoDesdeBanco(id) {
  const m = ST.banco.find(x => x.id === id); if (!m) return;
  window.AS_BANCO = m.id;
  cerrarTodosModales();
  const entra = m.imp >= 0;
  setTimeout(() => nuevoAsiento({
    fecha: m.fecha, detalle: m.det + ' (mov. ' + m.id + ')',
    lineas: [
      { cuenta: '1.1.03', aux: 'BROU USD', debe: entra ? Math.abs(m.imp) : 0, haber: entra ? 0 : Math.abs(m.imp) },
      { cuenta: entra ? '4.2.01' : '5.3.01', aux: '', debe: entra ? 0 : Math.abs(m.imp), haber: entra ? Math.abs(m.imp) : 0 },
    ],
  }), 120);
}

function exportarDiario() {
  const filas = [['Asiento', 'Fecha', 'Detalle', 'Origen', 'Negocio', 'Cuenta', 'Denominación', 'Auxiliar', 'Debe', 'Haber']];
  ST.asientos.forEach(a => a.lineas.forEach(l => filas.push([a.id, fecha(a.fecha), a.detalle, a.origen, a.negocio || '',
    l.cuenta, cuenta(l.cuenta).n, l.aux || '', l.debe ? num(l.debe) : '', l.haber ? num(l.haber) : ''])));
  exportarCSV('libro-diario-campo-mercado', filas);
}

    titulo: 'Eliminar la cuenta ' + p.c, tono: 'bad', peligro: true, aceptar: 'Eliminar',
    cuerpo: 'Se saca del plan de cuentas. No tiene movimientos, así que no afecta al libro diario.',

VISTAS.informes = function () {

  }));
  const porCat = {};
  ns.forEach(n => { const k = calcNegocio(n); n.lineas.forEach((l, i) => {
    const c = l.cat; if (!porCat[c]) porCat[c] = { cab: 0, kg: 0, imp: 0, n: 0 };
    porCat[c].cab += k.lineas[i].cab; porCat[c].kg += k.lineas[i].neto;
    porCat[c].imp += k.lineas[i].importe; porCat[c].n++;
  }); });
  const cats = Object.keys(porCat).map(c => Object.assign({ c }, porCat[c])).sort((a, b) => b.imp - a.imp);
  const porDpto = {};
  ns.forEach(n => { const d = cli(n.vendedor).paraje; const k = calcNegocio(n);
    if (!porDpto[d]) porDpto[d] = { imp: 0, cab: 0, n: 0 };
    porDpto[d].imp += k.importe; porDpto[d].cab += k.cabezas; porDpto[d].n++; });
  const dptos = Object.keys(porDpto).map(d => Object.assign({ d }, porDpto[d])).sort((a, b) => b.imp - a.imp).slice(0, 10);
  const frig = ns.filter(n => n.tipo === 'frigorifico'), repo = ns.filter(n => n.tipo === 'reposicion');
  const tf = totalesDeNegocios(frig), tr = totalesDeNegocios(repo);
  const rendProm = frig.filter(n => !calcNegocio(n).estimado);
  const rp = rendProm.length ? redondear(rendProm.reduce((s, n) => s + calcNegocio(n).rend, 0) / rendProm.length, 3) : 0;

  return {
    titulo: 'Informes',
    sub: 'Todo sale de los mismos negocios: si tocás uno, se mueve acá también',
    acciones: `<button class="btn" onclick="exportarNegocios()">${ic('descarga')}Bajar los negocios</button>`,

function guardarConfig() {
  const g = (id, def) => { const e = $('#' + id); return e ? (Number(e.value) || def) : def; };
  const t = (id, def) => { const e = $('#' + id); return e ? (e.value.trim() || def) : def; };
  CFG.empresa = t('cfEmpresa', CFG.empresa); CFG.rut = t('cfRut', CFG.rut);
  CFG.direccion = t('cfDir', CFG.direccion); CFG.telefono = t('cfTel', CFG.telefono); CFG.mail = t('cfMail', CFG.mail);
  CFG.cotizacion = g('cfCotiz', CFG.cotizacion); CFG.iva = g('cfIva', CFG.iva); CFG.imeba = g('cfImeba', CFG.imeba);
  CFG.comVentaFrig = g('cfCvF', CFG.comVentaFrig); CFG.comCompraFrig = g('cfCcF', CFG.comCompraFrig);
  CFG.comVentaRepo = g('cfCvR', CFG.comVentaRepo); CFG.comCompraRepo = g('cfCcR', CFG.comCompraRepo);
  CFG.comRemate = g('cfRemate', CFG.comRemate);
  CFG.plazoCobro = g('cfPCob', CFG.plazoCobro); CFG.plazoPago = g('cfPPag', CFG.plazoPago); CFG.plazoGastos = g('cfPGas', CFG.plazoGastos);
  CFG.metaAgente = g('cfMeta', CFG.metaAgente); CFG.comAgente = g('cfComAg', CFG.comAgente);

  /* Las comisiones nuevas se aplican a los negocios que todavía no se liquidaron. */
  let tocados = 0;
  ST.negocios.forEach(n => {
    if (n.estado === 'liquidado' || n.estado === 'cerrado') return;
    n.comVenta = n.tipo === 'frigorifico' ? CFG.comVentaFrig : CFG.comVentaRepo;
    n.comCompra = n.tipo === 'frigorifico' ? CFG.comCompraFrig : CFG.comCompraRepo;
    n.cotizacion = CFG.cotizacion;
    tocados++;
  });
  ST.negocios.forEach(n => recalcularFechas(n));
  $('.brand-txt strong').textContent = CFG.empresa.replace(/ S\.?A\.?S\.?$/i, '');
  render();
  aviso('Listo: recalculé el sistema con los valores nuevos' + (tocados ? ' y ajusté ' + tocados + ' negocios abiertos' : ''));
}

function buscarTodo(q) {
  const s = sinAcento(q);
  const r = [];
  const cabe = txt => !s || sinAcento(txt).indexOf(s) >= 0;
  accionesPaleta().forEach(a => { if (cabe(a.t + ' ' + a.m)) r.push(a); });
  if (s) {
    vivos().forEach(n => {
      const k = calcNegocio(n);
      if (cabe(n.id + ' ' + n.tropa + ' ' + cli(n.vendedor).nombre + ' ' + cli(n.comprador).nombre + ' ' + n.lineas.map(l => l.cat).join(' ')))
        r.push({ g: 'Negocios', t: 'Negocio ' + n.id + ' — ' + cli(n.vendedor).nombre, i: 'negocio',
          m: usd(k.importe) + ' · ' + ESTADOS[n.estado].t, go: () => abrirNegocio(n.id) });
    });
    ST.clientes.forEach(c => {
      if (cabe(c.nombre + ' ' + c.rut + ' ' + c.paraje + ' ' + c.dicose + ' ' + c.cod))
        r.push({ g: 'Cuentas', t: c.nombre, i: 'gente', m: TIPOS_CLI[c.tipo] + ' · ' + c.paraje, go: () => abrirCliente(c.id) });
    });
    ST.lotes.forEach(l => {
      if (cabe(l.id + ' ' + l.cat + ' ' + l.dpto + ' ' + cli(l.productor).nombre))
        r.push({ g: 'Lotes', t: l.id + ' — ' + l.cat, i: 'lote', m: l.cab + ' cab. · ' + l.dpto, go: () => abrirLote(l.id) });
    });
    ST.agentes.forEach(a => {
      if (cabe(a.nombre + ' ' + a.zona))
        r.push({ g: 'Agentes', t: a.nombre, i: 'agente', m: a.zona, go: () => abrirAgente(a.id) });
    });
    ST.plan.forEach(p => {
      if (p.t !== 'titulo' && cabe(p.c + ' ' + p.n))
        r.push({ g: 'Plan de cuentas', t: p.c + ' — ' + p.n, i: 'plan', m: p.t, go: () => verMayor(p.c) });
    });
    ST.asientos.slice().reverse().forEach(a => {
      if (cabe(a.id + ' ' + a.detalle))
        r.push({ g: 'Asientos', t: a.id + ' — ' + a.detalle, i: 'conta', m: fecha(a.fecha), go: () => verAsiento(a.id) });
    });
  }
  return r.slice(0, 40);
}

function abrirPaleta() {
  PAL_IDX = 0;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.style.alignItems = 'flex-start';
  ov.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Buscar">
    <div class="pal-in">${ic('buscar', 'ic-lg')}<input id="palQ" placeholder="Buscar negocio, cuenta, lote, cuenta contable… o escribí una acción" autocomplete="off"></div>
    <div class="pal-res" id="palRes"></div>
    <div class="pal-f"><span><kbd>${ic('flecha-ar')}</kbd><kbd>${ic('flecha-ab')}</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
  </div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) cerrarPaleta(); });
  $('#modalRoot').appendChild(ov);
  ov.id = 'paleta';
  const inp = $('#palQ', ov);
  const pintar = () => {
    PAL_RES = buscarTodo(inp.value);
    if (PAL_IDX >= PAL_RES.length) PAL_IDX = Math.max(0, PAL_RES.length - 1);
    let g = '';
    $('#palRes', ov).innerHTML = PAL_RES.length ? PAL_RES.map((r, i) => {
      const h = r.g !== g ? `<div class="pal-g">${esc(r.g)}</div>` : '';
      g = r.g;
      return h + `<div class="pal-i${i === PAL_IDX ? ' on' : ''}" data-i="${i}">${ic(r.i)}<b>${esc(r.t)}</b><span class="m">${esc(r.m || '')}</span></div>`;
    }).join('') : `<div class="pal-i t-dim">No encontré nada con «${esc(inp.value)}»</div>`;
    $$('.pal-i[data-i]', ov).forEach(d => d.onmousedown = e => {
      e.preventDefault(); ejecutarPaleta(Number(d.getAttribute('data-i')));
    });
    const on = $('.pal-i.on', ov);
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };
  inp.oninput = () => { PAL_IDX = 0; pintar(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); PAL_IDX = Math.min(PAL_IDX + 1, PAL_RES.length - 1); pintar(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); PAL_IDX = Math.max(PAL_IDX - 1, 0); pintar(); }
    else if (e.key === 'Enter') { e.preventDefault(); ejecutarPaleta(PAL_IDX); }
    else if (e.key === 'Escape') { e.preventDefault(); cerrarPaleta(); }
  };
  pintar();
  setTimeout(() => inp.focus(), 40);
}
function cerrarPaleta() { const p = $('#paleta'); if (p) p.remove(); }
function ejecutarPaleta(i) {
  const r = PAL_RES[i]; if (!r) return;
  cerrarPaleta();
  setTimeout(() => r.go(), 60);
}

let RELOJ = null;
function arrancarReloj() {
  if (RELOJ) clearInterval(RELOJ);
  RELOJ = setInterval(() => {
    if (MODALES.length || $('#paleta')) return;
    const posibles = [];
    const libres = ST.lotes.filter(l => l.estado === 'publicado' || l.estado === 'ofertas');
    if (libres.length) posibles.push(() => {
      const l = libres[Math.floor(Math.random() * libres.length)];
      const gordo = (CATEGORIAS.find(x => x.n === l.cat) || {}).gordo;
      const cands = ST.clientes.filter(c => gordo ? c.tipo === 'frigorifico' : c.tipo === 'invernador');
      const c = cands[Math.floor(Math.random() * cands.length)] || ST.clientes[0];
      const pr = redondear(l.pedido * (0.95 + Math.random() * 0.07), 2);
      l.ofertas.push({ id: l.id + '-O' + (l.ofertas.length + 1), comprador: c.id, pr, fecha: hoyISO(), ganadora: false });
      l.estado = 'ofertas';
      ST.avisos.unshift({ f: hoyISO(), i: 'plata', t: 'Oferta nueva en ' + l.id + ' — ' + usd(pr) + '/kg', s: c.nombre, ir: () => abrirLote(l.id) });
      aviso('Entró una oferta en el lote <b>' + l.id + '</b>: ' + esc(c.nombre) + ' ofrece ' + usd(pr) + ' el kilo');
    });
    const embarcados = vivos().filter(n => n.estado === 'embarcado' && n.tipo === 'frigorifico');
    if (embarcados.length) posibles.push(() => {
      const n = embarcados[0];
      ST.avisos.unshift({ f: hoyISO(), i: 'balanza', t: 'El frigorífico cargó la faena de la tropa ' + n.tropa,
        s: cli(n.comprador).nombre + ' — falta confirmarla en el negocio ' + n.id, ir: () => abrirNegocio(n.id) });
      aviso('<b>' + esc(cli(n.comprador).nombre) + '</b> subió la segunda balanza de la tropa ' + esc(n.tropa) +
        ', el negocio ' + n.id + ' está listo para faenar', 'warn');
    });
    const pendientes = vivos().filter(n => n.cfe && n.cfe.estado === 'Pendiente');
    if (pendientes.length) posibles.push(() => {
      const n = pendientes[0];
      n.cfe.estado = 'Aceptado'; n.cfe.motivo = '';
      ST.avisos.unshift({ f: hoyISO(), i: 'cfe', t: 'DGI aceptó la e-Factura A' + n.cfe.numero,
        s: 'Negocio ' + n.id + ', ' + cli(n.comprador).nombre, ir: () => abrirNegocio(n.id) });
      aviso('DGI aceptó la e-Factura <b>A' + n.cfe.numero + '</b> del negocio ' + n.id);
    });
    if (!posibles.length) return;
    posibles[Math.floor(Math.random() * posibles.length)]();
    render();
  }, 38000);
}

/* ==========================================================================
   Reiniciar y arranque
   ========================================================================== */
function reiniciarDemo() {
  preguntar({
    titulo: 'Reiniciar la demostración', tono: 'warn', aceptar: 'Reiniciar',
    cuerpo: 'Vuelve todo al estado inicial: los negocios, las cuentas, los asientos, el banco y la configuración. ' +
      'Conviene hacerlo antes de cada reunión.',
    ok: () => {
      construirEstado();
      $('.brand-txt strong').textContent = 'Campo Mercado';
      VISTA = 'inicio'; FILTROS = {}; NEG_MODO = 'lista'; CONTA_TAB = 'diario';
      NEG_ORD = { campo: 'fecha', desc: true };
      cerrarTodosModales(); render();
      aviso('Listo, la demostración volvió a cero');
    },
  });
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (!$('#paleta')) abrirPaleta(); return; }
  if (e.key === 'Escape') {
    if ($('#paleta')) return cerrarPaleta();
    if (MODALES.length) return cerrarModal();
    if ($('#nav').classList.contains('open')) return cerrarNav();
  }
  if (e.key === '/' && !/input|textarea|select/i.test((e.target.tagName || '')) && !MODALES.length) {
    e.preventDefault(); abrirPaleta();
  }
});

construirEstado();
render();
arrancarReloj();
setTimeout(() => { if (!MODALES.length) abrirTour(0); }, 1400);
</script>
