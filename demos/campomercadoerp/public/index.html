<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo Mercado SAS — Sistema de gestión</title>
<meta name="description" content="Sistema de gestión para escritorio rural: negocios, liquidaciones, comisiones, tesorería, conciliación y contabilidad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F4; --panel:#FFFFFF; --panel-2:#FBFCFB;
  --ink:#14241C; --ink-2:#4B5F54; --ink-3:#7C8F84;
  --line:#DCE6DE; --line-2:#EDF2EE;
  --brand:#1F7A4D; --brand-deep:#125438; --brand-soft:#E4F1E9; --brand-ink:#0F4530;
  --accent:#B5761F; --accent-soft:#FBF0DD; --accent-ink:#7A4E10;
  --warn:#C98A06; --warn-soft:#FDF2D8;
  --bad:#B93F37; --bad-soft:#FBE7E5;
  --info:#2C6E8F; --info-soft:#E2F0F6;
  --r:10px; --r-lg:16px; --r-sm:7px;
  --sh:0 1px 2px rgba(16,40,28,.05);
  --sh-lg:0 12px 34px rgba(16,40,28,.16);
  --nav-w:242px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.011em}
p{margin:0}
a{color:var(--brand-deep)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-lg{width:1.5em;height:1.5em}
.ic-xl{width:2.1em;height:2.1em;stroke-width:1.5}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:none;background:var(--brand-deep);color:#D9EADF;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.nav::-webkit-scrollbar{width:7px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.nav-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-mark{width:34px;height:34px;flex:none}
.brand-txt strong{display:block;color:#fff;font-size:14.5px;line-height:1.15;letter-spacing:-.01em}
.brand-txt span{display:block;font-size:11px;color:rgba(217,234,223,.72);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.nav-group{padding:12px 10px 2px}
.nav-group h5{margin:0 0 5px 8px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(217,234,223,.5);font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;margin-bottom:1px;
  background:none;border:0;border-radius:var(--r-sm);color:#D9EADF;cursor:pointer;
  text-align:left;font-size:13.4px;font-weight:500;transition:background .13s,color .13s;
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.on{background:var(--brand);color:#fff;font-weight:600}
.nav-item .pill{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:10.5px;
  font-weight:700;padding:1px 6px;border-radius:999px;min-width:19px;text-align:center}
.nav-item.on .pill{background:rgba(255,255,255,.26)}
.nav-item .pill.hot{background:var(--accent);color:#fff}
.nav-foot{margin-top:auto;padding:12px 10px 14px;border-top:1px solid rgba(255,255,255,.1)}
.nav-user{display:flex;align-items:center;gap:9px;padding:6px 8px 10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;letter-spacing:.02em}
.nav-user div{min-width:0}
.nav-user strong{display:block;color:#fff;font-size:12.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-user span{display:block;font-size:11px;color:rgba(217,234,223,.6)}
.nav-foot .nav-item{font-size:12.6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:rgba(244,247,244,.93);backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.top h1{font-size:18.5px}
.top .sub{font-size:12.4px;color:var(--ink-3);margin-top:1px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.searchbtn{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 10px;color:var(--ink-3);cursor:pointer;font-size:13px;min-width:210px;
  transition:border-color .13s,box-shadow .13s;
}
.searchbtn:hover{border-color:var(--brand);box-shadow:var(--sh)}
.searchbtn kbd{margin-left:auto;background:var(--line-2);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font:600 10.5px Inter,sans-serif;color:var(--ink-2)}
.view{padding:18px 20px 60px;flex:1}

/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:var(--r);padding:7.5px 13px;font-size:13.2px;font-weight:600;
  cursor:pointer;transition:background .13s,border-color .13s,transform .08s,box-shadow .13s;white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn-acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-acc:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft)}
.btn-danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn-sm{padding:4.5px 9px;font-size:12.3px;border-radius:var(--r-sm)}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover{background:var(--line-2);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--panel);border-color:var(--line)}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r-sm);
  border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-2);transition:background .13s}
.iconbtn:hover{background:var(--line-2);color:var(--ink)}

/* ---------- Tarjetas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:14.6px}
.card-h .sub{font-size:12.2px;color:var(--ink-3)}
.card-h .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px 17px}
.card-b.flush{padding:0}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.62fr)}
.mt{margin-top:15px}

/* ---------- KPIs ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--sh);
  position:relative;overflow:hidden}
.kpi .lbl{font-size:11.4px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-3);font-weight:700;
  display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.028em;margin-top:6px;line-height:1.05}
.kpi .val small{font-size:14px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.kpi .foot{font-size:12.2px;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .foot.good{color:var(--brand)} .kpi .foot.bad{color:var(--bad)} .kpi .foot.warn{color:var(--warn)}
.kpi.clickable{cursor:pointer;transition:border-color .13s,box-shadow .13s}
.kpi.clickable:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(31,122,77,.13)}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.1px}
th{
  text-align:left;font-size:11.1px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-3);
  font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2);
  position:sticky;top:0;z-index:2;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--brand)}
td{padding:9.5px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer;transition:background .1s}
tbody tr.row:hover{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.t-strong{font-weight:700}
.t-dim{color:var(--ink-3)}
.t-sm{font-size:12.1px}
.t-xs{font-size:11.4px}
tfoot td{background:var(--panel-2);font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.cell2{display:flex;flex-direction:column;gap:1px}
.cell2 span{font-size:11.6px;color:var(--ink-3)}

/* ---------- Píldoras ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.7px;
  font-weight:700;white-space:nowrap;line-height:1.5}
.tag-n{background:var(--line-2);color:var(--ink-2)}
.tag-b{background:var(--brand-soft);color:var(--brand-ink)}
.tag-a{background:var(--accent-soft);color:var(--accent-ink)}
.tag-w{background:var(--warn-soft);color:#8A5E00}
.tag-d{background:var(--bad-soft);color:#8E2F28}
.tag-i{background:var(--info-soft);color:#1B4E66}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;position:relative}
.field label{font-size:11.6px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.045em}
.field .hint{font-size:11.6px;color:var(--ink-3);font-weight:400;text-transform:none;letter-spacing:0}
input,select,textarea{
  font:inherit;font-size:13.4px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);color:var(--ink);width:100%;transition:border-color .13s,box-shadow .13s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[readonly]{background:var(--line-2);color:var(--ink-2)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
select{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8F84' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:15px;padding-right:28px}
textarea{resize:vertical;min-height:62px}
.fgrid{display:grid;gap:0 13px}
.fg2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.check{display:flex;align-items:center;gap:8px;font-size:13.2px;cursor:pointer;padding:6px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;flex:none}
.ac-list{position:absolute;top:100%;left:0;right:0;z-index:60;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);box-shadow:var(--sh-lg);max-height:210px;overflow-y:auto;margin-top:2px}
.ac-list div{padding:7px 10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px}
.ac-list div:hover,.ac-list div.on{background:var(--brand-soft)}
.ac-list div .t-xs{margin-left:auto}
.ac-new{color:var(--brand);font-weight:600}

/* ---------- Modales ---------- */
.ov{position:fixed;inset:0;background:rgba(14,36,25,.45);backdrop-filter:blur(2px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:560px;
  animation:pop .15s ease-out}
.modal.wide{max-width:960px}
.modal.xwide{max-width:1140px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:16px}
.modal-h .sub{font-size:12.4px;color:var(--ink-3);margin-top:2px}
.modal-h .iconbtn{margin-left:auto;flex:none}
.modal-b{padding:17px 18px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line-2);
  background:var(--panel-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.modal-f .left{margin-right:auto}

/* ---------- Avisos ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 28px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#EAF3ED;padding:10px 15px;
  border-radius:var(--r);box-shadow:var(--sh-lg);font-size:13.2px;font-weight:500;animation:up .2s ease-out;
  pointer-events:auto;max-width:100%}
.toast .ic{color:#7FD3A4}
.toast.warn .ic{color:#F2C55C} .toast.bad .ic{color:#F09A93}
.toast b{font-weight:700;color:#fff}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Estado vacío ---------- */
.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:42px 20px;text-align:center}
.empty .ic-xl{color:var(--ink-3)}
.empty h4{font-size:14.5px}
.empty p{font-size:12.9px;color:var(--ink-3);max-width:390px}

/* ---------- Barras y gráficos ---------- */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar{width:100%;background:var(--brand);border-radius:5px 5px 0 0;min-height:3px;position:relative;
  transition:opacity .13s;cursor:default}
.bar:hover{opacity:.82}
.bar.b2{background:var(--accent)}
.bar-w .cap{font-size:10.9px;color:var(--ink-3);white-space:nowrap;font-weight:600}
.bar-w .vv{font-size:10.9px;font-weight:700;color:var(--ink-2)}
.prog{height:7px;background:var(--line-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .35s}
.prog i.over{background:var(--accent)}
.prog i.low{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.8px;color:var(--ink-2);margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

/* ---------- Listas de definición ---------- */
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.1px;align-items:baseline}
.dl dt{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.045em;font-weight:700;white-space:nowrap}
.dl dd{margin:0;font-weight:600}
.panelbox{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px}
.panelbox.brand{background:var(--brand-soft);border-color:#C6E3D2}
.panelbox.acc{background:var(--accent-soft);border-color:#EED9B4}
.panelbox.warn{background:var(--warn-soft);border-color:#F0DCA8}
.panelbox.bad{background:var(--bad-soft);border-color:#F2CAC6}
.sec-t{font-size:11.4px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;
  margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.sec-t:first-child{margin-top:0}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line-2)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:15px 0}

/* ---------- Tabs / filtros ---------- */
.tabs{display:flex;gap:3px;background:var(--line-2);padding:3px;border-radius:var(--r);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:5.5px 11px;border-radius:var(--r-sm);font-size:12.7px;
  font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .13s}
.tabs button:hover{background:rgba(255,255,255,.65)}
.tabs button.on{background:var(--panel);color:var(--brand-deep);box-shadow:var(--sh)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.4px;
  font-weight:600;cursor:pointer;color:var(--ink-2);transition:all .13s}
.chip:hover{border-color:var(--brand);color:var(--brand-deep)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- Kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(5,minmax(178px,1fr));gap:11px;overflow-x:auto;padding-bottom:6px}
.kb-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:9px;min-height:240px;
  transition:background .13s,border-color .13s}
.kb-col.over{background:var(--brand-soft);border-color:var(--brand);border-style:dashed}
.kb-col h5{font-size:11.4px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;padding:0 2px}
.kb-col h5 b{margin-left:auto;background:var(--line-2);border-radius:999px;padding:0 6px;font-size:11px;color:var(--ink-2)}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;
  margin-bottom:7px;cursor:grab;box-shadow:var(--sh);transition:box-shadow .13s,transform .1s}
.kb-card:hover{box-shadow:0 4px 12px rgba(16,40,28,.11)}
.kb-card:active{cursor:grabbing}
.kb-card.drag{opacity:.4}
.kb-card .t{font-weight:700;font-size:12.7px;display:flex;align-items:center;gap:6px}
.kb-card .m{font-size:11.6px;color:var(--ink-3);margin-top:3px}
.kb-card .v{font-size:13px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}

/* ---------- Buscador Ctrl+K ---------- */
.pal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:620px;
  overflow:hidden;animation:pop .14s ease-out}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.pal-in input{border:0;padding:0;font-size:15.5px;background:none}
.pal-in input:focus{box-shadow:none}
.pal-res{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.pal-g{font-size:10.6px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;
  padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13.3px}
.pal-i.on{background:var(--brand-soft)}
.pal-i .ic{color:var(--ink-3)}
.pal-i.on .ic{color:var(--brand)}
.pal-i .m{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.pal-i b{font-weight:600}
.pal-f{padding:7px 14px;border-top:1px solid var(--line-2);font-size:11.4px;color:var(--ink-3);
  display:flex;gap:14px;background:var(--panel-2);flex-wrap:wrap}
.pal-f kbd{background:var(--line-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:600 10.4px Inter,sans-serif;display:inline-flex;align-items:center}
.pal-f kbd .ic{width:.95em;height:.95em;vertical-align:0}

/* ---------- Tour ---------- */
.tour{position:fixed;right:20px;bottom:20px;z-index:150;width:min(348px,calc(100% - 32px));background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);overflow:hidden}
.tour-h{background:var(--brand-deep);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:9px}
.tour-h strong{font-size:13.4px}
.tour-h .iconbtn{margin-left:auto;color:rgba(255,255,255,.8)}
.tour-h .iconbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.tour-b{padding:14px}
.tour-b h4{font-size:14.4px;margin-bottom:5px}
.tour-b p{font-size:12.9px;color:var(--ink-2);line-height:1.5}
.tour-f{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line-2)}
.tour-dots{display:flex;gap:5px;margin-right:auto}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.tour-dots i.on{background:var(--brand);width:16px;border-radius:999px}

/* ---------- Varios ---------- */
.demo-badge{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-ink);
  border:1px solid #EED9B4;border-radius:999px;padding:2px 9px;font-size:11.2px;font-weight:700}
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--line-2);margin-bottom:7px;cursor:pointer;transition:border-color .13s,background .13s}
.alert-row:hover{border-color:var(--brand);background:var(--panel-2)}
.alert-row:last-child{margin-bottom:0}
.alert-row .ic{margin-top:2px}
.alert-row.w{background:var(--warn-soft);border-color:#F0DCA8} .alert-row.w .ic{color:var(--warn)}
.alert-row.d{background:var(--bad-soft);border-color:#F2CAC6} .alert-row.d .ic{color:var(--bad)}
.alert-row.i{background:var(--info-soft);border-color:#C5E0EC} .alert-row.i .ic{color:var(--info)}
.alert-row strong{display:block;font-size:13px}
.alert-row span{font-size:12.1px;color:var(--ink-2)}
.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:0}
.feed-item .ic{color:var(--ink-3);margin-top:2px}
.feed-item strong{font-size:12.9px;font-weight:600;display:block}
.feed-item span{font-size:11.7px;color:var(--ink-3)}
.stepline{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:2px 0 4px}
.step{display:flex;align-items:center;gap:6px;font-size:11.9px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.step i{width:17px;height:17px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
  font-size:10px;color:var(--ink-3);font-style:normal;font-weight:700;flex:none}
.step.done{color:var(--brand)} .step.done i{background:var(--brand);color:#fff}
.step.now{color:var(--accent-ink)} .step.now i{background:var(--accent);color:#fff}
.step-sep{width:15px;height:1.5px;background:var(--line);margin:0 5px;flex:none}
.step-sep.done{background:var(--brand)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;font-size:12.9px}
.doc-h{display:flex;align-items:flex-start;gap:12px;border-bottom:2px solid var(--brand-deep);padding-bottom:11px;margin-bottom:12px}
.doc-h .brand-mark{width:38px;height:38px}
.doc-t{margin-left:auto;text-align:right}
.doc-t strong{display:block;font-size:14px;color:var(--brand-deep)}
.doc table{font-size:12.4px}
.doc th{background:none;position:static}
.money-pos{color:var(--brand);font-weight:700}
.money-neg{color:var(--bad);font-weight:700}
.scroll-y{max-height:330px;overflow-y:auto}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.linkish{color:var(--brand-deep);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  background:none;border:0;padding:0;font-size:inherit}
.linkish:hover{color:var(--brand)}
.mobonly{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .nav{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .nav.open{transform:none;box-shadow:var(--sh-lg)}
  .mobonly{display:inline-grid}
  .main{width:100%}
  .top{padding:10px 14px}
  .view{padding:14px 14px 76px}
  .g4,.g3,.g2,.fg2,.fg3,.fg4{grid-template-columns:minmax(0,1fr)}
  .searchbtn{min-width:0;flex:1}
  .searchbtn span,.searchbtn kbd{display:none}
  .top h1{font-size:16.5px}
  .nav-scrim{position:fixed;inset:0;background:rgba(14,36,25,.4);z-index:85}
  .modal-b{max-height:calc(100vh - 180px)}
  .kb{grid-template-columns:repeat(5,minmax(165px,1fr))}
}
@media print{
  .nav,.top,.toasts,.tour,.no-print{display:none!important}
  .view{padding:0}
  .card{box-shadow:none;border:0}
}

<script>
'use strict';

/* ==========================================================================
   Campo Mercado SAS — sistema de gestión (demostración)
   Todo vive en memoria: al recargar la página vuelve al estado inicial.
   ========================================================================== */

/* ---------- Utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const HOY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const dia = n => { const d = new Date(HOY); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const hoyISO = () => HOY.toISOString().slice(0, 10);
const aFecha = iso => { const [a, m, d] = String(iso).split('-'); return new Date(+a, +m - 1, +d); };
const dias = (a, b) => Math.round((aFecha(a) - aFecha(b || hoyISO())) / 864e5);

const nfMil = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf3 = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const nf4 = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const num = (v, d) => (d === 0 ? nfMil : d === 3 ? nf3 : d === 4 ? nf4 : nf2).format(Number(v) || 0);
const usd = v => 'USD ' + num(v);
const uyu = v => '$ ' + num(v, 0);
const kg = v => num(v, 0) + ' kg';
const pct = (v, d) => num(v, d == null ? 2 : d) + '%';
const fecha = iso => { if (!iso) return '—'; const [a, m, d] = String(iso).split('-'); return `${d}/${m}/${a}`; };
const fechaCorta = iso => { if (!iso) return '—'; const [, m, d] = String(iso).split('-'); return `${d}/${m}`; };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Set', 'Oct', 'Nov', 'Dic'];
const mesNom = iso => MESES_C[+String(iso).slice(5, 7) - 1] + ' ' + String(iso).slice(2, 4);
const iniciales = n => String(n).replace(/\(.*?\)/g, '').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const sinAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const redondear = (v, d) => { const f = Math.pow(10, d == null ? 2 : d); return Math.round((Number(v) || 0) * f) / f; };
/* El sistema actual trunca el promedio por cabeza en vez de redondearlo: lo respetamos
   para que los renglones den idénticos a los de la pantalla que usan hoy. */
const truncar = (v, d) => { const f = Math.pow(10, d == null ? 2 : d); return Math.trunc((Number(v) || 0) * f) / f; };
const ic = (n, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = p => p + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Configuración del escritorio ---------- */
const CFG_INICIAL = {
  empresa: 'Campo Mercado SAS',
  rut: '218456730017',
  direccion: 'Av. Dr. Luis Alberto de Herrera 1248, Montevideo',
  telefono: '+598 2628 4000',
  mail: 'info@campomercado.com',
  moneda: 'USD',
  cotizacion: 40.259,
  comVentaFrig: 1.0,
  comCompraFrig: 0.0,
  comVentaRepo: 1.5,
  comCompraRepo: 1.5,
  comRemate: 3.0,
  iva: 22,
  imeba: 2.5,
  plazoCobro: 45,
  plazoPago: 45,
  plazoGastos: 30,
  metaAgente: 420000,
  comAgente: 12,
};
let CFG = Object.assign({}, CFG_INICIAL);

/* ==========================================================================
   Motor de cálculo — de acá cuelga todo el sistema
   ========================================================================== */

/* Un negocio se liquida distinto según el tipo:
   - frigorífico: por kilo de carcasa (segunda balanza), con rendimiento sobre el peso en pie.
   - reposición:  por kilo en pie, con el desbaste (tara) descontado. */
function calcLinea(l, tipo, rendEst) {
  const bruto = Number(l.bruto) || 0;
  const cab = Number(l.cab) || 0;
  const pr = Number(l.pr) || 0;
  let neto, rend, estimado = false;
  if (tipo === 'frigorifico') {
    if (l.carc != null && l.carc !== '') {
      neto = Number(l.carc);
      rend = bruto ? (neto / bruto) * 100 : 0;
    } else {
      rend = Number(rendEst) || 52;
      neto = bruto * rend / 100;
      estimado = true;
    }
  } else {
    const tara = Number(l.tara) || 0;
    neto = bruto * (1 - tara / 100);
    rend = 100 - tara;
  }
  const desbaste = bruto - neto;
  return {
    cab, bruto, neto: redondear(neto, 2), desbaste: redondear(desbaste, 2),
    rend: redondear(rend, 3), prom: cab ? truncar(neto / cab, 3) : 0,
    pr, importe: redondear(neto * pr, 2), estimado,
    tara: Number(l.tara) || 0, cat: l.cat, raza: l.raza,
  };
}

function calcNegocio(n) {
  const lineas = n.lineas.map(l => calcLinea(l, n.tipo, n.rendEst));
  const importe = redondear(lineas.reduce((s, l) => s + l.importe, 0), 2);
  const cabezas = lineas.reduce((s, l) => s + l.cab, 0);
  const kgBruto = lineas.reduce((s, l) => s + l.bruto, 0);
  const kgNeto = redondear(lineas.reduce((s, l) => s + l.neto, 0), 2);
  const estimado = lineas.some(l => l.estimado);
  const rend = kgBruto ? redondear(kgNeto / kgBruto * 100, 3) : 0;

  const comVenta = redondear(importe * (Number(n.comVenta) || 0) / 100, 2);
  const comCompra = redondear(importe * (Number(n.comCompra) || 0) / 100, 2);
  const ivaVenta = redondear(comVenta * CFG.iva / 100, 2);
  const ivaCompra = redondear(comCompra * CFG.iva / 100, 2);
  const imeba = n.retImpuestos ? redondear(importe * CFG.imeba / 100, 2) : 0;

  const gastosV = redondear((n.gastos || []).filter(g => g.aCargo === 'v').reduce((s, g) => s + g.importe, 0), 2);
  const gastosC = redondear((n.gastos || []).filter(g => g.aCargo === 'c').reduce((s, g) => s + g.importe, 0), 2);

  const liquidoProductor = redondear(importe - comVenta - ivaVenta - imeba - gastosV, 2);
  const totalComprador = redondear(importe + comCompra + ivaCompra + gastosC, 2);
  const ingresoCM = redondear(comVenta + comCompra, 2);
  const comisionAgente = redondear(ingresoCM * CFG.comAgente / 100, 2);

  return {
    lineas, importe, cabezas, kgBruto, kgNeto, rend, estimado,
    comVenta, comCompra, ivaVenta, ivaCompra, imeba, gastosV, gastosC,
    liquidoProductor, totalComprador, ingresoCM, comisionAgente,
    importeUYU: redondear(importe * (n.cotizacion || CFG.cotizacion), 2),
  };
}

function neg(id) { return ST.negocios.find(n => n.id === id); }

  const cat0 = CATEGORIAS.find(x => x.n === lineas[0].cat) || { esp: 'Vacunos' };
  const n = {

    vendedor: s.v, comprador: s.c, agente: s.a,

    dicoseA: v.dicose, dicoseB: c.dicose, dicoseC: '', dicoseD: '',
    moneda: 'USD', cotizacion: CFG.cotizacion, unidad: 'Kilos', tipoProducto: cat0.esp,
    retImpuestos: true, segundaBalanza: s.tipo === 'frigorifico',
    comVenta: s.cv, comCompra: s.cc, rendEst: s.rendEst || null,
    plazoVenta: v.plazo, plazoCompra: c.plazo, plazoGastos: CFG.plazoGastos,
    estado: s.estado, nota: '', foto: !!s.foto, lineas,

    gastos: gastosDe(kgBruto, s.tipo),

    cobrado: false, pagado: false, fechaCobro: null, fechaPago: null,
    vencImpMun: sumarDias(fecha, 60),
  };
  recalcularFechas(n);
  return n;
}

/* Los vencimientos cuelgan de la fecha en que quedó definido el importe:
   la faena en los negocios de frigorífico, el embarque en los de reposición. */
function recalcularFechas(n) {
  const base = n.fechaFaena || n.fechaEmbarque || n.fecha;
  n.fechaBase = base;
  n.vencCobro = sumarDias(base, n.plazoCompra);
  n.vencPago = sumarDias(base, n.plazoVenta);
}

function construirEstado() {
  SEQ = { neg: 6357, asiento: 1, cfe: 4100, lote: 399, mov: 1, fid: 42 };
  CFG = Object.assign({}, CFG_INICIAL);

  ST = {
    clientes: SEED_CLIENTES.map(c => Object.assign({}, c)),
    agentes: SEED_AGENTES.map(a => Object.assign({}, a)),
    plan: SEED_PLAN.map(p => Object.assign({}, p)),
    negocios: SEED_NEGOCIOS.map(construirNegocio),
    lotes: [], remates: [], asientos: [], banco: [], fideicomiso: [], avisos: [],
  };

  /* Lotes de la app */
  ST.lotes = SEED_LOTES.map(l => ({
    id: l.id, fecha: dia(l.f), productor: l.prod, agente: l.ag, cat: l.cat, raza: l.raza,
    cab: l.cab, peso: l.peso, dpto: l.dpto, pedido: l.pedido, estado: l.estado,
    fotos: l.fotos, video: l.video, vet: l.vet, negocio: l.negocio || null,
    dicose: (SEED_CLIENTES.find(c => c.id === l.prod) || {}).dicose || '',
    ofertas: (l.ofertas || []).map((o, i) => ({
      id: l.id + '-O' + (i + 1), comprador: o.c, pr: o.pr, fecha: dia(o.f), ganadora: !!o.ganadora,
    })),
  }));
  ST.lotes.forEach(l => { if (l.negocio) { const n = neg(l.negocio); if (n) n.loteId = l.id; } });

  /* Remates */
  ST.remates = SEED_REMATES.map(r => Object.assign({}, r, { fecha: dia(r.f) }));

  /* Fideicomiso de garantía */
  ST.fideicomiso = SEED_FIDEI.map(x => {
    const fecha = dia(x.f);
    const venc = sumarDias(fecha, x.plazo);
    const interes = redondear(x.monto * x.tasa / 100 * x.plazo / 365, 2);
    return Object.assign({}, x, { fecha, venc, interes, total: redondear(x.monto + interes, 2) });
  });

  /* Documentos electrónicos y cierre de los negocios ya cobrados */
  const ordenados = ST.negocios.slice().sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  ordenados.forEach(n => {
    if (n.estado === 'liquidado' || n.estado === 'cerrado') {
      let estadoCfe = 'Aceptado', motivo = '';
      if (n.id === '6349') { estadoCfe = 'Rechazado'; motivo = 'Dígito verificador del RUT del receptor inválido'; }
      if (n.id === '6346') { estadoCfe = 'Pendiente'; motivo = 'Esperando respuesta de DGI'; }
      n.cfe = {
        tipo: 'e-Factura', serie: 'A', numero: SEQ.cfe++,
        cae: '9022' + String(4100000 + Math.round(n.importeHash || 0) + SEQ.cfe).slice(-7),
        fecha: n.fechaBase, estado: estadoCfe, motivo,
      };
    }
    if (n.estado === 'cerrado') {
      n.cobrado = true; n.pagado = true;
      n.fechaCobro = n.vencCobro; n.fechaPago = n.vencPago;
    }
  });

  construirContabilidad();
  construirBanco();
  return ST;
}

/* ---------- Libro diario ---------- */
function asientoLiquidacion(n) {
  const k = calcNegocio(n);
  const gastosTot = redondear(k.gastosV + k.gastosC, 2);
  const lineas = [
    { cuenta: '1.2.01', aux: cli(n.comprador).nombre, debe: k.totalComprador, haber: 0 },
    { cuenta: '2.1.01', aux: cli(n.vendedor).nombre, debe: 0, haber: k.liquidoProductor },
  ];
  if (k.comVenta) lineas.push({ cuenta: '4.1.01', aux: '', debe: 0, haber: k.comVenta });
  if (k.comCompra) lineas.push({ cuenta: '4.1.02', aux: '', debe: 0, haber: k.comCompra });
  const iva = redondear(k.ivaVenta + k.ivaCompra, 2);
  if (iva) lineas.push({ cuenta: '2.2.01', aux: '', debe: 0, haber: iva });
  if (k.imeba) lineas.push({ cuenta: '2.2.02', aux: 'DGI', debe: 0, haber: k.imeba });
  if (gastosTot) lineas.push({ cuenta: '2.1.02', aux: 'Gastos del negocio', debe: 0, haber: gastosTot });
  return {
    id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: n.fechaBase,
    detalle: 'Liquidación negocio ' + n.id + ' — ' + cli(n.vendedor).nombre + ' / ' + cli(n.comprador).nombre,
    origen: 'liquidacion', negocio: n.id, lineas,
  };
}

function construirContabilidad() {
  ST.asientos = [];
  const ord = ST.negocios.slice().sort((a, b) => (a.fechaBase || a.fecha) < (b.fechaBase || b.fecha) ? -1 : 1);
  ord.forEach(n => {
    if (n.estado !== 'liquidado' && n.estado !== 'cerrado') return;
    ST.asientos.push(asientoLiquidacion(n));
    const k = calcNegocio(n);
    if (n.cobrado) ST.asientos.push({
      id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: n.fechaCobro,
      detalle: 'Cobro negocio ' + n.id + ' — ' + cli(n.comprador).nombre,
      origen: 'cobro', negocio: n.id, lineas: [
        { cuenta: '1.1.03', aux: '', debe: k.totalComprador, haber: 0 },
        { cuenta: '1.2.01', aux: cli(n.comprador).nombre, debe: 0, haber: k.totalComprador },
      ],
    });
    if (n.pagado) ST.asientos.push({
      id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: n.fechaPago,
      detalle: 'Pago a productor negocio ' + n.id + ' — ' + cli(n.vendedor).nombre,
      origen: 'pago', negocio: n.id, lineas: [
        { cuenta: '2.1.01', aux: cli(n.vendedor).nombre, debe: k.liquidoProductor, haber: 0 },
        { cuenta: '1.1.03', aux: '', debe: 0, haber: k.liquidoProductor },
      ],
    });
  });

  /* Gastos de estructura de los últimos meses */
  [-64, -34, -4].forEach((off, i) => {
    const f = dia(off);
    ST.asientos.push({
      id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: f,
      detalle: 'Sueldos y leyes sociales — ' + MESES[+f.slice(5, 7) - 1],
      origen: 'manual', negocio: null, lineas: [
        { cuenta: '5.1.01', aux: '', debe: 18400, haber: 0 },
        { cuenta: '2.2.03', aux: 'BPS', debe: 0, haber: 4232 },
        { cuenta: '1.1.04', aux: '', debe: 0, haber: 14168 },
      ],
    });
    ST.asientos.push({

/* ---------- Extracto bancario ----------
   Los importes salen de los propios negocios, así la conciliación da exacta. */
function construirBanco() {
  ST.banco = SEED_BANCO_OTROS.map(m => Object.assign({}, m, { fecha: dia(m.f), conciliado: false, negocio: null, asiento: null }));
  const cobros = [['6343', -7], ['6344', -6], ['6345', -4], ['6346', -3]];
  const pagos = [['6347', -6], ['6348', -2]];
  cobros.forEach(([id, off], i) => {
    const n = neg(id); if (!n) return;
    const k = calcNegocio(n);
    ST.banco.push({
      id: 'B-' + String(101 + i).padStart(4, '0'), fecha: dia(off), banco: 'BROU USD',
      det: 'Transferencia recibida — ' + cli(n.comprador).nombre.toUpperCase().replace(/[().]/g, '').replace(/\s+/g, ' ').trim(),
      imp: k.totalComprador, ref: '0044' + (1800 + i * 37), conciliado: false, negocio: null, asiento: null,
    });
  });
  pagos.forEach(([id, off], i) => {
    const n = neg(id); if (!n) return;
    const k = calcNegocio(n);
    ST.banco.push({
      id: 'B-' + String(201 + i).padStart(4, '0'), fecha: dia(off), banco: 'BROU USD',
      det: 'Transferencia emitida — ' + cli(n.vendedor).nombre.toUpperCase().replace(/[().]/g, '').replace(/\s+/g, ' ').trim(),
      imp: -k.liquidoProductor, ref: '0044' + (1950 + i * 23), conciliado: false, negocio: null, asiento: null,
    });
  });
  ST.banco.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.id < b.id ? -1 : 1));
}

function badgeDe(id) {

function aviso(txt, tipo) {

/* ---------- Modales ---------- */
let MODALES = [];
function modal(o) {
  const foco = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="modal${o.ancho ? ' ' + o.ancho : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.titulo)}">
    <div class="modal-h">
      <div>
        <h3>${esc(o.titulo)}</h3>
        ${o.sub ? `<div class="sub">${o.sub}</div>` : ''}
      </div>
      <button class="iconbtn" data-cerrar aria-label="Cerrar">${ic('cerrar')}</button>
    </div>
    <div class="modal-b">${o.cuerpo}</div>
    ${o.pie === null ? '' : `<div class="modal-f">${o.pie || '<button class="btn" data-cerrar>Cerrar</button>'}</div>`}
  </div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) cerrarModal(); });
  $$('[data-cerrar]', ov).forEach(b => b.onclick = () => cerrarModal());
  $('#modalRoot').appendChild(ov);
  MODALES.push({ ov, foco });
  const primero = $('input:not([type=hidden]),select,textarea,button.btn-pri', ov);
  if (primero) setTimeout(() => primero.focus(), 40);
  if (o.luego) o.luego(ov);
  return ov;
}
function cerrarModal() {
  const m = MODALES.pop();
  if (!m) return;
  m.ov.remove();
  if (m.foco && m.foco.focus) try { m.foco.focus(); } catch (e) { /* el elemento ya no está */ }
}
function cerrarTodosModales() { while (MODALES.length) cerrarModal(); }

function preguntar(o) {
  modal({

    cuerpo: `<div class="panelbox ${o.tono || ''}">${o.cuerpo}</div>`,
    pie: `<button class="btn" data-cerrar>${esc(o.cancelar || 'Cancelar')}</button>
          <button class="btn ${o.peligro ? 'btn-danger' : 'btn-pri'}" id="mkOk">${esc(o.aceptar || 'Confirmar')}</button>`,
    luego: ov => { $('#mkOk', ov).onclick = () => { cerrarModal(); o.ok(); }; },
  });
}

/* ---------- Exportar a CSV ---------- */
function exportarCSV(nombre, filas) {
  const csv = filas.map(f => f.map(c => {
    const s = String(c == null ? '' : c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  aviso('Bajé <b>' + esc(nombre) + '.csv</b>, se abre con Excel');
}

function pasosHTML(n) {

function barras(datos, fmt) {
  const max = Math.max(1, ...datos.map(d => Math.abs(d.v)));

      <span class="cap">${esc(d.l)}</span>
    </div>`).join('') + `</div>`;
}

const ABIERTOS = ['pactado', 'embarcado', 'faenado'];
const esAbierto = n => ABIERTOS.indexOf(n.estado) >= 0;
const vivos = () => ST.negocios.filter(n => n.estado !== 'anulado');

function totalesDeNegocios(lista) {
  return lista.reduce((a, n) => {
    const k = calcNegocio(n);
    a.importe += k.importe; a.comision += k.ingresoCM; a.cabezas += k.cabezas;
    a.kgNeto += k.kgNeto; a.n++;
    return a;
  }, { importe: 0, comision: 0, cabezas: 0, kgNeto: 0, n: 0 });
}

function mesesRecientes(cant) {
  const out = [];
  const d = new Date(HOY.getFullYear(), HOY.getMonth(), 1);
  for (let i = cant - 1; i >= 0; i--) {
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(x.toISOString().slice(0, 7));
  }
  return out;
}
const mesDe = iso => String(iso).slice(0, 7);
const nomMes = ym => MESES_C[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4);

function comisionPorMes(cant) {
  return mesesRecientes(cant || 6).map(ym => ({
    l: nomMes(ym),
    v: redondear(vivos().filter(n => mesDe(n.fechaBase || n.fecha) === ym)
      .reduce((s, n) => s + calcNegocio(n).ingresoCM, 0), 2),
    ym,
  }));
}

function cobrosPendientes() {
  return vivos().filter(n => !n.cobrado && (n.estado === 'liquidado' || n.estado === 'cerrado'))
    .map(n => ({ n, imp: calcNegocio(n).totalComprador, venc: n.vencCobro }))
    .sort((a, b) => a.venc < b.venc ? -1 : 1);
}
function pagosPendientes() {
  return vivos().filter(n => !n.pagado && (n.estado === 'liquidado' || n.estado === 'cerrado'))
    .map(n => ({ n, imp: calcNegocio(n).liquidoProductor, venc: n.vencPago }))
    .sort((a, b) => a.venc < b.venc ? -1 : 1);
}

function saldoCliente(id) {
  const c = cli(id);
  let saldo = 0;
  vivos().forEach(n => {
    const k = calcNegocio(n);
    if (n.comprador === id && !n.cobrado && (n.estado === 'liquidado' || n.estado === 'cerrado')) saldo += k.totalComprador;
    if (n.vendedor === id && !n.pagado && (n.estado === 'liquidado' || n.estado === 'cerrado')) saldo -= k.liquidoProductor;
  });
  return redondear(saldo, 2);
}

function metricasAgente(id) {
  const ns = vivos().filter(n => n.agente === id);
  const ym = mesDe(hoyISO());
  const mes = ns.filter(n => mesDe(n.fechaBase || n.fecha) === ym);
  const t = totalesDeNegocios(mes);
  const lotes = ST.lotes.filter(l => l.agente === id);
  return {
    negocios: ns.length, negociosMes: mes.length,
    importeMes: redondear(t.importe, 2), comisionMes: redondear(t.comision, 2),
    cabezasMes: t.cabezas, lotes: lotes.length,
    lotesAbiertos: lotes.filter(l => l.estado === 'publicado' || l.estado === 'ofertas').length,
    meta: CFG.metaAgente, cumple: CFG.metaAgente ? redondear(t.importe / CFG.metaAgente * 100, 1) : 0,
    aCobrar: redondear(t.comision * CFG.comAgente / 100, 2),
  };
}

/* ==========================================================================

let NEG_MODO = 'lista', NEG_ORD = { campo: 'fecha', desc: true };

function negociosFiltrados() {
  let l = vivos().slice();
  const f = FILTROS;
  if (f.estado === 'abiertos') l = l.filter(esAbierto);
  else if (f.estado) l = l.filter(n => n.estado === f.estado);
  if (f.tipo) l = l.filter(n => n.tipo === f.tipo);
  if (f.agente) l = l.filter(n => n.agente === f.agente);
  if (f.cliente) l = l.filter(n => n.vendedor === f.cliente || n.comprador === f.cliente);
  if (f.texto) {
    const q = sinAcento(f.texto);
    l = l.filter(n => sinAcento(n.id + ' ' + n.tropa + ' ' + cli(n.vendedor).nombre + ' ' +
      cli(n.comprador).nombre + ' ' + n.lineas.map(x => x.cat).join(' ')).indexOf(q) >= 0);
  }
  const c = NEG_ORD.campo, s = NEG_ORD.desc ? -1 : 1;
  l.sort((a, b) => {
    let x, y;
    if (c === 'importe') { x = calcNegocio(a).importe; y = calcNegocio(b).importe; }
    else if (c === 'cabezas') { x = calcNegocio(a).cabezas; y = calcNegocio(b).cabezas; }
    else if (c === 'vendedor') { x = cli(a.vendedor).nombre; y = cli(b.vendedor).nombre; }
    else { x = a[c]; y = b[c]; }
    return x < y ? s : x > y ? -s : 0;
  });
  return l;
}

function ordenarNeg(campo) {
  if (NEG_ORD.campo === campo) NEG_ORD.desc = !NEG_ORD.desc;
  else NEG_ORD = { campo, desc: true };
  render();
}

          ${Object.keys(ESTADOS).filter(k => k !== 'anulado').map(k =>

          </select>
        </div>
      </div>
      <div class="card-b flush">
        ${NEG_MODO === 'tablero' ? tableroNegocios(lista) : (lista.length ? `<div class="tw"><table>
          <thead><tr>${th('id', 'Negocio')}${th('fecha', 'Fecha')}<th>Partes</th><th>Hacienda</th>
            ${th('cabezas', 'Cab.', 1)}<th class="num">Kg netos</th><th class="num">Rend.</th>

              <td class="mono t-sm">${fecha(n.fecha)}</td>

              <td><div class="cell2">${esc(n.lineas[0].cat)}<span>${esc(n.lineas[0].raza)}</span></div></td>
              <td class="num">${num(k.cabezas, 0)}</td>
              <td class="num">${num(k.kgNeto, 0)}</td>
              <td class="num">${k.rend ? num(k.rend, 3) + '%' : '—'}${k.estimado ? '<div class="t-xs t-dim">est.</div>' : ''}</td>
              <td class="num t-strong">${num(k.importe)}</td>

          }).join('')}</tbody>
          <tfoot><tr><td colspan="4">${lista.length} negocios</td>
            <td class="num">${num(t.cabezas, 0)}</td><td class="num">${num(t.kgNeto, 0)}</td><td></td>
            <td class="num">${num(t.importe)}</td><td class="num">${num(t.comision)}</td><td colspan="2"></td></tr></tfoot>
        </table></div>` : vacio('negocio', 'No hay negocios con ese filtro',

function filtroNeg(k, v) { FILTROS = Object.assign({}, FILTROS); if (v == null) delete FILTROS[k]; else FILTROS[k] = v; render(); }

function tableroNegocios(lista) {
  const cols = ['pactado', 'embarcado', 'faenado', 'liquidado', 'cerrado'];
  return `<div class="card-b"><div class="kb">${cols.map(c => {
    const ns = lista.filter(n => n.estado === c);

    return `<div class="kb-col" data-estado="${c}">
      <h5>${esc(ESTADOS[c].t)}<b>${ns.length}</b></h5>
      ${ns.map(n => {
        const k = calcNegocio(n);
        return `<div class="kb-card" draggable="true" data-id="${n.id}" onclick="abrirNegocio('${n.id}')">
          <div class="t">${n.id}<span class="tag ${n.tipo === 'frigorifico' ? 'tag-i' : 'tag-a'} t-xs">${n.tipo === 'frigorifico' ? 'Frig.' : 'Repo.'}</span></div>
          <div class="m">${esc(cli(n.vendedor).nombre)}</div>
          <div class="m">${num(k.cabezas, 0)} ${esc(n.lineas[0].cat.toLowerCase())}</div>

      }).join('') || `<div class="t-xs t-dim" style="padding:8px 4px">Sin negocios</div>`}
      ${ns.length ? `<div class="t-xs t-dim" style="padding:4px 4px 0;border-top:1px solid var(--line);margin-top:6px">${usd(tot.importe)}</div>` : ''}
    </div>`;
  }).join('')}</div>
  <p class="t-xs t-dim" style="margin-top:10px">Arrastrá una tarjeta a la columna siguiente y el sistema hace el paso: pide los kilos de balanza, arma las liquidaciones y escribe el asiento.</p></div>`;
}

function activarArrastre() {
  let arrastrando = null;
  $$('.kb-card').forEach(c => {
    c.addEventListener('dragstart', e => { arrastrando = c.getAttribute('data-id'); c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    c.addEventListener('dragend', () => { c.classList.remove('drag'); arrastrando = null; });
  });
  $$('.kb-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      if (!arrastrando) return;
      moverNegocioA(arrastrando, col.getAttribute('data-estado'));
    });
  });
}

/* Mover en el tablero dispara el mismo paso que el botón: nada de cambiar un rótulo. */
function moverNegocioA(id, destino) {
  const n = neg(id); if (!n || n.estado === destino) return;
  const pasos = pasosDe(n);
  const iA = pasos.indexOf(n.estado), iD = pasos.indexOf(destino);
  if (iD < 0) return aviso('Un negocio de ' + (n.tipo === 'frigorifico' ? 'frigorífico' : 'reposición') + ' no pasa por <b>' + esc(ESTADOS[destino].t) + '</b>', 'warn');
  if (iD < iA) return preguntar({
    titulo: 'Volver el negocio ' + id + ' atrás', tono: 'warn', peligro: true, aceptar: 'Volver atrás',
    cuerpo: 'Vas a llevar el negocio de <b>' + esc(ESTADOS[n.estado].t) + '</b> a <b>' + esc(ESTADOS[destino].t) +
      '</b>. Se borran las liquidaciones y los asientos que ya salieron de este negocio.',
    ok: () => { retrocederNegocio(n, destino); },
  });
  if (iD > iA + 1) return aviso('Hay que hacer primero el paso <b>' + esc(ESTADOS[pasos[iA + 1]].t) + '</b>', 'warn');
  avanzarNegocio(n);
}

function avanzarNegocio(n) {
  if (n.estado === 'pactado') return registrarEmbarque(n.id);
  if (n.estado === 'embarcado') return n.tipo === 'frigorifico' ? registrarFaena(n.id) : liquidarNegocio(n.id);
  if (n.estado === 'faenado') return liquidarNegocio(n.id);
  if (n.estado === 'liquidado') return cobrarYPagar(n.id);
}

function retrocederNegocio(n, destino) {
  const pasos = pasosDe(n);
  const iD = pasos.indexOf(destino);
  if (iD < pasos.indexOf('liquidado')) {
    ST.asientos = ST.asientos.filter(a => a.negocio !== n.id);
    ST.banco.forEach(m => { if (m.negocio === n.id) { m.negocio = null; m.conciliado = false; } });
    n.cfe = null;
  }
  if (iD < pasos.indexOf('cerrado')) { n.cobrado = false; n.pagado = false; n.fechaCobro = null; n.fechaPago = null; }
  if (destino === 'pactado') { n.fechaEmbarque = null; n.fechaFaena = null; n.lineas.forEach(l => l.carc = null); }
  if (destino === 'embarcado') { n.fechaFaena = null; n.lineas.forEach(l => l.carc = null); }
  n.estado = destino;
  recalcularFechas(n);
  render();
  aviso('Negocio ' + n.id + ' volvió a <b>' + esc(ESTADOS[destino].t) + '</b>', 'warn');
}

function botonSiguientePaso(n, chico) {
  const c = 'btn btn-sm btn-pri';
  const stop = 'event.stopPropagation();';
  if (n.estado === 'pactado') return `<button class="${c}" onclick="${stop}registrarEmbarque('${n.id}')">${ic('camion')}Embarcar</button>`;
  if (n.estado === 'embarcado') return n.tipo === 'frigorifico'
    ? `<button class="${c}" onclick="${stop}registrarFaena('${n.id}')">${ic('balanza')}Registrar faena</button>`
    : `<button class="${c}" onclick="${stop}liquidarNegocio('${n.id}')">${ic('liq')}Liquidar</button>`;
  if (n.estado === 'faenado') return `<button class="${c}" onclick="${stop}liquidarNegocio('${n.id}')">${ic('liq')}Liquidar</button>`;
  if (n.estado === 'liquidado' && !chico) return `<button class="${c}" onclick="${stop}cobrarYPagar('${n.id}')">${ic('plata')}Cobrar y pagar</button>`;
  return '';
}

function exportarNegocios() {
  const filas = [['Negocio', 'Fecha', 'Tipo', 'Vendedor', 'Comprador', 'Agente', 'Tropa', 'Categoría', 'Raza',
    'Cabezas', 'Kg brutos', 'Kg netos', 'Rendimiento %', 'Promedio kg', 'Precio USD', 'Importe USD',
    'Comisión venta', 'Comisión compra', 'Líquido productor', 'Total comprador', 'Estado', 'Vence cobro', 'Vence pago']];
  negociosFiltrados().forEach(n => {
    const k = calcNegocio(n);
    filas.push([n.id, fecha(n.fecha), n.tipo === 'frigorifico' ? 'Frigorífico' : 'Reposición',
      cli(n.vendedor).nombre, cli(n.comprador).nombre, agente(n.agente).nombre, n.tropa,
      n.lineas.map(l => l.cat).join(' / '), n.lineas.map(l => l.raza).join(' / '),
      k.cabezas, num(k.kgBruto, 0), num(k.kgNeto), num(k.rend, 3), num(k.cabezas ? k.kgNeto / k.cabezas : 0, 3),
      num(n.lineas[0].pr), num(k.importe), num(k.comVenta), num(k.comCompra),
      num(k.liquidoProductor), num(k.totalComprador), ESTADOS[n.estado].t, fecha(n.vencCobro), fecha(n.vencPago)]);
  });
  exportarCSV('negocios-campo-mercado', filas);
}

  <div class="panelbox"><div class="dl" style="grid-template-columns:auto 1fr auto 1fr">
    <dt>Moneda</dt><dd>${esc(n.moneda)}</dd>
    <dt>Cotización</dt><dd>${num(n.cotizacion, 3)}</dd>

  ${n.deltaFaena ? `<div class="panelbox brand" style="margin-top:10px">${ic('check-c')}

      <dt>Ingreso de Campo Mercado</dt><dd>${usd(k.ingresoCM)}</dd>

  ${n.cfe ? `<div class="sec-t">Documento electrónico</div>

    ${n.cfe.estado === 'Rechazado' ? `<button class="btn btn-sm btn-pri" style="margin-top:9px" onclick="reenviarCFE('${n.id}')">${ic('cfe')}Corregir y reenviar a DGI</button>` : ''}
  </div>` : ''}

  ${asientos.length ? `<div class="sec-t">Asientos que generó este negocio</div>
  <div class="tw"><table>
    <thead><tr><th>Asiento</th><th>Fecha</th><th>Detalle</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead>
    <tbody>${asientos.map(a => {
      const d = a.lineas.reduce((s, l) => s + l.debe, 0);
      return `<tr class="row" onclick="cerrarModal();verAsiento('${a.id}')"><td class="t-strong">${a.id}</td>
        <td class="mono t-sm">${fecha(a.fecha)}</td><td class="t-sm">${esc(a.detalle)}</td>

    }).join('')}</tbody></table></div>` : ''}

  <div class="sec-t">Estado de la plata</div>
  <div class="grid g2" style="gap:12px">
    <div class="panelbox ${n.cobrado ? 'brand' : ''}">
      <div class="dl"><dt>Cobro al comprador</dt><dd>${n.cobrado ? 'Cobrado el ' + fecha(n.fechaCobro) : 'Pendiente, vence ' + fecha(n.vencCobro)}</dd>
      <dt>Importe</dt><dd>${usd(k.totalComprador)}</dd></div>
    </div>
    <div class="panelbox ${n.pagado ? 'brand' : ''}">
      <div class="dl"><dt>Pago al productor</dt><dd>${n.pagado ? 'Pagado el ' + fecha(n.fechaPago) : 'Pendiente, vence ' + fecha(n.vencPago)}</dd>

    </div>

  modal({

    ancho: 'xwide', cuerpo,
    pie: `
      <div class="left" style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="editarNegocio('${n.id}')">${ic('lapiz')}Editar</button>
        <button class="btn btn-sm" onclick="duplicarNegocio('${n.id}')">${ic('copia')}Duplicar</button>

function filaLiq(lbl, v, fuerte) {
  return `<div style="display:flex;gap:10px;font-size:${fuerte ? '14.5px' : '13px'};padding:2.5px 0;${fuerte ? 'font-weight:800' : ''}">
    <span${fuerte ? '' : ' class="t-dim"'}>${esc(lbl)}</span>
    <span style="margin-left:auto;font-variant-numeric:tabular-nums" class="${fuerte ? '' : (v < 0 ? 'money-neg' : '')}">${v < 0 ? '−' : ''}${num(Math.abs(v))}</span></div>`;
}

/* ==========================================================================
   Los pasos del negocio
   ========================================================================== */
function registrarEmbarque(id) {
  const n = neg(id); if (!n) return;
  const k = calcNegocio(n);
  modal({
    titulo: 'Registrar embarque — negocio ' + n.id,
    sub: cli(n.vendedor).nombre + ' hacia ' + cli(n.comprador).nombre,
    cuerpo: `
      <div class="panelbox" style="margin-bottom:13px">${ic('camion')}
        Al embarcar se carga la guía de propiedad y tránsito y quedan firmes los kilos en pie de la primera balanza.
        ${n.tipo === 'reposicion' ? 'En reposición, acá ya queda definido el importe.' : 'El importe se define después, con la faena.'}
      </div>
      <div class="fgrid fg2">
        <div class="field"><label>Fecha de embarque</label><input type="date" id="emFecha" value="${hoyISO()}"></div>
        <div class="field"><label>Guía de propiedad y tránsito</label><input id="emGuia" value="${esc(n.guia || '')}" placeholder="F52210 / F522101"></div>
        <div class="field"><label>DICOSE origen</label><input id="emDicA" value="${esc(n.dicoseA)}"></div>
        <div class="field"><label>DICOSE destino</label><input id="emDicB" value="${esc(n.dicoseB)}"></div>
      </div>
      <div class="sec-t">Kilos de la primera balanza</div>
      ${n.lineas.map((l, i) => `<div class="fgrid fg3">
        <div class="field"><label>Renglón</label><input readonly value="${esc(l.cat)}"></div>
        <div class="field"><label>Cabezas</label><input class="num" id="emCab${i}" value="${l.cab}"></div>
        <div class="field"><label>Kilos en pie</label><input class="num" id="emKg${i}" value="${l.bruto}"></div>
      </div>`).join('')}`,
    pie: `<button class="btn" data-cerrar>Cancelar</button>
      <button class="btn btn-pri" id="emOk">${ic('camion')}Confirmar embarque</button>`,
    luego: ov => {
      $('#emOk', ov).onclick = () => {
        n.fechaEmbarque = $('#emFecha', ov).value || hoyISO();
        n.guia = $('#emGuia', ov).value.trim();
        n.dicoseA = $('#emDicA', ov).value.trim();
        n.dicoseB = $('#emDicB', ov).value.trim();
        n.lineas.forEach((l, i) => {
          l.cab = Number($('#emCab' + i, ov).value) || l.cab;
          l.bruto = Number($('#emKg' + i, ov).value) || l.bruto;
        });
        n.gastos = gastosDe(n.lineas.reduce((a, l) => a + l.bruto, 0), n.tipo);
        n.estado = 'embarcado';
        recalcularFechas(n);
        cerrarModal();
        render();
        aviso('Embarque del negocio <b>' + n.id + '</b> registrado con la guía ' + esc(n.guia || 'sin número'));
        setTimeout(() => abrirNegocio(n.id), 260);
      };
    },
  });
}

/* El momento de la demo: entra la segunda balanza y se rehace todo el sistema. */
function registrarFaena(id) {
  const n = neg(id); if (!n) return;
  const antes = calcNegocio(n);
  const rendEst = Number(n.rendEst) || 52;

  const previsualizar = ov => {
    const copia = JSON.parse(JSON.stringify(n));
    copia.lineas.forEach((l, i) => {
      const el = $('#faKg' + i, ov);
      l.carc = el && el.value !== '' ? Number(el.value) : null;
    });
    const k = calcNegocio(copia);
    const dImp = redondear(k.importe - antes.importe, 2);
    const dCom = redondear(k.ingresoCM - antes.ingresoCM, 2);
    n.lineas.forEach((l, i) => {
      const el = $('#faKg' + i, ov); if (!el) return;
      const bruto = l.bruto, v = Number(el.value) || 0;
      const r = bruto ? v / bruto * 100 : 0;
      const p = l.cab ? v / l.cab : 0;
      const rr = $('#faRend' + i, ov); if (rr) rr.textContent = num(r, 3) + '%';
      const pp = $('#faProm' + i, ov); if (pp) pp.textContent = num(p, 3) + ' kg';
    });
    $('#faPrev', ov).innerHTML = `
      <div class="dl" style="grid-template-columns:auto 1fr auto 1fr">
        <dt>Rendimiento</dt><dd>${num(k.rend, 3)}%</dd>
        <dt>Kilos de carcasa</dt><dd>${kg(k.kgNeto)}</dd>
        <dt>Importe del negocio</dt><dd>${usd(k.importe)}</dd>
        <dt>Comisión de Campo Mercado</dt><dd>${usd(k.ingresoCM)}</dd>
        <dt>Líquido al productor</dt><dd>${usd(k.liquidoProductor)}</dd>
        <dt>Total al comprador</dt><dd>${usd(k.totalComprador)}</dd>
      </div>
      <hr class="sep" style="margin:10px 0">
      <div style="font-size:13.2px">
        Se había pactado con un rendimiento estimado de <b>${num(rendEst, 3)}%</b>.
        Con el real, el importe cambia <b class="${dImp >= 0 ? 'money-pos' : 'money-neg'}">${dImp >= 0 ? '+' : '−'}${usd(Math.abs(dImp))}</b>
        y la comisión <b class="${dCom >= 0 ? 'money-pos' : 'money-neg'}">${dCom >= 0 ? '+' : '−'}${usd(Math.abs(dCom))}</b>.
      </div>`;
  };

  modal({
    titulo: 'Registrar faena — negocio ' + n.id,
    sub: 'Segunda balanza de ' + cli(n.comprador).nombre + ' &middot; tropa ' + esc(n.tropa),
    ancho: 'wide',
    cuerpo: `
      <div class="panelbox" style="margin-bottom:13px">${ic('balanza')}
        Cambiá los kilos de carcasa y mirá lo que pasa abajo: se rehacen el rendimiento, el importe, las dos comisiones,
        las dos liquidaciones, el flujo de fondos y el asiento contable. Los valores que vienen son el estimado al pactar.
      </div>
      <div class="field" style="max-width:220px"><label>Fecha de faena</label><input type="date" id="faFecha" value="${hoyISO()}"></div>
      <div class="tw"><table>
        <thead><tr><th>Renglón</th><th class="num">Cab.</th><th class="num">Kg en pie</th>
          <th class="num" style="width:150px">Kg de carcasa</th><th class="num">Rend.</th><th class="num">Promedio</th></tr></thead>
        <tbody>${n.lineas.map((l, i) => `<tr>
          <td><div class="cell2">${esc(l.cat)}<span>${esc(l.raza)}</span></div></td>
          <td class="num">${num(l.cab, 0)}</td>
          <td class="num">${num(l.bruto, 0)}</td>
          <td><input class="num" id="faKg${i}" value="${Math.round(l.bruto * rendEst / 100)}"></td>
          <td class="num t-strong" id="faRend${i}">—</td>
          <td class="num" id="faProm${i}">—</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="sec-t">Cómo queda el negocio</div>
      <div class="panelbox brand" id="faPrev"></div>`,
    pie: `<button class="btn" data-cerrar>Cancelar</button>
      <button class="btn btn-pri" id="faOk">${ic('balanza')}Confirmar faena</button>`,
    luego: ov => {
      n.lineas.forEach((l, i) => { const el = $('#faKg' + i, ov); if (el) el.oninput = () => previsualizar(ov); });
      previsualizar(ov);
      $('#faOk', ov).onclick = () => {
        n.fechaFaena = $('#faFecha', ov).value || hoyISO();
        n.lineas.forEach((l, i) => { const el = $('#faKg' + i, ov); if (el && el.value !== '') l.carc = Number(el.value); });
        n.estado = 'faenado';
        recalcularFechas(n);
        const k = calcNegocio(n);
        n.deltaFaena = {
          rendEst, rendReal: k.rend,
          dImporte: redondear(k.importe - antes.importe, 2),
          dComision: redondear(k.ingresoCM - antes.ingresoCM, 2),
        };
        cerrarModal();
        render();
        aviso('Faena cargada: rendimiento <b>' + num(k.rend, 3) + '%</b>, importe <b>' + usd(k.importe) +
          '</b>, comisión <b>' + usd(k.ingresoCM) + '</b>');
        setTimeout(() => abrirNegocio(n.id), 260);
      };
    },
  });
}

function liquidarNegocio(id) {
  const n = neg(id); if (!n) return;
  const k = calcNegocio(n);
  if (k.estimado) return aviso('Falta la segunda balanza: sin los kilos de carcasa el importe no está firme', 'warn');
  modal({
    titulo: 'Liquidar el negocio ' + n.id,
    sub: 'Salen las dos liquidaciones, la e-Factura y el asiento',
    cuerpo: `
      <div class="panelbox" style="margin-bottom:12px">${ic('liq')}
        Se emiten las dos liquidaciones por punta, se firma la e-Factura contra DGI y se escribe el asiento en el libro diario.
        Después queda esperando el cobro y el pago según los plazos.
      </div>
      <div class="dl">
        <dt>Importe</dt><dd>${usd(k.importe)}</dd>
        <dt>Comisión de venta</dt><dd>${usd(k.comVenta)} (${num(n.comVenta, 4)}%)</dd>
        <dt>Comisión de compra</dt><dd>${usd(k.comCompra)} (${num(n.comCompra, 4)}%)</dd>
        <dt>IVA</dt><dd>${usd(redondear(k.ivaVenta + k.ivaCompra, 2))}</dd>
        <dt>Retención IMEBA</dt><dd>${usd(k.imeba)}</dd>
        <dt>Líquido al productor</dt><dd>${usd(k.liquidoProductor)} el ${fecha(n.vencPago)}</dd>
        <dt>Total al comprador</dt><dd>${usd(k.totalComprador)} el ${fecha(n.vencCobro)}</dd>
      </div>`,
    pie: `<button class="btn" data-cerrar>Cancelar</button>
      <button class="btn btn-pri" id="liOk">${ic('liq')}Emitir liquidaciones</button>`,
    luego: ov => {
      $('#liOk', ov).onclick = () => {
        n.estado = 'liquidado';
        n.cfe = { tipo: 'e-Factura', serie: 'A', numero: SEQ.cfe++, cae: '9022' + String(4100000 + SEQ.cfe * 7).slice(-7),
          fecha: hoyISO(), estado: 'Aceptado', motivo: '' };
        ST.asientos = ST.asientos.filter(a => a.negocio !== n.id);
        ST.asientos.push(asientoLiquidacion(n));
        ordenarAsientos();
        cerrarModal(); render();
        aviso('Negocio <b>' + n.id + '</b> liquidado. e-Factura A' + n.cfe.numero + ' aceptada por DGI y asiento escrito');
        setTimeout(() => verLiquidacion(n.id, 'v'), 260);
      };
    },
  });
}

function cobrarYPagar(id) {
  const n = neg(id); if (!n) return;
  const k = calcNegocio(n);
  modal({
    titulo: 'Cobro y pago — negocio ' + n.id,
    cuerpo: `
      <div class="panelbox" style="margin-bottom:12px">${ic('plata')}
        Normalmente esto entra solo por la conciliación bancaria, cuando aparece el movimiento en el extracto.
        Acá lo podés registrar a mano.</div>
      <label class="check"><input type="checkbox" id="cpCob" ${n.cobrado ? 'checked disabled' : 'checked'}>
        Cobrado a ${esc(cli(n.comprador).nombre)} — ${usd(k.totalComprador)}</label>
      <div class="field" style="max-width:220px"><label>Fecha de cobro</label>
        <input type="date" id="cpFCob" value="${n.fechaCobro || hoyISO()}"></div>
      <hr class="sep">
      <label class="check"><input type="checkbox" id="cpPag" ${n.pagado ? 'checked disabled' : 'checked'}>
        Pagado a ${esc(cli(n.vendedor).nombre)} — ${usd(k.liquidoProductor)}</label>
      <div class="field" style="max-width:220px"><label>Fecha de pago</label>
        <input type="date" id="cpFPag" value="${n.fechaPago || hoyISO()}"></div>`,
    pie: `<button class="btn" data-cerrar>Cancelar</button>
      <button class="btn btn-pri" id="cpOk">Registrar</button>`,
    luego: ov => {
      $('#cpOk', ov).onclick = () => {
        if ($('#cpCob', ov).checked && !n.cobrado) registrarCobro(n, $('#cpFCob', ov).value || hoyISO());
        if ($('#cpPag', ov).checked && !n.pagado) registrarPago(n, $('#cpFPag', ov).value || hoyISO());
        if (n.cobrado && n.pagado) n.estado = 'cerrado';
        cerrarModal(); render();
        aviso('Negocio <b>' + n.id + '</b> ' + (n.estado === 'cerrado' ? 'cerrado' : 'actualizado'));
      };
    },
  });
}

function registrarCobro(n, f) {
  const k = calcNegocio(n);
  n.cobrado = true; n.fechaCobro = f;
  ST.asientos.push({ id: 'A-' + String(SEQ.asiento++).padStart(4, '0'), fecha: f,

/* Campo con autocompletado: si el nombre no existe, lo da de alta como cuenta nueva. */
function autocompletar(ov, inputId, ocultoId, filtro, alElegir) {
  const inp = $('#' + inputId, ov), hid = $('#' + ocultoId, ov);
  const cont = inp.parentNode;
  let lista = null, idx = -1;
  const cerrar = () => { if (lista) { lista.remove(); lista = null; idx = -1; } };
  const opciones = () => {
    const q = sinAcento(inp.value.trim());
    let l = ST.clientes.filter(c => !filtro || filtro.indexOf(c.tipo) >= 0);
    if (q) l = l.filter(c => sinAcento(c.nombre + ' ' + c.rut + ' ' + c.cod).indexOf(q) >= 0);
    return l.slice(0, 8);
  };
  const pintar = () => {
    cerrar();
    const ops = opciones();
    const q = inp.value.trim();
    const exacto = ST.clientes.some(c => sinAcento(c.nombre) === sinAcento(q));
    lista = document.createElement('div');
    lista.className = 'ac-list';
    lista.innerHTML = ops.map((c, i) => `<div data-id="${c.id}" class="${i === idx ? 'on' : ''}">
        ${ic('gente')}<span>${esc(c.nombre)}</span><span class="t-xs t-dim">${esc(c.paraje)}</span></div>`).join('') +
      (q && !exacto ? `<div data-nuevo="1" class="ac-new">${ic('mas')}Dar de alta «${esc(q)}» como cuenta nueva</div>` : '') +
      (!ops.length && !q ? `<div class="t-dim">Escribí para buscar</div>` : '');
    lista.querySelectorAll('[data-id]').forEach(d => d.onmousedown = e => {
      e.preventDefault();
      const c = ST.clientes.find(x => x.id === d.getAttribute('data-id'));
      inp.value = c.nombre; hid.value = c.id; cerrar(); if (alElegir) alElegir(c);
    });
    const nv = lista.querySelector('[data-nuevo]');
    if (nv) nv.onmousedown = e => {
      e.preventDefault();
      const c = crearCliente(q, filtro && filtro[0] === 'productor' ? 'productor' : (filtro && filtro[0]) || 'productor');
      inp.value = c.nombre; hid.value = c.id; cerrar();
      aviso('Di de alta a <b>' + esc(c.nombre) + '</b> como cuenta nueva');
      if (alElegir) alElegir(c);
    };
    cont.appendChild(lista);
  };
  inp.addEventListener('focus', pintar);
  inp.addEventListener('input', () => { hid.value = ''; pintar(); });
  inp.addEventListener('blur', () => setTimeout(cerrar, 140));
  inp.addEventListener('keydown', e => {
    if (!lista) return;
    const items = Array.from(lista.querySelectorAll('[data-id],[data-nuevo]'));
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); }
    else if (e.key === 'Enter' && idx >= 0 && items[idx]) { e.preventDefault(); items[idx].onmousedown(new Event('x')); return; }
    else if (e.key === 'Escape') { cerrar(); return; }
    else return;
    items.forEach((it, i) => it.classList.toggle('on', i === idx));
  });
}

function crearCliente(nombre, tipo) {
  const c = {
    id: uid('c'), cod: Math.max(...ST.clientes.map(x => x.cod)) + 1, nombre: nombre.trim(), tipo: tipo || 'productor',
    rut: '', dir: '', paraje: 'Montevideo', dicose: '', plazo: tipo === 'invernador' ? 30 : 45,
    tel: '', mail: '', contacto: nombre.trim(), nuevo: true,
  };
  ST.clientes.push(c);
  return c;
}

function guardarNegocio(ov, n) {
  const o = armarDesdeForm(ov, n);
  if (!o.vendedor) return aviso('Falta el vendedor', 'warn');
  if (!o.comprador) return aviso('Falta el comprador', 'warn');
  if (o.vendedor === o.comprador) return aviso('El vendedor y el comprador no pueden ser la misma cuenta', 'warn');
  if (!o.lineas.length || !o.lineas[0].cab || !o.lineas[0].bruto) return aviso('Faltan las cabezas o los kilos', 'warn');
  if (n) {
    Object.assign(n, o);
    recalcularFechas(n);
    if (n.estado === 'liquidado' || n.estado === 'cerrado') {
      ST.asientos = ST.asientos.filter(a => !(a.negocio === n.id && a.origen === 'liquidacion'));
      ST.asientos.push(asientoLiquidacion(n)); ordenarAsientos();
    }
    cerrarModal(); render();
    aviso('Negocio <b>' + n.id + '</b> actualizado; se rehicieron las liquidaciones y el asiento');
    setTimeout(() => abrirNegocio(n.id), 240);
  } else {
    o.id = String(SEQ.neg++);
    o.estado = 'pactado'; o.cfe = null; o.cobrado = false; o.pagado = false;
    o.fechaEmbarque = null; o.fechaFaena = null; o.loteId = null; o.nota = '';
    o.vencImpMun = sumarDias(o.fecha, 60); o.boleta = ''; o.dicoseC = ''; o.dicoseD = '';
    recalcularFechas(o);
    ST.negocios.unshift(o);
    cerrarModal(); irA('negocios');
    aviso('Negocio <b>' + o.id + '</b> creado. El próximo paso es el embarque');
    setTimeout(() => abrirNegocio(o.id), 240);
  }
}

    ok: () => {
      ST.negocios = ST.negocios.filter(x => x.id !== id);
      ST.asientos = ST.asientos.filter(a => a.negocio !== id);
      ST.banco.forEach(m => { if (m.negocio === id) { m.negocio = null; m.conciliado = false; } });

      cerrarTodosModales(); render();
      aviso('Negocio <b>' + id + '</b> eliminado', 'warn');
    },
  });
}

/* El lote se vuelve negocio sin que nadie vuelva a tipear las partes. */
function importarLote(id, ofertaId) {
  const l = ST.lotes.find(x => x.id === id); if (!l) return;
  const of = ofertaId ? l.ofertas.find(o => o.id === ofertaId) : l.ofertas.slice().sort((a, b) => b.pr - a.pr)[0];
  if (!of) return aviso('Ese lote todavía no tiene ofertas para cerrar', 'warn');
  const comprador = cli(of.comprador);
  const esFrig = comprador.tipo === 'frigorifico';
  cerrarTodosModales();
  const n = {
    id: String(SEQ.neg++), fecha: hoyISO(), tipo: esFrig ? 'frigorifico' : 'reposicion',
    modalidad: 'Consignación', sucursal: '1 General',
    vendedor: l.productor, comprador: of.comprador, agente: l.agente,
    tropa: String(2390 + ST.negocios.length), guia: '', boleta: '',
    dicoseA: l.dicose, dicoseB: comprador.dicose, dicoseC: '', dicoseD: '',
    moneda: 'USD', cotizacion: CFG.cotizacion, unidad: 'Kilos',
    tipoProducto: (CATEGORIAS.find(c => c.n === l.cat) || { esp: 'Vacunos' }).esp,
    retImpuestos: true, segundaBalanza: esFrig,
    comVenta: esFrig ? CFG.comVentaFrig : CFG.comVentaRepo,
    comCompra: esFrig ? CFG.comCompraFrig : CFG.comCompraRepo,
    rendEst: esFrig ? 53 : null,
    plazoVenta: cli(l.productor).plazo, plazoCompra: comprador.plazo, plazoGastos: CFG.plazoGastos,
    estado: 'pactado', nota: 'Importado del lote ' + l.id + ' de la app', foto: false,
    lineas: [{ cat: l.cat, raza: l.raza, cab: l.cab, bruto: l.cab * l.peso, tara: esFrig ? 0 : 3.5, carc: null, pr: of.pr }],
    fechaEmbarque: null, fechaFaena: null, loteId: l.id, cfe: null,
    cobrado: false, pagado: false, fechaCobro: null, fechaPago: null,
    vencImpMun: sumarDias(hoyISO(), 60),
  };
  n.gastos = gastosDe(n.lineas[0].bruto, n.tipo);
  recalcularFechas(n);
  ST.negocios.unshift(n);
  l.estado = 'importado'; l.negocio = n.id;
  l.ofertas.forEach(o => o.ganadora = o.id === of.id);
  irA('negocios');
  aviso('Lote <b>' + l.id + '</b> importado como negocio <b>' + n.id + '</b>, con las dos puntas y el DICOSE cargados');
  setTimeout(() => abrirNegocio(n.id), 300);
}

function simularOferta(id) {
  const l = ST.lotes.find(x => x.id === id); if (!l) return;
  const candidatos = ST.clientes.filter(c => (c.tipo === 'frigorifico') === !!(CATEGORIAS.find(x => x.n === l.cat) || {}).gordo);
  const c = candidatos[Math.floor(Math.random() * candidatos.length)] || ST.clientes[0];
  const pr = redondear(l.pedido * (0.96 + Math.random() * 0.06), 2);
  l.ofertas.push({ id: l.id + '-O' + (l.ofertas.length + 1), comprador: c.id, pr, fecha: hoyISO(), ganadora: false });
  l.estado = 'ofertas';
  ST.avisos.unshift({ f: hoyISO(), i: 'plata', t: 'Oferta en ' + l.id + ' — ' + usd(pr) + '/kg', s: c.nombre, ir: () => abrirLote(l.id) });
  cerrarModal(); render();
  aviso('Entró una oferta de <b>' + esc(c.nombre) + '</b> por ' + usd(pr) + ' el kilo');
  setTimeout(() => abrirLote(l.id), 240);
}

            <td class="num"><button class="linkish" onclick="verLiquidacion('${n.id}','c')">${num(k.totalComprador)}</button></td>
            <td class="num t-strong">${num(k.ingresoCM)}</td>
            <td>${n.cfe ? `<span class="tag ${n.cfe.estado === 'Aceptado' ? 'tag-b' : n.cfe.estado === 'Pendiente' ? 'tag-w' : 'tag-d'}">${esc(n.cfe.serie)} ${n.cfe.numero}</span>` : '—'}</td>

          'Cuando liquides un negocio aparecen acá las dos puntas.')}
      </div>

  };
};

function verLiquidacion(id, punta) {
  const n = neg(id); if (!n) return;
  const k = calcNegocio(n);
  const esV = punta === 'v';
  const c = esV ? cli(n.vendedor) : cli(n.comprador);
  const filas = esV
    ? [['Importe de la hacienda', k.importe], ['Comisión de venta ' + num(n.comVenta, 4) + '%', -k.comVenta],
       ['IVA sobre comisión ' + pct(CFG.iva, 0), -k.ivaVenta]]
       .concat(n.retImpuestos ? [['Retención IMEBA ' + pct(CFG.imeba), -k.imeba]] : [])
       .concat((n.gastos || []).filter(g => g.aCargo === 'v').map(g => [g.concepto, -g.importe]))
    : [['Importe de la hacienda', k.importe], ['Comisión de compra ' + num(n.comCompra, 4) + '%', k.comCompra],
       ['IVA sobre comisión ' + pct(CFG.iva, 0), k.ivaCompra]]
       .concat((n.gastos || []).filter(g => g.aCargo === 'c').map(g => [g.concepto, g.importe]));
  const total = esV ? k.liquidoProductor : k.totalComprador;

  modal({
    titulo: 'Liquidación ' + (esV ? 'al productor' : 'al comprador'),
    sub: 'Negocio ' + n.id + ' &middot; ' + esc(c.nombre),
    ancho: 'wide',
    cuerpo: `<div class="doc" id="docLiq">

          <rect width="40" height="40" rx="9" fill="#1F7A4D"/>

          <path d="M22 27c3.4-1.6 5.7-4.3 7-8.2" stroke="#FFFFFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="29" cy="13.5" r="3" fill="#EFD9A8"/></svg>
        <div><strong style="font-size:15px">${esc(CFG.empresa)}</strong>
          <div class="t-xs t-dim">${esc(CFG.direccion)}<br>RUT ${esc(CFG.rut)} &middot; ${esc(CFG.telefono)}</div></div>
        <div class="doc-t"><strong>Liquidación ${esV ? 'de venta' : 'de compra'}</strong>
          <div class="t-xs">Negocio ${n.id} &middot; ${fecha(n.fechaBase)}</div>
          ${n.cfe ? `<div class="t-xs">e-Factura ${esc(n.cfe.serie)} ${n.cfe.numero}</div>` : ''}</div>
      </div>
      <div class="grid g2" style="gap:12px;margin-bottom:12px">
        <div><div class="t-xs t-dim">${esV ? 'Productor' : 'Comprador'}</div>
          <div style="font-weight:700">${esc(c.nombre)}</div>
          <div class="t-xs">RUT ${esc(c.rut || '—')} &middot; ${esc(c.dir || '—')}, ${esc(c.paraje)}</div>
          <div class="t-xs">DICOSE ${esc(esV ? n.dicoseA : n.dicoseB)}</div></div>
        <div><div class="t-xs t-dim">Tropa y guía</div>
          <div style="font-weight:700">Tropa ${esc(n.tropa || '—')}</div>
          <div class="t-xs">Guía ${esc(n.guia || '—')}</div>
          <div class="t-xs">${n.tipo === 'frigorifico' ? 'Faena del ' + fecha(n.fechaFaena) : 'Embarque del ' + fecha(n.fechaEmbarque)}</div></div>
      </div>
      <table><thead><tr><th>Categoría</th><th>Raza</th><th class="num">Cab.</th><th class="num">Kg en pie</th>
        <th class="num">Kg ${n.tipo === 'frigorifico' ? 'carcasa' : 'netos'}</th><th class="num">Rend.</th>
        <th class="num">Precio</th><th class="num">Importe</th></tr></thead>
        <tbody>${k.lineas.map(l => `<tr><td>${esc(l.cat)}</td><td>${esc(l.raza)}</td>
          <td class="num">${num(l.cab, 0)}</td><td class="num">${num(l.bruto, 0)}</td>
          <td class="num">${num(l.neto)}</td><td class="num">${num(l.rend, 3)}%</td>
          <td class="num">${num(l.pr, 4)}</td><td class="num">${num(l.importe)}</td></tr>`).join('')}</tbody></table>
      <hr class="sep">
      <div style="max-width:420px;margin-left:auto">
        ${filas.map(f => filaLiq(f[0], f[1])).join('')}
        <hr class="sep" style="margin:8px 0">
        ${filaLiq(esV ? 'Líquido a pagar' : 'Total a cobrar', total, true)}
        <div class="t-xs t-dim" style="text-align:right;margin-top:4px">
          ${uyu(redondear(total * n.cotizacion, 2))} a cotización ${num(n.cotizacion, 3)}</div>
        <div class="t-xs t-dim" style="text-align:right">
