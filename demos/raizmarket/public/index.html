<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5A3A">
<title>Raíz Market · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EA; --panel:#FFFFFF; --ink:#18261D; --ink-2:#5A6A5F; --ink-3:#98A59C; --line:#E6E3D6;
  --brand:#1F5A3A; --brand-2:#2E7A51; --brand-soft:#DBE9E0; --sun:#F7DC1B; --sun-soft:#FFF6C2;
  --peach:#FFDFB8; --ok:#2E7A51; --ok-soft:#DFF0E4; --warn:#C98A12; --warn-soft:#FFF1D2; --bad:#C11900; --bad-soft:#FBE3DE;
  --r:14px; --r-lg:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#E3E9DF;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
/* marco: en el celular ocupa todo, en la compu se ve como un teléfono */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:0}
.aside-note{display:none;max-width:320px;color:var(--brand)}
.aside-note h2{font-size:28px;margin:0 0 10px;line-height:1.15}
.aside-note p{color:var(--ink-2);line-height:1.5}
.aside-note .qr{display:flex;gap:10px;align-items:center;background:#fff;border-radius:var(--r);padding:12px 14px;margin-top:16px;font-weight:700}
.phone{width:100%;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:900px){
  .stage{padding:24px}
  .aside-note{display:block}
  .phone{width:400px;height:min(860px,calc(100vh - 48px));border-radius:44px;border:10px solid #14201A;box-shadow:0 30px 80px rgba(20,32,26,.35)}
}
.top{background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:10px;flex:none}
.top img{height:30px}
.top .t{margin-left:auto;text-align:right;font-size:12px;opacity:.85;line-height:1.2}
.top .t b{display:block;font-size:14px;opacity:1}
.scroll{flex:1;overflow:auto;padding:16px 16px 110px}
.h1{font-size:22px;font-weight:900;margin:2px 0 12px;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.h2 .more{margin-left:auto;font-size:13px;color:var(--brand-2);font-weight:800;background:none;border:0;padding:0}
.card{background:var(--panel);border-radius:var(--r-lg);padding:16px;box-shadow:0 1px 0 var(--line)}
.card+.card{margin-top:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border-radius:var(--r-lg);padding:14px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
.kpi .v{font-size:23px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-weight:800;color:var(--ok);display:flex;align-items:center;gap:3px}
.kpi .d.neg{color:var(--bad)}.kpi .d.n{color:var(--ink-3)}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:#fff}
.kpi.hero .l{color:#CFE3D5}.kpi.hero .v{font-size:32px}.kpi.hero .d{color:var(--sun)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qbtn{background:var(--panel);border:0;border-radius:var(--r-lg);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px}
.qbtn .ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.qbtn:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.tap{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;background:var(--brand-soft);color:var(--brand)}
.av.rest{background:var(--peach);color:#8A4B06}
.grow{flex:1;min-width:0}
.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:900;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt small{display:block;font-size:11.5px;font-weight:700;color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-n{background:#EEECE3;color:var(--ink-2)}.p-sun{background:var(--sun-soft);color:#7A6A00}.p-peach{background:var(--peach);color:#8A4B06}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:800;background:#EEECE3;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--brand);color:#fff}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.seg{display:flex;background:#E9E6DA;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:0;background:#fff;border-radius:20px;padding:7px 13px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--r);padding:11px 13px;margin-bottom:12px;color:var(--ink-3)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bars .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:7px 7px 3px 3px;overflow:hidden;background:var(--brand-soft)}
.bars .stack i{display:block;background:var(--brand-2)}
.bars .b span{font-size:10.5px;color:var(--ink-3);font-weight:700}
.bars .b.cur .stack{outline:2px solid var(--sun)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.meter{height:8px;background:#EEECE3;border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--brand-2);border-radius:6px}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:8px 0}
.tip{display:flex;gap:12px;background:#fff;border-radius:var(--r-lg);padding:14px;margin-bottom:10px;border-left:5px solid var(--sun)}
.tip .ti{width:36px;height:36px;border-radius:50%;background:var(--sun-soft);color:#7A6A00;display:grid;place-items:center;flex:none}
.tip b{display:block;margin-bottom:2px}
.tip p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.tip .act{margin-top:8px}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--ink-3);padding:6px 0}
.tabbar button.on{color:var(--brand)}
.tabbar .plus{margin-top:-24px}
.tabbar .plus span.c{width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,90,58,.25);font-size:22px}
/* hoja inferior */
.sheet-bg{position:absolute;inset:0;background:rgba(20,32,26,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .25s ease-out}
.sheet .sh{display:flex;align-items:center;padding:14px 16px 10px;gap:10px}
.sheet .sh h3{margin:0;font-size:18px;font-weight:900}
.sheet .sh .x{margin-left:auto;border:0;background:#E9E6DA;border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5D1C2;margin:8px auto 0}
.sheet .sb{overflow:auto;padding:4px 16px 16px;flex:1}
.sheet .sf{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.noanim,.noanim .sheet{animation:none}
.steps{display:flex;gap:6px;margin:0 16px 8px}
.steps i{flex:1;height:4px;border-radius:3px;background:#DDD9CB}
.steps i.on{background:var(--brand-2)}
.prod{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.prod .pi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:10px;border:0;background:#EEECE3;font-weight:900;display:grid;place-items:center}
.stepper button.add{background:var(--brand);color:#fff}
.stepper span{min-width:22px;text-align:center;font-weight:900}
.field{display:block;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--ink-2)}
.field input,.field select{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
.field input:focus,.field select:focus{outline:0;border-color:var(--brand-2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:800;font-size:13.5px;text-align:left;display:flex;align-items:center;gap:8px}
.opt.on{border-color:var(--brand-2);background:var(--ok-soft);color:var(--brand)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;display:flex;gap:10px;align-items:center;z-index:40;font-weight:700;font-size:14px;animation:up .25s}
.toast .ic{color:var(--sun)}
.empty{color:var(--ink-3);text-align:center;padding:24px 0;font-weight:700}
.big-total{font-size:22px;font-weight:900}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px auto 10px;font-size:28px}
.muted{color:var(--ink-2)}
.center{text-align:center}
.sep{height:1px;background:var(--line);margin:10px 0}
.line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.line b{font-variant-numeric:tabular-nums}
.dim{color:var(--ink-3);font-weight:700;font-size:12.5px}
</style>
</head>

function linea(id,q,rest){const p=P(id);return {id,q,p:rest?p.pm:p.p,c:p.c};}
function nuevaVenta(cli,fecha,items,pago,entregada){
  const total=sum(items,i=>i.q*i.p), costo=sum(items,i=>i.q*i.c);
  return {id:++nroV,cli,fecha,items,total,costo,pago,cobrada:pago!=='cuenta',entregada};
}
const EXTRAS_FAM=[[7,1],[3,1],[4,1],[19,1],[15,1],[16,1],[13,1],[11,1],[6,1],[5,1],[21,1],[1,4],[9,1],[20,1],[14,1],[17,1]];
const EXTRAS_REST=[[8,3],[10,2],[1,24],[2,12],[12,4],[6,4],[3,6],[14,4],[18,3]];
for(const c of clientes){
  const rest=c.t==='rest';
  let off=Math.floor(rnd()*c.f);
  for(let d=84-off; d>=0; d-=c.f){
    const semAtras=Math.floor(d/7);
    if(c.desde!=null && semAtras>c.desde) continue;
    if(c.hasta!=null && semAtras<c.hasta) continue;
    if(c.menos && semAtras<5 && rnd()<.5) continue;
    const f=new Date(HOY-Math.round(d)*DAY); f.setHours(8+Math.floor(rnd()*10),Math.floor(rnd()*60));
    if(f>new Date()) f.setTime(Date.now()-3600000);
    const items=[];
    if(!rest){
      if(c.plan) items.push(linea(c.plan,1,false));
      const n=(c.plan?0:2)+Math.floor(rnd()*3);
      for(let k=0;k<n;k++){const [id,q]=EXTRAS_FAM[Math.floor(rnd()*EXTRAS_FAM.length)];if(!items.find(i=>i.id===id))items.push(linea(id,q,false));}
    }else{
      const n=3+Math.floor(rnd()*3);
      for(let k=0;k<n;k++){const [id,q]=EXTRAS_REST[Math.floor(rnd()*EXTRAS_REST.length)];if(!items.find(i=>i.id===id))items.push(linea(id,Math.max(1,Math.round(q*(.7+rnd()*.6))),true));}
    }
    const pago=rest?(c.deuda&&d<20?'cuenta':'transf'):['transf','transf','mp','efectivo'][Math.floor(rnd()*4)];
    ventas.push(nuevaVenta(c.id,f,items,pago,d>0||rnd()<.35));
  }
}

function rango(per, atras=0){
  const dias = per==='semana'?7:per==='mes'?30:90;
  const hasta=new Date(HOY.getTime()+DAY/2 - atras*dias*DAY), desde=new Date(hasta-dias*DAY);
  return [desde,hasta];
}
const enRango = (arr,[d,h]) => arr.filter(x=>x.fecha>=d&&x.fecha<h);
function resumen(per,atras=0){
  const r=rango(per,atras), vs=enRango(ventas,r), gs=enRango(gastos,r);
  const venta=sum(vs,v=>v.total), costo=sum(vs,v=>v.costo), gasto=sum(gs,g=>g.total);
  return {vs,venta,costo,margen:venta-costo,gasto,gan:venta-costo-gasto,ped:vs.length};
}
function porProducto(vs){const m={};vs.forEach(v=>v.items.forEach(i=>{const x=m[i.id]||(m[i.id]={id:i.id,q:0,venta:0,costo:0});x.q+=i.q;x.venta+=i.q*i.p;x.costo+=i.q*i.c;}));return Object.values(m).map(x=>({...x,gan:x.venta-x.costo,mg:(x.venta-x.costo)/x.venta*100}));}
function porCliente(vs){const m={};vs.forEach(v=>{const x=m[v.cli]||(m[v.cli]={id:v.cli,n:0,venta:0,gan:0});x.n++;x.venta+=v.total;x.gan+=v.total-v.costo;});return m;}
const variacion = (a,b) => b ? (a-b)/b*100 : 0;
const deltaHtml = (a,b,lbl) => { const v=variacion(a,b); lbl=lbl||(periodo==='semana'?'la semana anterior':periodo==='mes'?'los 30 días anteriores':'los 3 meses anteriores'); return `<div class="d ${v>=0?'':'neg'}">${ico(v>=0?'up':'down')}${Math.abs(Math.round(v))}% contra ${lbl}</div>`; };
function ultimaCompra(cid){return ventas.find(v=>v.cli===cid);}
function deuda(cid){return sum(ventas.filter(v=>v.cli===cid&&!v.cobrada),v=>v.total);}
function tendencia(cid){const a=sum(enRango(ventas,rango('mes')).filter(v=>v.cli===cid),v=>v.total),b=sum(enRango(ventas,rango('mes',1)).filter(v=>v.cli===cid),v=>v.total);return {a,b,v:variacion(a,b)};}

  const f=new Date(); if(draft.cuando==='man'){f.setDate(f.getDate()+1);}
  const v=nuevaVenta(draft.cli,draft.cuando==='man'?new Date():f,items,draft.pago,draft.cuando==='ya');ventas.unshift(v);
  sheet('Listo',`<div class="done-ic">${ico('check')}</div><div class="center"><div class="big-total">${fmt(v.total)}</div><p class="muted" style="margin:4px 0 14px">${C(v.cli).n} · ${PAGOS[v.pago]}</p></div>
  <div class="card"><div class="line"><span>Te costó</span><b>${fmt(v.costo)}</b></div><div class="line" style="color:var(--ok)"><span><b>Ganaste en esta venta</b></span><b>${fmt(v.total-v.costo)} (${pct((v.total-v.costo)/v.total*100)})</b></div></div>`,
  `<button class="btn" style="flex:1" onclick="toast('Resumen enviado por WhatsApp a ${C(v.cli).n}')">${ico('msg')}Mandar resumen</button><button class="btn pri" style="flex:1" onclick="closeSheet();render()">Listo</button>`);
  catProd='Todos';render();
}
function nuevaCompra(){
  sheet('Anotar compra',`<label class="field">¿Dónde compraste?<select id="cp">${PROVS.map(p=>`<option>${p}</option>`).join('')}</select></label>
  <label class="field">Producto<select id="cprod">${productos.filter(p=>p.cat!=='Planes').map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select></label>
  <div class="opts" style="margin:0"><label class="field">Cantidad<input id="cq" type="number" inputmode="numeric" value="40"></label><label class="field">Pagaste en total<input id="ct" type="number" inputmode="numeric" value="1400"></label></div>
  <div class="card" id="cprev"></div>`,`<button class="btn pri full" onclick="guardarCompra()">${ico('check')}Guardar compra</button>`);
  const upd=()=>{const p=P(+$('#cprod').value),q=+$('#cq').value||1,t=+$('#ct').value||0,u=t/q,mg=(p.p-u)/p.p*100;$('#cprev').innerHTML=`<div class="line"><span>Te sale cada ${p.u}</span><b>${fmt(u)}</b></div><div class="line"><span>Lo vendés a</span><b>${fmt(p.p)}</b></div><div class="line" style="color:${mg<30?'var(--bad)':'var(--ok)'}"><span><b>Te deja</b></span><b>${fmt(p.p-u)} por ${p.u} (${pct(mg)})</b></div>${mg<30?`<p class="dim" style="color:var(--bad);margin:6px 0 0">Ojo: con este costo el margen queda bajo. Pensá en subir el precio.</p>`:''}`;};
  ['cprod','cq','ct'].forEach(i=>$('#'+i).oninput=upd);upd();
}
function guardarCompra(){const p=P(+$('#cprod').value),q=+$('#cq').value||1,t=+$('#ct').value||0;p.c=Math.round(t/q);compras.unshift({fecha:new Date(),prov:$('#cp').value,det:q+' x '+p.n,total:t});closeSheet();render();toast('Compra anotada. Actualicé el costo de '+p.n+'.');}
function nuevoGasto(){
  sheet('Anotar gasto',`<div class="opts">${['Nafta','Bolsas y envases','Celular','Otros'].map((g,i)=>`<button class="opt ${i===0?'on':''}" data-g="${g}" onclick="document.querySelectorAll('[data-g]').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${ico(i===0?'fuel':i===1?'box':i===2?'phone':'cash')}${g}</button>`).join('')}</div><label class="field">¿Cuánto?<input id="gm" type="number" inputmode="numeric" value="1500"></label>`,`<button class="btn pri full" onclick="guardarGasto()">${ico('check')}Guardar gasto</button>`);
  setTimeout(()=>$('#gm').select(),50);
}
function guardarGasto(){const g=document.querySelector('[data-g].on').dataset.g,m=+$('#gm').value||0;gastos.unshift({fecha:new Date(),cat:g,det:'',total:m});closeSheet();render();toast('Gasto anotado: '+g+' '+fmt(m));}

// ---------- Clientes ----------
VIEWS.clientes=()=>{
  const conDatos=clientes.map(c=>{const u=ultimaCompra(c.id),t=tendencia(c.id);return {...c,u,t,dias:u?diasDesde(u.fecha):999,total:sum(ventas.filter(v=>v.cli===c.id),v=>v.total)};});
  const dormidos=conDatos.filter(c=>c.dias>c.f*2+2);
  let lista=conDatos.filter(c=>filtroCli==='todos'||(filtroCli==='fam'&&c.t==='fam')||(filtroCli==='rest'&&c.t==='rest')||(filtroCli==='dorm'&&dormidos.includes(c))).filter(c=>!qCli||c.n.toLowerCase().includes(qCli.toLowerCase()));
  lista.sort((a,b)=>b.total-a.total);
  $('#view').innerHTML=`<div class="h1">Clientes</div>
  <div class="search">${ico('search')}<input id="qcli" placeholder="Buscar" value="${qCli}"></div>
  <div class="chips">${[['todos','Todos'],['fam','Familias'],['rest','Restaurantes'],['dorm','No compran hace rato ('+dormidos.length+')']].map(([k,l])=>`<button class="chip ${filtroCli===k?'on':''}" onclick="filtroCli='${k}';VIEWS.clientes()">${l}</button>`).join('')}</div>
  <div class="card" style="padding:4px 14px">${lista.map(c=>`<div class="item tap" onclick="verCliente(${c.id})"><div class="av ${c.t==='rest'?'rest':''}">${ini(c.n)}</div><div class="grow"><div class="name">${c.n}</div><div class="sub">${c.u?'Última compra: '+fcorta(c.u.fecha).toLowerCase():'Sin compras'}${c.plan?' · '+P(c.plan).n:''}</div></div><div class="amt">${fmt(c.t.a)}<small style="color:${c.t.v<-10?'var(--bad)':c.t.v>10?'var(--ok)':'var(--ink-3)'}">${c.t.b||c.t.a?(c.t.v>10?'Compra más':c.t.v<-10?'Compra menos':'Igual'):'Nuevo'}</small></div></div>`).join('')||'<div class="empty">Nadie por acá</div>'}</div>
  <p class="dim center" style="margin-top:10px">El monto es lo que compró en los últimos 30 días.</p>`;
  const i=$('#qcli');i.oninput=()=>{qCli=i.value;VIEWS.clientes();const n=$('#qcli');n.focus();n.setSelectionRange(qCli.length,qCli.length);};
};
function verCliente(id){
  const c=C(id),vs=ventas.filter(v=>v.cli===id),t=tendencia(id),u=vs[0];
  const pp=porProducto(vs).sort((a,b)=>b.q-a.q).slice(0,4);
  const semanas=[];for(let s=7;s>=0;s--){const d=new Date(HOY-(s+1)*7*DAY+DAY/2),h=new Date(HOY-s*7*DAY+DAY/2);semanas.push(sum(vs.filter(v=>v.fecha>=d&&v.fecha<h),v=>v.total));}
  const mx=Math.max(...semanas,1);
  sheet(c.n,`<div class="row" style="margin-bottom:12px"><span class="pill ${c.t==='rest'?'p-peach':'p-n'}">${c.t==='rest'?'Restaurante':'Familia'} · ${c.b}</span>${c.plan?`<span class="pill p-sun">${P(c.plan).n}</span>`:''}</div>
  <div class="kpis"><div class="kpi"><div class="l">Este mes</div><div class="v">${fmt(t.a)}</div><div class="d ${t.v<0?'neg':''}">${ico(t.v>=0?'up':'down')}${Math.abs(Math.round(t.v))}% vs mes anterior</div></div><div class="kpi"><div class="l">Te dejó de ganancia</div><div class="v">${fmt(sum(vs,v=>v.total-v.costo))}</div><div class="d n">en 3 meses</div></div></div>
  <div class="card" style="margin-top:10px"><div class="dim">Lo que compró cada semana</div><div class="bars" style="height:90px">${semanas.map((s,i)=>`<div class="b ${i===7?'cur':''}"><div class="stack" style="height:${s/mx*100}%;background:${c.t==='rest'?'#F2B872':'var(--brand-2)'}"></div><span>${i===7?'Esta':'-'+(7-i)}</span></div>`).join('')}</div></div>
  <div class="card"><div class="dim" style="margin-bottom:4px">Lo que más lleva</div>${pp.map(p=>`<div class="line"><span>${P(p.id).n}</span><b>${p.q} en total</b></div>`).join('')}</div>
  ${deuda(id)?`<div class="tip" style="border-left-color:var(--bad)"><div class="ti" style="background:var(--bad-soft);color:var(--bad)">${ico('cash')}</div><div><b>Te debe ${fmt(deuda(id))}</b><p>Pedidos anotados a cuenta.</p></div></div>`:''}
  ${u&&diasDesde(u.fecha)>c.f*2+2?`<div class="tip"><div class="ti">${ico('bulb')}</div><div><b>Hace ${diasDesde(u.fecha)} días que no compra</b><p>Antes compraba cada ${Math.round(c.f)} días. Capaz vale la pena escribirle.</p></div></div>`:''}`,
  `<button class="btn" style="flex:1" onclick="toast('Abriendo WhatsApp con ${c.n}')">${ico('msg')}WhatsApp</button><button class="btn pri" style="flex:1" onclick="draft={cli:${id},items:{},pago:'${c.t==='rest'?'cuenta':'transf'}',cuando:'hoy'};pasoProductos()">${ico('cart')}Nueva venta</button>`);
}

// ---------- Números ----------
function consejos(){
  const r=resumen('mes'), pp=porProducto(r.vs).filter(p=>P(p.id).cat!=='Planes'&&p.venta>2000);
  const tips=[];
  const peor=pp.slice().sort((a,b)=>a.mg-b.mg)[0];
  if(peor){const p=P(peor.id),nuevo=Math.ceil(p.c/0.65/10)*10;tips.push({i:'bulb',t:`${p.n} te deja poco`,d:`Ganás ${pct(peor.mg)} de lo que vendés. Si lo pasás de ${fmt(p.p)} a ${fmt(nuevo)}, quedás en 35%.`,a:`<button class="btn sm sun" onclick="precio(${p.id},${nuevo})">Subir a ${fmt(nuevo)}</button>`});}
  const dorm=clientes.map(c=>({c,u:ultimaCompra(c.id)})).filter(x=>x.u&&diasDesde(x.u.fecha)>x.c.f*2+2).sort((a,b)=>diasDesde(a.u.fecha)-diasDesde(b.u.fecha));
  if(dorm.length)tips.push({i:'users',t:`${dorm.length} cliente${dorm.length>1?'s':''} dejaron de comprar`,d:`${dorm.slice(0,2).map(x=>x.c.n).join(' y ')}${dorm.length>2?' y otros':''}. Antes compraban seguido.`,a:`<button class="btn sm sun" onclick="filtroCli='dorm';go('clientes')">Ver quiénes</button>`});
  const vf=sum(r.vs.filter(v=>C(v.cli).t==='fam'),v=>v.total),gf=sum(r.vs.filter(v=>C(v.cli).t==='fam'),v=>v.total-v.costo),vr=r.venta-vf,gr=r.margen-gf;
  if(vr)tips.push({i:'store',t:'Los restaurantes compran mucho pero dejan menos',d:`Son el ${pct(vr/r.venta*100)} de lo que vendés pero el ${pct(gr/r.margen*100)} de lo que ganás. Las familias te dejan ${pct(gf/vf*100)} y los restaurantes ${pct(gr/vr*100)}.`});
  const planes=r.vs.filter(v=>v.items.some(i=>P(i.id).cat==='Planes'));
  tips.push({i:'repeat',t:'Los planes son lo más estable',d:`${pct(planes.length/r.ped*100)} de los pedidos del mes fueron planes. Pasar clientes sueltos a un plan te asegura la venta de cada semana.`});
  const gN=sum(enRango(gastos,rango('mes')).filter(g=>g.cat==='Nafta'),g=>g.total);
  tips.push({i:'fuel',t:'Nafta',d:`Gastaste ${fmt(gN)} en nafta este mes: ${fmt(gN/Math.max(r.ped,1))} por pedido. Juntar entregas por barrio el mismo día lo baja.`});
  return tips;
}
const tipHtml=t=>`<div class="tip"><div class="ti">${ico(t.i)}</div><div><b>${t.t}</b><p>${t.d}</p>${t.a?`<div class="act">${t.a}</div>`:''}</div></div>`;
function precio(id,n){const p=P(id);sheet('Cambiar precio',`<div class="card"><div class="line"><span>${p.n}</span><b></b></div><div class="line"><span>Te cuesta</span><b>${fmt(p.c)}</b></div><div class="line"><span>Precio actual</span><b>${fmt(p.p)}</b></div><div class="line" style="color:var(--ok)"><span><b>Precio nuevo</b></span><b>${fmt(n)}</b></div><div class="line"><span>Ganancia por ${p.u}</span><b>${fmt(p.p-p.c)} pasa a ${fmt(n-p.c)}</b></div></div><p class="dim" style="margin-top:10px">El precio nuevo se usa desde la próxima venta. Si querés, también lo cambiamos en la web.</p>`,`<button class="btn" onclick="closeSheet()">Ahora no</button><button class="btn pri" style="flex:1" onclick="P(${id}).p=${n};closeSheet();render();toast('Precio actualizado')">Confirmar</button>`);}

VIEWS.numeros=()=>{
  const r=resumen(periodo),a=resumen(periodo,1);
  const pp=porProducto(r.vs), ppA=porProducto(a.vs);
  const top=pp.slice().sort((x,y)=>y.venta-x.venta), deja=pp.slice().sort((x,y)=>y.gan-x.gan);
  const menos=pp.map(p=>{const b=ppA.find(x=>x.id===p.id);return {...p,v:variacion(p.q,b?b.q:0)};}).filter(p=>P(p.id).cat!=='Planes').sort((x,y)=>x.v-y.v);
  const nSem=periodo==='3m'?12:8, sems=[];for(let s=nSem-1;s>=0;s--){const d=new Date(HOY-(s+1)*7*DAY+DAY/2),h=new Date(HOY-s*7*DAY+DAY/2),vs=ventas.filter(v=>v.fecha>=d&&v.fecha<h);sems.push([sum(vs,v=>v.total),sum(vs,v=>v.total-v.costo)]);}
  const mx=Math.max(...sems.map(s=>s[0]),1);
  const pc=porCliente(r.vs),pcA=porCliente(a.vs);
  const cl=clientes.map(c=>({c,a:(pc[c.id]||{venta:0}).venta,b:(pcA[c.id]||{venta:0}).venta,g:(pc[c.id]||{gan:0}).gan}));
  const vf=sum(r.vs.filter(v=>C(v.cli).t==='fam'),v=>v.total),vr=r.venta-vf;
  $('#view').innerHTML=`<div class="h1">¿Cómo te está yendo?</div>
  <div class="seg">${[['semana','Semana'],['mes','Mes'],['3m','3 meses']].map(([k,l])=>`<button class="${periodo===k?'on':''}" onclick="periodo='${k}';VIEWS.numeros()">${l}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi hero"><div class="l">Lo que te quedó en el bolsillo</div><div class="v">${fmt(r.gan)}</div>${deltaHtml(r.gan,a.gan)}</div>
    <div class="kpi"><div class="l">Vendiste</div><div class="v">${fmt(r.venta)}</div>${deltaHtml(r.venta,a.venta)}</div>
    <div class="kpi"><div class="l">Margen</div><div class="v">${pct(r.margen/r.venta*100)}</div><div class="d n">de cada $100, ganás $${Math.round(r.margen/r.venta*100)}</div></div>
    <div class="kpi"><div class="l">Pedidos</div><div class="v">${r.ped}</div><div class="d n">ticket ${fmt(r.venta/Math.max(r.ped,1))}</div></div>
    <div class="kpi"><div class="l">Gastos</div><div class="v">${fmt(r.gasto)}</div><div class="d n">nafta, bolsas y otros</div></div>
  </div>
  <div class="card" style="margin-top:10px"><div class="dim" style="margin-bottom:6px">Cuentas de ${periodo==='semana'?'la semana':periodo==='mes'?'los últimos 30 días':'los últimos 3 meses'}</div><div class="line"><span>Vendiste</span><b>${fmt(r.venta)}</b></div><div class="line muted"><span>Te costó la mercadería</span><b>- ${fmt(r.costo)}</b></div><div class="line muted"><span>Gastos</span><b>- ${fmt(r.gasto)}</b></div><div class="sep"></div><div class="line"><span><b>Te quedó</b></span><b style="color:var(--ok)">${fmt(r.gan)}</b></div></div>
  <div class="h2">${ico('chart')}Semana a semana</div>
  <div class="card"><div class="bars">${sems.map((s,i)=>`<div class="b ${i===nSem-1?'cur':''}"><div class="stack" style="height:${s[0]/mx*100}%"><i style="height:${s[1]/Math.max(s[0],1)*100}%"></i></div><span>${i===nSem-1?'Esta':'-'+(nSem-1-i)}</span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--brand-soft)"></i>Vendido</span><span><i style="background:var(--brand-2)"></i>Ganancia</span></div></div>
  <div class="h2">${ico('bulb')}Qué podés mejorar</div>
  ${consejos().map(tipHtml).join('')}
  <div class="h2">${ico('leaf')}Lo que más se vende</div>
  <div class="card">${top.slice(0,6).map(p=>`<div style="margin-bottom:10px"><div class="line" style="padding:0"><span><b>${P(p.id).n}</b> <span class="dim">${p.q} ${P(p.id).u}${p.q>1&&P(p.id).u!=='kg'?'s':''}</span></span><b>${fmt(p.venta)}</b></div><div class="meter"><i style="width:${p.venta/top[0].venta*100}%"></i></div></div>`).join('')}</div>
  <div class="h2">${ico('cash')}Lo que más ganancia te deja</div>
  <div class="card" style="padding:4px 14px">${deja.slice(0,5).map((p,i)=>`<div class="item"><div class="av">${i+1}</div><div class="grow"><div class="name">${P(p.id).n}</div><div class="sub">Margen ${pct(p.mg)}</div></div><div class="amt">${fmt(p.gan)}</div></div>`).join('')}</div>
  <div class="h2">${ico('down')}Lo que se vende menos que antes</div>
  <div class="card" style="padding:4px 14px">${menos.slice(0,4).map(p=>`<div class="item"><div class="pi" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad)">${ico('down')}</div><div class="grow"><div class="name">${P(p.id).n}</div><div class="sub">${p.q} vendidos</div></div><span class="pill p-bad">${Math.round(p.v)}%</span></div>`).join('')}</div>
  <div class="h2">${ico('users')}Familias y restaurantes</div>
  <div class="card"><div class="split"><div style="width:${vf/r.venta*100}%;background:var(--brand-2)"></div><div style="flex:1;background:#F2B872"></div></div>
  <div class="line"><span><b style="color:var(--brand-2)">Familias</b></span><b>${fmt(vf)} · ${pct(vf/r.venta*100)}</b></div><div class="line"><span><b style="color:#B8741E">Restaurantes</b></span><b>${fmt(vr)} · ${pct(vr/r.venta*100)}</b></div></div>
  <div class="h2">${ico('up')}Quién compra más</div>
  <div class="card" style="padding:4px 14px">${cl.slice().sort((x,y)=>y.a-x.a).slice(0,5).map(x=>`<div class="item tap" onclick="verCliente(${x.c.id})"><div class="av ${x.c.t==='rest'?'rest':''}">${ini(x.c.n)}</div><div class="grow"><div class="name">${x.c.n}</div><div class="sub">Te dejó ${fmt(x.g)}</div></div><div class="amt">${fmt(x.a)}</div></div>`).join('')}</div>
  <div class="h2">${ico('down')}Quién compra menos que antes</div>
  <div class="card" style="padding:4px 14px">${cl.filter(x=>x.b>0&&x.a<x.b*.8).sort((x,y)=>(x.a/x.b)-(y.a/y.b)).slice(0,5).map(x=>`<div class="item tap" onclick="verCliente(${x.c.id})"><div class="av ${x.c.t==='rest'?'rest':''}">${ini(x.c.n)}</div><div class="grow"><div class="name">${x.c.n}</div><div class="sub">Antes ${fmt(x.b)} · ahora ${fmt(x.a)}</div></div><span class="pill p-bad">${Math.round(variacion(x.a,x.b))}%</span></div>`).join('')||'<div class="empty">Nadie bajó sus compras</div>'}</div>
  <div class="h2" style="margin-top:22px">${ico('more')}Más</div>
  <div class="card" style="padding:4px 14px">
    <div class="item tap" onclick="verProductos()"><div class="av">${ico('leaf')}</div><div class="grow"><div class="name">Productos y precios</div><div class="sub">Costo, precio y cuánto te deja cada uno</div></div></div>
    <div class="item tap" onclick="verCompras()"><div class="av">${ico('box')}</div><div class="grow"><div class="name">Compras y gastos</div><div class="sub">Todo lo que anotaste</div></div></div>
  </div>`;
};
function verProductos(){
  sheet('Productos y precios',`<p class="dim" style="margin-top:0">Precio al público (el de la web) y precio para restaurantes.</p>${productos.map(p=>{const m=(p.p-p.c)/p.p*100;return `<div class="prod" onclick="precio(${p.id},${p.p+20})" style="cursor:pointer"><div class="pi">${ico(p.ic)}</div><div class="grow"><div class="name" style="font-size:14px">${p.n}</div><div class="sub">Costo ${fmt(p.c)} · público ${fmt(p.p)} · rest. ${fmt(p.pm)}</div></div><span class="pill ${m>=38?'p-ok':m>=30?'p-warn':'p-bad'}">${pct(m)}</span></div>`}).join('')}`);
}
function verCompras(){
  const it=[...compras.slice(0,12).map(c=>({...c,k:'c'})),...gastos.slice(0,10).map(g=>({...g,k:'g',prov:g.cat,det:g.det||'Gasto'}))].sort((a,b)=>b.fecha-a.fecha);
  sheet('Compras y gastos',`<div class="card" style="padding:4px 14px">${it.map(x=>`<div class="item"><div class="av ${x.k==='g'?'rest':''}">${ico(x.k==='g'?'fuel':'box')}</div><div class="grow"><div class="name">${x.prov}</div><div class="sub">${fcorta(x.fecha)} · ${x.det}</div></div><div class="amt">${fmt(x.total)}</div></div>`).join('')}</div>`,`<button class="btn" style="flex:1" onclick="nuevoGasto()">${ico('fuel')}Gasto</button><button class="btn pri" style="flex:1" onclick="nuevaCompra()">${ico('box')}Compra</button>`);
}

render();
</script>
</body>
</html>
