<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet Smiles · Gestión</title>
<meta name="description" content="Sistema de gestión de Pet Smiles · PlaqueOff en Uruguay, Argentina y Paraguay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F8F7; --bg-2:#E9F1EF; --panel:#FFFFFF;
  --ink:#0E2E2A; --ink-2:#456461; --ink-3:#7C9894; --ink-4:#A6BCB8;
  --line:#E5EEEC; --line-2:#D2E2DE;
  --teal:#12907C; --teal-600:#0E7867; --teal-700:#0A5B4E; --teal-soft:#E1F3EF; --teal-glow:rgba(18,144,124,.14);
  --sun:#D9911A; --sun-soft:#FCF0D9;
  --rose:#D24F47; --rose-soft:#FBE6E4;
  --sky:#2C74C0; --sky-soft:#E5EEFA;
  --violet:#6A5AC9; --violet-soft:#ECE9FA;
  --wa:#1FA855;
  --r-xs:6px; --r-sm:9px; --r:12px; --r-lg:18px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(14,46,42,.05), 0 1px 3px rgba(14,46,42,.03);
  --sh-2:0 2px 4px rgba(14,46,42,.04), 0 8px 24px rgba(14,46,42,.07);
  --sh-3:0 24px 64px rgba(14,46,42,.20), 0 4px 12px rgba(14,46,42,.10);
  --sh-in:0 0 0 3px var(--teal-glow);
  --t:.16s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--teal-700);text-decoration-color:rgba(18,144,124,.35);text-underline-offset:2px}
a:hover{text-decoration-color:currentColor}
h1,h2,h3,h4{margin:0}
h3{margin:0 0 12px;font-size:12.5px;color:var(--ink-3);font-weight:800;letter-spacing:.34px;text-transform:uppercase}
::selection{background:var(--teal-soft)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}

/* ---------- Iconos ---------- */
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ic *{vector-effect:non-scaling-stroke}
.ic-xs{width:.8em;height:.8em}
.ic-sm{width:.9em;height:.9em}
.ic-md{width:1.15em;height:1.15em}
.ic-lg{width:1.4em;height:1.4em}
.ic-18{width:18px;height:18px}
.ic-20{width:20px;height:20px}
.ic-22{width:22px;height:22px}
.ic-28{width:28px;height:28px}
.ic-40{width:40px;height:40px;stroke-width:1.4}
.ic-64{width:64px;height:64px;stroke-width:1.2}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;z-index:6}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:13px;background:linear-gradient(150deg,#1BAE95,#0C6B5B);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(12,107,91,.28)}
.brand b{font-size:17px;font-weight:900;letter-spacing:-.2px;display:block;line-height:1.15}
.brand small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:700}
.nav{background:none;border:0;text-align:left;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:10px;width:100%;font-size:13.8px;transition:background var(--t),color var(--t);position:relative}
.nav .ic{color:var(--ink-3);transition:color var(--t)}
.nav .badge{margin-left:auto;background:var(--rose);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
.nav .badge.soft{background:var(--teal-soft);color:var(--teal-700)}
.nav:hover{background:var(--bg-2);color:var(--ink)}
.nav:hover .ic{color:var(--ink-2)}
.nav.on{background:var(--teal-soft);color:var(--teal-700)}
.nav.on .ic{color:var(--teal)}
.nav.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
.navgrp{font-size:10.5px;color:var(--ink-4);font-weight:900;padding:14px 10px 5px;letter-spacing:.7px;text-transform:uppercase}
.side .user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line);cursor:pointer;border-radius:var(--r-sm);border-width:1px 0 0;background:none;width:100%;text-align:left;transition:background var(--t)}
.side .user:hover{background:var(--bg-2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--sun-soft);color:#8A5B00;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.side .user .n{font-weight:800;font-size:13.5px}
.side .user .r{font-size:11px;color:var(--ink-3);font-weight:700}

.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:11px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);position:sticky;top:0;z-index:5}
.top h1{font-size:19.5px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.top .grow{flex:1}
.seg{display:flex;background:var(--bg-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:800;color:var(--ink-2);font-size:12.8px;display:flex;align-items:center;gap:6px;transition:background var(--t),color var(--t),box-shadow var(--t)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.seg button .dot{width:7px;height:7px;border-radius:50%;flex:none}
.kbtn{border:1px solid var(--line-2);border-radius:999px;padding:7px 8px 7px 13px;background:var(--bg);color:var(--ink-3);font-weight:700;display:flex;gap:8px;align-items:center;width:252px;font-size:13px;transition:border-color var(--t),box-shadow var(--t),background var(--t)}
.kbtn:hover{border-color:var(--teal);color:var(--ink-2);background:var(--panel);box-shadow:var(--sh-1)}
.kbtn kbd{margin-left:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;font-size:10.5px;font-family:inherit;font-weight:800;color:var(--ink-3)}
.iconbtn{position:relative;border:1px solid var(--line-2);background:var(--panel);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:border-color var(--t),color var(--t),box-shadow var(--t)}
.iconbtn:hover{border-color:var(--teal);color:var(--teal);box-shadow:var(--sh-1)}
.iconbtn b{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;border:2px solid var(--panel)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);font-weight:800;padding:5px 11px;border-radius:999px;background:var(--bg-2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(18,144,124,.45)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(18,144,124,0)}}
.view{padding:22px 26px 40px;display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Botones ---------- */
.btn{border:1px solid var(--line-2);background:var(--panel);padding:8px 14px;border-radius:var(--r-sm);font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:7px;font-size:13.2px;transition:background var(--t),border-color var(--t),box-shadow var(--t),transform var(--t);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-4);box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn .ic{color:var(--ink-3)}
.btn:hover .ic{color:var(--ink-2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(18,144,124,.24)}
.btn.primary .ic,.btn.primary:hover .ic{color:#fff}
.btn.primary:hover{background:var(--teal-600);border-color:var(--teal-600);box-shadow:0 4px 14px rgba(18,144,124,.32)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa .ic,.btn.wa:hover .ic{color:#fff}
.btn.wa:hover{background:#188A46;border-color:#188A46}
.btn.danger{color:var(--rose);border-color:var(--rose-soft)}
.btn.danger .ic{color:var(--rose)}
.btn.danger:hover{background:var(--rose-soft);border-color:var(--rose)}
.btn.sm{padding:5px 10px;font-size:12.4px;border-radius:var(--r-xs);gap:5px}
.btn.xs{padding:3px 8px;font-size:11.8px;border-radius:var(--r-xs);gap:4px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal-700)}
.btn.ghost .ic{color:var(--teal)}
.btn.ghost:hover{background:var(--teal-soft);border-color:transparent;box-shadow:none}
.btn.icon{padding:7px;border-radius:50%}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{border-color:var(--line-2);transform:none}

/* ---------- Grillas y tarjetas ---------- */
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.gs{grid-template-columns:1fr 336px}
.mb{margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 19px;box-shadow:var(--sh-1)}
.card.tight{padding:6px 8px}
.card.flat{box-shadow:none}
.card.accent{background:linear-gradient(160deg,#FFFFFF,var(--teal-soft));border-color:transparent}
.cardhd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cardhd h3{margin:0}
.cardhd .grow{flex:1}
.kpi .n{font-size:27px;font-weight:900;letter-spacing:-.8px;line-height:1.1}
.kpi .d{color:var(--ink-3);font-size:12.4px;margin-top:5px;font-weight:700;display:flex;align-items:center;gap:5px}
.kpi .d.up{color:var(--teal-700)}
.kpi .d.warn{color:var(--rose)}
.kpi.click{cursor:pointer;transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
.kpi.click:hover{border-color:var(--teal);box-shadow:var(--sh-2);transform:translateY(-2px)}
.kpi.click:active{transform:none}

/* ---------- Tablas ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:900;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.4px;text-transform:uppercase}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.4px}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background var(--t)}
tr.row:hover td{background:var(--bg)}
tr.row:hover td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.mini{font-size:12.2px;color:var(--ink-2);line-height:1.4}
.mini.muted{color:var(--ink-3)}
.big-n{font-variant-numeric:tabular-nums;font-weight:800}
.strong{color:var(--ink);font-weight:800}

/* ---------- Etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.6px;font-weight:800;background:var(--bg-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.tag .ic{width:.85em;height:.85em}
.tag.ok{background:var(--teal-soft);color:var(--teal-700)}
.tag.warn{background:var(--sun-soft);color:#8A5B00}
.tag.bad{background:var(--rose-soft);color:#A83A33}
.tag.info{background:var(--sky-soft);color:#1F5896}
.tag.vio{background:var(--violet-soft);color:#4A3CA8}
.tag.wa{background:#E2F6E9;color:#15703A}
.tag.sh{background:#EBF4DD;color:#476F17}
.tag.ig{background:#FBE7F0;color:#A02660}
.tag.x{cursor:pointer;transition:background var(--t),color var(--t)}
.tag.x:hover{background:var(--rose-soft);color:#A83A33}
.tag.plus{cursor:pointer;border:1px dashed var(--line-2);background:transparent;color:var(--ink-3)}
.tag.plus:hover{border-color:var(--teal);color:var(--teal-700)}
/* País */
.cty{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:11.4px;font-weight:900;letter-spacing:.4px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap;line-height:1.7}
.cty::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 0 2.5px rgba(255,255,255,.75)}
.cty.uy{background:var(--sky-soft);color:#1F5896}
.cty.ar{background:#E4F1FB;color:#2E7FB8}
.cty.py{background:var(--rose-soft);color:#A83A33}
.ctys{padding:1px 8px 1px 7px;font-size:10.5px}

.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:0}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.4px;font-weight:800;color:var(--ink-2);transition:background var(--t),color var(--t),border-color var(--t);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-4);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .ic{color:#fff}
.chip .n{opacity:.6;font-weight:700}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.col{background:var(--bg-2);border-radius:var(--r-lg);padding:10px;min-height:130px;transition:background var(--t),border-color var(--t);border:2px dashed transparent}
.col.over{background:var(--teal-soft);border-color:var(--teal)}
.col h4{margin:0 0 4px 6px;font-size:12.6px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;font-weight:900}
.col h4 span{color:var(--ink-3);font-weight:800;background:var(--panel);border-radius:99px;padding:0 8px;font-size:11.5px}
.col .sum{font-size:11.4px;color:var(--ink-3);margin:0 0 8px 6px;font-weight:800}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 10px;margin-bottom:8px;cursor:grab;user-select:none;box-shadow:var(--sh-1);transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.3}
.kcard:hover{border-color:var(--teal);box-shadow:var(--sh-2);transform:translateY(-1px)}
.kcard b{display:block;font-size:13.4px;line-height:1.3}
.kcard .m{font-size:11.8px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kcard .f{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11.2px;color:var(--ink-3);gap:6px;font-weight:700}
.kcard .cold{color:var(--rose);font-weight:800;display:inline-flex;align-items:center;gap:4px}
.kcard .tags{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap}
.kcard .tags .tag{font-size:10.4px;padding:1px 7px}
.dropzone{border:2px dashed var(--line-2);border-radius:var(--r);padding:14px 8px;text-align:center;color:var(--ink-4);font-size:12px;font-weight:800}

/* ---------- Detalle ---------- */
.detail{display:grid;grid-template-columns:352px 1fr;gap:16px;align-items:start}
.field{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.3px;align-items:center}
.field:last-child{border-bottom:0}
.field>span:first-child{color:var(--ink-3);font-weight:800;font-size:11.6px;flex:none;letter-spacing:.2px;text-transform:uppercase}
.field>span:last-child{text-align:right}
.ed{cursor:text;border-radius:5px;padding:1px 5px;margin:-1px -5px;border-bottom:1px dashed transparent;transition:background var(--t),border-color var(--t);display:inline-flex;align-items:center;gap:6px}
.ed:hover{background:var(--bg-2);border-color:var(--ink-4)}
.ed .pen{opacity:0;color:var(--ink-3);transition:opacity var(--t)}
.ed:hover .pen{opacity:1}
.edin{border:1.5px solid var(--teal);border-radius:var(--r-xs);padding:3px 7px;width:200px;max-width:52vw;outline:none;box-shadow:var(--sh-in);background:var(--panel)}
.pet{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.pet:last-child{border-bottom:0}
.pet .pa{width:38px;height:38px;border-radius:13px;background:var(--teal-soft);color:var(--teal-700);display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:800;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--t),border-color var(--t);white-space:nowrap;font-size:13.2px}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--teal-700);border-color:var(--teal)}
.log{display:grid;grid-template-columns:152px 1fr auto;gap:8px;align-items:center;margin-bottom:16px}
.log select,.log input{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;background:var(--bg);outline:none;transition:border-color var(--t),box-shadow var(--t)}
.log input:focus,.log select:focus{border-color:var(--teal);box-shadow:var(--sh-in);background:var(--panel)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px 1fr;gap:13px;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.tl li:last-child{border-bottom:0}
.tl li::after{content:'';position:absolute;left:16px;top:44px;bottom:-1px;width:1.5px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .ib{width:32px;height:32px;border-radius:11px;background:var(--bg-2);color:var(--ink-2);display:grid;place-items:center;margin-top:1px;position:relative;z-index:1}
.tl .ib.venta{background:var(--teal-soft);color:var(--teal-700)}
.tl .ib.cotiz{background:var(--sky-soft);color:#1F5896}
.tl .ib.whatsapp{background:#E2F6E9;color:#15703A}
.tl .ib.instagram{background:#FBE7F0;color:#A02660}
.tl .ib.shopify{background:#EBF4DD;color:#476F17}
.tl .t{font-size:13.3px}
.tl .w{font-size:11.6px;color:var(--ink-3);margin-top:2px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stage{display:flex;gap:4px;margin:12px 0 4px;background:var(--bg-2);padding:3px;border-radius:var(--r-sm)}
.stage button{flex:1;border:0;background:none;padding:6px 3px;border-radius:var(--r-xs);font-size:11.4px;font-weight:800;color:var(--ink-3);transition:background var(--t),color var(--t),box-shadow var(--t)}
.stage button:hover{color:var(--ink)}
.stage button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.alertbox{background:var(--sun-soft);border-radius:var(--r);padding:10px 13px;font-size:12.9px;margin-bottom:10px;display:flex;gap:9px;align-items:center;line-height:1.4;color:#6E4A05}
.alertbox .ic{flex:none;color:var(--sun)}
.alertbox.ok{background:var(--teal-soft);color:var(--teal-700)}
.alertbox.ok .ic{color:var(--teal)}
.alertbox.bad{background:var(--rose-soft);color:#A83A33}
.alertbox.bad .ic{color:var(--rose)}
.alertbox.info{background:var(--sky-soft);color:#1F5896}
.alertbox.info .ic{color:var(--sky)}
.alertbox.click{cursor:pointer;transition:filter var(--t)}
.alertbox.click:hover{filter:brightness(.975)}
.task{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.3px}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);flex:none;cursor:pointer}
.task.done>span{text-decoration:line-through;color:var(--ink-3)}
.task .due{margin-left:auto;font-size:11.6px;color:var(--ink-3);font-weight:800;flex:none}
.task .due.late{color:var(--rose)}

/* ---------- Bandeja ---------- */
.inbox{display:grid;grid-template-columns:346px 1fr;gap:14px;height:calc(100vh - 132px);min-height:520px}
.mlist{overflow:auto;padding:0}
.msg{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:11px;transition:background var(--t);border-left:3px solid transparent}
.msg:hover{background:var(--bg)}
.msg.on{background:var(--teal-soft);border-left-color:var(--teal)}
.msg .who{font-weight:800;font-size:13.3px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg .who span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .who small{color:var(--ink-3);font-weight:700;font-size:11px;flex:none}
.msg .pre{font-size:12.2px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg.unread .pre{color:var(--ink);font-weight:700}
.msg.unread .who span:first-child::before{content:'';display:inline-block;width:7px;height:7px;background:var(--teal);border-radius:50%;margin-right:7px;vertical-align:middle}
.chan{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none}
.chan.whatsapp{background:#E2F6E9;color:#15703A}
.chan.shopify{background:#EBF4DD;color:#476F17}
.chan.instagram{background:#FBE7F0;color:#A02660}
.chan.email{background:var(--sky-soft);color:#1F5896}
.thread{display:flex;flex-direction:column;overflow:hidden}
.thread .hd{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:13px;flex-wrap:wrap}
.thread .body{flex:1;overflow:auto;padding-right:4px}
.bub{max-width:74%;padding:9px 14px;border-radius:16px 16px 16px 5px;margin-bottom:9px;font-size:13.4px;background:var(--bg-2);width:fit-content;line-height:1.45}
.bub.me{background:var(--teal-soft);margin-left:auto;border-radius:16px 16px 5px 16px}
.bub .w{font-size:10.8px;color:var(--ink-3);margin-top:4px;font-weight:700}
.order{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.reply{display:flex;gap:8px;margin-top:12px}
.reply input{flex:1}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ---------- Formularios / modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,40,36,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:30;padding:16px;animation:fade .16s ease}
.modal-bg.on{display:grid}
.modal{background:var(--panel);border-radius:var(--r-xl);width:min(800px,100%);max-height:92vh;overflow:auto;padding:24px 26px;box-shadow:var(--sh-3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal.wide{width:min(1020px,100%)}
.modal.slim{width:min(470px,100%);padding:22px 24px}
.modal h2{margin:0 0 15px;font-size:19.5px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:14px;letter-spacing:-.3px;flex-wrap:wrap}
.modal h2 .sub{font-size:12.4px;font-weight:700;color:var(--ink-3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}
.frow.three{grid-template-columns:1fr 1fr 1fr}
label.f{display:block;font-size:11.6px;font-weight:800;color:var(--ink-2);margin-bottom:5px;letter-spacing:.2px;text-transform:uppercase}
.in{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;background:var(--bg);outline:none;transition:border-color var(--t),box-shadow var(--t),background var(--t)}
.in:hover{border-color:var(--ink-4)}
.in:focus{border-color:var(--teal);box-shadow:var(--sh-in);background:var(--panel)}
.in.ro{background:var(--teal-soft);border-color:transparent;color:var(--teal-700);font-weight:800;display:flex;align-items:center;gap:7px}
select.in{cursor:pointer}
textarea.in{resize:vertical;line-height:1.5}
.lines td{padding:5px 6px}
.lines input.in,.lines select.in{padding:6px 9px}
.lines .qty{width:70px;text-align:right}
.totals{margin-left:auto;width:326px;max-width:100%;margin-top:10px}
.totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:13.3px;gap:12px}
.totals div span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.totals div.big{font-size:19px;font-weight:900;border-top:1.5px solid var(--line-2);padding-top:11px;margin-top:5px;letter-spacing:-.3px}
.totals div.big span:last-child{font-weight:900}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.hint{font-size:12.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;margin-bottom:11px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.hint .ic{flex:none;color:var(--ink-3);margin-top:2px}
.hint.teal{background:var(--teal-soft);border-color:transparent;color:var(--teal-700)}
.hint.teal .ic{color:var(--teal)}
.inv{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg)}
.inv .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.inv .hd b{font-size:16px}
.cfe{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-2);line-height:1.7;word-break:break-all;background:var(--panel);border-radius:var(--r-xs);padding:9px 11px;margin-top:13px}
.qrfake{display:inline-block;vertical-align:middle;margin-right:10px}

/* ---------- Paleta ---------- */
.pal-bg{position:fixed;inset:0;background:rgba(10,40,36,.4);backdrop-filter:blur(3px);display:none;z-index:45;padding-top:11vh;justify-content:center;align-items:flex-start}
.pal-bg.on{display:flex}
.pal{background:var(--panel);width:min(640px,94vw);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-3);animation:pop .18s ease}
.pal .qw{display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal .qw .ic{color:var(--ink-3)}
.pal input{width:100%;border:0;padding:16px 0;font-size:16px;outline:none;background:transparent;font-weight:600}
.pal .res{max-height:390px;overflow:auto;padding:6px}
.pal .grp{font-size:10.5px;font-weight:900;color:var(--ink-4);padding:9px 12px 4px;letter-spacing:.7px;text-transform:uppercase}
.pal .it{padding:9px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:13.8px;border-radius:var(--r-sm);font-weight:700}
.pal .it.on{background:var(--teal-soft);color:var(--teal-700)}
.pal .it .k{font-size:11px;color:var(--ink-3);margin-left:auto;font-weight:800;flex:none;background:var(--bg-2);padding:1px 8px;border-radius:99px}
.pal .it.on .k{background:rgba(255,255,255,.7)}
.pal .it .ic{color:var(--ink-3);flex:none}
.pal .it.on .ic{color:var(--teal)}
.pal .it .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .ft{border-top:1px solid var(--line);padding:8px 16px;font-size:11.4px;color:var(--ink-3);font-weight:700;display:flex;gap:14px;flex-wrap:wrap}

/* ---------- Notificaciones ---------- */
.pop{position:absolute;right:26px;top:58px;width:378px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-3);display:none;z-index:15;overflow:hidden;animation:pop .16s ease}
.pop.on{display:block}
.pop .ph{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.pop .pb{max-height:390px;overflow:auto}
.pop .it{padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:background var(--t)}
.pop .it:last-child{border-bottom:0}
.pop .it:hover{background:var(--bg)}
.pop .it .ic{flex:none;margin-top:2px}
.pop .it.bad .ic{color:var(--rose)}
.pop .it.warn .ic{color:var(--sun)}
.pop .it.ok .ic{color:var(--teal)}
.pop .it.info .ic{color:var(--sky)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:800;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:60;max-width:90vw;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-3);font-size:13.4px}
.toast .ic{color:#6FD9C3}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Estados vacíos ---------- */
.empty{text-align:center;color:var(--ink-3);padding:34px 20px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.empty .art{color:var(--ink-4);margin-bottom:8px;opacity:.85}
.empty .t{font-size:14.5px;font-weight:800;color:var(--ink-2)}
.empty .s{font-size:12.6px;font-weight:600;max-width:380px;line-height:1.5}
.empty .btn{margin-top:10px}
td .empty,th .empty{padding:26px}

/* ---------- Barras / gráficos ---------- */
.bar{height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar i.sun{background:var(--sun)}
.bar i.rose{background:var(--rose)}
.bar i.sky{background:var(--sky)}
.bar i.vio{background:var(--violet)}
.bar.lg{height:11px}
.barrow{display:flex;align-items:center;gap:10px;font-size:12.6px;margin-bottom:7px}
.barrow .lb{width:112px;flex:none;color:var(--ink-2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bar{flex:1;margin:0}
.barrow .vv{width:78px;text-align:right;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.route{list-style:none;margin:0;padding:0;counter-reset:s}
.route li{display:grid;grid-template-columns:32px 1fr auto;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.route li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12.5px}
.route li.done::before{background:var(--teal)}
.route li.done .t b{text-decoration:line-through;color:var(--ink-3)}
.route li:last-child{border-bottom:0}
canvas{width:100%;display:block}
.legend{display:flex;gap:16px;font-size:12.2px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap;font-weight:700}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cfg label.f{margin-top:10px}
.kbd{background:rgba(255,255,255,.22);border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:800;margin-left:2px}
.btn:not(.primary) .kbd{background:var(--bg-2);color:var(--ink-3)}
.sep{height:1px;background:var(--line);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:800;color:var(--ink-2)}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{width:26px;height:26px;border-radius:9px;background:var(--bg-2);color:var(--ink-2);display:grid;place-items:center;font-weight:900;font-size:12.5px;flex:none}
.rank .pos.p1{background:#FBEFD2;color:#8A5B00}
.rank .pos.p2{background:#EDF1F3;color:#5A6B72}
.rank .pos.p3{background:#F6E7DC;color:#8A5024}
.gauge{position:relative;height:11px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--teal),#3FC3A9);border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.gauge b{position:absolute;top:-3px;width:2px;height:17px;background:var(--ink);border-radius:2px;opacity:.5}
.prodart{width:62px;height:62px;border-radius:16px;background:var(--teal-soft);display:grid;place-items:center;flex:none;color:var(--teal-700)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tourdot{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:background var(--t),width var(--t)}
.tourdot.on{background:var(--teal);width:20px;border-radius:99px}

/* ---------- Barra inferior (móvil) ---------- */
.botnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}
.bn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--ink-3);font-size:10.4px;font-weight:800;border-radius:var(--r-sm);position:relative;transition:color var(--t),background var(--t)}
.bn.on{color:var(--teal-700);background:var(--teal-soft)}
.bn .badge{position:absolute;top:1px;right:calc(50% - 20px);background:var(--rose);color:#fff;font-size:9.5px;font-weight:800;padding:0 5px;border-radius:99px;border:1.5px solid var(--panel)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,40,36,.5);backdrop-filter:blur(3px);display:none;z-index:35;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--panel);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.sheet .nav{font-size:14.5px;padding:10px}

@media print{
  body *{visibility:hidden}
  .modal-bg,.modal-bg *{visibility:visible}
  .modal-bg{position:static;background:none;display:block;padding:0;backdrop-filter:none}
  .modal{box-shadow:none;max-height:none;width:100%;padding:0;animation:none;border-radius:0}
  .actions,.noprint{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
}
@media (max-width:1220px){
  .g5{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .gs{grid-template-columns:1fr}
  .detail{grid-template-columns:300px 1fr}
  .kanban{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .botnav{display:grid}
  .main{padding-bottom:66px}
  .g5,.g4,.g3,.g2,.gs,.kanban,.detail,.inbox{grid-template-columns:1fr}
  .kbtn{width:auto;padding:7px 11px}
  .kbtn .lbl,.kbtn kbd{display:none}
  .top{padding:10px 14px;gap:9px}
  .top h1{font-size:17px}
  .view{padding:16px 14px 28px}
  .inbox{height:auto;min-height:0}
  .mlist{max-height:340px}
  .thread{min-height:420px}
  .pop{right:8px;left:8px;width:auto}
  .modal{padding:20px 16px}
  .totals{width:100%}
  .live .lbl{display:none}
}
@media (max-width:640px){
  .kanban{grid-template-columns:1fr}
  .frow,.frow.three{grid-template-columns:1fr}
  .log{grid-template-columns:1fr}
  .seg button .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

// Dosificación de PlaqueOff polvo (cuchara medidora ≈ 1 g): ≤10 kg ½ · 10–25 kg 1 · >25 kg 2
const doseG=kg=>kg<=10?0.5:kg<=25?1:2;
function refill(c){
  if(!c||!c.pets||!c.pets.length)return null;
  const inv=invoices.filter(i=>i.contactId===c.id&&i.status!=='anulada').sort((a,b)=>b.date.localeCompare(a.date));
  const last=inv.find(i=>i.lines.some(l=>P(l.sku).cat==='Polvo'));
  if(!last)return null;
  const g=last.lines.filter(l=>P(l.sku).cat==='Polvo').reduce((a,l)=>a+P(l.sku).grams*l.qty,0);
  const daily=c.pets.reduce((a,p)=>a+doseG(p.kg),0)||0.5;
  const days=Math.max(1,Math.round(g/daily));
  return {last:last.date,days,end:addDays(last.date,days),left:diffDays(TODAY,addDays(last.date,days))};
}
// Costo landed por país: última importación recibida de ese país; si no hay, factor estimado configurable
let FACTOR_EST={UY:1.72,AR:1.95,PY:1.58};
function poFactor(o){const fob=o.lines.reduce((a,l)=>a+P(l.sku).fob*l.qty,0);return fob?((fob+o.freight)/fob)*(1+o.duty/100):1}
function landedInfo(k){
  const po=purchases.filter(x=>x.country===k&&x.status==='recibida').sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(po)return {factor:poFactor(po),src:po.id,date:po.date};
  return {factor:FACTOR_EST[k]||1.7,src:'estimado',date:null};
}
const landed=(p,k)=>p.fob*landedInfo(k||'UY').factor;
function marginPct(p,k){const netPrice=p.price[k]/FX[k]/(1+COUNTRIES[k].iva/100);return netPrice?((netPrice-landed(p,k))/netPrice)*100:0}

function nextBuy(cid){const f=buyFreq(cid);const l=cust(cid).map(i=>i.date).sort();if(!f||!l.length)return null;return addDays(l[l.length-1],f)}

// ============ Alertas ============
function alerts(){
  const a=[];
  invoices.filter(i=>inC(i)&&i.status==='vencida').forEach(i=>a.push({i:'i-card',tone:'bad',t:'Factura <b>'+i.id+'</b> vencida hace '+diffDays(i.due,TODAY)+' días · '+C(i.contactId).name,go:()=>openInvoice(i.id)}));
  PRODUCTS.forEach(p=>CK.filter(k=>inC({country:k})).forEach(k=>{if(p.stock[k]<p.min)a.push({i:'i-box',tone:p.stock[k]===0?'bad':'warn',t:'<b>'+p.short+'</b> en '+k+': '+p.stock[k]+' u. (mínimo '+p.min+')',go:()=>openProduct(p.sku)})}));
  tasks.filter(t=>!t.done&&t.due<TODAY&&inCid(t.contactId)).forEach(t=>a.push({i:'i-clock',tone:'warn',t:'Tarea atrasada: '+t.text,go:()=>openContact(t.contactId,'tareas')}));
  contacts.filter(c=>inC(c)&&['Prospecto','Contactado','Cotizado'].includes(c.stage)&&(lastContactDays(c)===null||lastContactDays(c)>7))
    .forEach(c=>a.push({i:'i-snow',tone:'info',t:'<b>'+c.name+'</b> sin contacto hace '+(lastContactDays(c)===null?'siempre':lastContactDays(c)+' días'),go:()=>openContact(c.id)}));
  contacts.filter(c=>inC(c)&&c.type==='part').forEach(c=>{const r=refill(c);
    if(r&&r.left<=5&&!subs.some(s=>s.contactId===c.id&&s.status==='activa'))a.push({i:'i-paw',tone:'warn',t:'<b>'+c.name+'</b>: se le termina el polvo '+(r.left<=0?'ya':'en '+r.left+' días'),go:()=>openContact(c.id)})});
  quotes.filter(q=>inC(q)&&q.status==='enviada'&&q.valid<=addDays(TODAY,2)).forEach(q=>a.push({i:'i-clipboard',tone:'warn',t:'<b>'+q.id+'</b> vence '+dmy(q.valid)+' · '+C(q.contactId).name,go:()=>openQuote(q.id)}));
  subs.filter(s=>s.status==='activa'&&s.next<=TODAY&&inCid(s.contactId)).forEach(s=>a.push({i:'i-repeat',tone:'ok',t:'Suscripción de <b>'+C(s.contactId).name+'</b> lista para generar',go:()=>go('subs')}));
  return a;
}
const BADGE={
  inbox:()=>inbox.filter(m=>m.unread&&inC(m)).length,
  cobros:()=>invoices.filter(i=>inC(i)&&i.status==='vencida').length,
  ent:()=>deliveries.filter(d=>d.status!=='entregada'&&inCid(d.contactId)).length,
  subs:()=>subs.filter(s=>s.status==='activa'&&s.next<=TODAY&&inCid(s.contactId)).length,
};
function badges(){
  Object.keys(BADGE).forEach(k=>{const n=BADGE[k]();
    document.querySelectorAll('[data-badge="'+k+'"]').forEach(el=>{el.textContent=n||'';el.style.display=n?'':'none'})});
  const a=alerts().length;$('#bell-n').textContent=a||'';$('#bell-n').style.display=a?'':'none';
}
function togglePop(){
  const p=$('#pop');
  if(p.classList.contains('on')){p.classList.remove('on');return}
  const a=alerts();window._al=a;
  p.innerHTML='<div class="ph"><span>Avisos'+(country!=='all'?' · '+COUNTRIES[country].name:'')+'</span><span class="mini muted">'+a.length+'</span></div>'+
   '<div class="pb">'+(a.length?a.map((x,i)=>'<div class="it '+x.tone+'" onclick="_al['+i+'].go();togglePop()">'+ic(x.i,'ic-18')+'<span>'+x.t+'</span></div>').join('')
   :emptyState('i-check-circle','Nada pendiente','Ni facturas vencidas, ni stock bajo mínimo, ni tareas atrasadas.'))+'</div>';
  p.classList.add('on');
}

// ============ Render ============
function render(){
  document.querySelectorAll('.nav,.bn').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));
  $('#title').textContent=TITLES[view]||'Panel';
  const fn={panel:rPanel,inbox:rInbox,crm:rCrm,cotiz:rCotiz,ventas:rVentas,cobros:rCobros,caja:rCaja,subs:rSubs,devol:rDevol,
    entregas:rEntregas,stock:rStock,precios:rPrecios,compras:rCompras,campanas:rCampanas,metas:rMetas,reportes:rReportes,config:rConfig}[view];
  if(fn)fn();
  badges();
}

    '<div class="mini muted">'+(c?TYPES[c.type]+' · '+c.stage+petTxt+' · '+cust(c.id).length+' compras':'Sin ficha todavía · '+(m.name?esc(m.name):'contacto nuevo'))+'</div></div>'+

      '<tr><td colspan="2"><b>Total (IVA incluido)</b></td><td class="num"><b>'+fmt(t.total,m.country)+'</b></td></tr></tbody></table></div>'+
      '<div class="hint">'+ic('i-info','ic-md')+'<span>'+(c?'El cliente ya existe: la venta se suma a su ficha.':'Cliente nuevo: se crea la ficha sola con el nombre, el teléfono y la dirección del pedido.')+

      '<button class="btn primary" onclick="importOrder('+m.id+')">'+ic('i-play')+' Importar pedido, facturar y despachar</button></div>';
  }
  const body=m.thread.length?m.thread.map(b=>'<div class="bub '+(b.me?'me':'')+'">'+esc(b.t)+'<div class="w">'+esc(b.w||'')+(b.me?' · '+esc(b.by||'vos'):'')+'</div></div>').join('')
    :emptyState('i-chat','Conversación nueva','Escribí abajo para arrancar el hilo.');
  const cRef=c?'C('+c.id+')':'null';
  return hd+'<div class="body">'+body+'</div>'+
    '<div class="tpl">'+TEMPLATES.map((t,i)=>'<button class="chip" onclick="setReply(TEMPLATES['+i+'].t,'+cRef+')">'+esc(t.n)+'</button>').join('')+
    (!c&&m.channel==='whatsapp'?'<button class="chip" onclick="setReply(\'Hola! Para un perro de 30 kg son 2 cucharas por día: el pote de 40 g dura unos 20 días. Sale $ 1.999 y el envío es gratis desde $ 2.000, en el día en Montevideo. ¿Te lo mando hoy?\',null)">Cotizar polvo</button>':'')+'</div>'+
    '<div class="reply"><input class="in" id="rp" placeholder="Responder… (Enter para enviar)" aria-label="Responder" onkeydown="if(event.key===\'Enter\')reply('+m.id+')">'+
    '<button class="btn primary" onclick="reply('+m.id+')" aria-label="Enviar respuesta">'+ic('i-send')+' Enviar</button>'+

function setReply(t,c){const el=$('#rp');if(!el)return;el.value=fill(t,c||{name:'',contact:'',pets:[]});el.focus()}
function reply(id){
  const m=inbox.find(x=>x.id===id);if(!m)return;
  const el=$('#rp');const t=el?el.value.trim():'';if(!t)return;
  if(!m.thread)m.thread=[];
  m.thread.push({me:true,t,w:new Date().toTimeString().slice(0,5),by:USERS[user].n});
  if(m.contactId!=null)log(m.contactId,m.channel==='instagram'?'instagram':m.channel==='email'?'email':'whatsapp','Respondido: '+t.slice(0,90));

function importOrder(id){
  const m=inbox.find(x=>x.id===id);if(!m||!m.order)return;
  if(m.contactId==null){
    const c={id:uid(),name:m.name,type:'part',country:m.country,stage:'Cliente',phone:m.phone,doc:'',city:COUNTRIES[m.country].city,addr:m.addr,origin:'Web',since:TODAY,tags:['shopify'],pets:[],notes:'',log:[]};
    contacts.unshift(c);m.contactId=c.id;

function dragStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move';e.target.classList.add('drag')}
function dropCard(e,stage){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  const c=C(dragId);dragId=null;
  if(!c||c.stage===stage)return;
  const from=c.stage;c.stage=stage;
  log(c.id,'sistema','Movido de '+from+' a '+stage);aud(c.name+': de '+from+' a '+stage);toast(c.name+' pasó a '+stage,'i-arrow-right');
  render();

    setTimeout(()=>askConfirm({title:'Armar la cotización',text:'<b>'+esc(c.name)+'</b> pasó a <b>Cotizado</b>. ¿Querés armar la cotización ahora?',ok:'Sí, armarla',cancel:'Después',onOk:()=>newQuote(c.id)}),180);
  }

function editField(id,f,el){
  const c=C(id);if(!c||el.querySelector('input'))return;
  const old=c[f]||'';
  el.innerHTML='<input class="edin" value="'+esc(old)+'" aria-label="Editar '+(FIELDLBL[f]||f)+'">';
  const inp=el.querySelector('input');inp.focus();inp.select();
  let done=false;
  const finish=save=>{if(done)return;done=true;
    if(save){const v=inp.value.trim();if(v!==old){c[f]=v;aud(c.name+': se editó '+(FIELDLBL[f]||f));toast('Guardado')}}
    openContact(id)};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape'){e.preventDefault();finish(false)}};
  inp.onblur=()=>finish(true);
}

function rmLine(i){draft.lines.splice(i,1);if(!draft.lines.length)draft.lines.push({sku:'PO-DOG-PWD',qty:1});renderDoc()}
function kit(t){
  const c=C(draft.contactId);
  if(t==='vet'){draft.lines=L('DP',12,'CP',6,'DS',24,'B1',50);draft.disc=0}
  else if(t==='shop'){draft.lines=L('DS',12,'CS',12,'B1',40,'M20',6);draft.disc=0}
  else if(t==='guard'){draft.lines=L('DS',24,'B1',60,'CQ',6);draft.disc=5}
  else if(t==='pet'){const cat=c.pets.some(p=>p.k==='cat');draft.lines=[{sku:cat?'PO-CAT-PWD':'PO-DOG-PWD',qty:1}]}
  renderDoc();
}
function emitFromDraft(){
  const c=C(draft.contactId);
  const short=draft.lines.filter(l=>P(l.sku).stock[c.country]<l.qty);
  const doEmit=()=>{
    const inv=emitInvoice({contactId:c.id,lines:draft.lines.map(l=>({sku:l.sku,qty:l.qty})),disc:draft.disc,pay:draft.pay,
      status:(draft.pay==='cuenta corriente 30 días'||(c.type!=='part'&&draft.pay==='transferencia'))?'pendiente':'pagada',
      delivery:draft.delivery,slot:draft.slot});
    closeModal();toast('Factura '+inv.id+' emitida','i-receipt');openInvoice(inv.id);
  };
  if(short.length)askConfirm({title:'Stock insuficiente',
    text:'Hay '+short.length+' línea'+(short.length>1?'s':'')+' sin stock suficiente en '+c.country+': <b>'+short.map(l=>esc(P(l.sku).short)).join(', ')+'</b>.<br>Se puede emitir igual y la entrega queda pendiente hasta que llegue la importación.',
    ok:'Emitir igual',onOk:doEmit});
  else doEmit();
}
function emitInvoice(o){
  const c=C(o.contactId),k=c.country,n=seq[k]++;
  const id=k==='UY'?'A '+String(n).padStart(6,'0'):k==='AR'?'0003-'+String(n).padStart(8,'0'):'001-001-'+String(n).padStart(7,'0');
  const auth=k==='UY'?'CFE '+(c.doc?'111':'101')+' · N° '+String(n).padStart(9,'0')+' · Autorizado DGI'
    :k==='AR'?'CAE '+(76300000000000+n*791903717)+' · vto '+dmy(addDays(TODAY,10))
    :'CDC 0180'+String(n).padStart(4,'0')+' 4567 8901 2345 6789 0123 4567 89'+String(230+n).slice(0,3)+' · Aprobado SIFEN';
  const inv={id,country:k,contactId:c.id,date:TODAY,due:o.status==='pagada'?TODAY:addDays(TODAY,30),lines:o.lines,disc:o.disc||0,
    status:o.status,pay:o.pay,by:USERS[user].n,paidOn:o.status==='pagada'?TODAY:null,channel:o.channel||'directo',auth};
  invoices.unshift(inv);
  inv.lines.forEach(l=>{const p=P(l.sku);p.stock[k]=Math.max(0,p.stock[k]-l.qty)});
  log(c.id,'venta','Factura '+id+' · '+inv.lines.map(l=>l.qty+'× '+P(l.sku).short).join(', '));
  if(c.stage!=='Cliente'){c.stage='Cliente';if(!c.since)c.since=TODAY}
  if(o.delivery)deliveries.push({id:uid(),invId:id,contactId:c.id,slot:o.slot,driver:o.slot==='Courier'?'Andreani':'Mateo',status:'pendiente',order:deliveries.length+1,mode:o.slot==='Courier'?'courier':'reparto',note:''});
  aud('Factura '+id+' emitida a '+c.name);
  return inv;
}
function saveQuote(){

function acceptQuote(id){
  const q=quotes.find(x=>x.id===id);if(!q)return;

let cajaRange=7;
function rCaja(){
  const from=addDays(TODAY,-cajaRange+1);
  const cobros=invoices.filter(i=>inC(i)&&i.paidOn&&i.paidOn>=from&&i.paidOn<=TODAY&&i.status!=='anulada');
  const byPay={};cobros.forEach(i=>{byPay[i.pay]=(byPay[i.pay]||0)+invUsd(i)});
  const pays=Object.keys(byPay).sort((a,b)=>byPay[b]-byPay[a]);
  const totalCob=cobros.reduce((a,i)=>a+invUsd(i),0);
  const maxPay=Math.max.apply(null,pays.map(p=>byPay[p]).concat([1]));
  const efectivo=cobros.filter(i=>i.pay==='efectivo');
  const efLocal=efectivo.filter(i=>i.country==='UY').reduce((a,i)=>a+docTotals(i).total,0);
  const set=settle.filter(s=>inC(s));

  '<div class="grid g4 mb">'+
    '<div class="card kpi"><h3>Cobrado en el período</h3><div class="n">'+usd(totalCob)+'</div><div class="d">'+ic('i-cash')+cobros.length+' operaciones</div></div>'+
    '<div class="card kpi"><h3>Efectivo en la calle</h3><div class="n">'+fmtS(efLocal,'UY')+'</div><div class="d">'+ic('i-scooter')+efectivo.length+' cobros contra entrega · Mateo</div></div>'+
    '<div class="card kpi"><h3>Comisiones de pasarela</h3><div class="n">'+usd(set.reduce((a,s)=>a+toUsd(s.fee,s.country),0))+'</div><div class="d">'+ic('i-percent')+'Mercado Pago y PayPal</div></div>'+
    '<div class="card kpi"><h3>Pendiente de acreditar</h3><div class="n">'+usd(pendConc.reduce((a,s)=>a+toUsd(s.net,s.country),0))+'</div><div class="d '+(pendConc.length?'warn':'')+'">'+ic('i-clock')+pendConc.length+' liquidaciones en camino</div></div>'+
  '</div>'+
  '<div class="grid gs">'+
    '<div class="card tight"><div style="padding:12px 12px 0"><h3>Cobros del período</h3></div><div class="scroll-x"><table><thead><tr><th>Fecha</th><th>Factura</th><th>Cliente</th><th>Medio</th><th>País</th><th class="num">Importe</th><th class="num">En USD</th></tr></thead><tbody>'+
      (cobros.length?cobros.sort((a,b)=>b.paidOn.localeCompare(a.paidOn)).map(i=>'<tr class="row" onclick="openInvoice(\''+i.id+'\')"><td>'+dmy(i.paidOn)+'</td><td>'+i.id+'</td>'+
        '<td>'+esc(C(i.contactId).name)+'</td><td class="mini">'+ic(PAYIC[i.pay]||'i-cash')+' '+esc(i.pay)+'</td><td>'+ctag(i.country,1)+'</td>'+
        '<td class="num">'+fmt(docTotals(i).total,i.country)+'</td><td class="num"><b>'+usd(invUsd(i))+'</b></td></tr>').join('')
       :emptyRow(7,emptyCountry('i-wallet','Sin cobros en el período','Probá ampliando el rango a 30 días.')))+
      '</tbody></table></div></div>'+
    '<div><div class="card mb"><h3>Reparto por medio de pago</h3>'+

        '<b style="font-size:13.2px">'+ic(s.proc==='PayPal'?'i-globe':'i-card')+' '+esc(s.proc)+'</b>'+stag(s.status)+'</div>'+
        '<div class="mini muted" style="margin:4px 0">'+dmy(s.date)+' · '+s.n+' operación'+(s.n>1?'es':'')+' · '+ctag(s.country,1)+'</div>'+

  const due=act.filter(s=>s.next<=TODAY);
  const churn=list.filter(s=>s.status==='pausada').length;
  $('#v-subs').innerHTML=
  '<div class="grid g4 mb">'+
    '<div class="card kpi"><h3>Ingreso recurrente mensual</h3><div class="n">'+usd(mrr)+'</div><div class="d">'+ic('i-repeat')+act.length+' suscripciones activas</div></div>'+
    '<div class="card kpi"><h3>Valor anual proyectado</h3><div class="n">'+usd(mrr*12)+'</div><div class="d">'+ic('i-trending-up')+'si nadie se da de baja</div></div>'+
    '<div class="card kpi"><h3>Pausadas</h3><div class="n">'+churn+'</div><div class="d '+(churn?'warn':'')+'">'+ic('i-pause')+(churn?'candidatas a reactivar':'ninguna')+'</div></div>'+

      '<div class="mini" style="margin-bottom:10px">PlaqueOff es de uso permanente: la suscripción convierte a cada cliente en ingreso recurrente. Cada mañana el sistema genera solo las facturas y las entregas del día.</div>'+
      '<button class="btn primary" '+(due.length?'':'disabled')+' onclick="runSubs()">'+ic('i-play')+' Generar '+(due.length||'')+' pedido'+(due.length===1?'':'s')+' de hoy</button></div>'+
  '</div>'+
  '<div class="card tight"><div class="scroll-x"><table><thead><tr><th>Cliente</th><th>País</th><th>Producto</th><th class="num">Cant.</th><th>Cada</th><th>Próxima</th><th class="num">Precio</th><th>Desde</th><th>Estado</th><th></th></tr></thead><tbody>'+
  (list.length?list.sort((a,b)=>a.next.localeCompare(b.next)).map(s=>{const c=C(s.contactId);
    return '<tr'+(s.next<=TODAY&&s.status==='activa'?' style="background:var(--teal-soft)"':'')+'><td><b style="cursor:pointer" onclick="openContact('+c.id+')">'+esc(c.name)+'</b>'+
      ((c.pets&&c.pets.length)?'<div class="mini muted">'+c.pets.map(p=>petIc(p.k)+' '+esc(p.n)).join(' ')+'</div>':'')+'</td>'+
      '<td>'+ctag(c.country,1)+'</td><td>'+esc(P(s.sku).short)+'</td><td class="num">'+s.qty+'</td><td>'+s.every+' días</td>'+
      '<td><b>'+dmy(s.next)+'</b>'+(s.next<=TODAY&&s.status==='activa'?'<div class="mini" style="color:var(--teal-700);font-weight:800">hoy</div>':'')+'</td>'+
      '<td class="num">'+fmt(unit(s.sku,c.country,c.type)*s.qty*(1-s.disc/100),c.country)+(s.disc?'<div class="mini muted">−'+s.disc+'% suscriptor</div>':'')+'</td>'+
      '<td class="mini muted">'+dmy(s.started)+'</td><td>'+stag(s.status)+'</td>'+
      '<td><button class="btn sm" onclick="toggleSub('+s.id+')">'+(s.status==='activa'?ic('i-pause')+' Pausar':ic('i-play')+' Reanudar')+'</button></td></tr>'}).join('')
   :emptyRow(10,emptyCountry('i-repeat','Sin suscripciones','Desde la ficha de cualquier cliente particular podés crear una: el sistema calcula solo cada cuántos días le toca.')))+

function toggleSub(id){
  const s=subs.find(x=>x.id===id);if(!s)return;
  s.status=s.status==='activa'?'pausada':'activa';
  log(s.contactId,'sistema','Suscripción '+(s.status==='activa'?'reanudada':'pausada'));
  toast('Suscripción '+(s.status==='activa'?'reanudada':'pausada'),'i-repeat');render();
}
function newSub(cid){
  const c=C(cid);if(!c)return;
  const sku=(c.pets&&c.pets.some(p=>p.k==='cat'))?'PO-CAT-PWD':'PO-DOG-PWD';
  const r=refill(c);
  const every=r?Math.max(15,Math.round(r.days/15)*15):30;
  subs.push({id:uid(),contactId:cid,sku,qty:1,every,next:(r&&r.left>0)?r.end:TODAY,status:'activa',disc:10,started:TODAY});
  log(cid,'sistema','Suscripción creada: '+P(sku).short+' cada '+every+' días · 10% de descuento');
  toast('Suscripción creada con 10% de descuento','i-repeat');openContact(cid);
}
function runSubs(){
  const due=subs.filter(s=>s.status==='activa'&&s.next<=TODAY&&inCid(s.contactId));
  if(!due.length){toast('No hay suscripciones para generar','i-info');return}
  askConfirm({title:'Generar pedidos del día',
    text:'Se van a emitir <b>'+due.length+' factura'+(due.length>1?'s':'')+'</b>, descontar el stock y agregar las entregas a la ruta de hoy:<br><br>'+
      '<div style="margin-top:10px">'+due.map(s=>'<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)">'+ic('i-check-circle','ic-md')+'<span><b>'+esc(C(s.contactId).name)+'</b> — '+s.qty+'× '+esc(P(s.sku).short)+'</span></div>').join('')+'</div>',
    ok:'Generar todo',onOk:()=>{
      let n=0;
      due.forEach(s=>{const c=C(s.contactId);
        emitInvoice({contactId:c.id,lines:[{sku:s.sku,qty:s.qty}],disc:s.disc,pay:'Mercado Pago',status:'pagada',
          delivery:true,slot:c.country==='UY'?'14:00–18:00':'Courier'});
        s.next=addDays(TODAY,s.every);n++});
      aud(n+' suscripciones generadas');toast(n+' facturas emitidas y agregadas a la ruta','i-check-circle');render();
    }});
}

  const reasons=Object.keys(byReason).sort((a,b)=>byReason[b]-byReason[a]);

     :emptyRow(8,emptyCountry('i-check-circle','Sin devoluciones','Ninguna venta necesitó nota de crédito. Se emiten desde el detalle de cada factura.')))+
    '</tbody></table></div></div>'+

function rEntregas(){
  const all=deliveries.filter(d=>inCid(d.contactId)).sort((a,b)=>a.order-b.order);
  const ruta=all.filter(d=>d.mode!=='courier');
  const courier=all.filter(d=>d.mode==='courier');

  const row=d=>{
    const c=C(d.contactId);if(!c)return '';
    const inv=d.invId?invoices.find(i=>i.id===d.invId):null;
    const det=inv?inv.lines.map(l=>l.qty+'× '+esc(P(l.sku).short)).join(', '):(d.note?esc(d.note):'Sin detalle');
    return '<li class="'+(d.status==='entregada'?'done':'')+'"><div class="t"><b style="cursor:pointer" onclick="openContact('+c.id+')">'+esc(c.name)+'</b> '+stag(d.status)+' '+ctag(c.country,1)+
      '<div class="mini muted">'+ic('i-pin')+' '+esc(c.addr||'sin dirección')+' · '+esc(d.slot)+(inv?' · '+det:'')+
      (inv&&d.note?' · '+esc(d.note):'')+(!inv&&d.note?'':'')+
      (inv&&inv.status!=='pagada'&&inv.pay==='efectivo'?' · <b style="color:var(--rose)">cobrar '+fmt(docTotals(inv).total,inv.country)+'</b>':'')+'</div></div>'+
      '<div style="display:flex;gap:6px;align-items:center">'+
      (inv?'<button class="btn sm ghost" onclick="openInvoice(\''+inv.id+'\')" aria-label="Ver factura">'+ic('i-receipt')+'</button>':'')+
      (d.status==='pendiente'?'<button class="btn sm" onclick="delStatus('+d.id+',\'en camino\')">'+ic('i-play')+' Salir</button>':'')+
      (d.status==='en camino'?'<a class="btn sm wa" target="_blank" rel="noopener" href="'+wa(c.phone,fill(TEMPLATES[2].t,c))+'">'+ic('i-chat')+' Llegando</a><button class="btn sm primary" onclick="delStatus('+d.id+',\'entregada\')">'+ic('i-check')+' Entregada</button>':'')+
      (d.status==='entregada'?'<span class="tag ok">'+ic('i-check')+'</span>':'')+'</div></li>'};

    '<div><div class="card mb"><div class="cardhd"><h3 style="margin:0">Ruta de '+dmyL(TODAY)+' · Mateo</h3><div class="grow"></div><span class="pill">'+ic('i-scooter')+done+' de '+ruta.length+' entregadas</span></div>'+
      '<div class="bar lg" style="margin-bottom:14px"><i style="width:'+(ruta.length?done/ruta.length*100:0)+'%"></i></div>'+
      (ruta.length?'<ol class="route">'+ruta.map(row).join('')+'</ol>'
        :emptyCountry('i-scooter','Sin entregas en la ruta de hoy','Cada venta con envío entra sola acá, ordenada por franja horaria.'))+'</div>'+
      '<div class="card"><div class="cardhd"><h3 style="margin:0">Despachos por courier</h3><div class="grow"></div><span class="pill">'+ic('i-truck')+courier.length+'</span></div>'+

    '<div><div class="card mb"><h3>Optimizar la ruta</h3>'+

function optRoute(){
  const pend=deliveries.filter(d=>d.status!=='entregada'&&d.mode!=='courier');

  pend.sort((a,b)=>a.slot.localeCompare(b.slot)).forEach((d,i)=>d.order=100+i);
  toast(pend.length+' paradas reordenadas · unos 14 km','i-map');render();
}
function delStatus(id,s){
  const d=deliveries.find(x=>x.id===id);if(!d)return;

    log(d.contactId,'entrega','Pedido entregado · '+d.slot);
    const inv=d.invId?invoices.find(i=>i.id===d.invId):null;
    if(inv&&inv.status!=='pagada'&&inv.pay==='efectivo'){inv.status='pagada';inv.paidOn=TODAY;aud('Cobro en efectivo contra entrega · '+inv.id)}
  }

const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const mIdx=m=>{const p=m.split('-');return +p[0]*12+(+p[1]-1)};
const mAdd=(m,n)=>{const i=mIdx(m)+n;return String(Math.floor(i/12))+'-'+String(i%12+1).padStart(2,'0')};
const mLbl=m=>MONTHS[+m.split('-')[1]-1]+' '+m.split('-')[0].slice(2);
const SERIES_BASE={
  UY:{'2025-09':3559,'2025-10':3600,'2025-11':3260,'2025-12':3900,'2026-01':3100,'2026-02':3300,'2026-03':3600,'2026-04':3900,'2026-05':4100,'2026-06':3060,'2026-07':2594,'2026-08':2204},
  AR:{'2026-06':311,'2026-07':358,'2026-08':603},
  PY:{'2026-06':219,'2026-07':348,'2026-08':277}};
function monthSales(k,m){
  const real=invoices.filter(i=>i.country===k&&i.status!=='anulada'&&i.date.startsWith(m)).reduce((a,i)=>a+invUsd(i),0);
  const base=(SERIES_BASE[k]||{})[m]||0;
  return real+base;
}
function cohorts(){
  const first={},byC={};
  invoices.filter(i=>inC(i)&&i.status!=='anulada'&&i.date>='2026-01-01').forEach(i=>{
    const m=i.date.slice(0,7);
    if(!first[i.contactId]||m<first[i.contactId])first[i.contactId]=m;
    (byC[i.contactId]=byC[i.contactId]||{})[m]=true;
  });
  const cs={};
  Object.keys(first).forEach(id=>{(cs[first[id]]=cs[first[id]]||[]).push(id)});
  return Object.keys(cs).sort().map(m=>({m,n:cs[m].length,
    r:[1,2,3].map(k=>{const t=mAdd(m,k);return cs[m].filter(id=>byC[id]&&byC[id][t]).length})}));
}

  const avgGrow=(last3[0]&&last3[2])?Math.pow(last3[0]/last3[2],1/2)-1:0.08;
  const proj=[1,2,3].map(i=>({m:mAdd('2026-09',i),v:sep26*Math.pow(1+avgGrow,i)}));
  $('#v-reportes').innerHTML=

    '<div class="card kpi"><h3>Margen bruto</h3><div class="n">'+(rev?Math.round((rev-cogs)/rev*100):0)+'%</div><div class="d">'+ic('i-percent')+usd(rev-cogs)+' sobre '+usd(rev)+' sin IVA</div></div>'+

    '<div class="card kpi"><h3>Interanual de setiembre</h3><div class="n">'+(sep25?pct((sep26/sep25-1)*100):'—')+'</div><div class="d up">'+ic('i-trending-up')+usd(sep26)+' proyectado contra '+usd(sep25)+' en 2025</div></div>'+

function drawChart(months,series,projSep){
  const cv=$('#ch');if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.width,H=cv.height;
  const ctx=cv.getContext('2d');
  const padL=44,padR=12,padT=16,padB=26;
  const all=CK.reduce((a,k)=>a.concat(series[k]),[]);
  const mx=Math.max.apply(null,all.concat([1]))*1.12;
  ctx.clearRect(0,0,W,H);
  ctx.font='11px Nunito, sans-serif';
  for(let i=0;i<=4;i++){
    const y=padT+(H-padT-padB)*i/4;
    ctx.strokeStyle='#E5EEEC';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,y+.5);ctx.lineTo(W-padR,y+.5);ctx.stroke();
    ctx.fillStyle='#7C9894';ctx.textAlign='right';
    ctx.fillText(nf(mx*(1-i/4)),padL-8,y+4);
  }
  const xAt=i=>padL+(W-padL-padR)*i/(months.length-1);
  const yAt=v=>padT+(H-padT-padB)*(1-v/mx);
  months.forEach((m,i)=>{if(i%1===0){ctx.fillStyle='#7C9894';ctx.textAlign='center';ctx.fillText(mLbl(m).split(' ')[0],xAt(i),H-8)}});
  const cols={UY:'#2C74C0',AR:'#12907C',PY:'#D24F47'};
  CK.forEach(k=>{
    if(country!=='all'&&country!==k)return;
    const s=series[k];
    const g=ctx.createLinearGradient(0,padT,0,H-padB);
    g.addColorStop(0,cols[k]+'26');g.addColorStop(1,cols[k]+'00');
    ctx.beginPath();ctx.moveTo(xAt(0),yAt(s[0]));
    s.forEach((v,i)=>{if(i)ctx.lineTo(xAt(i),yAt(v))});
    ctx.lineTo(xAt(s.length-1),H-padB);ctx.lineTo(xAt(0),H-padB);ctx.closePath();
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();
    s.forEach((v,i)=>{const x=xAt(i),y=yAt(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.strokeStyle=cols[k];ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.stroke();
    if(projSep&&projSep[k]>s[s.length-1]){
      ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.moveTo(xAt(s.length-2),yAt(s[s.length-2]));ctx.lineTo(xAt(s.length-1),yAt(projSep[k]));
      ctx.strokeStyle=cols[k];ctx.lineWidth=2;ctx.globalAlpha=.55;ctx.stroke();
      ctx.globalAlpha=1;ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(xAt(s.length-1),yAt(projSep[k]),4,0,7);ctx.fillStyle='#fff';ctx.strokeStyle=cols[k];ctx.lineWidth=2;ctx.fill();ctx.stroke();
    }
    s.forEach((v,i)=>{if(!v)return;ctx.beginPath();ctx.arc(xAt(i),yAt(v),i===s.length-1?4.5:3,0,7);
      ctx.fillStyle=i===s.length-1?cols[k]:'#fff';ctx.strokeStyle=cols[k];ctx.lineWidth=2;ctx.fill();ctx.stroke()});
  });
}

  }else if(what==='stock'){
    const cols=country==='all'?CK:[country];
    rows=[['sku','producto','linea','gramos'].concat(cols.map(k=>'stock_'+k)).concat(cols.map(k=>'precio_'+k)).concat(cols.map(k=>'margen_'+k))]
      .concat(PRODUCTS.map(p=>[p.sku,p.name,p.cat,p.grams].concat(cols.map(k=>p.stock[k])).concat(cols.map(k=>p.price[k])).concat(cols.map(k=>Math.round(marginPct(p,k))+'%'))));
  }else if(what==='precios'){
    const k=country==='all'?precK:country;name='precios-'+k;
    rows=[['sku','producto','moneda','pvp','tachado'].concat(Object.keys(LISTS).map(t=>LISTS[t].n))]
      .concat(PRODUCTS.map(p=>[p.sku,p.name,COUNTRIES[k].cur,p.price[k],p.was[k]].concat(Object.keys(LISTS).map(t=>unit(p.sku,k,t)))));
  }else{
    rows=[['id','fecha','cliente','pais','total']].concat(quotes.filter(inC).map(q=>[q.id,q.date,C(q.contactId).name,q.country,Math.round(docTotals(q).total)]));
  }
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='petsmiles-'+name+(country!=='all'?'-'+country:'')+'-'+TODAY+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('Exportado'+(country!=='all'?' · solo '+COUNTRIES[country].name:'')+' · '+(rows.length-1)+' filas','i-download');
}

// ============ Paleta de comandos ============
let palIdx=0;
function openPal(){$('#pal').classList.add('on');$('#pal-q').value='';palRender('');setTimeout(()=>$('#pal-q').focus(),40)}
function closePal(){$('#pal').classList.remove('on')}
function palItems(q){
  q=(q||'').toLowerCase().trim();
  const it=[];
  const acts=[
    ['i-receipt','Nueva venta','N','accion',()=>newSale()],
    ['i-clipboard','Nueva cotización','','accion',()=>newQuote()],
    ['i-user-plus','Nuevo contacto','C','accion',()=>newContact()],
    ['i-repeat','Generar suscripciones de hoy','','accion',()=>{go('subs');runSubs()}],
    ['i-megaphone','Nueva campaña de WhatsApp','','accion',()=>{go('campanas');newCampaign()}],
    ['i-ship','Nueva orden de compra','','accion',()=>{go('compras');newPO()}],
    ['i-boxes','Ajustar stock','','accion',()=>adjustStock()],
    ['i-printer','Informe mensual imprimible','','accion',()=>{go('reportes');setTimeout(printReport,80)}],
    ['i-download','Exportar contactos a CSV','','accion',()=>exportCsv('contactos')],
    ['i-download','Exportar facturas a CSV','','accion',()=>exportCsv('facturas')],
    ['i-target','Editar metas del mes','','accion',()=>{go('metas');setTimeout(editGoals,80)}],
    ['i-play','Ver el tour de bienvenida','','accion',()=>openTour()],
    ['i-globe','Ver los tres países','','filtro',()=>setCountry('all')],
    ['i-globe','Filtrar por Uruguay','','filtro',()=>setCountry('UY')],
    ['i-globe','Filtrar por Argentina','','filtro',()=>setCountry('AR')],
    ['i-globe','Filtrar por Paraguay','','filtro',()=>setCountry('PY')],
    ['i-user','Cambiar de usuario','','accion',()=>switchUser()],
  ];
  NAV.forEach(n=>acts.push([n.i,'Ir a '+n.t,'','navegar',()=>go(n.v)]));
  acts.filter(a=>!q||a[1].toLowerCase().indexOf(q)>=0).slice(0,q?8:9).forEach(a=>it.push({i:a[0],t:a[1],k:a[2]||a[3],g:a[3],go:a[4]}));
  if(q){
    contacts.filter(c=>c.name.toLowerCase().indexOf(q)>=0||(c.contact||'').toLowerCase().indexOf(q)>=0||(c.phone||'').indexOf(q)>=0||(c.pets||[]).some(p=>p.n.toLowerCase().indexOf(q)>=0))
      .slice(0,6).forEach(c=>it.push({i:TYPEICON[c.type],g:'clientes',t:c.name+((c.pets&&c.pets.length)?' · '+c.pets.map(p=>p.n).join(', '):''),k:TYPES[c.type]+' · '+c.stage,go:()=>openContact(c.id)}));
    invoices.filter(i=>i.id.toLowerCase().indexOf(q)>=0).slice(0,4).forEach(i=>it.push({i:'i-receipt',g:'documentos',t:'Factura '+i.id+' · '+C(i.contactId).name,k:i.status,go:()=>openInvoice(i.id)}));
    quotes.filter(x=>x.id.toLowerCase().indexOf(q)>=0).slice(0,3).forEach(x=>it.push({i:'i-clipboard',g:'documentos',t:x.id+' · '+C(x.contactId).name,k:x.status,go:()=>openQuote(x.id)}));
    credits.filter(x=>x.id.toLowerCase().indexOf(q)>=0).slice(0,3).forEach(x=>it.push({i:'i-undo',g:'documentos',t:x.id+' · '+esc(x.reason),k:'nota de crédito',go:()=>openCredit(x.id)}));
    PRODUCTS.filter(p=>p.name.toLowerCase().indexOf(q)>=0||p.sku.toLowerCase().indexOf(q)>=0||p.cat.toLowerCase().indexOf(q)>=0)
      .slice(0,4).forEach(p=>it.push({i:'i-box',g:'productos',t:p.name,k:'stock UY '+p.stock.UY,go:()=>openProduct(p.sku)}));
    campaigns.filter(c=>c.name.toLowerCase().indexOf(q)>=0).slice(0,3).forEach(c=>it.push({i:'i-megaphone',g:'campañas',t:c.name,k:c.sent+' envíos',go:()=>openCampaign(c.id)}));
  }
  return it.slice(0,14);
}
function palRender(q){
  const it=palItems(q);window._pi=it;palIdx=0;
  let h='',g=null;
  it.forEach((x,i)=>{if(x.g!==g){g=x.g;h+='<div class="grp">'+g+'</div>'}
    h+='<div class="it '+(i===0?'on':'')+'" onclick="palGo('+i+')">'+ic(x.i,'ic-18')+'<span class="t">'+esc(x.t)+'</span><span class="k">'+esc(x.k)+'</span></div>'});
  $('#pal-res').innerHTML=h||emptyState('i-search','Nada por acá','Probá con el nombre de un cliente, una mascota, un número de factura o una acción.');
}
function palGo(i){const x=window._pi&&window._pi[i];closePal();if(x)x.go()}
$('#pal-q').oninput=e=>palRender(e.target.value);
$('#pal-q').onkeydown=e=>{
  const n=window._pi?window._pi.length:0;
  if(e.key==='ArrowDown'){if(!n)return;e.preventDefault();palIdx=(palIdx+1)%n}
  else if(e.key==='ArrowUp'){if(!n)return;e.preventDefault();palIdx=(palIdx-1+n)%n}
  else if(e.key==='Enter'){if(n)palGo(palIdx);return}
  else if(e.key==='Escape'){closePal();return}
  else return;
  const els=document.querySelectorAll('.pal .it');
  els.forEach((el,i)=>el.classList.toggle('on',i===palIdx));
  if(els[palIdx])els[palIdx].scrollIntoView({block:'nearest'});
};
$('#pal').onclick=e=>{if(e.target.id==='pal')closePal()};

  '<div class="actions"><div style="display:flex;gap:6px;align-items:center;margin-right:auto">'+

    (tourStep>0?'<button class="btn" onclick="openTour('+(tourStep-1)+')">'+ic('i-arrow-left')+' Anterior</button>':'')+
    (tourStep<TOUR.length-1?'<button class="btn primary" onclick="openTour('+(tourStep+1)+')">Siguiente '+ic('i-arrow-right')+'</button>'
      :'<button class="btn primary" onclick="closeModal();toast(\'Listo. Mirá todo lo que quieras.\',\'i-sparkle\')">'+ic('i-check')+' Empezar</button>')+'</div>');
}

$('#modal2').onclick=e=>{if(e.target.id==='modal2')closeModal2()};
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const typing=ae&&['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}
  if(e.key==='Escape'){
    if($('#modal2').classList.contains('on')){closeModal2();return}
    if($('#pal').classList.contains('on')){closePal();return}
    closeModal();closeSheet();$('#pop').classList.remove('on');return;
  }
  if(typing||$('#modal').classList.contains('on')||$('#modal2').classList.contains('on'))return;
  if(e.key==='n'||e.key==='N')newSale();
  else if(e.key==='c'||e.key==='C')newContact();
  else if(e.key==='/'){e.preventDefault();openPal()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.iconbtn')&&!e.target.closest('.pop'))$('#pop').classList.remove('on')});
