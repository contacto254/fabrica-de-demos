<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Romualdo &amp; Cía. · Gestión de lotes y negocios</title>
<meta name="description" content="Sistema de gestión de Romualdo & Cía.: lotes, Plaza Rural, remates particulares, proformas y comisiones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F3; --panel:#FFFFFF; --ink:#18261F; --ink-2:#4B5C53; --ink-3:#6F7F76;
  --line:#DFE6E0; --line-2:#EBF0EC;
  --brand:#1F6B45; --brand-deep:#154A30; --brand-soft:#E3F1E8; --brand-ink:#FFFFFF;
  --gold:#A8792B; --gold-soft:#F7EEDC;
  --warn:#C98A0B; --warn-soft:#FFF3D6; --warn-ink:#7A5200;
  --bad:#C7443C; --bad-soft:#FCE6E4; --bad-ink:#9A2B24;
  --info:#2F6690; --info-soft:#E3EEF7;
  --wa:#1FA855;
  --side:#0F2A1D; --side-ink:#C9D8CF; --side-ink-2:#8FA99B; --side-hover:#183B29;
  --r:10px; --r-lg:16px;
  --shadow:0 12px 32px rgba(16,40,28,.14),0 2px 6px rgba(16,40,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand svg.logo{width:38px;height:38px;flex:none}
.brand b{display:block;color:#fff;font-weight:800;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--side-ink-2);font-size:11px;letter-spacing:.4px}
.nav{padding:4px 10px 16px;flex:1}
.nav h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--side-ink-2);font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;font-size:13.5px;transition:background .15s,color .15s}
.nav button:hover{background:var(--side-hover);color:#fff}
.nav button.on{background:var(--brand);color:#fff}
.nav .cnt{margin-left:auto;background:#2B5A41;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.nav button.on .cnt{background:rgba(255,255,255,.22)}
.nav .cnt.hot{background:var(--wa)}
.side-foot{padding:12px 14px;border-top:1px solid #1D3E2C;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--brand-soft);color:var(--brand-deep);flex:none}
.side-foot .av{background:#2B5A41;color:#fff}
.side-foot b{color:#fff;font-size:13px;display:block}
.side-foot small{color:var(--side-ink-2);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
.top .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:250px;color:var(--ink-3);cursor:pointer}
.search:hover{border-color:#C6D2C9}
.search kbd{margin-left:auto}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-2);background:var(--bg)}
.icon-btn.menu-btn{display:none}
.top h1{white-space:nowrap}
.top>div:nth-child(2){min-width:0}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.content{padding:20px 24px 60px;max-width:1440px;width:100%}

/* botones */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:#C6D2C9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{filter:brightness(.93)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}

/* tarjetas */
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.card h3 small{font-weight:600;color:var(--ink-3);font-size:12px}
.mb{margin-bottom:15px}
.kpi{position:relative;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:#BFD3C5}
.kpi .lbl{color:var(--ink-3);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12.5px;color:var(--ink-2)}
.kpi .foot b.up{color:var(--brand)}
.kpi .foot b.dn{color:var(--bad-ink)}
.kpi .ico{position:absolute;right:15px;top:15px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.kpi .ico.g{background:var(--gold-soft);color:var(--gold)}
.kpi .ico.w{background:#E4F6EA;color:var(--wa)}
.kpi .ico.r{background:var(--bad-soft);color:var(--bad)}

/* tablas */
.tbl-wrap{overflow-x:auto;margin:0 -17px -17px;border-top:1px solid var(--line-2)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFA}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover{background:#F6F9F7}
td.strong{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{padding-left:17px}
th:last-child,td:last-child{padding-right:17px}
td .muted,.muted{color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums}
.strong{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.tag.ok{background:var(--brand-soft);color:var(--brand-deep)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad-ink)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.gold{background:var(--gold-soft);color:#7C5613}
.tag.wa{background:#E4F6EA;color:#136B37}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}

/* filtros */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:#BFD3C5}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.65;margin-left:4px}
.sel,.inp{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 10px;font-size:13px;min-width:0}
.sel:hover,.inp:hover{border-color:#C6D2C9}
.inp:focus,.sel:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field .inp,.field .sel{width:100%}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form3{grid-template-columns:repeat(3,minmax(0,1fr))}
textarea.inp{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.check input{accent-color:var(--brand);width:16px;height:16px}
.req{color:var(--bad)}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer;border-radius:8px;padding-left:6px;padding-right:6px;margin:0 -6px}
.li.click:hover{background:#F6F9F7}
.li .t{font-weight:700}
.li .s{font-size:12.5px;color:var(--ink-3)}
.li .grow{flex:1;min-width:0}
.li .ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.bubble.w{background:var(--warn-soft);color:var(--warn-ink)}
.bubble.r{background:var(--bad-soft);color:var(--bad)}
.bubble.wa{background:#E4F6EA;color:var(--wa)}
.bubble.i{background:var(--info-soft);color:var(--info)}
.bubble.g{background:var(--gold-soft);color:var(--gold)}

/* hero del remate */
.hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;border-radius:var(--r-lg);padding:20px 22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:15px;position:relative;overflow:hidden}
.hero .pat{position:absolute;right:-30px;top:-20px;width:260px;height:260px;opacity:.09}
.hero h2{margin:0;font-size:20px;font-weight:800}
.hero p{margin:4px 0 0;color:#D5E8DC;font-size:13px}
.hero .stats{display:flex;gap:26px;flex-wrap:wrap}
.hero .stats div b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .stats div span{font-size:11.5px;color:#C4DDCD;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.hero .btn{background:#fff;color:var(--brand-deep);border-color:#fff}
.hero .btn:hover{background:#EAF3ED}
.hero .count{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;text-align:center}
.hero .count b{font-size:24px;display:block;font-weight:800}
.hero .count span{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#C4DDCD;font-weight:700}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#EBF0EC;border-radius:var(--r-lg);padding:10px;min-height:420px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.col.over{background:#D7E8DD;outline:2px dashed var(--brand);outline-offset:-4px}
.col h4{margin:2px 4px 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.col h4 .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:11.5px}
.col h4 .sum{font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink-3);font-size:11.5px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:grab;transition:box-shadow .15s,transform .15s}
.kc:hover{box-shadow:0 4px 14px rgba(16,40,28,.08)}
.kc.drag{opacity:.45;transform:rotate(1.5deg)}
.kc .t{font-weight:800;font-size:13.5px}
.kc .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kc .m{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.kc .m .av{width:22px;height:22px;font-size:10px;margin-left:auto}

/* bandeja */
.inbox{display:grid;grid-template-columns:330px 1fr 290px;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;height:calc(100vh - 150px);min-height:520px}
.inbox .threads{border-right:1px solid var(--line);overflow-y:auto}
.inbox .th{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s}
.inbox .th:hover{background:#F6F9F7}
.inbox .th.on{background:var(--brand-soft)}
.inbox .th .grow{flex:1;min-width:0}
.inbox .th .t{font-weight:800;display:flex;gap:6px;align-items:center}
.inbox .th .t small{white-space:nowrap;margin-left:auto;font-weight:600;color:var(--ink-3);font-size:11.5px}
.inbox .th .p{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .th .unread{width:8px;height:8px;border-radius:50%;background:var(--wa);flex:none;margin-top:6px}
.inbox .chat{display:flex;flex-direction:column;min-width:0;background:#F3F1EA}
.inbox .chat-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.inbox .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:8px 11px;border-radius:12px;font-size:13.5px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg.me{align-self:flex-end;background:#DDF3D9}
.msg.bot{align-self:flex-end;background:#E6EEF6}
.msg small{display:block;font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:2px}
.msg.sys{align-self:center;background:#FFF8E6;color:var(--warn-ink);font-size:12px;font-weight:700}
.inbox .compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.inbox .compose .inp{flex:1}
.inbox .ctx{border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.inbox .ctx h5{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px;background:var(--panel)}

/* ficha */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.facts div span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.facts div b{font-weight:700;font-variant-numeric:tabular-nums}
.facts.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:10px;position:relative;padding-bottom:14px}
.tl:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line-2)}
.tl:last-child:before{display:none}
.tl .bubble{width:28px;height:28px;border-radius:50%}
.tl .t{font-weight:700;font-size:13px}
.tl .s{font-size:12px;color:var(--ink-3)}
.steps{display:flex;gap:0;margin:4px 0 14px}
.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3);position:relative;padding-top:24px}
.steps div:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1}
.steps div:after{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--brand-deep)}
.steps div.done:before,.steps div.done:after{background:var(--brand)}
.steps div.cur{color:var(--ink)}
.steps div.cur:before{background:#fff;border:3px solid var(--brand)}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;cursor:pointer;border:0;background:none;padding:4px 0;margin-bottom:10px}
.back:hover{color:var(--brand)}

/* barras simples */
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.brow .track{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.brow .fill{height:100%;background:var(--brand);border-radius:999px}
.brow .fill.g{background:var(--gold)}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:Manrope,sans-serif;font-size:13px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2);font-weight:700}
.chart .bar{fill:var(--brand);transition:opacity .12s}
.chart .bar:hover{opacity:.8}
.chart .grid-l{stroke:var(--line-2);stroke-width:1}
.chart .ln{stroke:var(--brand);stroke-width:2;fill:none}
.chart .ar{fill:var(--brand);opacity:.08}
.chart .pt{fill:var(--brand);stroke:#fff;stroke-width:2}
.tip{position:fixed;z-index:200;background:var(--ink);color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}
.tip.on{opacity:1}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,32,24,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.scrim.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);width:100%;max-width:560px;animation:pop .18s}
.modal.lg{max-width:820px}
.modal.xl{max-width:980px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:16.5px;font-weight:800;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#FAFBFA;border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.modal-f .grow{flex:1}

/* toast */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-weight:600;font-size:13.5px;animation:up .2s;pointer-events:auto;max-width:92vw}
.toast .ic{color:#7FD6A1}
.toast.wa .ic{color:#5BE08E}
.toast button{background:none;border:0;color:#9FE0B8;font-weight:800;cursor:pointer;padding:0 0 0 6px}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ctrl k */
.cmdk{max-width:620px}
.cmdk .q{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk .q input{border:0;outline:0;flex:1;font-size:16px;background:none}
.cmdk .res{max-height:60vh;overflow-y:auto;padding:6px}
.cmdk .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);font-weight:700;padding:8px 10px 4px}
.cmdk .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.cmdk .it.on,.cmdk .it:hover{background:var(--brand-soft)}
.cmdk .it small{margin-left:auto;color:var(--ink-3);font-size:12px}

/* tour */
.tour{position:fixed;z-index:400;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:330px;padding:16px;border:1px solid var(--line)}
.tour h4{margin:0 0 6px;font-size:15px}
.tour p{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.tour .f{display:flex;align-items:center;gap:8px}
.tour .f span{flex:1;color:var(--ink-3);font-size:12px;font-weight:700}
.ring{position:fixed;z-index:399;border-radius:12px;box-shadow:0 0 0 4px var(--brand),0 0 0 9999px rgba(15,32,24,.45);pointer-events:none;transition:all .25s}

/* impresión de documentos */
.doc{border:1px solid var(--line);border-radius:12px;padding:26px;background:#fff;font-size:13px}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:16px}
.doc .dh b{font-size:17px}
.doc h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--brand-deep)}
.doc table td,.doc table th{padding:6px 8px}
.doc .tot td{font-weight:800;border-top:2px solid var(--ink)}
.doc .foot{margin-top:18px;font-size:11px;color:var(--ink-3)}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;padding:0}
  #print .doc{border:0;padding:0}
}

.empty{text-align:center;padding:30px 10px;color:var(--ink-3)}
.empty .bubble{margin:0 auto 10px;width:44px;height:44px}
.empty p{margin:0 0 12px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.progress div{height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.sep{height:1px;background:var(--line);margin:14px 0}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6B4A10;display:flex;gap:9px;align-items:flex-start}
.note.i{background:var(--info-soft);color:#234E6E}
.note.g{background:var(--brand-soft);color:var(--brand-deep)}
.flex{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.right{margin-left:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--wa)}
.live .dot{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hl{animation:hl 1.6s}
@keyframes hl{from{background:#FFF3C4}to{background:transparent}}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .15s;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}
.sw.on:after{left:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand-deep);border-bottom-color:var(--brand)}
.mini-map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-map div{border-radius:8px;padding:8px;font-size:11.5px;font-weight:700;cursor:pointer;transition:transform .12s;color:var(--ink)}
.mini-map div:hover{transform:translateY(-1px)}
.mini-map div b{display:block;font-size:16px}

@media (max-width:1560px){.search span{display:none}.search{min-width:0}}
@media (max-width:1280px){.top-actions .btn:not(.pri) span{display:none}.top .sub{max-width:300px}}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inbox{grid-template-columns:290px 1fr}
  .inbox .ctx{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .icon-btn.menu-btn{display:grid}
  .g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .search{min-width:0}
  .search span,.search kbd{display:none}
  .top{padding:10px 16px}
  .content{padding:16px 16px 60px}
  .form,.form3{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr;height:auto}
  .inbox .threads{max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
  .inbox .chat{min-height:420px}
  .top-actions .btn span{display:none}
  .top>div:nth-child(2){flex:1;min-width:0}
  .top h1{font-size:16px;overflow:hidden;text-overflow:ellipsis}
  .top .grow{display:none}
  .toasts{left:16px;right:16px;transform:none}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr}
  .facts,.facts.f3{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:90px 1fr 70px}
  .top .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  for (let k = 1; k <= 3; k++) { const y = pt + (H - pt - pb) * (1 - k / 3); g += `<line class="grid-l" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  items.forEach((it, i) => {
    const h = Math.max(2, (H - pt - pb) * it.v / max), x = pl + bw * i + (bw - b) / 2, y = H - pb - h;
    g += `<rect class="bar" x="${x}" y="${y}" width="${b}" height="${h}" rx="4" data-tip="${esc(it.l + ': ' + fmt(it.v))}" ${it.c ? `style="fill:${it.c}"` : ''}/>`;
    g += `<text x="${x + b / 2}" y="${H - 8}" text-anchor="middle">${esc(it.l)}</text>`;
    if (o.labels !== false && (i === items.length - 1 || o.labels === 'all')) g += `<text class="lbl" x="${x + b / 2}" y="${y - 6}" text-anchor="middle">${esc(fmt(it.v))}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Gráfico de barras')}">${g}</svg>`;
}
function lineChart(items, o = {}) {
  const W = 600, H = o.h || 200, pl = 34, pr = 14, pb = 26, pt = 20;
  const vs = items.map(i => i[1]);
  const mn = Math.min(...vs) * .96, mx = Math.max(...vs) * 1.02;
  const X = i => pl + (W - pl - pr) * i / (items.length - 1);
  const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const fmt = o.fmt || (v => nf2.format(v));
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = mn + (mx - mn) * k / 3, y = Y(v); g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${nf2.format(v)}</text>`; }
  const pts = items.map((it, i) => `${X(i)},${Y(it[1])}`).join(' ');
  g += `<polygon class="ar" points="${X(0)},${H - pb} ${pts} ${X(items.length - 1)},${H - pb}"/>`;
  g += `<polyline class="ln" points="${pts}"/>`;
  items.forEach((it, i) => {
    g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(it[0])}</text>`;
    g += `<circle cx="${X(i)}" cy="${Y(it[1])}" r="12" fill="transparent" data-tip="${esc((o.pre || '') + it[0] + ': ' + fmt(it[1]))}"/>`;
    if (i === items.length - 1) g += `<circle class="pt" cx="${X(i)}" cy="${Y(it[1])}" r="5"/><text class="lbl" x="${X(i) - 8}" y="${Y(it[1]) - 10}" text-anchor="end">${esc(fmt(it[1]))}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Evolución')}">${g}</svg>`;
}
const hbars = (rows, fmt = num, cls = '') => {
  const max = Math.max(...rows.map(r => r[1]), 1);
  return `<div class="bars">${rows.map(r => `<div class="brow" data-tip="${esc(r[0] + ': ' + fmt(r[1]))}"><span class="ellip" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r[0])}</span><div class="track"><div class="fill ${cls}" style="width:${(r[1] / max * 100).toFixed(1)}%"></div></div><b>${fmt(r[1])}</b></div>`).join('')}</div>`;
};

let lastFocus = null;
function modal(html, cls = '') {
  lastFocus = document.activeElement;
  // un nodo nuevo por modal: así no quedan escuchas del modal anterior
  const old = $('#modal'), m = old.cloneNode(false);
  old.replaceWith(m);
  m.className = 'modal ' + cls;
  m.innerHTML = html;
  $('#scrim').classList.add('on');
  setTimeout(() => { const f = m.querySelector('[autofocus]') || m.querySelector('input,select,textarea,button:not(.icon-btn)'); if (f) f.focus(); }, 30);
}
function closeModal() {
  $('#scrim').classList.remove('on');
  $('#modal').innerHTML = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const mHead = t => `<div class="modal-h"><h2>${t}</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic('i-cerrar')}</button></div>`;
function confirmar(titulo, texto, okTxt, fn, danger) {
  modal(`${mHead(titulo)}<div class="modal-b"><p style="margin:0;color:var(--ink-2)">${texto}</p></div>
  <div class="modal-f"><button class="btn" data-act="close">Cancelar</button><button class="btn ${danger ? 'danger' : 'pri'}" id="okBtn" autofocus>${okTxt}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); fn(); };
}
function toast(msg, o = {}) {
  const t = document.createElement('div');
  t.className = 'toast ' + (o.cls || '');
  t.innerHTML = ic(o.ico || 'i-ok') + `<span>${msg}</span>` + (o.act ? `<button>${o.act}</button>` : '');
  if (o.act) t.querySelector('button').onclick = () => { t.remove(); o.fn(); };
  $('#toasts').appendChild(t);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, o.ms || 4200);
}
function csv(nombre, filas) {
  const s = filas.map(r => r.map(v => { const x = String(v == null ? '' : v); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';')).join('\r\n');
  const b = new Blob(['﻿' + s], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(`Descargado ${nombre} (${filas.length - 1} filas). Se abre en Excel.`, { ico: 'i-bajar' });
}
function imprimir(html) {

function comisionesPorAgente() {
  const res = AGENTES.map(a => ({ a, gen: 0, parte: 0, lv: 0, lc: 0, lineas: [] }));

    const k = calcPF(p);
    const rv = res.find(r => r.a.id === k.agV.id), rc = res.find(r => r.a.id === k.agC.id);
    rv.gen += k.comV; rv.parte += k.agVm; rv.lv++; rv.lineas.push({ p, lado: 'Vendedor', base: k.comV, parte: k.agVm, k });
    rc.gen += k.comC; rc.parte += k.agCm; rc.lc++; rc.lineas.push({ p, lado: 'Comprador', base: k.comC, parte: k.agCm, k });
  });
  return res.sort((a, b) => b.gen - a.gen);
}

function bindKanban() {
  let drag = null;
  $$('.kc').forEach(k => {
    k.addEventListener('dragstart', e => { drag = k.dataset.neg; k.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag); });
    k.addEventListener('dragend', () => k.classList.remove('drag'));
    k.addEventListener('click', () => negocioModal(k.dataset.neg));
    k.addEventListener('keydown', e => { if (e.key === 'Enter') negocioModal(k.dataset.neg); });
  });
  $$('.col').forEach(c => {
    c.addEventListener('dragover', e => { e.preventDefault(); c.classList.add('over'); });
    c.addEventListener('dragleave', () => c.classList.remove('over'));
    c.addEventListener('drop', e => { e.preventDefault(); c.classList.remove('over'); const id = drag || e.dataTransfer.getData('text/plain'); if (id) moverNegocio(id, c.dataset.col); drag = null; });
  });
}
function moverNegocio(id, etapa) {
  const n = NEGOCIOS.find(x => x.id === id);
  if (!n || n.etapa === etapa) return;
  const et = ETAPAS.find(e => e.id === etapa);
  n.etapa = etapa; n.dias = 0;
  const p = prod(n.prod);
  if (etapa === 'contactado' || etapa === 'revision') p.temp = 'caliente';
  if (etapa === 'cargado' && !n.lote) {
    const l = L({ prod: n.prod, cat: n.cat, cab: n.cab, kg: 0, raza: '', edad: '', rem: 'PR328', estado: 'Borrador', ag: n.ag, ch: {}, precioBase: cat(n.cat).ref });
    l.kg = ''; l.hist.push({ t: 'Lote creado desde el embudo comercial', h: ahora(), i: 'i-kanban' });
    LOTES.push(l); n.lote = l.id; n.nota = `Lote ${l.id} en borrador para Plaza Rural 328.`;
    render();
    toast(`${p.nom} pasó a Lote cargado. Se creó el lote ${l.id} en borrador.`, { act: 'Completar', fn: () => go('lote', l.id), ms: 6000 });
    return;
  }
  render();
  toast(`${p.nom} pasó a ${et.nom}.`);
}

    <div class="sep"></div>
    <b style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-deep)">Plato del negocio</b>
    <div class="form form3" style="margin-top:10px">
      <div class="field"><label for="fRem">Dónde se vende</label><select class="sel" id="fRem">${REMATES.filter(r => r.fecha > HOY).map(r => `<option value="${r.id}" ${remSel === r.id ? 'selected' : ''}>${r.nom} · ${fdate(r.fecha)}</option>`).join('')}<option value="" ${!remSel ? 'selected' : ''}>Venta directa</option></select></div>

  </div>
  <div class="modal-f"><span class="muted" id="fProg" style="font-size:12.5px;font-weight:700;align-self:center"></span><span class="grow"></span><button class="btn" data-act="close">Cancelar</button><button class="btn" id="fDraft">Guardar borrador</button><button class="btn pri" id="fOk">${ic('i-ok')} Guardar y marcar revisado</button></div>`;
  modal(html, 'lg');
  const esp = () => {
    const c = cat($('#fCat').value);
    const ch = d.cat === c.id ? d.ch || {} : {};
    $('#fEsp').innerHTML = FORMS[c.form].filter(f => !(f[0] === 'toro' && c.id !== 'vp')).map(f => `<div class="field ${f[2] === 'text' && f[0] === 'sanidad' ? '' : ''}"><label for="e_${f[0]}">${f[1]} <span class="req">*</span></label>${Array.isArray(f[2]) ? `<select class="sel" id="e_${f[0]}" data-esp="${f[0]}"><option value="">Elegí</option>${f[2].map(o => `<option ${ch[f[0]] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>` : `<input class="inp" id="e_${f[0]}" data-esp="${f[0]}" value="${esc(ch[f[0]] || '')}" placeholder="${esc(f[3] || '')}">`}</div>`).join('');
    $('#fU').textContent = c.u === 'kg' ? '(US$/kg)' : '(US$/cab)';
    $('#fRef').textContent = 'Referencia: ' + precioU(c, c.ref);
    if (!$('#fPre').value || nuevo) $('#fPre').placeholder = c.ref;
    prog();
  };
  const prog = () => {
    const req = ['#fProd', '#fCab', '#fKg', '#fRaza', '#fEdad', '#fPre'].map(s => $(s)).concat($$('[data-esp]'));
    const ok = req.filter(x => String(x.value).trim() !== '').length;
    $('#fProg').textContent = `${ok} de ${req.length} campos completos`;
    return { req, ok };
  };
  $('#fCat').onchange = esp;
  $('#fProd').onchange = () => { const p = prod($('#fProd').value); if (p && !$('#fAg').value) $('#fAg').value = p.ag; prog(); };
  $('#modal').addEventListener('input', prog);
  $('#modal').addEventListener('change', prog);
  esp();
  const guardar = (revisar) => {
    const pr = prog();
    $$('.inp,.sel', $('#modal')).forEach(x => x.style.borderColor = '');
    if (!$('#fProd').value || !$('#fCab').value) {
      ['#fProd', '#fCab'].forEach(s => { if (!$(s).value) $(s).style.borderColor = 'var(--bad)'; });
      $('#fErr').innerHTML = `<div class="note" style="background:var(--bad-soft);color:var(--bad-ink)">${ic('i-alerta')}<span>Como mínimo necesitás productor y cabezas para guardar.</span></div>`;
      return;
    }
    if (revisar && pr.ok < pr.req.length) {
      pr.req.forEach(x => { if (!String(x.value).trim()) x.style.borderColor = 'var(--bad)'; });
      $('#fErr').innerHTML = `<div class="note" style="background:var(--bad-soft);color:var(--bad-ink)">${ic('i-alerta')}<span>Para marcarlo revisado faltan ${pr.req.length - pr.ok} campos, marcados en rojo. Podés guardarlo como borrador y seguir después.</span></div>`;
      return;
    }
    const chN = {}; $$('[data-esp]').forEach(x => chN[x.dataset.esp] = x.value.trim());
    const p = prod($('#fProd').value);
    const o = { prod: p.id, cat: $('#fCat').value, cab: +$('#fCab').value, kg: +$('#fKg').value || '', raza: $('#fRaza').value, edad: $('#fEdad').value.trim(), ag: $('#fAg').value || p.ag, ch: chN, rem: $('#fRem').value || null, canal: $('#fRem').value ? rem($('#fRem').value).canal : 'Venta directa', precioBase: +$('#fPre').value || '', plazo: +$('#fPlazo').value, flete: $('#fFlete').value, destino: $('#fDest').value, balanza: $('#fBal').value.trim() };
    let t;
    if (nuevo) {
      t = L(Object.assign(o, { estado: revisar ? 'Revisado' : 'Borrador' }));
      t.hist.push({ t: 'Lote cargado con el formulario estandarizado', h: ahora(), i: 'i-doc' });
      LOTES.push(t);
      if (pre.leadId) { const ld = LEADS.find(x => x.id === pre.leadId); if (ld) { ld.estado = 'Convertido'; ld.msgs.push({ de: 'sys', t: `Lote ${t.id} creado desde esta conversación`, h: ahora() }); } }
    } else {
      t = l; Object.assign(t, o);
      if (revisar && t.estado === 'Borrador') t.estado = 'Revisado';
      t.hist.push({ t: revisar ? 'Formulario completo, lote revisado' : 'Formulario actualizado', h: ahora(), i: 'i-lapiz' });
    }
    closeModal();
    go('lote', t.id);
    toast(revisar ? `Lote ${t.id} revisado. Ya lo podés pasar a catálogo y mandar a compradores.` : `Lote ${t.id} guardado como borrador.`, revisar ? { act: 'Pasar a catálogo', fn: () => aCatalogo(t.id), ms: 6500 } : {});
  };
  $('#fDraft').onclick = () => guardar(false);
  $('#fOk').onclick = () => guardar(true);
}
function aCatalogo(id) {
  const l = lote(id);
  const cc = camposLote(l);
  if (cc.ok < cc.total) { toast(`Al lote ${l.id} le faltan ${cc.total - cc.ok} datos del formulario.`, { ico: 'i-alerta', act: 'Completar', fn: () => loteForm(l) }); return; }
  if (l.rem && rem(l.rem).fecha < HOY) { l.hist.push({ t: `Reingresa: pasa de ${rem(l.rem).nom} a Remate 328`, h: ahora(), i: 'i-martillo' }); l.rem = 'PR328'; }
  l.estado = l.rem ? 'En catálogo' : 'Ofrecido';
  if (CFG.autoWeb) l.web = true;
  l.hist.push({ t: l.rem ? `Entró al catálogo de ${rem(l.rem).nom}` : 'Ofrecido en venta directa', h: ahora(), i: 'i-lote' });
  if (CFG.autoWeb) l.hist.push({ t: 'Publicado automáticamente en romualdo.com.uy', h: ahora(), i: 'i-globo' });
  render();
  toast(`Lote ${l.id} en catálogo${CFG.autoWeb ? ' y publicado en la web' : ''}.`, { act: 'Enviar a compradores', fn: () => enviarLote(l.id), ms: 6500 });
}

function fichaPDF(id) {

/* ---------- Envío automatizado a compradores ---------- */
function enviarLote(id, preSel) {
  const l = lote(id), c = cat(l.cat), p = prod(l.prod), r = l.rem ? rem(l.rem) : null;
  if (l.estado === 'Borrador') {
    modal(`${mHead('Primero completá el formulario')}<div class="modal-b"><p style="margin:0">El lote ${l.id} está en borrador. Para mandarlo a compradores tiene que estar revisado: así todos reciben la misma información, completa.</p></div><div class="modal-f"><button class="btn" data-act="close">Cerrar</button><button class="btn pri" id="goForm">${ic('i-lapiz')} Completar formulario</button></div>`);
    $('#goForm').onclick = () => loteForm(l);
    return;
  }
  const cps = compradoresPara(l);
  const txt = `Hola, te comparto un lote de Romualdo & Cía.\n\n${l.cab} ${c.nom.toLowerCase()} ${l.raza}, ${l.kg} kg promedio, ${l.edad}.\n${p.paraje}, ${p.depto}.\n${l.precioBase ? 'Base ' + precioU(c, l.precioBase) + '. ' : ''}${r ? r.nom + ', ' + fdate(r.fecha) + '.' : 'Venta directa.'}\n\nFicha completa y video: romualdo.com.uy/lotes/${l.id}`;
  modal(`${mHead('Enviar lote ' + l.id + ' a compradores')}<div class="modal-b">
    <div class="grid g2" style="gap:16px">
      <div><div class="flex" style="margin-bottom:8px"><b>Destinatarios</b><span class="grow" style="flex:1"></span><button class="btn sm ghost" id="selAll">Todos</button><button class="btn sm ghost" id="selNone">Ninguno</button></div>
        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px">${cps.map(x => `<label class="check" style="padding:7px 0;border-bottom:1px solid var(--line-2)"><input type="checkbox" value="${x.c.id}" ${!preSel || preSel.includes(x.c.id) ? 'checked' : ''}><span style="flex:1"><b>${esc(x.c.nom)}</b><br><span class="muted" style="font-size:12px;font-weight:600">${esc(x.why.join(' · '))}</span></span></label>`).join('')}</div>
        <div class="flex" style="margin-top:10px;gap:16px"><label class="check"><input type="checkbox" id="chWa" checked> WhatsApp</label><label class="check"><input type="checkbox" id="chMail" checked> Mail con PDF</label></div>
      </div>
      <div><b style="display:block;margin-bottom:8px">Mensaje</b><textarea class="inp" id="envTxt" style="width:100%;min-height:230px">${esc(txt)}</textarea><div class="hint muted" style="font-size:12px;margin-top:4px">Se adjunta la ficha PDF del lote. Cada comprador lo recibe a su nombre.</div></div>
    </div>
    <div id="envProg" style="display:none;margin-top:14px"><div class="flex" style="margin-bottom:6px"><b id="envLbl">Enviando...</b></div><div class="progress"><div id="envBar" style="width:0"></div></div></div>
  </div><div class="modal-f"><span class="muted" id="envCnt" style="align-self:center;font-weight:700;font-size:12.5px"></span><span class="grow"></span><button class="btn" data-act="close">Cancelar</button><button class="btn wa" id="envOk">${ic('i-enviar')} Enviar ahora</button></div>`, 'lg');
  const upd = () => { const n = $$('#modal input[type=checkbox][value]:checked').length; $('#envCnt').textContent = `${n} destinatarios`; $('#envOk').disabled = !n; };
  $('#modal').addEventListener('change', upd); upd();
  $('#selAll').onclick = () => { $$('#modal input[type=checkbox][value]').forEach(x => x.checked = true); upd(); };
  $('#selNone').onclick = () => { $$('#modal input[type=checkbox][value]').forEach(x => x.checked = false); upd(); };
  $('#envOk').onclick = () => {
    const sel = $$('#modal input[type=checkbox][value]:checked').map(x => x.value);
    const chs = [$('#chWa').checked ? 'WhatsApp' : '', $('#chMail').checked ? 'mail' : ''].filter(Boolean).join(' y ') || 'WhatsApp';
    $('#envOk').disabled = true; $('#envProg').style.display = 'block';
    let i = 0;
    const step = () => {
      i++;
      $('#envBar').style.width = (i / sel.length * 100) + '%';
      $('#envLbl').textContent = `Enviando a ${comp(sel[i - 1]).nom} (${i} de ${sel.length})`;
      if (i < sel.length) setTimeout(step, 140);
      else setTimeout(() => {
        l.envios += sel.length;
        sel.forEach(cid => { if (!l.interes.includes(cid) && Math.random() < .3) l.interes.push(cid); });
        l.hist.push({ t: `Ficha enviada a ${sel.length} compradores`, h: ahora(), i: 'i-enviar' });
        ACTIVIDAD.unshift({ ico: 'i-enviar', t: `Lote ${l.id} enviado a ${sel.length} compradores`, h: ahora(), c: 'wa' });
        closeModal(); render();
        toast(`Lote ${l.id} enviado a ${sel.length} compradores por ${chs}.`, { cls: 'wa', ico: 'i-wa' });
        setTimeout(() => { const cc = comp(sel[0]); if (cc) toast(`${cc.nom} respondió: "Me interesa, ¿se puede ver el video?"`, { cls: 'wa', ico: 'i-wa', act: 'Ver', fn: () => go('bandeja') }); }, 3500);
      }, 300);
    };
    step();
  };
}

/* ---------- Martillo: venta y proforma automática ---------- */
function martillo(id) {
  const l = lote(id), c = cat(l.cat);
  const cps = COMPRADORES.map(x => Object.assign({ c: x }, match(l, x))).sort((a, b) => b.s - a.s);
  const sug = +(l.precioBase || c.ref) + (c.u === 'kg' ? Math.round((Math.random() * 10 - 2)) / 100 : Math.round(Math.random() * 40 - 10));
  modal(`${mHead((l.rem ? 'Bajar martillo · ' : 'Cerrar venta · ') + 'lote ' + l.id)}<div class="modal-b">
    <div class="note g" style="margin-bottom:14px">${ic('i-rayo')}<span>Al confirmar, el lote queda vendido y el sistema arma solo la proforma con comisiones de vendedor y comprador, la parte de cada agente, y la manda por WhatsApp y mail.</span></div>
    <div class="form">
      <div class="field full"><label for="mComp">Comprador</label><select class="sel" id="mComp">${cps.map(x => `<option value="${x.c.id}">${esc(x.c.nom)}${x.s >= 2 ? ' · le sirve' : ''}</option>`).join('')}</select></div>
      <div class="field"><label for="mPre">Precio (${c.u === 'kg' ? 'US$/kg' : 'US$/cab'})</label><input class="inp" id="mPre" type="number" step="${c.u === 'kg' ? '0.01' : '1'}" value="${c.u === 'kg' ? sug.toFixed(2) : Math.round(sug)}"></div>
      <div class="field"><label for="mKg">Kg reales en balanza (promedio)</label><input class="inp" id="mKg" type="number" value="${l.kg}"></div>
    </div>
    <div class="card" style="margin-top:14px;background:#FAFBFA" id="mRes"></div>
  </div><div class="modal-f"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="mOk">${ic('i-martillo')} Confirmar venta</button></div>`);
  const calc = () => {
    const pr = +$('#mPre').value || 0, k = +$('#mKg').value || 0;
    const bruto = c.u === 'kg' ? pr * k * l.cab : pr * l.cab;
    const cv = bruto * CFG.comVend / 100, cc = bruto * CFG.comComp / 100;
    $('#mRes').innerHTML = `<div class="facts f3"><div><span>Bruto</span><b>${usd(bruto)}</b></div><div><span>Com. vendedor ${CFG.comVend}%</span><b>${usd(cv)}</b></div><div><span>Com. comprador ${CFG.comComp}%</span><b>${usd(cc)}</b></div><div><span>Kg totales</span><b>${c.u === 'kg' ? kg(k * l.cab) : 'por cabeza'}</b></div><div><span>vs. referencia</span><b style="color:${pr >= c.ref ? 'var(--brand)' : 'var(--bad-ink)'}">${pr >= c.ref ? '+' : ''}${c.u === 'kg' ? nf2.format(pr - c.ref) : num(pr - c.ref)}</b></div><div><span>Comisión total</span><b>${usd(cv + cc)}</b></div></div>`;
  };
  $('#mPre').oninput = calc; $('#mKg').oninput = calc; calc();
  $('#mOk').onclick = () => { venderLote(l, $('#mComp').value, +$('#mPre').value, +$('#mKg').value); closeModal(); render(); };
}
function venderLote(l, cid, precio, kgR, quiet) {
  l.venta = { comp: cid, precio, fecha: ahora(), kgReal: kgR || l.kg };
  l.estado = 'Vendido';
  const n = NEGOCIOS.find(x => x.lote === l.id); if (n) { n.etapa = 'vendido'; n.dias = 0; }
  let pf = null;
  if (CFG.autoProforma) pf = generaProforma(l, ahora());
  ACTIVIDAD.unshift({ ico: 'i-martillo', t: `Vendido ${l.id}: ${l.cab} ${cat(l.cat).nom.toLowerCase()} a ${comp(cid).nom}`, h: ahora(), c: '' });
  if (!quiet) toast(pf ? `Vendido a ${comp(cid).nom}. Proforma ${pf.id} generada${CFG.autoEnvio ? ' y enviada' : ''}.` : `Vendido a ${comp(cid).nom}.`, pf ? { act: 'Ver proforma', fn: () => verPF(pf.id), ms: 6500 } : {});
  return pf;
}

/* ---------- Ofertas y filtros ---------- */
VIEWS.ofertas = () => {
  const F = Object.assign({ oZ: [], oC: [], oComp: '', oGrp: 'zona', oKgMin: '', oKgMax: '' }, S.f);
  const disp = LOTES.filter(l => ['En catálogo', 'Ofrecido', 'Revisado'].includes(l.estado));
  let ls = disp.filter(l => (!F.oZ.length || F.oZ.includes(prod(l.prod).depto)) && (!F.oC.length || F.oC.includes(cat(l.cat).grupo)) && (!F.oKgMin || l.kg >= +F.oKgMin) && (!F.oKgMax || l.kg <= +F.oKgMax));
  const cSel = F.oComp ? comp(F.oComp) : null;
  if (cSel) ls = ls.filter(l => match(l, cSel).s >= 2);
  const zonas = [...new Set(disp.map(l => prod(l.prod).depto))].sort();
  const grupos = [...new Set(CATS.map(c => c.grupo))];
  const keyF = { zona: l => prod(l.prod).depto, cat: l => cat(l.cat).nom, remate: l => l.rem ? rem(l.rem).nom : 'Venta directa', agente: l => ag(l.ag).nom };
  const groups = {};
  ls.forEach(l => { const k = keyF[F.oGrp](l); (groups[k] = groups[k] || []).push(l); });
  // matriz categoría por zona
  const gz = grupos.filter(g => disp.some(l => cat(l.cat).grupo === g));
  const mx = {}; let mmax = 1;
  disp.forEach(l => { const k = cat(l.cat).grupo + '|' + prod(l.prod).depto; mx[k] = (mx[k] || 0) + l.cab; mmax = Math.max(mmax, mx[k]); });
  S.ofVis = ls;
  return {
    t: 'Ofertas y filtros', s: 'Toda la hacienda disponible, ordenada por zona, compradores y categorías',
    a: cSel ? `<button class="btn wa" data-act="mandarSel">${ic('i-enviar')}<span>Mandar ${ls.length} lotes a ${esc(cSel.nom.split(' ')[0])}</span></button>` : `<button class="btn" data-act="csvOfertas">${ic('i-bajar')}<span>Exportar</span></button>`,
    h: `<div class="card mb">
      <div class="form form3" style="margin-bottom:12px">
        <div class="field"><label for="oComp">Mostrar lo que le sirve a</label><select class="sel" id="oComp" data-act-change="fsel" data-k="oComp"><option value="">Cualquier comprador</option>${COMPRADORES.map(c => `<option value="${c.id}" ${F.oComp === c.id ? 'selected' : ''}>${esc(c.nom)} · ${c.tipo}</option>`).join('')}</select></div>
        <div class="field"><label>Kg promedio</label><div class="flex"><input class="inp" style="width:100%" type="number" placeholder="desde" value="${esc(F.oKgMin)}" data-act-change="fsel" data-k="oKgMin" aria-label="Kg desde"><input class="inp" style="width:100%" type="number" placeholder="hasta" value="${esc(F.oKgMax)}" data-act-change="fsel" data-k="oKgMax" aria-label="Kg hasta"></div></div>
        <div class="field"><label for="oGrp">Agrupar por</label><select class="sel" id="oGrp" data-act-change="fsel" data-k="oGrp">${[['zona', 'Zona'], ['cat', 'Categoría'], ['remate', 'Remate'], ['agente', 'Agente']].map(([k, t]) => `<option value="${k}" ${F.oGrp === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="flex wrap" style="margin-bottom:8px"><b style="font-size:12px;color:var(--ink-2);width:80px">Zona</b>${zonas.map(z => `<button class="chip ${F.oZ.includes(z) ? 'on' : ''}" data-act="ftog" data-k="oZ" data-v="${z}">${z}<span class="n">${disp.filter(l => prod(l.prod).depto === z).length}</span></button>`).join('')}</div>
      <div class="flex wrap"><b style="font-size:12px;color:var(--ink-2);width:80px">Categoría</b>${grupos.map(g => `<button class="chip ${F.oC.includes(g) ? 'on' : ''}" data-act="ftog" data-k="oC" data-v="${g}">${g}<span class="n">${disp.filter(l => cat(l.cat).grupo === g).length}</span></button>`).join('')}
      ${F.oZ.length || F.oC.length || F.oComp || F.oKgMin || F.oKgMax ? `<button class="btn sm ghost" data-act="fclearOf">${ic('i-cerrar')} Limpiar</button>` : ''}</div>
    </div>
    <div class="grid g21 mb" style="align-items:start">
        <div class="card"><h3>${ic('i-pin')} Cabezas por zona y categoría</h3>
          <div class="tbl-wrap"><table><thead><tr><th>Zona</th>${gz.map(g => `<th class="num">${g}</th>`).join('')}</tr></thead><tbody>${zonas.map(z => `<tr>${`<td class="strong">${z}</td>`}${gz.map(g => { const v = mx[g + '|' + z] || 0; return `<td class="num" style="background:${v ? `rgba(31,107,69,${(.08 + .5 * v / mmax).toFixed(2)})` : 'transparent'};cursor:${v ? 'pointer' : 'default'};${v / mmax > .6 ? 'color:#fff;font-weight:800' : ''}" ${v ? `data-act="fcell" data-z="${z}" data-g="${g}" data-tip="${esc(z + ' · ' + g + ': ' + num(v) + ' cabezas')}"` : ''}>${v ? num(v) : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
        </div>
        ${cSel ? `<div class="card"><h3>${ic('i-comprador')} ${esc(cSel.nom)}</h3><div class="facts"><div><span>Tipo</span><b>${esc(cSel.tipo)}</b></div><div><span>Agente</span><b>${esc(ag(cSel.ag).nom)}</b></div><div style="grid-column:1/-1"><span>Busca</span><b>${cSel.cats.map(k => cat(k).nom).join(', ')}</b></div><div style="grid-column:1/-1"><span>Opera en</span><b>${cSel.zonas.length > 10 ? 'Todo el país' : cSel.zonas.join(', ')}</b></div></div></div>` : `<div class="note i">${ic('i-filtro')}<span>Elegí un comprador arriba y la lista se reduce a lo que le sirve. Después le mandás todo junto con un botón.</span></div>`}
      </div>
    <div class="grid g2" style="align-items:start">${Object.keys(groups).sort().map(k => `<div class="card"><h3>${ic(F.oGrp === 'zona' ? 'i-pin' : F.oGrp === 'agente' ? 'i-user' : F.oGrp === 'remate' ? 'i-martillo' : 'i-vaca')} ${esc(k)}<span class="grow"></span><small>${groups[k].length} lotes · ${num(groups[k].reduce((a, l) => a + l.cab, 0))} cab.</small></h3>
        <div class="tbl-wrap"><table><tbody>${groups[k].map(l => { const p = prod(l.prod); const cps = compradoresPara(l); return `<tr class="click" data-go="lote" data-arg="${l.id}"><td class="strong">${l.id}</td><td>${l.cab} ${esc(cat(l.cat).nom.toLowerCase())}<div class="muted" style="font-size:12px">${esc(l.raza)} · ${esc(p.depto)}</div></td><td class="num">${kgTxt(l)}</td><td class="num">${precioLote(l)}</td><td><span class="tag info">${cps.length} compradores</span></td><td class="num"><button class="btn sm wa" data-act="enviarLote" data-id="${l.id}" ${cSel ? `data-comp="${cSel.id}"` : ''} aria-label="Enviar lote ${l.id}">${ic('i-enviar')}</button></td></tr>`; }).join('')}</tbody></table></div></div>`).join('') || `<div class="card">${empty('i-filtro', 'Nada coincide con estos filtros. Probá sacando alguno.', '<button class="btn" data-act="fclearOf">Limpiar filtros</button>')}</div>`}</div>
    </div>`
  };
};

/* ---------- Remates ---------- */
VIEWS.remates = () => {
  const f = S.f.rCan || 'todos';
  const rs = REMATES.filter(r => f === 'todos' || r.canal === f).sort((a, b) => a.fecha - b.fecha);
  return {
    t: 'Remates', s: 'Plaza Rural y remates particulares del escritorio',
    a: `<button class="btn pri" data-act="nuevoRemate">${ic('i-mas')}<span>Nuevo remate particular</span></button>`,
    h: `<div class="bar">${[['todos', 'Todos'], ['Plaza Rural', 'Plaza Rural'], ['Remate particular', 'Remates particulares']].map(([k, t]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="fset" data-k="rCan" data-v="${k}">${t}</button>`).join('')}</div>
    <div class="grid g3">${rs.map(r => { const ls = LOTES.filter(l => l.rem === r.id); const cab = ls.reduce((a, l) => a + l.cab, 0); const vend = ls.filter(l => l.venta); const listos = ls.filter(l => ['En catálogo', 'Vendido', 'Sin vender'].includes(l.estado)).length; const fact = vend.reduce((a, l) => { const p = pfOf(l.id); return a + (p ? calcPF(p).bruto : 0); }, 0); const fut = r.fecha > HOY; return `<div class="card kpi" data-go="remate" data-arg="${r.id}">
      <div class="flex" style="margin-bottom:10px"><div class="bubble ${r.canal === 'Plaza Rural' ? 'g' : ''}">${ic(r.canal === 'Plaza Rural' ? 'i-tv' : 'i-martillo')}</div><span class="tag ${fut ? 'warn' : 'ok'}" style="margin-left:auto">${esc(r.estado)}</span></div>
      <div style="font-size:16px;font-weight:800">${esc(r.nom)}</div>
      <div class="muted" style="font-size:12.5px;margin:2px 0 12px">${fdate(r.fecha)}${r.dias > 1 ? ' y ' + fdate(new Date(r.fecha.getTime() + DIA)) : ''} · ${esc(r.lugar)}</div>
      <div class="facts f3"><div><span>Lotes</span><b>${ls.length}</b></div><div><span>Cabezas</span><b>${num(cab)}</b></div><div><span>${fut ? 'Cierra' : 'Vendido'}</span><b>${fut ? (r.cierre ? rel(r.cierre) : 'sin fecha') : usd(fact)}</b></div></div>
      ${fut ? `<div style="margin-top:12px"><div class="flex" style="font-size:12px;margin-bottom:4px"><span class="muted">Lotes listos</span><b class="right">${listos} de ${ls.length}</b></div><div class="progress"><div style="width:${ls.length ? listos / ls.length * 100 : 0}%"></div></div></div>` : `<div style="margin-top:12px;font-size:12.5px" class="muted">Colocación ${ls.length ? Math.round(vend.length / ls.length * 100) : 0}% · ${vend.length} de ${ls.length} lotes vendidos</div>`}
    </div>`; }).join('')}</div>`
  };
};
VIEWS.remate = (id) => {
  const r = rem(id);
  if (!r) return VIEWS.remates();
  const ls = LOTES.filter(l => l.rem === r.id);
  const fut = r.fecha > HOY;
  const vend = ls.filter(l => l.venta);
  const fact = vend.reduce((a, l) => { const p = pfOf(l.id); return a + (p ? calcPF(p).bruto : 0); }, 0);
  const com = vend.reduce((a, l) => { const p = pfOf(l.id); if (!p) return a; const k = calcPF(p); return a + k.comV + k.comC; }, 0);
  const enCat = ls.filter(l => l.estado === 'En catálogo');
  return {
    t: r.nom, s: `${fdate(r.fecha)} · ${r.lugar}`,
    a: `<button class="btn" data-act="csvRemate" data-id="${r.id}">${ic('i-bajar')}<span>Catálogo CSV</span></button><button class="btn" data-act="printCat" data-id="${r.id}">${ic('i-print')}<span>Imprimir catálogo</span></button>${fut ? `<button class="btn wa" data-act="enviarCat" data-id="${r.id}">${ic('i-enviar')}<span>Enviar catálogo</span></button>` : ''}${fut && enCat.length ? `<button class="btn pri" data-act="simRemate" data-id="${r.id}">${ic('i-play')}<span>Simular remate</span></button>` : ''}`,
    h: `<button class="back" data-act="back">${ic('i-atras')} Volver</button>
    <div class="grid g4 mb">
      <div class="card kpi"><div class="lbl">Lotes</div><div class="val">${ls.length}</div><div class="foot">${enCat.length} en catálogo</div></div>
      <div class="card kpi"><div class="lbl">Cabezas</div><div class="val">${num(ls.reduce((a, l) => a + l.cab, 0))}</div><div class="foot">${[...new Set(ls.map(l => cat(l.cat).grupo))].join(', ')}</div></div>
      <div class="card kpi"><div class="lbl">${fut ? 'Valor estimado' : 'Negociado'}</div><div class="val">${usd(fut ? ls.reduce((a, l) => { const c = cat(l.cat); return a + (c.u === 'kg' ? l.cab * (l.kg || 0) : l.cab) * (l.precioBase || c.ref); }, 0) : fact)}</div><div class="foot">${fut ? 'con precios base' : vend.length + ' lotes vendidos'}</div></div>
      <div class="card kpi"><div class="lbl">${fut ? 'Cierre de inscripción' : 'Comisiones'}</div><div class="val">${fut ? (r.cierre ? fdate(r.cierre) : 'A definir') : usd(com)}</div><div class="foot">${fut ? (r.cierre ? rel(r.cierre) : '') : 'vendedor + comprador'}</div></div>
    </div>
    <div class="card"><h3>${ic('i-lote')} Catálogo<span class="grow"></span>${fut ? '<small>Apretá el martillo en cada lote a medida que se vende</small>' : ''}</h3>
      <div class="tbl-wrap"><table><thead><tr><th class="num">Nº</th><th>Lote</th><th>Productor</th><th>Categoría</th><th class="num">Cab.</th><th class="num">Kg</th><th class="num">Base</th><th>Resultado</th><th></th></tr></thead><tbody>
      ${ls.map((l, i) => { const p = prod(l.prod), c = cat(l.cat); return `<tr class="click" data-go="lote" data-arg="${l.id}"><td class="num muted">${i + 1}</td><td class="strong">${l.id}</td><td>${esc(p.nom)}<div class="muted" style="font-size:12px">${esc(p.depto)}</div></td><td>${esc(c.nom)}<div class="muted" style="font-size:12px">${esc(l.raza)}</div></td><td class="num">${num(l.cab)}</td><td class="num">${kgTxt(l)}</td><td class="num">${l.precioBase ? precioU(c, l.precioBase) : '<span class="muted">sin dato</span>'}</td>
        <td>${l.venta ? `<b class="mono">${precioU(c, l.venta.precio)}</b><div class="muted" style="font-size:12px">${esc(comp(l.venta.comp).nom)}</div>` : estTag(l.estado)}</td>
        <td class="num">${l.estado === 'En catálogo' ? `<button class="btn sm pri" data-act="martillo" data-id="${l.id}">${ic('i-martillo')} Martillo</button>` : pfOf(l.id) ? `<button class="btn sm" data-act="verPF" data-id="${pfOf(l.id).id}">${ic('i-doc')} ${pfOf(l.id).id}</button>` : ['Borrador', 'Revisado'].includes(l.estado) ? `<button class="btn sm" data-act="aCatalogo" data-id="${l.id}">A catálogo</button>` : ''}</td></tr>`; }).join('')}
      </tbody></table>${ls.length ? '' : empty('i-lote', 'Este remate todavía no tiene lotes.', `<button class="btn pri" data-act="nuevoLote" data-rem="${r.id}">${ic('i-mas')} Cargar el primero</button>`)}</div></div>`
  };
};
function simRemate(id) {
  const r = rem(id);
  const ls = LOTES.filter(l => l.rem === id && l.estado === 'En catálogo');
  confirmar('Simular el remate', `Se van a rematar los ${ls.length} lotes en catálogo de ${esc(r.nom)}, uno por segundo, con compradores y precios verosímiles. Cada venta genera su proforma sola. Es para mostrar el flujo: al recargar la página vuelve todo como estaba.`, 'Empezar', () => {
    let i = 0;
    const t = setInterval(() => {
      const l = ls[i++];
      if (!l) { clearInterval(t); toast(`Remate terminado: ${ls.length} lotes vendidos y ${ls.length} proformas enviadas.`, { act: 'Ver proformas', fn: () => go('proformas'), ms: 7000 }); return; }
      const c = cat(l.cat), cps = compradoresPara(l);
      const cid = (cps[Math.floor(Math.random() * Math.min(3, cps.length))] || { c: COMPRADORES[5] }).c.id;
      const base = l.precioBase || c.ref;
      const pr = c.u === 'kg' ? Math.round((base + (Math.random() * .16 - .03)) * 100) / 100 : Math.round(base + Math.random() * 60 - 10);
      venderLote(l, cid, pr, l.kg, true);
      toast(`${l.id}: ${l.cab} ${c.nom.toLowerCase()} a ${comp(cid).nom}, ${precioU(c, pr)}`, { ico: 'i-martillo', ms: 2600 });
      if (S.view === 'remate') render();
    }, 1000);
  });
}
function docCatalogo(r) {
  const ls = LOTES.filter(l => l.rem === r.id);
  return `<div class="doc"><div class="dh"><div><b>Romualdo &amp; Cía.</b><div class="muted">Catálogo de lotes</div></div><div style="text-align:right"><b>${esc(r.nom)}</b><div class="muted">${fdateL(r.fecha)} · ${esc(r.lugar)}</div></div></div>
  <table><thead><tr><th>Nº</th><th>Lote</th><th>Categoría</th><th class="num">Cab.</th><th class="num">Kg prom.</th><th>Raza</th><th>Origen</th><th class="num">Base</th></tr></thead><tbody>${ls.map((l, i) => `<tr><td>${i + 1}</td><td>${l.id}</td><td>${esc(cat(l.cat).nom)}</td><td class="num">${l.cab}</td><td class="num">${l.kg || ''}</td><td>${esc(l.raza)}</td><td>${esc(prod(l.prod).depto)}</td><td class="num">${l.precioBase ? precioU(cat(l.cat), l.precioBase) : ''}</td></tr>`).join('')}</tbody></table>
  <div class="foot">Comisión comprador ${CFG.comComp}% + IVA. Plazo ${CFG.plazo} días salvo indicación en el lote.</div></div>`;
}

/* ---------- Proformas ---------- */
VIEWS.proformas = () => {
  const ks = PROFORMAS.map(p => ({ p, k: calcPF(p) }));
  const tot = ks.reduce((a, x) => ({ b: a.b + x.k.bruto, c: a.c + x.k.comV + x.k.comC, i: a.i + x.k.ivaV + x.k.ivaC, cab: a.cab + x.k.l.cab }), { b: 0, c: 0, i: 0, cab: 0 });
  return {
    t: 'Proformas', s: 'Se generan solas al bajar el martillo, con las dos comisiones y la parte de cada agente',
    a: `<button class="btn" data-act="csvPF">${ic('i-bajar')}<span>Exportar</span></button>`,
    h: `<div class="grid g4 mb">
      <div class="card kpi"><div class="ico">${ic('i-doc')}</div><div class="lbl">Proformas</div><div class="val">${PROFORMAS.length}</div><div class="foot">${num(tot.cab)} cabezas</div></div>
      <div class="card kpi"><div class="ico g">${ic('i-plata')}</div><div class="lbl">Negociado</div><div class="val">${usd(tot.b)}</div><div class="foot">bruto de hacienda</div></div>
      <div class="card kpi" data-go="comisiones"><div class="ico">${ic('i-pct')}</div><div class="lbl">Comisiones</div><div class="val">${usd(tot.c)}</div><div class="foot">${CFG.comVend}% vendedor + ${CFG.comComp}% comprador</div></div>
      <div class="card kpi"><div class="ico">${ic('i-escudo')}</div><div class="lbl">IVA sobre comisiones</div><div class="val">${usd(tot.i)}</div><div class="foot">${CFG.iva}%</div></div>
    </div>
    <div class="card"><div class="tbl-wrap" style="border-top:0;margin-top:-17px"><table><thead><tr><th>Proforma</th><th>Fecha</th><th>Lote</th><th>Vendedor</th><th>Comprador</th><th class="num">Kg totales</th><th class="num">Precio</th><th class="num">Bruto</th><th class="num">Com. vend.</th><th class="num">Com. comp.</th><th>Envío</th></tr></thead><tbody>
    ${ks.map(({ p, k }) => `<tr class="click" data-act="verPF" data-id="${p.id}"><td class="strong">${p.id}</td><td>${fdate(p.fecha)}</td><td>${k.l.id}<div class="muted" style="font-size:12px">${k.l.cab} ${esc(k.c.nom.toLowerCase())}</div></td><td>${esc(prod(k.l.prod).nom)}</td><td>${esc(k.cp.nom)}</td><td class="num">${k.c.u === 'kg' ? kg(k.kgTot) : '<span class="muted">por cabeza</span>'}</td><td class="num">${precioU(k.c, k.v.precio)}</td><td class="num strong">${usd(k.bruto)}</td><td class="num">${usd(k.comV)}</td><td class="num">${usd(k.comC)}</td><td><span class="tag ${p.estado === 'Enviada' ? 'ok' : ''}">${p.estado === 'Enviada' ? ic('i-wa') + ' Enviada' : 'Emitida'}</span></td></tr>`).join('')}
    </tbody></table>${ks.length ? '' : empty('i-doc', 'Todavía no hay proformas. Se crean al vender un lote.')}</div></div>`
  };
};
function docPF(p, lado) {
  const k = calcPF(p), pr = prod(k.l.prod);
  const cab = `<div class="dh"><div><b>Romualdo &amp; Cía.</b><div class="muted">Negocios rurales desde 1964</div><div class="muted" style="font-size:11.5px">Av. Italia 6919, Montevideo · 2605 2222 · secretaria@romualdo.com.uy</div></div><div style="text-align:right"><b>Proforma ${p.id}</b><div class="muted">${fdateL(p.fecha)}</div><div class="muted">${k.l.rem ? esc(rem(k.l.rem).nom) : 'Venta directa'}</div></div></div>`;
  const neg = `<table><thead><tr><th>Lote</th><th>Categoría</th><th class="num">Cab.</th><th class="num">Kg prom.</th><th class="num">Kg totales</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead><tbody><tr><td>${k.l.id}</td><td>${esc(k.c.nom)} ${esc(k.l.raza)}</td><td class="num">${k.l.cab}</td><td class="num">${k.kgR}</td><td class="num">${num(k.kgTot)}</td><td class="num">${precioU(k.c, k.v.precio)}</td><td class="num">${usd2(k.bruto)}</td></tr></tbody></table>`;
  if (lado === 'vend') return `<div class="doc">${cab}<h4>Liquidación al vendedor</h4><div class="facts" style="margin-bottom:10px"><div><span>Vendedor</span><b>${esc(pr.nom)}</b></div><div><span>Establecimiento</span><b>${esc(pr.est)} · DICOSE ${pr.dicose}</b></div><div><span>Comprador</span><b>${esc(k.cp.nom)}</b></div><div><span>Plazo</span><b>${p.plazo ? p.plazo + ' días' : 'Contado'} · vence ${fdateL(k.vence)}</b></div></div>${neg}
    <table style="margin-top:10px"><tbody><tr><td>Importe bruto</td><td class="num">${usd2(k.bruto)}</td></tr><tr><td>Comisión ${nf1.format(p.pv)}%</td><td class="num">- ${usd2(k.comV)}</td></tr><tr><td>IVA ${p.iva}% sobre comisión</td><td class="num">- ${usd2(k.ivaV)}</td></tr><tr><td>IMEBA y adicionales ${nf1.format(p.reten)}%</td><td class="num">- ${usd2(k.ret)}</td></tr>${k.flete ? `<tr><td>Flete a cargo del vendedor</td><td class="num">- ${usd2(k.flete)}</td></tr>` : ''}<tr class="tot"><td>Líquido a cobrar</td><td class="num">${usd2(k.netoProd)}</td></tr></tbody></table>
    <div class="foot">Balanza: ${esc(k.l.balanza)}. Guía de propiedad y tránsito a nombre del comprador. Documento generado automáticamente al cierre de la venta.</div></div>`;

    <tr><td>Comisión vendedor</td><td class="num">${usd(k.bruto)}</td><td class="num">${nf1.format(p.pv)}%</td><td class="num">${usd2(k.comV)}</td><td>${esc(k.agV.nom)}${k.agV.casa ? ' (socio)' : ''}</td><td class="num">${usd2(k.agVm)}${k.agV.pct ? ` <span class="muted">(${k.agV.pct}%)</span>` : ''}</td></tr>
    <tr><td>Comisión comprador</td><td class="num">${usd(k.bruto)}</td><td class="num">${nf1.format(p.pc)}%</td><td class="num">${usd2(k.comC)}</td><td>${esc(k.agC.nom)}${k.agC.casa ? ' (socio)' : ''}</td><td class="num">${usd2(k.agCm)}${k.agC.pct ? ` <span class="muted">(${k.agC.pct}%)</span>` : ''}</td></tr>
    <tr class="tot"><td>Queda para el escritorio</td><td></td><td></td><td class="num">${usd2(k.comV + k.comC)}</td><td></td><td class="num">${usd2(k.casa)}</td></tr></tbody></table>
    <div class="foot">Se calcula con kg, precio y los porcentajes vigentes al momento de la venta. Cambiar la configuración no altera proformas ya emitidas.</div></div>`;

        <div class="card" style="background:var(--gold-soft);border-color:transparent"><div class="lbl muted" style="font-size:12px;font-weight:700">COMISIÓN VENDEDOR · ${nf1.format(ej.pv)}%</div><div style="font-size:22px;font-weight:800">${usd(k.comV)}</div><div class="muted" style="font-size:12.5px">${esc(prod(k.l.prod).nom)}</div><div class="sep" style="margin:8px 0"></div><div class="flex">${avatar(k.agV)}<div><b>${esc(k.agV.nom)}</b><div class="muted" style="font-size:12px">${k.agV.pct ? k.agV.pct + '% = ' + usd(k.agVm) : 'socio, queda en la casa'}</div></div></div></div>

      </div></div>` : ''}
    <div class="grid" style="grid-template-columns:minmax(0,1fr)">

      ${rows.map(r => `<tr class="click" data-act="comDet" data-id="${r.a.id}"><td><div class="flex">${avatar(r.a)}<div><b>${esc(r.a.nom)}</b><div class="muted" style="font-size:12px">${esc(r.a.rol)} · ${esc(r.a.zona.slice(0, 3).join(', '))}${r.a.zona.length > 3 ? ' y más' : ''}</div></div></div></td><td class="num">${r.lv}</td><td class="num">${r.lc}</td><td class="num strong">${usd(r.gen)}</td><td class="num">${r.a.casa ? '<span class="muted">socio</span>' : r.a.pct + '%'}</td><td class="num strong">${r.a.casa ? '<span class="muted">no aplica</span>' : usd(r.parte)}</td><td class="num">${!r.a.casa && r.parte ? (S.liq[r.a.id] ? '<span class="tag ok">Liquidado</span>' : `<button class="btn sm" data-act="liquidar" data-id="${r.a.id}">Liquidar</button>`) : ''}</td></tr>`).join('')}

      <div class="card kpi" data-act="fset" data-k="cTab" data-v="prod"><div class="ico g">${ic('i-user')}</div><div class="lbl">A pagar a productores</div><div class="val">${usd(aPagar)}</div><div class="foot">ya cobrado al comprador</div></div>
      <div class="card kpi"><div class="ico">${ic('i-ok')}</div><div class="lbl">Cobrado</div><div class="val">${usd(cobrado)}</div><div class="foot">en ${MES[HOY.getMonth()]}</div></div>
    </div>

    ${rows.map(({ p, k, ec, ep }) => tab === 'comp'

let poolI = 0, LID = 100;
function nuevoLeadAuto(d, abrir) {
  const x = { id: 'w' + (++LID), nom: d.nom, tel: d.tel, canal: d.canal, tipo: d.tipo, depto: d.depto, ag: null, estado: 'Nuevo', temp: 'frío', unread: true, msgs: [{ de: 'el', t: d.t, h: ahora() }] };
  LEADS.unshift(x);
  if (CFG.bot) x.msgs.push({ de: 'bot', t: `Hola ${d.nom.split(' ')[0]}, gracias por escribir a Romualdo & Cía. Ya le pasamos tu consulta al representante de ${d.depto}.`, h: ahora() });
  renderNav();
  if (S.view === 'bandeja' || S.view === 'inicio') render();
  const tt = d.t.replace(/^Formulario web: /, '');
  toast(`${d.canal === 'Web' ? 'Formulario web' : 'Nuevo ' + d.canal} de ${esc(d.nom)}: ${esc(tt.slice(0, 60))}${tt.length > 60 ? '...' : ''}`, { cls: 'wa', ico: canalIco(d.canal), act: 'Ver', fn: () => go('bandeja', x.id), ms: 6500 });
  if (CFG.autoAsignar) setTimeout(() => {
    const a = agDeZona(x.depto);
    x.ag = a.id; x.estado = 'Asignado';
    x.msgs.push({ de: 'sys', t: `Asignado automáticamente a ${a.nom} por zona (${x.depto})`, h: ahora() });
    renderNav();
    if (S.view === 'bandeja' || S.view === 'inicio') render();
  }, 2200);
  if (abrir) go('bandeja', x.id);
  return x;
}

function formModal(titulo, campos, okTxt, fn, cls) {
  modal(`${mHead(titulo)}<div class="modal-b"><div class="form">${campos.map(c => `<div class="field ${c.full ? 'full' : ''}"><label for="fm_${c.k}">${c.l}${c.req ? ' <span class="req">*</span>' : ''}</label>${c.opts ? `<select class="sel" id="fm_${c.k}">${c.opts.map(o => Array.isArray(o) ? `<option value="${o[0]}" ${o[0] === c.v ? 'selected' : ''}>${esc(o[1])}</option>` : `<option ${o === c.v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : c.area ? `<textarea class="inp" id="fm_${c.k}">${esc(c.v || '')}</textarea>` : `<input class="inp" id="fm_${c.k}" type="${c.type || 'text'}" value="${esc(c.v || '')}" placeholder="${esc(c.ph || '')}">`}</div>`).join('')}</div><div id="fmErr"></div></div>
  <div class="modal-f"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="fmOk">${okTxt}</button></div>`, cls || '');
  $('#fmOk').onclick = () => {
    const v = {}; let bad = false;
    campos.forEach(c => { const el = $('#fm_' + c.k); v[c.k] = el.value.trim(); el.style.borderColor = ''; if (c.req && !v[c.k]) { el.style.borderColor = 'var(--bad)'; bad = true; } });
    if (bad) { $('#fmErr').innerHTML = `<div class="note" style="margin-top:12px;background:var(--bad-soft);color:var(--bad-ink)">${ic('i-alerta')}<span>Completá los campos marcados.</span></div>`; return; }
    closeModal(); fn(v);
  };
}
