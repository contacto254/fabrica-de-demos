  csvLotes: () => csv('lotes-romualdo.csv', [['Lote', 'Productor', 'Establecimiento', 'Departamento', 'DICOSE', 'Categoría', 'Raza', 'Cabezas', 'Kg promedio', 'Canal', 'Remate', 'Precio base', 'Precio venta', 'Estado']].concat((S.lotesVis || LOTES).map(l => { const p = prod(l.prod); return [l.id, p.nom, p.est, p.depto, p.dicose, cat(l.cat).nom, l.raza, l.cab, l.kg, canalDe(l), l.rem ? rem(l.rem).nom : '', l.precioBase ? nf2.format(l.precioBase) : '', l.venta ? nf2.format(l.venta.precio) : '', l.estado]; }))),
  csvOfertas: () => csv('ofertas-romualdo.csv', [['Lote', 'Zona', 'Categoría', 'Cabezas', 'Kg', 'Base', 'Compradores que le sirven']].concat((S.ofVis || []).map(l => [l.id, prod(l.prod).depto, cat(l.cat).nom, l.cab, l.kg, l.precioBase ? nf2.format(l.precioBase) : '', compradoresPara(l).map(x => x.c.nom).join(', ')]))),
  csvRemate: d => { const r = rem(d.id); csv(`catalogo-${r.id}.csv`, [['Nº', 'Lote', 'Productor', 'Departamento', 'Categoría', 'Raza', 'Cabezas', 'Kg', 'Base', 'Resultado', 'Comprador']].concat(LOTES.filter(l => l.rem === r.id).map((l, i) => [i + 1, l.id, prod(l.prod).nom, prod(l.prod).depto, cat(l.cat).nom, l.raza, l.cab, l.kg, l.precioBase ? nf2.format(l.precioBase) : '', l.venta ? nf2.format(l.venta.precio) : l.estado, l.venta ? comp(l.venta.comp).nom : '']))); },
  csvPF: () => csv('proformas-romualdo.csv', [['Proforma', 'Fecha', 'Lote', 'Vendedor', 'Comprador', 'Cabezas', 'Kg totales', 'Precio', 'Bruto', 'Com. vendedor', 'Com. comprador', 'Agente vendedor', 'Agente comprador', 'Líquido productor', 'Total comprador']].concat(PROFORMAS.map(p => { const k = calcPF(p); return [p.id, fdateL(p.fecha), k.l.id, prod(k.l.prod).nom, k.cp.nom, k.l.cab, Math.round(k.kgTot), nf2.format(k.v.precio), nf2.format(k.bruto), nf2.format(k.comV), nf2.format(k.comC), k.agV.nom, k.agC.nom, nf2.format(k.netoProd), nf2.format(k.totComp)]; }))),
  csvCom: () => csv('comisiones-romualdo.csv', [['Agente', 'Proforma', 'Lado', 'Comisión', 'Parte agente']].concat(comisionesPorAgente().flatMap(r => r.lineas.map(x => [r.a.nom, x.p.id, x.lado, nf2.format(x.base), nf2.format(x.parte)])))),
  csvCob: () => csv('cobranza-romualdo.csv', [['Proforma', 'Comprador', 'Vence', 'Total', 'Estado cobro', 'Productor', 'Líquido', 'Estado pago']].concat(PROFORMAS.map(p => { const k = calcPF(p); return [p.id, k.cp.nom, fdateL(k.vence), nf2.format(k.totComp), estadoCobro(p).t, prod(k.l.prod).nom, nf2.format(k.netoProd), estadoPago(p).t]; }))),
  csvProd: () => csv('productores-romualdo.csv', [['Nombre', 'Establecimiento', 'Departamento', 'Paraje', 'DICOSE', 'Teléfono', 'Hectáreas', 'Agente', 'Estado']].concat(PRODUCTORES.map(p => [p.nom, p.est, p.depto, p.paraje, p.dicose, p.tel, p.has, ag(p.ag).nom, p.temp]))),
  csvComp: () => csv('compradores-romualdo.csv', [['Nombre', 'Tipo', 'Departamento', 'Teléfono', 'Busca', 'Zonas', 'Agente']].concat(COMPRADORES.map(c => [c.nom, c.tipo, c.depto, c.tel, c.cats.map(k => cat(k).nom).join(', '), c.zonas.join(', '), ag(c.ag).nom]))),
  csvPrecios: () => csv('precios-referencia.csv', [['Categoría', 'Unidad', 'Remate 326', 'Remate 327']].concat(CATS.map(c => [c.nom, c.u === 'kg' ? 'US$/kg' : 'US$/cab', nf2.format(c.ant), nf2.format(c.ref)]))),
  csvRep: () => csv('resumen-romualdo.csv', [['Mes', 'Cabezas', 'Negociado US$']].concat(MESES_H.map(m => [m[0], m[1], m[2]])).concat([[MES[HOY.getMonth()], LOTES.filter(l => l.venta && l.venta.fecha.getMonth() === HOY.getMonth()).reduce((a, l) => a + l.cab, 0), Math.round(PROFORMAS.reduce((a, p) => a + calcPF(p).bruto, 0))]]))
};
const ACTC = {
  asignar: (el) => { const x = LEADS.find(y => y.id === el.dataset.id); x.ag = el.value || null; x.estado = x.ag ? 'Asignado' : 'Nuevo'; if (x.ag) x.msgs.push({ de: 'sys', t: `Asignado a ${ag(x.ag).nom}`, h: ahora() }); render(); if (x.ag) toast(`${x.nom} ahora lo atiende ${ag(x.ag).nom}.`); },
  fNegAg: (el) => { S.f.negAg = el.value; render(); },
  fsel: (el) => { S.f[el.dataset.k] = el.value; render(); }
};
const ENVIAR_RESP = ['Perfecto, gracias.', 'Dale, quedo atento.', 'Buenísimo, mañana te confirmo.', 'Bárbaro, pasame la ficha por acá.'];

/* ================= Delegación de eventos ================= */
document.addEventListener('click', e => {
  if (e.target.id === 'scrim') { closeModal(); return; }
  const el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const a = el.dataset.act;
  if (a === 'close') closeModal();
  else if (a && ACT[a]) { e.stopPropagation(); ACT[a](el.dataset, el, e); }
  if (el.dataset.go) { if (el.dataset.comp) { S.f.oComp = el.dataset.comp; S.f.oZ = []; S.f.oC = []; } go(el.dataset.go, el.dataset.arg); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange && ACTC[el.dataset.actChange]) return ACTC[el.dataset.actChange](el);
  if (el.dataset.cfg) { CFG[el.dataset.cfg] = +el.value; toast(`Guardado. Las próximas proformas usan ${NOMBRE_CFG[el.dataset.cfg]} ${nf1.format(+el.value)}${el.dataset.cfg === 'plazo' ? ' días' : '%'}.`); return; }
  if (el.dataset.agpct) { const a = ag(el.dataset.agpct); a.pct = +el.value; toast(`${a.nom} cobra ${a.pct}% de las comisiones que trae.`); return; }
  if (el.dataset.zona) { const d = el.dataset.zona; AGENTES.forEach(a => a.zona = a.zona.filter(z => z !== d)); ag(el.value).zona.push(d); toast(`Los contactos de ${d} ahora van a ${ag(el.value).nom}.`); }
});
const NOMBRE_CFG = { comVend: 'comisión vendedor', comComp: 'comisión comprador', iva: 'IVA', reten: 'retenciones', plazo: 'plazo' };
let qT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.actInput === 'fQ') {
    clearTimeout(qT);
    qT = setTimeout(() => { const k = el.dataset.k, pos = el.selectionStart; S.f[k] = el.value; render(); const n = $(`[data-k="${k}"][data-act-input]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220);
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.actSubmit !== 'enviarMsg') return;
  e.preventDefault();
  const i = $('#msgInp'), t = i.value.trim();
  if (!t) return;
  const x = LEADS.find(y => y.id === S.thread);
  x.msgs.push({ de: 'yo', t, h: ahora() });
  if (x.estado === 'Nuevo' || x.estado === 'Asignado') x.estado = 'Contactado';
  if (!x.ag) { x.ag = agDeZona(x.depto).id; x.msgs.push({ de: 'sys', t: `Tomado por ${ag(x.ag).nom}`, h: ahora() }); }
  render(); $('#msgInp').focus();
  setTimeout(() => {
    x.msgs.push({ de: 'el', t: ENVIAR_RESP[Math.floor(Math.random() * ENVIAR_RESP.length)], h: ahora() });
    if (S.view === 'bandeja' && S.thread === x.id) { render(); } else { x.unread = true; renderNav(); toast(`${esc(x.nom)} respondió por WhatsApp.`, { cls: 'wa', ico: 'i-wa', act: 'Ver', fn: () => go('bandeja', x.id) }); }
  }, 3200);
});

/* tooltips de gráficos */
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) { tip.textContent = t.dataset.tip; tip.classList.add('on'); } });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.classList.remove('on'); });
document.addEventListener('mousemove', e => { if (tip.classList.contains('on')) { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; } });

/* ================= Buscador Ctrl+K ================= */
let cmdSel = 0, cmdItems = [];
function cmdIndex() {
  const it = [];
  NAV.forEach(([g, items]) => items.forEach(([id, t, i]) => it.push({ g: 'Ir a', t, s: g, i, fn: () => go(id) })));
  it.push({ g: 'Acciones', t: 'Cargar un lote nuevo', s: 'formulario estandarizado', i: 'i-mas', fn: () => loteForm() });
  it.push({ g: 'Acciones', t: 'Agregar contacto a la bandeja', s: 'WhatsApp, teléfono, web', i: 'i-wa', fn: () => ACT.nuevoLead() });
  it.push({ g: 'Acciones', t: 'Simular el Remate 328 de Plaza Rural', s: 'martillo y proformas solas', i: 'i-play', fn: () => { go('remate', 'PR328'); simRemate('PR328'); } });
  it.push({ g: 'Acciones', t: 'Probar el formulario de la web', s: 'cae en la bandeja por zona', i: 'i-globo', fn: () => formWeb() });
  it.push({ g: 'Acciones', t: 'Exportar lotes a Excel', s: 'CSV', i: 'i-bajar', fn: () => ACT.csvLotes() });
  it.push({ g: 'Acciones', t: 'Ver el recorrido guiado', s: '3 pasos', i: 'i-ayuda', fn: () => startTour() });
  LOTES.forEach(l => it.push({ g: 'Lotes', t: `${l.id} · ${l.cab} ${cat(l.cat).nom.toLowerCase()}`, s: `${prod(l.prod).nom} · ${prod(l.prod).depto} · ${l.estado}`, i: 'i-lote', fn: () => go('lote', l.id) }));
  PRODUCTORES.forEach(p => it.push({ g: 'Productores', t: p.nom, s: `${p.est} · ${p.depto} · DICOSE ${p.dicose}`, i: 'i-user', fn: () => fichaProd(p.id) }));
  COMPRADORES.forEach(c => it.push({ g: 'Compradores', t: c.nom, s: `${c.tipo} · ${c.depto}`, i: 'i-comprador', fn: () => fichaComp(c.id) }));
  REMATES.forEach(r => it.push({ g: 'Remates', t: r.nom, s: fdate(r.fecha), i: 'i-martillo', fn: () => go('remate', r.id) }));
  PROFORMAS.forEach(p => { const k = calcPF(p); it.push({ g: 'Proformas', t: `${p.id} · ${k.cp.nom}`, s: `lote ${k.l.id} · ${usd(k.bruto)}`, i: 'i-doc', fn: () => verPF(p.id) }); });
  AGENTES.forEach(a => it.push({ g: 'Agentes', t: a.nom, s: a.rol + ' · ' + a.zona.join(', '), i: 'i-users', fn: () => comDet(a.id) }));
  return it;
}
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function openCmd() {
  modal(`<div class="q">${ic('i-buscar', 'muted')}<input id="cmdQ" placeholder="Buscá un lote, productor, comprador, proforma o una acción..." autocomplete="off" aria-label="Buscar"><kbd>Esc</kbd></div><div class="res" id="cmdRes"></div>`, 'cmdk');
  const idx = cmdIndex();
  const draw = () => {
    const q = norm($('#cmdQ').value.trim());
    const toks = q.split(/\s+/).filter(Boolean);
    cmdItems = (toks.length ? idx.filter(x => { const h = norm(x.t + ' ' + x.s + ' ' + x.g); return toks.every(t => h.includes(t)); }) : idx.filter(x => x.g === 'Acciones' || x.g === 'Ir a')).slice(0, 40);
    cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1));
    let g = '', h = '';
    cmdItems.forEach((x, i) => { if (x.g !== g) { g = x.g; h += `<div class="grp">${g}</div>`; } h += `<div class="it ${i === cmdSel ? 'on' : ''}" data-i="${i}">${ic(x.i, 'muted')}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></div>`; });
    $('#cmdRes').innerHTML = h || empty('i-buscar', 'No encontré nada con eso.');
    const on = $('#cmdRes .it.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  };
  const run = i => { const x = cmdItems[i]; if (!x) return; closeModal(); x.fn(); };
  $('#cmdQ').addEventListener('input', () => { cmdSel = 0; draw(); });
  $('#cmdQ').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdItems.length - 1); draw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); draw(); }
    if (e.key === 'Enter') { e.preventDefault(); run(cmdSel); }
  });
  $('#cmdRes').addEventListener('click', e => { const it = e.target.closest('.it'); if (it) run(+it.dataset.i); });
  cmdSel = 0; draw();
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if (e.key === 'Escape') { if (tourOn) endTour(); else if ($('#scrim').classList.contains('on')) closeModal(); else $('#side').classList.remove('open'); }
  if (e.key === 'Enter' && e.target.id === 'searchBtn') openCmd();
});
$('#searchBtn').onclick = openCmd;
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#side').classList.toggle('open'); };
document.addEventListener('click', e => { if (innerWidth <= 900 && $('#side').classList.contains('open') && !e.target.closest('#side') && !e.target.closest('#menuBtn')) $('#side').classList.remove('open'); }, true);

/* ================= Recorrido guiado ================= */
let tourOn = false, tourI = 0, tourEls = null;
const TOUR = [
  { sel: '#nav-bandeja', v: 'bandeja', t: 'Todo WhatsApp en un solo lugar', p: 'Los mensajes de WhatsApp, la web e Instagram caen acá y se reparten solos al representante de cada zona. Nadie queda sin contestar.' },
  { sel: '#nav-lotes', v: 'lotes', t: 'Cada lote con el mismo formulario', p: 'Plato del negocio, categoría y características. Con el formulario completo sale la ficha PDF y se manda a los compradores que buscan eso, en esa zona.' },
  { sel: '#nav-proformas', v: 'remate', arg: 'PR328', t: 'Martillo y proforma automática', p: 'En cada remate, al bajar el martillo se arma la proforma con kg, precio, comisión vendedor, comisión comprador y la parte de cada agente. Probá "Simular remate".' }
];
function startTour() {
  closeModal(); tourOn = true; tourI = 0;
  if (!tourEls) { tourEls = { ring: document.createElement('div'), box: document.createElement('div') }; tourEls.ring.className = 'ring'; tourEls.box.className = 'tour'; tourEls.box.setAttribute('role', 'dialog'); document.body.append(tourEls.ring, tourEls.box); }
  tourEls.ring.style.display = tourEls.box.style.display = 'block';
  tourStep();
}
function tourStep() {
  const s = TOUR[tourI];
  go(s.v, s.arg || null);
  if (innerWidth <= 900) $('#side').classList.add('open');
  setTimeout(() => {
    const el = $(s.sel), r = el.getBoundingClientRect();
    Object.assign(tourEls.ring.style, { left: r.left - 4 + 'px', top: r.top - 4 + 'px', width: r.width + 8 + 'px', height: r.height + 8 + 'px' });
    tourEls.box.innerHTML = `<h4>${s.t}</h4><p>${s.p}</p><div class="f"><span>${tourI + 1} de ${TOUR.length}</span><button class="btn sm ghost" id="tSkip">Salir</button><button class="btn sm pri" id="tNext">${tourI < TOUR.length - 1 ? 'Siguiente' : 'Empezar a usarlo'}</button></div>`;
    const left = Math.min(r.right + 16, innerWidth - 346), top = Math.min(Math.max(12, r.top - 20), innerHeight - 200);
    Object.assign(tourEls.box.style, innerWidth <= 900 ? { left: '16px', top: 'auto', bottom: '16px', width: 'calc(100% - 32px)' } : { left: left + 'px', top: top + 'px', bottom: 'auto', width: '330px' });
    $('#tNext').onclick = () => { tourI++; if (tourI >= TOUR.length) endTour(); else tourStep(); };
    $('#tSkip').onclick = endTour;
    $('#tNext').focus();
  }, 60);
}
function endTour() {
  tourOn = false;
  if (tourEls) tourEls.ring.style.display = tourEls.box.style.display = 'none';
  $('#side').classList.remove('open');
  try { localStorage.setItem('romualdo-tour', '1'); } catch (e) { /* sin almacenamiento, no pasa nada */ }
}
$('#tourBtn').onclick = startTour;
addEventListener('resize', () => { if (tourOn) tourStep(); });

/* ================= Arranque ================= */
(function seed() {
  const plazos = { 'RC-1050': 7, 'RC-1049': 15, 'RC-1051': 0 };
  Object.keys(plazos).forEach(id => lote(id).plazo = plazos[id]);
  PFN = 2603;
  LOTES.filter(l => l.venta).sort((a, b) => a.venta.fecha - b.venta.fecha || a.id.localeCompare(b.id)).forEach(l => { const p = generaProforma(l, l.venta.fecha); p.estado = 'Enviada'; });
  const pf = id => pfOf(id).id;
  COBROS[pf('RC-1051')] = { comp: dd(-4), prod: dd(-3) };
  COBROS[pf('RC-1043')] = { comp: dd(-5), prod: dd(-4) };
  COBROS[pf('RC-1042')] = { comp: dd(-2) };
  COBROS[pf('RC-1048')] = { comp: dd(-1) };
})();
render();
try { if (!localStorage.getItem('romualdo-tour')) setTimeout(startTour, 1200); } catch (e) { /* modo privado: arranca sin recorrido */ }
</script>
</body>
</html>
