/* Procesa la lectura de manga: anexa a la ficha de cada caravana */
function procesarLectura(t) {
  cerrarModal();
  const c = CAMPO(t.campo);
  const delCampo = S.vientres.filter(v => v.est === t.campo);
  let anexados = 0, nuevos = 0;
  const resultados = ['Cabeza', 'Cuerpo', 'Cola', 'Vacía'];
  delCampo.forEach((v, k) => {
    v.ev.push({ f: t.f, tipo: t.tipo, camp: '2025-26', lote: v.cat, toro: '', eco30: '',
                res: resultados[k % 4 === 3 ? 3 : k % 3] });
    anexados++;
  });
  if (delCampo.length < 3) {
    for (let k = 0; k < 4; k++) {
      const car = '8580000' + String(40000000 + Math.floor(Math.random() * 9999999));
      S.vientres.push({ _i: S.vientres.length, car, est: t.campo, cat: t.lote, estado: 'Activa (2025-26) - ingresó este año',
        anios: '1', p: '2026', u: '2026',
        ev: [{ f: t.f, tipo: t.tipo, camp: '2025-26', lote: t.lote, toro: '', eco30: '', res: resultados[k % 4] }] });
      nuevos++;
    }
  }
  t.estado = 'Cerrado'; t.lectura = false;
  modal({
    titulo: 'Lectura procesada', sub: c.n + ' · ' + t.tipo,
    cuerpo:
      '<div class="note note--ok">' + ic('check') +
      '<div><b>' + nf0.format(t.animales) + ' caravanas leídas y cruzadas contra la base.</b></div></div>' +
      '<div class="kv" style="margin-top:12px"><span>Fichas actualizadas</span><b>' + anexados + '</b></div>' +
      '<div class="kv"><span>Caravanas nuevas dadas de alta</span><b>' + nuevos + '</b></div>' +
      '<div class="kv"><span>Sin identificar</span><b>0</b></div>' +
      '<div class="kv"><span>Trabajo</span><b>Cerrado</b></div>' +
      '<div class="note note--info" style="margin-top:13px">' + ic('inf') +
      '<div>Con el trabajo cerrado, el informe de cierre ya se puede generar sin rearmar nada: los datos del día quedaron anexados a la ficha histórica de cada animal.</div></div>',
    acciones: [{ txt: 'Ver las fichas', fn: () => { S.filtros.campo = t.campo; S.ficha = null; S.campo = null; ir('vientres'); } },
               { txt: 'Generar el informe', tipo: 'g', icono: 'inf', fn: () => ACCIONES.generarInforme() }]
  });
  aviso('Lectura de ' + c.n + ' procesada · ' + anexados + ' fichas actualizadas', 'ok');
  render();
}


/* ============================================================
   Buscador, tour, eventos en vivo y arranque
   ============================================================ */
let palSel = 0, palOps = [];

function abrirPal() {
  $('#ov-pal').hidden = false;
  const i = $('#pal-i'); i.value = ''; i.focus();
  filtrarPal('');
}
function cerrarPal() { $('#ov-pal').hidden = true; }

function opcionesPal(q) {
  const t = q.trim().toLowerCase();
  const ops = [];
  VISTAS.filter(v => v.id).forEach(v => {
    if (!t || v.n.toLowerCase().includes(t)) ops.push({ g: 'Ir a', n: v.n, i: v.i, fn: () => ir(v.id) });
  });
  S.campos.forEach(c => {
    if (!t || c.n.toLowerCase().includes(t) || c.productor.toLowerCase().includes(t) || c.loc.toLowerCase().includes(t))
      ops.push({ g: 'Establecimientos', n: c.n, s: c.productor + ' · ' + c.loc, i: 'campo', fn: () => { S.campo = c.id; S.ficha = null; ir('campos'); } });
  });
  if (t.length >= 2) {
    S.vientres.filter(v => v.car.toLowerCase().includes(t)).slice(0, 8).forEach(v =>
      ops.push({ g: 'Vientres', n: v.car, s: CAMPO(v.est).n + ' · ' + cap(v.cat), i: 'vaca', fn: () => { S.ficha = v._i; S.campo = null; ir('vientres'); } }));
    S.toros.filter(x => x.ide.toLowerCase().includes(t) || (x.caravana || '').includes(t) || (x.origen || '').toLowerCase().includes(t)).slice(0, 6).forEach(x =>
      ops.push({ g: 'Toros', n: 'Toro ' + x.ide, s: normalizar(x.raza, 'Raza') + ' · ' + x.origen, i: 'toro', fn: () => { ir('toros'); setTimeout(() => ACCIONES.verToro({ ide: x.ide }), 120); } }));
  }
  S.informes.filter(i => !t || i.t.toLowerCase().includes(t) || CAMPO(i.campo).n.toLowerCase().includes(t)).slice(0, 5).forEach(i =>
    ops.push({ g: 'Informes', n: i.t, s: CAMPO(i.campo).n + ' · ' + fecha(i.f), i: 'inf', fn: () => { S.informe = i.id; S.campo = null; ir('informes'); } }));
  [
    { n: 'Subir lectura de manga', i: 'subir', fn: () => ACCIONES.subirLectura({}) },
    { n: 'Dar de alta un vientre', i: 'mas', fn: () => ACCIONES.altaVientre() },
    { n: 'Cambio de caravana', i: 'swap', fn: () => ACCIONES.cambioCaravanaDe({ i: 0 }) },
    { n: 'Generar un informe', i: 'inf', fn: () => ACCIONES.generarInforme() },
    { n: 'Exportar los vientres a CSV', i: 'bajar', fn: () => ACCIONES.csvVientres() },
    { n: 'Ver el recorrido de la demostración', i: 'ojo', fn: () => tour(0) }
  ].forEach(a => { if (!t || a.n.toLowerCase().includes(t)) ops.push(Object.assign({ g: 'Acciones' }, a)); });
  return ops.slice(0, 22);
}

function filtrarPal(q) {
  palOps = opcionesPal(q); palSel = 0;
  const c = $('#pal-r');
  if (!palOps.length) { c.innerHTML = '<div class="empty" style="padding:26px">' + ic('buscar') + '<p>Sin resultados</p><small>Probá con una caravana, un establecimiento o un toro.</small></div>'; return; }
  let g = '', h = '';
  palOps.forEach((o, i) => {
    if (o.g !== g) { g = o.g; h += '<div class="pal__g">' + esc(g) + '</div>'; }
    h += '<div class="pal__o" role="option" data-i="' + i + '"' + (i === palSel ? ' aria-selected="true"' : '') + '>' +
      ic(o.i) + '<div style="flex:1;min-width:0"><div>' + esc(o.n) + '</div>' +
      (o.s ? '<small style="display:block;margin:0;color:var(--ink-3);font-weight:600">' + esc(o.s) + '</small>' : '') + '</div></div>';
  });
  c.innerHTML = h;
  $$('#pal-r .pal__o').forEach(el => {
    el.onmouseenter = () => { palSel = +el.dataset.i; marcarPal(); };
    el.onclick = () => { cerrarPal(); palOps[+el.dataset.i].fn(); };
  });
}
function marcarPal() {
  $$('#pal-r .pal__o').forEach(el => el.setAttribute('aria-selected', +el.dataset.i === palSel ? 'true' : 'false'));
  const a = $('#pal-r .pal__o[aria-selected="true"]');
  if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
}

/* ---------------- tour ---------------- */
const PASOS = [
  { t: 'Buscá una caravana y vas a ver toda su historia',
    d: 'Apretá Ctrl+K y escribí los últimos dígitos de una caravana. La ficha junta lo que pasó en cada campaña: la IATF, el DAO, el eco de 30 días y el resultado final. Antes eso eran tres archivos distintos y había que cruzarlos a mano.',
    v: 'vientres' },
  { t: 'Cerrá un trabajo y el informe se arma solo',
    d: 'En Trabajos de manga, el de Aguará está esperando la lectura del día. Subila y mirá cómo el sistema cruza cada caravana contra la base, anexa los datos a las fichas y deja el informe listo para enviar.',
    v: 'trabajos' },
  { t: 'Cargá un Día 0 y el cronograma se calcula solo',
    d: 'En Calendario, elegí protocolo y fecha de Día 0: salen el Día 5, el Día 7 y la IATF, con los días que se pisan con otros campos marcados antes de que llegue la fecha.',
    v: 'calendario' },
  { t: 'La plata, con los dos modelos de reparto',
    d: 'En Honorarios están las tarifas por vaca y por km, el reparto por jornadas de la zafra de IATF y el 50/25/25 de la zafra de ecografías. Movés una tarifa y se recalcula todo, incluido lo que le queda a cada socio.',
    v: 'honorarios' }
];
function tour(i) {
  if (i >= PASOS.length) { aviso('Listo. Ahora recorrelo a tu ritmo', 'gold'); return; }
  const p = PASOS[i];
  ir(p.v);
  modal({
    titulo: p.t, sub: 'Paso ' + (i + 1) + ' de ' + PASOS.length,
    cuerpo: '<p style="line-height:1.65;font-weight:600;color:var(--ink-2)">' + esc(p.d) + '</p>',
    acciones: [
      { txt: i ? 'Anterior' : 'Salir', fn: () => { if (i) setTimeout(() => tour(i - 1), 120); } },
      { txt: i === PASOS.length - 1 ? 'Terminar' : 'Siguiente', tipo: 'p', icono: 'flecha',
        fn: () => setTimeout(() => tour(i + 1), 120) }
    ]
  });
}

/* ---------------- eventos en vivo ---------------- */
const EVENTOS = [
  () => { const c = CAMPO('lacapilla');
    aviso('Álvaro Ferrés pidió adelantar la eco de La Capilla', 'gold');
    const t = S.trabajos.find(x => x.campo === 'lacapilla'); if (t && t.estado === 'Sin cerrar') { t.f = hoyISO(HOY); t.estado = 'Hoy'; }
    if (S.vista === 'trabajos' || S.vista === 'hoy') render(); },
  () => { const v = S.vientres.find(x => perdioPreñez(x));
    if (v) aviso('Caravana ' + v.car + ': reabsorción confirmada al eco de 90', 'bad'); },
  () => { aviso('Santiago cerró la lectura de Aguará desde el campo', 'ok');
    const t = S.trabajos.find(x => x.campo === 'aguara'); if (t && t.estado !== 'Cerrado') { t.estado = 'Sin cerrar'; }
    if (S.vista === 'trabajos' || S.vista === 'hoy') render(); },
  () => { aviso('The Land Group pidió la comparativa de origen de Villa Lucero', 'gold'); },
  () => { const t = S.toros.find(x => /POSITIV/i.test(x.raspaje));
    if (t) aviso('Laboratorio: reconfirmado el positivo del toro ' + t.ide, 'bad'); }
];
let evIdx = 0;
function arrancarEventos() {
  setInterval(() => { EVENTOS[evIdx % EVENTOS.length](); evIdx++; }, 38000);
}

/* ---------------- teclado ---------------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); abrirPal(); return; }
  if (e.key === 'Escape') {
    if (!$('#ov-pal').hidden) { cerrarPal(); return; }
    if (!$('#ov-modal').hidden) { cerrarModal(); return; }
  }
  if (!$('#ov-pal').hidden) {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palSel + 1, palOps.length - 1); marcarPal(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(palSel - 1, 0); marcarPal(); }
    if (e.key === 'Enter' && palOps[palSel]) { e.preventDefault(); cerrarPal(); palOps[palSel].fn(); }
  }
});

/* ---------------- arranque ---------------- */
$('#btn-pal').onclick = abrirPal;
$('#pal-i').addEventListener('input', e => filtrarPal(e.target.value));
$('#ov-pal').addEventListener('click', e => { if (e.target.id === 'ov-pal') cerrarPal(); });
$('#ov-modal').addEventListener('click', e => { if (e.target.id === 'ov-modal') cerrarModal(); });
$('#modal-x').onclick = cerrarModal;

recalcularAvisos();
pintarNav();
pintarCtx();
render();
arrancarEventos();
setTimeout(() => {
  modal({
    titulo: 'Reprogen, de las planillas a un sistema',
    sub: 'Demostración con los datos reales de la campaña 2025-26',
    cuerpo:
      '<p style="line-height:1.65;font-weight:600;color:var(--ink-2)">Esto es el Excel Madre, el calendario de campaña, los informes y el desglose de honorarios, ' +
      'funcionando como un solo sistema. Los ' + S.vientres.length + ' vientres, los ' + S.toros.length + ' toros y las ' + S.jornadas.length +
      ' jornadas salieron de las planillas de Reprogen.</p>' +
      '<div class="grid g2" style="margin-top:15px">' +
      '<div class="note note--info">' + ic('hist') + '<div><b>Ficha histórica por caravana.</b> El requisito no negociable del brief: cada animal acumula sus eventos campaña tras campaña.</div></div>' +
      '<div class="note note--ok">' + ic('subir') + '<div><b>Carga automática de lecturas.</b> Subís el archivo del día y se anexa solo a la ficha de cada animal.</div></div>' +
      '</div>' +
      '<div class="note" style="margin-top:11px">' + ic('buscar') + '<div>Apretá <b>Ctrl+K</b> en cualquier momento para buscar una caravana, un campo o un toro.</div></div>',
    acciones: [
      { txt: 'Entro solo' },
      { txt: 'Mostrame el recorrido', tipo: 'g', icono: 'ojo', fn: () => setTimeout(() => tour(0), 150) }
    ]
  });
}, 700);

</script>
