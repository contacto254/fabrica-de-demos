<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reprogen · Gestión reproductiva</title>
<meta name="description" content="Sistema de gestión reproductiva integral de Reprogen — ficha histórica por caravana, trabajos de manga, protocolos, toros, informes y honorarios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F6; --panel:#FFFFFF; --panel-2:#FAFCFC;
  --ink:#102C33; --ink-2:#4B6870; --ink-3:#88A2A8;
  --line:#DCE7E8; --line-2:#EDF3F3;
  --brand:#1D3F48; --brand-2:#2B5D69; --brand-soft:#E6EEEF; --brand-ink:#0D2429;
  --gold:#D2AA50; --gold-soft:#FBF3E2; --gold-deep:#9A7724;
  --ok:#2E7D62; --ok-soft:#E3F2EC;
  --warn:#C98A12; --warn-soft:#FDF2DC;
  --bad:#C0524B; --bad-soft:#FBE8E6;
  --info:#2F6D8F; --info-soft:#E5F0F5;
  --r:10px; --r-lg:16px; --r-sm:7px;
  --sh:0 1px 2px rgba(16,44,51,.05);
  --sh-2:0 10px 30px rgba(16,44,51,.13),0 2px 8px rgba(16,44,51,.07);
  --nav:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.5 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::selection{background:var(--gold-soft)}

/* ---------- estructura ---------- */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav);flex:none;background:var(--brand);color:#CFE0E3;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.nav__brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.nav__logo{width:34px;height:34px;flex:none}
.nav__name{font-weight:800;font-size:16px;color:#fff;letter-spacing:.02em;line-height:1.1}
.nav__sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nav__group{padding:10px 10px 2px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7FA0A8;font-weight:700}
.nav__link{
  display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:1px 8px;padding:9px 10px;
  background:none;border:0;border-radius:var(--r);color:#CFE0E3;cursor:pointer;text-align:left;
  font-size:13.5px;font-weight:600;transition:background .14s,color .14s;
}
.nav__link:hover{background:rgba(255,255,255,.08);color:#fff}
.nav__link[aria-current="page"]{background:var(--gold);color:#22190A;font-weight:700}
.nav__badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav__link[aria-current="page"] .nav__badge{background:#22190A;color:var(--gold)}
.nav__foot{margin-top:auto;padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#7FA0A8;line-height:1.45}
.nav__foot b{color:#CFE0E3;font-weight:700}

.main{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:rgba(242,246,246,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.top__t{font-size:19px;font-weight:800}
.top__s{font-size:12.5px;color:var(--ink-3);font-weight:600}
.top__sp{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 11px;min-width:220px;cursor:pointer;color:var(--ink-3);
  font-size:13px;font-weight:600;transition:border-color .14s,box-shadow .14s;
}
.search:hover{border-color:var(--brand-2);box-shadow:var(--sh)}
.search kbd{
  margin-left:auto;background:var(--brand-soft);border-radius:5px;padding:1px 6px;
  font:700 10.5px/1.6 Manrope;color:var(--brand-2);letter-spacing:.04em;
}
.view{padding:20px 22px 48px;flex:1}

/* ---------- controles ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
  font-size:13px;font-weight:700;transition:background .14s,border-color .14s,transform .08s;
}
.btn:hover{background:var(--panel-2);border-color:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn--p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn--p:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn--g{background:var(--gold);border-color:var(--gold);color:#22190A}
.btn--g:hover{background:#C29A3F;border-color:#C29A3F}
.btn--sm{padding:5px 10px;font-size:12px;border-radius:var(--r-sm)}
.btn--icon{padding:7px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,select.inp{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;
  font-size:13px;font-weight:600;color:var(--ink);width:100%;transition:border-color .14s;
}
.inp:focus{border-color:var(--brand-2)}
.inp::placeholder{color:var(--ink-3);font-weight:500}
label.fl{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin:0 0 5px 2px;letter-spacing:.01em}
.field{margin-bottom:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

/* ---------- tarjetas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);min-width:0}
.card__b{min-width:0}
.card__h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card__t{font-size:14.5px;font-weight:800}
.card__d{font-size:12px;color:var(--ink-3);font-weight:600}
.card__b{padding:16px 18px}
.card__b--flush{padding:0}
.grid{display:grid;gap:15px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.mb{margin-bottom:15px}

/* ---------- kpi ---------- */
.kpi{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi__l{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.kpi__v{font-size:27px;font-weight:800;margin:7px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi__d{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi--ok .kpi__v{color:var(--ok)} .kpi--warn .kpi__v{color:var(--warn)}
.kpi--bad .kpi__v{color:var(--bad)} .kpi--gold .kpi__v{color:var(--gold-deep)}
.kpi__spark{position:absolute;right:10px;bottom:8px;opacity:.5}

/* ---------- tablas ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:800;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2);
}
th.num{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:700}
.t-sub{font-size:11.5px;color:var(--ink-3);font-weight:600}

/* ---------- pildoras ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag--n{background:var(--brand-soft);color:var(--brand-2)}
.tag--ok{background:var(--ok-soft);color:var(--ok)}
.tag--warn{background:var(--warn-soft);color:var(--warn)}
.tag--bad{background:var(--bad-soft);color:var(--bad)}
.tag--info{background:var(--info-soft);color:var(--info)}
.tag--gold{background:var(--gold-soft);color:var(--gold-deep)}
.tag--mute{background:var(--line-2);color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}

/* ---------- barras y graficos ---------- */
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--brand-2);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar--ok>i{background:var(--ok)} .bar--warn>i{background:var(--warn)} .bar--bad>i{background:var(--bad)} .bar--gold>i{background:var(--gold)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.stack>i{display:block;transition:width .5s}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:9px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:9px;height:9px;border-radius:3px;display:block}

/* ---------- ficha ---------- */
/* ---- contexto: el establecimiento manda ---- */
.ctx{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:9px 11px;margin:2px 0 4px;cursor:pointer;transition:background .15s,border-color .15s}
.ctx:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)}
.ctx__p{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#7FA0A8;font-weight:700}
.ctx__n{display:flex;align-items:center;gap:7px;color:#fff;font-size:14.5px;font-weight:800;margin:3px 0 1px}
.ctx__n .ic{width:15px;height:15px;flex:none;opacity:.85}
.ctx__c{margin-left:auto;width:13px;height:13px;opacity:.6}
.ctx__d{display:block;font-size:11px;color:#9DB6BC;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx__camps{display:flex;gap:5px;margin:0 0 8px}
.ctx__camp{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#9DB6BC;border-radius:var(--r-sm);padding:5px 4px;font:700 11px Manrope;cursor:pointer}
.ctx__camp.is-on{background:var(--gold);border-color:var(--gold);color:#3A2C08}

/* ---- elegir establecimiento ---- */
.pick{display:flex;flex-direction:column;gap:7px}
.pick__i{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.pick__i:hover{border-color:var(--brand-2);background:#fff}
.pick__i.is-on{border-color:var(--brand-2);background:var(--brand-soft)}
.pick__n{font-weight:800;font-size:14px;color:var(--ink)}
.pick__d{grid-column:1;font-size:11.5px;color:var(--ink-2);font-weight:600}
.pick__p{grid-row:1/3;align-self:center;font-weight:800;font-size:17px;color:var(--brand-2)}

/* ---- distribucion de paricion: el titular del sistema ---- */
.dist{display:flex;height:30px;border-radius:var(--r-sm);overflow:hidden;background:var(--line-2)}
.dist--big{height:58px}
.dist__s{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1.15;overflow:hidden;transition:width .4s}
.dist__s b{font-size:13px;font-weight:800}
.dist--big .dist__s b{font-size:19px}
.dist__s span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.85;font-weight:700}
.dist__s--cabeza{background:var(--ok)}
.dist__s--cuerpo{background:var(--brand-2)}
.dist__s--cola{background:var(--bad)}
.dist__leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dist__leg span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sw--cabeza{background:var(--ok)} .sw--cuerpo{background:var(--brand-2)} .sw--cola{background:var(--bad)}
.cmp__t{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.cmp .dist{opacity:.55}

/* ---- variacion contra la campana anterior ---- */
.dl{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.dl .ic{width:12px;height:12px}
.dl--ok{color:var(--ok)} .dl--bad{color:var(--bad)} .dl--mute{color:var(--ink-3)}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl__i{position:relative;padding:0 0 18px}
.tl__i:last-child{padding-bottom:0}
.tl__d{position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2.5px solid var(--brand-2)}
.tl__i--ok .tl__d{border-color:var(--ok)} .tl__i--bad .tl__d{border-color:var(--bad)} .tl__i--warn .tl__d{border-color:var(--warn)}
.tl__f{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.tl__t{font-weight:700;margin:2px 0 3px}
.tl__m{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,30,34,.5);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.ov[hidden]{display:none}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-2);width:100%;max-width:620px;animation:pop .18s ease-out}
.modal--wide{max-width:900px}
.modal--slim{max-width:460px}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.modal__h{display:flex;align-items:flex-start;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line-2)}
.modal__t{font-size:16px;font-weight:800}
.modal__d{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.modal__b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal__f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:5px;border-radius:var(--r-sm);display:flex}
.x:hover{background:var(--line-2);color:var(--ink)}

/* ---------- aviso ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--brand-ink);color:#EAF2F3;padding:10px 17px;border-radius:999px;box-shadow:var(--sh-2);
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;animation:up .22s ease-out;max-width:88vw;
}
.toast--ok{background:var(--ok)} .toast--bad{background:var(--bad)} .toast--gold{background:var(--gold-deep)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- buscador ---------- */
.pal{width:100%;max-width:600px;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;animation:pop .16s ease-out}
.pal__i{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line-2);color:var(--ink-3)}
.pal__i input{border:0;outline:0;flex:1;font-size:15px;font-weight:600;background:none}
.pal__r{max-height:56vh;overflow-y:auto;padding:6px}
.pal__o{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:600}
.pal__o[aria-selected="true"]{background:var(--brand-soft)}
.pal__o small{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:700}
.pal__g{padding:9px 12px 4px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:800}

/* ---------- tablero ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px;min-height:220px;transition:background .15s,border-color .15s}
.col.over{background:var(--gold-soft);border-color:var(--gold)}
.col__h{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--ink-2);margin-bottom:10px}
.col__n{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:box-shadow .14s,transform .14s}
.tk:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.tk.drag{opacity:.4}
.tk__t{font-weight:700;font-size:13px;margin-bottom:4px}
.tk__m{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- varios ---------- */
.empty{text-align:center;padding:38px 18px;color:var(--ink-3)}
.empty svg{width:40px;height:40px;stroke-width:1.4;margin-bottom:10px;opacity:.55}
.empty p{font-weight:700;color:var(--ink-2);margin-bottom:5px}
.empty small{font-size:12.5px;display:block;margin-bottom:13px;max-width:330px;margin-inline:auto;line-height:1.5}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-2);transition:all .14s}
.chip:hover{border-color:var(--brand-2);color:var(--brand-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.note{background:var(--gold-soft);border:1px solid #F0E0BE;border-radius:var(--r);padding:11px 14px;font-size:12.5px;font-weight:600;color:#6B5312;display:flex;gap:9px;line-height:1.5}
.note--info{background:var(--info-soft);border-color:#CEE2EC;color:#1F4F68}
.note--bad{background:var(--bad-soft);border-color:#F2D3D0;color:#8C3832}
.note--ok{background:var(--ok-soft);border-color:#C9E4D8;color:#1F5A46}
.sep{height:1px;background:var(--line-2);margin:15px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700;font-variant-numeric:tabular-nums}
.kv span{color:var(--ink-2);font-weight:600}
.big{font-size:17px;font-weight:800}
.hl{background:var(--gold-soft);padding:0 3px;border-radius:3px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-3);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .14s,border-color .14s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--gold)}
.hr-sc{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}.g-23,.g-32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{flex-direction:column}

function fecha(iso, largo) {
  if (!iso) return '—';
  const p = String(iso).slice(0, 10).split('-');
  if (p.length < 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d)) return iso;
  return largo
    ? DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + '. ' + d.getFullYear()
    : d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2);
}

/* Normalización: el vocabulario controlado del brief, aplicado de verdad */
function normalizar(valor, campo) {
  if (!valor) return '';
  const v = String(valor).trim();
  const voc = VOCABULARIO.find(x => x.campo === campo);
  if (!voc) return v;
  const up = v.toUpperCase();
  for (const k in voc.alias) if (k.toUpperCase() === up) return voc.alias[k];
  const ok = voc.validos.find(x => x.toUpperCase() === up);
  return ok || v;
}
function estadoPreñez(res) {
  const r = String(res || '').toUpperCase();
  if (/^(CABEZA|CUERPO|COLA|PREÑ|PREN)/.test(r)) return 'prenada';
  if (/^VAC/.test(r)) return 'vacia';
  if (/REABSORBE/.test(r)) return 'perdida';
  if (/NO PAS/.test(r)) return 'nopaso';
  return 'otro';
}

/* ---------- CSV ----------
   Dos caminos segun donde corra el demo: si el visor ofrece guardar
   archivos va por ahi; si no (servido normal), enlace de toda la vida.
   Asi el boton hace algo en los dos lados. */
let guardarArchivo = null;
if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
  try { window.claude.use('downloads').then(function (d) { guardarArchivo = d; }, function () {}); } catch (e) { /* servido normal */ }
}
function csv(nombre, cabeceras, filas) {
  const q = v => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const txt = '﻿' + [cabeceras.map(q).join(';')].concat(filas.map(f => f.map(q).join(';'))).join('\r\n');
  if (guardarArchivo && typeof guardarArchivo.save === 'function') {
    guardarArchivo.save({ filename: nombre, data: txt }).then(
      function () { aviso(nombre + ' descargado', 'ok'); },
      function (e) { aviso(e && e.code === 'declined' ? 'Descarga cancelada' : 'Acá no se puede descargar', 'bad'); }
    );
    return;
  }
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  aviso(nombre + ' descargado', 'ok');
}

/* Último evento de cada vientre */
function ultimoEvento(v) { return v.ev && v.ev.length ? v.ev[v.ev.length - 1] : null; }
function estadoVientre(v) {
  const e = ultimoEvento(v);
  return e ? estadoPreñez(e.res) : 'otro';
}

/* Pérdida embrionaria: preñada al eco 30 y perdida después */
function perdioPreñez(v) {
  const e30 = v.ev.find(x => /30/.test(x.tipo));
  const post = v.ev.filter(x => /90|final/i.test(x.tipo));
  if (!e30 || !post.length) return false;
  return estadoPreñez(e30.res) === 'prenada' && estadoPreñez(post[post.length - 1].res) !== 'prenada';
}

/* Las que estaban preñadas al eco de 30: es el denominador correcto de la pérdida embrionaria */
function preñadasAl30() {
  return enCampo().filter(v => {
    const e30 = v.ev.find(x => /30/.test(x.tipo));
    return e30 && estadoPreñez(e30.res) === 'prenada';
  });
}

/* Reincidencia entre campañas: vacía dos campañas seguidas */
function reincidente(v) {
  const res = v.ev.filter(e => /final|eco|dao/i.test(e.tipo) || e.res).map(e => estadoPreñez(e.res));
  let seguidas = 0, max = 0;
  res.forEach(r => { if (r === 'vacia') { seguidas++; max = Math.max(max, seguidas); } else seguidas = 0; });
  return max >= 2 || (v.anios === '2' && res.filter(r => r === 'vacia').length >= 2);
}

/* Preñez por toro sobre los vientres cargados */
function preñezPorToro() {
  const m = {};
  enCampo().forEach(v => v.ev.forEach(e => {
    if (!e.toro || e.toro.length < 3 || /^[-\u2014\s]+$/.test(e.toro)) return;
    const t = cap(e.toro);
    m[t] = m[t] || { n: t, tot: 0, pr: 0 };
    const fin = v.ev[v.ev.length - 1];
    m[t].tot++;
    if (estadoPreñez(fin.res) === 'prenada') m[t].pr++;
  }));
  return Object.values(m).filter(x => x.tot >= 4)
    .map(x => Object.assign(x, { pct: Math.round(100 * x.pr / x.tot) }))
    .sort((a, b) => b.pct - a.pct);
}

/* Preñez por estado ovárico, con el vocabulario ya normalizado */
function preñezPorDAO() {
  const m = {};
  S.vientres.forEach(v => {
    const dao = v.ev.find(e => /DAO/i.test(e.tipo));
    if (!dao) return;
    const est = normalizar(dao.res, 'Estado ovárico (DAO)');
    const VALIDOS = VOCABULARIO.find(x => x.campo === 'Estado ovárico (DAO)').validos;
    if (!est || VALIDOS.indexOf(est) === -1) return;
    m[est] = m[est] || { n: est, tot: 0, pr: 0 };
    m[est].tot++;
    if (estadoVientre(v) === 'prenada') m[est].pr++;
  });
  return Object.values(m).map(x => Object.assign(x, { pct: Math.round(100 * x.pr / x.tot) }))
    .sort((a, b) => b.tot - a.tot);
}

/* Totales de cartera: lo que factura y lo que le queda a Reprogen */
function totalesCartera() {
  const t = { fact: 0, hon: 0, via: 0, ben: 0, vacas: 0, km: 0 };
  S.campos.forEach(c => { t.fact += c.fact; t.hon += c.honTotal; t.via += c.viaTotal; t.ben += c.beneficio; t.vacas += c.vacas; t.km += c.km; });
  return t;
}

/* Reparto por persona en toda la cartera */
function repartoEquipo() {
  const m = {};
  EQUIPO.forEach(p => m[p.id] = { id: p.id, n: p.n, ini: p.ini, col: p.col, socio: p.socio, hon: 0, via: 0, ben: 0, jornadas: 0 });
  S.campos.forEach(c => {
    for (const k in c.honPersona) if (m[k]) { m[k].hon += c.honPersona[k]; m[k].jornadas += c.honPersona[k] / S.tarifas.jornada; }
    for (const k in c.kmPersona) if (m[k]) m[k].via += c.kmPersona[k] * c.tarifa.viatico;
    const socios = EQUIPO.filter(p => p.socio);
    socios.forEach(s => { if (m[s.id]) m[s.id].ben += c.beneficio / socios.length; });
  });
  return Object.values(m).map(x => Object.assign(x, { total: x.hon + x.via + x.ben }))
    .filter(x => x.total > 0).sort((a, b) => b.total - a.total);
}

/* Calcula la facturación de un campo con las tarifas que estén puestas */
function facturar(c, tarifa) {
  const t = tarifa || c.tarifa;
  const hon = c.vacas * t.hon, extra = c.vacas * t.extra, via = c.km * t.viatico;
  return { hon, extra, via, total: hon + extra + via };
}

/* Genera las etapas de un protocolo a partir del Día 0 */
function generarEtapas(protoId, dia0) {
  const p = PROTOCOLOS.find(x => x.id === protoId);
  if (!p) return [];
  const base = new Date(dia0 + 'T12:00:00');
  return p.etapas.map(e => {
    const d = new Date(base); d.setDate(d.getDate() + e.d);
    return { f: hoyISO(d), n: e.n, det: e.det, offset: e.d };
  });
}

/* Jornadas del calendario que chocan el mismo día */
function superposiciones() {
  const porFecha = {};
  S.jornadas.forEach(j => { (porFecha[j.f] = porFecha[j.f] || []).push(j); });
  return Object.keys(porFecha).filter(f => porFecha[f].length > 1)
    .map(f => ({ f, js: porFecha[f] })).sort((a, b) => a.f < b.f ? -1 : 1);
}

/* Carga de trabajo por persona en el calendario */
function cargaEquipo() {
  const m = {};
  S.jornadas.forEach(j => {
    const nombres = (j.resp || '').split('/').map(s => s.trim()).filter(Boolean);
    (nombres.length ? nombres : ['Sin asignar']).forEach(nn => {
      const key = nn.toLowerCase();
      const p = EQUIPO.find(e => key.includes(e.id) || key.includes(e.n.split(' ')[0].toLowerCase()));
      const id = p ? p.n : (key === 'reprogen' ? 'Todo el equipo' : cap(nn));
      m[id] = (m[id] || 0) + 1;
    });
  });
  return Object.entries(m).map(([n, v]) => ({ n, v })).sort((a, b) => b.v - a.v);
}

}
function barra(p, mod) { return '<div class="bar' + (mod ? ' bar--' + mod : '') + '"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i></div>'; }
function tag(mod, txt) { return '<span class="tag tag--' + mod + '">' + esc(txt) + '</span>'; }

/* ============================================================
   El establecimiento como contexto
   Todo lo de aca adentro se lee dentro del campo y la campana
   elegidos arriba. Un total cruzado entre campos no le sirve a
   nadie: el productor viene a hablar del suyo.
   ============================================================ */

/* Cuanto vale adelantar un parto. Una vaca que se prena en la cabeza
   pare unos dos meses antes que una de la cola, y ese ternero llega al
   destete con esos dias de mas encima. Los numeros se tocan en
   Configuracion: cada productor tiene los suyos. */
const SUPUESTOS = { dias: 60, ganancia: 0.75, precioKg: 2.4 };
const kgPorTercio = () => Math.round(SUPUESTOS.dias * SUPUESTOS.ganancia);

/* La distribucion de parto: cabeza, cuerpo y cola.
   Si el campo tiene vientres cargados la calculamos de los eventos;
   si no, la tomamos del informe de cierre. */
function tercios(id) {
  const vs = S.vientres.filter(v => v.est === id);
  const cuenta = { cabeza: 0, cuerpo: 0, cola: 0 };
  let con = 0;
  vs.forEach(v => {
    const fin = ultimoEvento(v);
    if (!fin || estadoPreñez(fin.res) !== 'prenada') return;
    const t = String(fin.res + ' ' + (fin.lote || '')).toUpperCase();
    const k = /CABEZA|GRANDE/.test(t) ? 'cabeza' : /COLA|CHICA/.test(t) ? 'cola' : 'cuerpo';
    cuenta[k]++; con++;
  });
  const c = S.campos.find(x => x.id === id);
  /* Manda el cierre de campana: cubre las preñadas del campo entero. Los
     vientres cargados son una parte, y su reparto no se puede estirar al
     total sin contradecir al propio informe. Se calcula de los eventos solo
     cuando el campo todavia no tiene cierre. */
  if (c.dist) return Object.assign({ base: c.resumen.prenadas, fuente: 'el informe de cierre' }, c.dist);
  if (con >= 20) {
    return {
      cabeza: Math.round(100 * cuenta.cabeza / con),
      cuerpo: Math.round(100 * cuenta.cuerpo / con),
      cola: Math.round(100 * cuenta.cola / con),
      base: con, fuente: 'los ' + con + ' vientres cargados'
    };
  }
  return { cabeza: 0, cuerpo: 0, cola: 0, base: 0, fuente: 'sin cierre todavía' };
}

/* Cuanto ternero separa a la cola de la cabeza. No es plata perdida:
   es lo que hay arriba de la mesa si la cola se corre para adelante. */
function enJuego(c) {
  const t = tercios(c.id);
  const vacasCola = Math.round(c.resumen.prenadas * t.cola / 100);
  const kg = vacasCola * kgPorTercio();
  return { vacasCola: vacasCola, kg: kg, usd: kg * SUPUESTOS.precioKg };
}

/* Variacion contra la campana anterior, que es la unica comparacion
   que significa algo: mismo campo, misma gente, mismo pasto. */
function delta(hoy, antes, mejorArriba) {
  const d = hoy - antes;
  if (!d) return '<span class="dl dl--mute">igual que ' + esc('2024-25') + '</span>';
  const bien = mejorArriba ? d > 0 : d < 0;
  return '<span class="dl dl--' + (bien ? 'ok' : 'bad') + '">' +
    ic(d > 0 ? 'subir' : 'bajar') + (d > 0 ? '+' : '') + nf1.format(d).replace(',0', '') +
    ' vs ' + esc('2024-25') + '</span>';
}

/* La barra de los tres tercios, que es el titular de todo el sistema. */
function barraTercios(t, alto) {
  return '<div class="dist' + (alto ? ' dist--big' : '') + '">' +
    ['cabeza', 'cuerpo', 'cola'].map(k =>
      '<div class="dist__s dist__s--' + k + '" style="width:' + t[k] + '%" title="' + k + ' ' + t[k] + '%">' +
        (t[k] >= 9 ? '<b>' + t[k] + '%</b><span>' + k + '</span>' : '') +
      '</div>').join('') + '</div>';
}

RENDER.iatf = () => {
  const c = campoActual();
  const inf = S.informes.filter(i => i.campo === c.id).find(i => i.lotes);
  const lotesIatf = inf && inf.lotes ? inf.lotes.filter(l => l.tec === 'IATF') : [];
  const ev = Math.round(lotesIatf.reduce((a, l) => a + l.ev, 0));
  const pr = Math.round(lotesIatf.reduce((a, l) => a + l.pr, 0));
  const pctIatf = ev ? Math.round(100 * pr / ev) : 0;

  /* Las jornadas del protocolo en este campo: dia 0, dia 5, dia 7/8 e IATF. */
  const clave = c.n.toUpperCase().split(' ').filter(w => w.length > 3)[0] || c.n.toUpperCase();
  const js = S.jornadas.filter(j => j.act.toUpperCase().includes(clave));

  const html =
    '<div class="grid g4 mb">' +
      kpi('Preñez a la IATF', pctIatf + '%', nf0.format(pr) + ' de ' + nf0.format(ev) + ' inseminadas',
          pctIatf >= 60 ? 'ok' : pctIatf >= 50 ? '' : 'warn', 'jeringa') +
      kpi('Lotes inseminados', String(lotesIatf.length), 'De ' + (inf && inf.lotes ? inf.lotes.length : 0) + ' lotes de la campaña', '', 'manga') +
      kpi('Jornadas en el campo', String(js.length), 'Día 0, día 5, día 7 e IATF', '', 'cal') +
      kpi('Aporte a la cabeza', tercios(c.id).cabeza + '%', 'Lo que la IATF mete en el primer mes', 'gold', 'subir') +
    '</div>' +

    '<div class="grid g-23">' +
      tarjeta('Resultado por lote inseminado', 'Sólo los lotes con IATF',
        lotesIatf.length
          ? '<div class="tw"><table><thead><tr><th>Lote</th><th>Fecha</th><th class="num">Inseminadas</th><th class="num">Preñadas</th><th class="num">%</th></tr></thead><tbody>' +
            lotesIatf.map(l =>
              '<tr><td><b>' + esc(l.n) + '</b></td><td>' + esc(l.fecha || '—') + '</td>' +
              '<td class="num">' + nf0.format(l.ev) + '</td><td class="num">' + nf0.format(l.pr) + '</td>' +
              '<td class="num"><b>' + l.pct + '%</b>' + barra(l.pct, l.pct >= 85 ? 'ok' : l.pct >= 70 ? '' : 'bad') + '</td></tr>').join('') +
            '</tbody></table></div>'
          : vacio('Sin lotes de IATF cargados', 'Este campo todavía no tiene el cierre de la inseminación')) +

      tarjeta('Protocolo en el campo', 'Las jornadas tal como quedaron en el calendario',
        js.length
          ? '<div class="tl">' + js.slice(0, 14).map(j =>
              '<div class="tl__i"><div class="tl__d"></div>' +
              '<div class="tl__f">' + fecha(j.f) + '</div>' +
              '<div class="tl__t">' + esc(j.act) + '</div>' +
              '<div class="tl__m">' + esc(j.resp) + '</div></div>').join('') + '</div>'
          : vacio('Sin jornadas registradas', 'No hay días de trabajo cargados para este campo')) +
    '</div>';

  return { titulo: 'IATF · ' + c.n, sub: 'Inseminación a tiempo fijo · campaña ' + esc(S.camp), html: html };
};

  const av = recalcularAvisos();
  const t = totalesCartera();
  const hoyStr = hoyISO(HOY);
  const trabHoy = S.trabajos.filter(x => x.f === hoyStr || x.estado === 'Hoy');
  const proximos = S.trabajos.filter(x => x.f > hoyStr).sort((a, b) => a.f < b.f ? -1 : 1).slice(0, 5);

  const totPreñadas = S.campos.reduce((s, c) => s + c.resumen.prenadas, 0);

    '<button class="btn btn--sm" data-accion="verAviso" data-i="' + i + '">Ver</button></div>').join('')
    : '<div class="note note--ok">' + ic('check') + '<div>Sin alertas abiertas. Todo lo de la campaña está cerrado.</div></div>';

  const html =
    '<div class="grid g4 mb">' +

function activarBoard() {
  let arrastrando = null;
  $$('#board .tk').forEach(tk => {
    tk.addEventListener('dragstart', () => { arrastrando = tk.dataset.id; tk.classList.add('drag'); });
    tk.addEventListener('dragend', () => { tk.classList.remove('drag'); $$('#board .col').forEach(c => c.classList.remove('over')); });
  });
  $$('#board .col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const t = S.trabajos.find(x => x.id === arrastrando);
      if (!t) return;
      const nuevo = col.dataset.col;
      if (t.estado === nuevo) return;
      t.estado = nuevo;
      if (nuevo === 'Cerrado' && !t.informe) {
        aviso(CAMPO(t.campo).n + ': trabajo cerrado, informe generado', 'ok');
        t.informe = 'auto-' + t.id;
      } else {
        aviso(CAMPO(t.campo).n + ' pasó a ' + nuevo.toLowerCase(), 'ok');
      }
      render();
    });
  });
}

    '<span style="width:8px;height:8px;border-radius:2px;background:' + c.color + ';flex:none"></span>' +
    '<div style="flex:1;min-width:0"><b class="mono" style="font-size:12.5px">' + esc(v.car) + '</b>' +
    '<div class="t-sub">' + esc(cap(v.cat)) + '</div></div>' + tag(t[0], t[1]) + '</div>';
}

RENDER.vientres = () => {
  if (S.ficha !== null) return vistaFicha(S.vientres[S.ficha]);
  const f = S.filtros;
  let vs = enCampo();
  if (f.estado !== 'todos') vs = vs.filter(v => {
    if (f.estado === 'perdida') return perdioPreñez(v);
    if (f.estado === 'baja') return /Baja/.test(v.estado);
    if (f.estado === 'historial') return v.anios === '2';
    return estadoVientre(v) === f.estado;
  });
  if (f.q) { const q = f.q.toLowerCase(); vs = vs.filter(v => v.car.toLowerCase().includes(q) || (v.cat || '').toLowerCase().includes(q)); }

  const base = enCampo();
  const conHistorial = base.filter(v => v.anios === '2').length;
  const perdidas = base.filter(perdioPreñez).length;
  const bajas = base.filter(v => /Baja/.test(v.estado));
  const bajasPreñadas = bajas.filter(v => {
    const ult = v.ev.filter(e => e.camp === '2024');
    return ult.length && estadoPreñez(ult[ult.length - 1].res) === 'prenada';
  }).length;

  const html =
    '<div class="grid g4 mb">' +
      kpi('Fichas del campo', nf0.format(base.length), 'Con historial acumulado por caravana', '', 'vaca') +
      kpi('Con dos campañas', String(conHistorial), 'Historial que ninguna planilla por campaña conserva', 'ok', 'hist') +
      kpi('Preñeces perdidas', String(perdidas), 'Preñadas al eco 30, vacías después', 'bad', 'eco') +
      kpi('Bajas sin motivo', String(bajas.length), bajasPreñadas + ' de ellas salieron preñadas', 'warn', 'alerta') +
    '</div>' +

    '<div class="card mb"><div class="card__b">' +
      '<div class="row" style="align-items:flex-end">' +
        '<div class="field" style="flex:2"><label class="fl" for="fv-q">Buscar por caravana</label>' +
        '<input class="inp" id="fv-q" placeholder="858000031149537" value="' + esc(f.q) + '"></div>' +
        '<div class="field"><label class="fl" for="fv-estado">Estado</label><select class="inp" id="fv-estado">' +
        ['todos|Todos', 'prenada|Preñadas', 'vacia|Vacías', 'perdida|Con pérdida embrionaria', 'historial|Con dos campañas', 'baja|Bajas del programa']
          .map(o => { const [v, n] = o.split('|'); return '<option value="' + v + '"' + (f.estado === v ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<div class="t-sub">' + nf0.format(vs.length) + ' vientres coinciden</div>' +
    '</div></div>' +

    tarjeta('Vientres', 'Cada caravana con su historia completa, campaña tras campaña',
      vs.length ? '<div class="tw"><table><thead><tr>' +
        '<th>Caravana</th><th>Establecimiento</th><th>Categoría / lote</th><th>Campañas</th>' +
        '<th>Última técnica</th><th>Resultado</th><th></th></tr></thead><tbody>' +
        vs.slice(0, 60).map(v => {
          const e = estadoVientre(v), t = TAG_PREÑEZ[e], c = CAMPO(v.est), ult = ultimoEvento(v);
          return '<tr class="clickable" data-accion="verFicha" data-i="' + v._i + '">' +
            '<td><b class="mono">' + esc(v.car) + '</b></td>' +
            '<td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + c.color + ';margin-right:6px"></span>' + esc(c.n) + '</td>' +
            '<td class="t-sub">' + esc(cap(v.cat) || '—') + '</td>' +
            '<td>' + (v.anios === '2' ? tag('gold', '2 campañas') : tag('mute', '1 campaña')) + '</td>' +
            '<td class="t-sub">' + esc(ult ? ult.tipo : '—') + '</td>' +
            '<td>' + tag(t[0], t[1]) + (perdioPreñez(v) ? ' ' + tag('bad', 'perdió') : '') + '</td>' +
            '<td style="width:34px">' + ic('flecha') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (vs.length > 60 ? '<div class="t-sub" style="padding:11px 16px">Mostrando 60 de ' + nf0.format(vs.length) + '. Afiná con los filtros o buscá la caravana.</div>' : '')
        : vacio('Ninguna caravana coincide', 'Probá con otro filtro o buscá la caravana completa.',
            '<button class="btn btn--sm" data-accion="limpiarFiltros">Limpiar filtros</button>'), null, true);

  return { titulo: 'Vientres · ' + campoActual().n, sub: nf0.format(enCampo().length) + ' fichas · historial por caravana',
    acciones:
      '<button class="btn btn--sm btn--p" data-accion="porLista">' + ic('subir') + '<span>Actualizar por lista</span></button>' +
      '<button class="btn btn--sm" data-accion="altaVientre">' + ic('mas') + '<span>Alta</span></button>' +
      '<button class="btn btn--sm" data-accion="cambioCaravana">' + ic('swap') + '<span>Cambio de caravana</span></button>' +
      '<button class="btn btn--sm" data-accion="csvVientres">' + ic('bajar') + '<span>Exportar</span></button>',
    html, luego: () => {
      const q = $('#fv-q');
      if (q) { q.oninput = () => { S.filtros.q = q.value; render(); setTimeout(() => { const n = $('#fv-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); }; }
      const fe = $('#fv-estado'); if (fe) fe.onchange = () => { S.filtros.estado = fe.value; render(); };
    } };
};

/* ---------------- FICHA DEL VIENTRE ---------------- */
function vistaFicha(v) {
  const c = CAMPO(v.est), e = estadoVientre(v), t = TAG_PREÑEZ[e];
  const perdida = perdioPreñez(v);
  const camps = Array.from(new Set(v.ev.map(x => x.camp)));

  const linea = v.ev.map(ev => {
    const est = estadoPreñez(ev.res);
    const mod = est === 'prenada' ? 'ok' : est === 'vacia' || est === 'perdida' ? 'bad' : '';
    const partes = [];
    if (ev.lote) partes.push('Lote: ' + cap(ev.lote));
    if (ev.toro) partes.push('Toro: ' + cap(ev.toro));
    if (ev.eco30 && ev.eco30 !== ev.res) partes.push('Eco 30: ' + normalizar(ev.eco30, 'Resultado de ecografía'));
    return '<div class="tl__i' + (mod ? ' tl__i--' + mod : '') + '"><div class="tl__d"></div>' +
      '<div class="tl__f">' + fecha(ev.f) + ' · campaña ' + esc(ev.camp) + '</div>' +
      '<div class="tl__t">' + esc(ev.tipo) + ' · ' +
      esc(normalizar(ev.res, 'Estado ovárico (DAO)') !== ev.res ? normalizar(ev.res, 'Estado ovárico (DAO)') : normalizar(ev.res, 'Resultado de ecografía')) + '</div>' +
      (partes.length ? '<div class="tl__m">' + esc(partes.join(' · ')) + '</div>' : '') + '</div>';
  }).join('');

  const html =
    '<button class="btn btn--sm mb" data-accion="volverVientres">' + ic('atras') + '<span>Todos los vientres</span></button>' +
    (perdida ? '<div class="note note--bad mb">' + ic('alerta') +
      '<div><b>Perdió la preñez entre el eco de 30 y el de 90 días.</b> Estaba preñada al diagnóstico y llegó vacía al control siguiente. ' +
      'A USD 47,7 la preñez lograda, ésta ya se pagó y no va a dar ternero.</div></div>' : '') +
    (/Baja/.test(v.estado) ? '<div class="note mb">' + ic('alerta') +
      '<div><b>Salió del programa y no quedó registrado por qué.</b> Cargá el motivo para no perder la trazabilidad del rodeo.' +
      ' <button class="btn btn--sm" style="margin-left:8px" data-accion="cargarMotivo" data-i="' + v._i + '">Cargar motivo</button></div></div>' : '') +

    '<div class="grid g-23 mb">' +
      tarjeta('Ficha del animal', 'Identificación electrónica',
        '<div style="display:flex;align-items:center;gap:13px;margin-bottom:15px">' +
        '<div style="width:52px;height:52px;border-radius:14px;background:' + c.color + ';display:flex;align-items:center;justify-content:center;color:#fff;flex:none">' +
        ic('vaca') + '</div>' +
        '<div><div class="mono" style="font-size:19px;font-weight:800;letter-spacing:-.01em">' + esc(v.car) + '</div>' +
        '<div class="t-sub">' + esc(c.n) + ' · ' + esc(c.productor) + '</div></div></div>' +
        '<div class="kv"><span>Categoría / lote</span><b>' + esc(cap(v.cat) || '—') + '</b></div>' +
        '<div class="kv"><span>Estado en el programa</span><b>' + esc(v.estado) + '</b></div>' +
        '<div class="kv"><span>Campañas en el programa</span><b>' + esc(v.anios) + '</b></div>' +
        '<div class="kv"><span>Primera campaña</span><b>' + esc(v.p) + '</b></div>' +
        '<div class="kv"><span>Última campaña</span><b>' + esc(v.u) + '</b></div>' +
        '<div class="kv"><span>Eventos registrados</span><b>' + v.ev.length + '</b></div>' +
        '<div class="kv"><span>Estado reproductivo</span>' + tag(t[0], t[1]) + '</div>' +
        (v.motivo ? '<div class="kv"><span>Motivo de baja</span><b>' + esc(v.motivo) + '</b></div>' : '') +
        '<div class="sep"></div>' +
        '<div class="row">' +
        '<button class="btn btn--sm" data-accion="cambioCaravanaDe" data-i="' + v._i + '">' + ic('swap') + '<span>Cambiar caravana</span></button>' +
        '<button class="btn btn--sm" data-accion="agregarEvento" data-i="' + v._i + '">' + ic('mas') + '<span>Agregar evento</span></button>' +
        '</div>') +
      tarjeta('Historial reproductivo', v.ev.length + ' eventos en ' + camps.length + ' campaña' + (camps.length > 1 ? 's' : ''),
        '<div class="tl">' + linea + '</div>' +
        (v.anios === '2' ? '<div class="note note--ok" style="margin-top:14px">' + ic('hist') +
          '<div>Esta ficha atraviesa dos campañas. En la planilla vieja eran dos archivos distintos y la caravana no se cruzaba sola: había que buscarla a mano en cada uno.</div></div>' : '')) +
    '</div>' +

    tarjeta('Otros vientres del mismo lote', 'Para comparar contra sus compañeras de trabajo',
      '<div class="tw"><table><thead><tr><th>Caravana</th><th>Categoría</th><th>Último evento</th><th>Resultado</th></tr></thead><tbody>' +
      S.vientres.filter(x => x.est === v.est && x.cat === v.cat && x._i !== v._i).slice(0, 8).map(x => {
        const ee = estadoVientre(x), tt = TAG_PREÑEZ[ee], u = ultimoEvento(x);
        return '<tr class="clickable" data-accion="verFicha" data-i="' + x._i + '">' +
          '<td><b class="mono">' + esc(x.car) + '</b></td><td class="t-sub">' + esc(cap(x.cat)) + '</td>' +
          '<td class="t-sub">' + esc(u ? u.tipo + ' · ' + fecha(u.f) : '—') + '</td>' +
          '<td>' + tag(tt[0], tt[1]) + '</td></tr>';
      }).join('') + '</tbody></table></div>', null, true);

  return { titulo: 'Caravana ' + v.car, sub: c.n + ' · ' + cap(v.cat), html };
}

/* ---------------- TOROS ---------------- */
RENDER.toros = () => {
  const ts = torosDelCampo();
  const pos = ts.filter(t => /POSITIV/i.test(t.raspaje));
  const sinRas = ts.filter(t => /no muestreado/i.test(t.raspaje));
  const refugo = ts.filter(t => /REFUGO/i.test(t.obs || ''));
  const aptos = ts.filter(t => ['MB', 'B'].includes(t.sem) && /negativo/i.test(t.raspaje) && !/REFUGO/i.test(t.obs || ''));
  const ORDEN = { MB: 5, B: 4, R: 3, M: 2, E: 1 };
  const rank = ts.slice().sort((a, b) => (ORDEN[b.sem] || 0) - (ORDEN[a.sem] || 0) || (parseFloat(b.ce) || 0) - (parseFloat(a.ce) || 0));

  const html =
    '<div class="grid g4 mb">' +
      kpi('Toros evaluados', String(ts.length), 'Plantel de servicio 2026', '', 'toro') +
      kpi('Aptos sin observaciones', String(aptos.length), Math.round(100 * aptos.length / ts.length) + '% del plantel', aptos.length / ts.length > .5 ? 'ok' : 'warn', 'check') +
      kpi('Positivos a Campylobacter', String(pos.length), pos.length ? 'No pueden entrar al servicio' : 'Ninguno', pos.length ? 'bad' : 'ok', 'alerta') +
      kpi('Sin raspaje ni clasificación', String(sinRas.length + ts.filter(t => !t.sem).length), 'Revisación incompleta', 'warn', 'lupa-doc') +
    '</div>' +

    (pos.length ? pos.map(t => '<div class="note note--bad mb">' + ic('alerta') +
      '<div><b>Toro ' + esc(t.ide) + ' positivo a Campylobacter.</b> Caravana ' + esc(t.caravana) + ', origen ' + esc(t.origen) + '. ' +
      'Condición corporal ' + esc(t.cc || 's/d') + ', escala fenotípica ' + esc(t.fen || 's/d') + ', ' + esc(t.obs || 'sin observaciones') + '. ' +
      'Un portador en el rodeo arruina el entore entero: hay que sacarlo y rastrear con qué lote trabajó.' +
      ' <button class="btn btn--sm" style="margin-left:6px" data-accion="refugar" data-ide="' + esc(t.ide) + '">Sacar del plantel</button></div></div>').join('') : '') +

    '<div class="grid g4 mb">' +
      tarjeta('Por clasificación seminal', 'Aptitud del plantel',
        ['MB', 'B', 'R', 'M', 'E', ''].map(s => {
          const n = ts.filter(t => (t.sem || '') === s).length;
          if (!n) return '';
          const nombres = { MB: 'Muy bueno', B: 'Bueno', R: 'Regular', M: 'Malo', E: 'En estudio', '': 'Sin clasificar' };
          return '<div style="display:flex;align-items:center;gap:10px;padding:5px 0">' +
            '<b style="min-width:92px;font-size:12.5px">' + nombres[s] + '</b>' +
            '<div style="flex:1">' + barra(100 * n / ts.length, s === 'MB' || s === 'B' ? 'ok' : s === '' ? 'bad' : 'warn') + '</div>' +
            '<b class="num" style="width:26px">' + n + '</b></div>';
        }).join('')) +
      tarjeta('Por raza', 'Composición del plantel',
        Object.entries(ts.reduce((m, t) => { const r = normalizar(t.raza, 'Raza'); m[r] = (m[r] || 0) + 1; return m; }, {}))
          .sort((a, b) => b[1] - a[1]).map(([r, n]) =>
          '<div style="display:flex;align-items:center;gap:10px;padding:5px 0">' +
          '<b style="min-width:110px;font-size:12.5px">' + esc(r) + '</b>' +
          '<div style="flex:1">' + barra(100 * n / ts.length) + '</div>' +
          '<b class="num" style="width:26px">' + n + '</b></div>').join('') +
        '<div class="t-sub" style="margin-top:9px">En la planilla venían como AA, aa, RA y HE. El sistema los unifica solo.</div>') +
      tarjeta('Circunferencia escrotal', 'Promedio del plantel',
        (() => { const v = ts.map(t => parseFloat(t.ce)).filter(x => !isNaN(x));
          const prom = v.reduce((a, b) => a + b, 0) / v.length;
          return '<div class="kpi__v" style="font-size:31px;margin:0">' + nf1.format(prom) + ' cm</div>' +
            '<div class="t-sub">Mínimo ' + Math.min.apply(null, v) + ' · máximo ' + Math.max.apply(null, v) + ' · medidos ' + v.length + ' de ' + ts.length + '</div>' +
            '<div class="sep"></div>' + barra(100 * (prom - 30) / 20, 'ok') +
            '<div class="t-sub" style="margin-top:7px">Por encima de 32 cm se considera apto para la categoría.</div>'; })()) +
      tarjeta('Origen del plantel', 'De dónde vienen los toros',
        Object.entries(ts.reduce((m, t) => { const o = t.origen || 'Sin dato'; m[o] = (m[o] || 0) + 1; return m; }, {}))
          .sort((a, b) => b[1] - a[1]).slice(0, 5).map(([o, n]) =>
          '<div style="display:flex;gap:9px;padding:5px 0;font-size:12.5px"><span style="flex:1;font-weight:600">' + esc(o) + '</span><b>' + n + '</b></div>').join('')) +
    '</div>' +

    tarjeta('Ranking de aptitud', 'Ordenado por clasificación seminal y circunferencia escrotal',
      '<div class="tw"><table><thead><tr><th>#</th><th>Caravana</th><th>Raza</th><th>Boca</th>' +
      '<th class="num">CE</th><th class="num">CC</th><th class="num">Fenotipo</th><th>Seminal</th>' +
      '<th>Raspaje</th><th>Origen</th><th>Observaciones</th><th>Rodeo</th></tr></thead><tbody>' +
      rank.map((t, i) => {
        const semTag = { MB:['ok','Muy bueno'], B:['ok','Bueno'], R:['warn','Regular'], M:['bad','Malo'], E:['info','En estudio'] }[t.sem] || ['mute', 'Sin clasificar'];
        const ras = /POSITIV/i.test(t.raspaje) ? tag('bad', 'Positivo') : /negativo/i.test(t.raspaje) ? tag('ok', 'Negativo') : tag('warn', 'Sin muestrear');
        return '<tr class="clickable" data-accion="verToro" data-ide="' + esc(t.ide) + '">' +
          '<td class="t-sub">' + (i + 1) + '</td>' +
          '<td><b class="mono">' + esc(t.ide) + '</b><div class="t-sub mono">' + esc(t.caravana || '—') + '</div></td>' +
          '<td class="t-sub">' + esc(normalizar(t.raza, 'Raza')) + '</td>' +
          '<td class="t-sub">' + esc(t.boca || '—') + '</td>' +
          '<td class="num">' + esc(t.ce || '—') + '</td><td class="num">' + esc(t.cc || '—') + '</td>' +
          '<td class="num">' + esc(t.fen || '—') + '</td>' +
          '<td>' + tag(semTag[0], semTag[1]) + '</td><td>' + ras + '</td>' +
          '<td class="t-sub">' + esc(t.origen) + '</td>' +
          '<td class="t-sub">' + (t.obs ? (/REFUGO/i.test(t.obs) ? tag('bad', t.obs) : esc(t.obs)) : '—') + '</td>' +
          '<td>' + (t.asignado ? tag('gold', CAMPO(t.asignado) ? CAMPO(t.asignado).n : t.asignado) : '<button class="btn btn--sm" data-accion="asignarToro" data-ide="' + esc(t.ide) + '">Asignar</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div>', null, true);

  return { titulo: 'Toros · ' + campoActual().n, sub: ts.length + ' evaluados · ' + aptos.length + ' aptos sin observaciones',
    acciones: '<button class="btn btn--sm" data-accion="csvToros">' + ic('bajar') + '<span>Exportar</span></button>', html };
};

  const html =
    '<div class="grid g4 mb">' +
      kpi('Informes del campo', String(DEL.length), 'Evaluaciones, IATF, DAO y entore', '', 'inf') +
      kpi('Enviados al productor', String(DEL.filter(i => i.estado === 'Enviado').length), 'Con acuse del cliente', 'ok', 'check') +
      kpi('En borrador', String(DEL.filter(i => i.estado !== 'Enviado').length), 'Listos para revisar y enviar', 'warn', 'lupa-doc') +
      kpi('Páginas generadas', String(DEL.reduce((a, i) => a + i.paginas, 0)), 'Antes se armaban a mano una por una', 'gold', 'libro') +
    '</div>' +
    '<div class="note note--info mb">' + ic('inf') +
      '<div><b>El informe sale de los datos que ya están cargados.</b> Totales por lote, evaluación por tecnología aplicada, ciclicidad ovárica y consideraciones finales: lo mismo que hoy se arma a mano desde el Excel Madre, generado al cerrar el trabajo.</div></div>' +
    tarjeta('Informes emitidos', 'Ordenados por fecha',
      !DEL.length ? vacio('Sin informes todavía', 'Cuando se cierre un trabajo de manga, el informe aparece acá') :
      '<div class="tw"><table><thead><tr><th>Informe</th><th>Técnica</th>' +
      '<th>Fecha</th><th class="num">Vientres</th><th class="num">Preñez</th><th>Estado</th><th></th></tr></thead><tbody>' +
      DEL.slice().sort((a, b) => a.f < b.f ? 1 : -1).map(i => {
        return '<tr class="clickable" data-accion="verInforme" data-id="' + i.id + '">' +
          '<td><b>' + esc(i.t) + '</b><div class="t-sub">' + i.paginas + ' páginas</div></td>' +
          '<td class="t-sub">' + esc(i.tec) + '</td><td class="t-sub">' + fecha(i.f) + '</td>' +
          '<td class="num">' + nf0.format(i.tot.entoradas) + '</td>' +

  return { titulo: 'Informes · ' + campoActual().n, sub: DEL.length + ' documentos de la campaña ' + S.camp + ',',
    acciones: '<button class="btn btn--sm btn--g" data-accion="generarInforme">' + ic('mas') + '<span>Generar informe</span></button>', html };
};

function vistaInforme(i) {
  const c = CAMPO(i.campo);
  const bloque = (t, cuerpo) => '<div style="margin-bottom:20px"><h3 style="font-size:14px;margin-bottom:10px;color:var(--brand)">' + esc(t) + '</h3>' + cuerpo + '</div>';
  const tablaPct = (filas, colN) => '<div class="tw"><table><thead><tr><th>' + esc(colN) + '</th><th class="num">Total</th><th class="num">Preñadas</th><th class="num">%</th><th></th></tr></thead><tbody>' +
    filas.map(f => '<tr><td><b>' + esc(f.n) + '</b></td><td class="num">' + nf0.format(f.tot || f.ev) + '</td>' +
      '<td class="num">' + nf0.format(f.pr != null ? f.pr : '—') + '</td><td class="num"><b>' + f.pct + '%</b></td>' +
      '<td style="width:110px">' + barra(f.pct, f.pct >= 85 ? 'ok' : f.pct >= 70 ? '' : 'warn') + '</td></tr>').join('') +
    '</tbody></table></div>';

  let cuerpo = '';
  cuerpo += bloque('1 · Evaluación general',
    '<div class="grid g4">' +
      kpi('Entoradas', nf0.format(i.tot.entoradas), 'Vientres del trabajo') +
      kpi('Evaluadas', nf0.format(i.tot.evaluadas), 'Pasaron por el tubo') +
      kpi('Preñadas', nf0.format(i.tot.prenadas), 'Confirmadas a la ecografía', 'ok') +
      kpi('Preñez', nf1.format(i.tot.pct).replace(',0', '') + '%', 'Sobre evaluadas', i.tot.pct >= 85 ? 'ok' : i.tot.pct >= 70 ? '' : 'warn') +
    '</div>' +
    (i.dist ? '<div style="margin-top:15px"><div class="stack">' +
      '<i style="width:' + i.dist.cabeza + '%;background:var(--ok)"></i>' +
      '<i style="width:' + i.dist.cuerpo + '%;background:var(--gold)"></i>' +
      '<i style="width:' + i.dist.cola + '%;background:var(--bad)"></i></div>' +
      '<div class="leg"><span><i style="background:var(--ok)"></i>Cabeza ' + i.dist.cabeza + '%</span>' +
      '<span><i style="background:var(--gold)"></i>Cuerpo ' + i.dist.cuerpo + '%</span>' +
      '<span><i style="background:var(--bad)"></i>Cola ' + i.dist.cola + '%</span></div>' +
      '<div class="t-sub" style="margin-top:7px">Cuanto más cargada la cabeza, más parejo y temprano va a ser el próximo parto.</div></div>' : ''));

  if (i.tecnologia) cuerpo += bloque('2 · Evaluación por tecnología aplicada', tablaPct(i.tecnologia, 'Técnica'));
  if (i.ciclicidad) cuerpo += bloque('3 · Evaluación por ciclicidad ovárica', tablaPct(i.ciclicidad, 'Estado ovárico'));
  if (i.lotes) cuerpo += bloque('4 · Resultados lote por lote',
    '<div class="tw"><table><thead><tr><th>Lote</th><th>Técnica</th><th>Fecha</th><th class="num">Evaluadas</th><th class="num">Preñadas</th><th class="num">%</th><th></th></tr></thead><tbody>' +
    i.lotes.map(l => '<tr><td><b>' + esc(l.n) + '</b></td>' +
      '<td>' + tag(l.tec === 'IATF' ? 'info' : l.tec === 'DAO' ? 'gold' : 'mute', l.tec) + '</td>' +
      '<td class="t-sub">' + esc(l.fecha) + '</td><td class="num">' + nf0.format(l.ev) + '</td>' +
      '<td class="num">' + nf0.format(l.pr) + '</td><td class="num"><b>' + l.pct + '%</b></td>' +
      '<td style="width:110px">' + barra(l.pct, l.pct >= 85 ? 'ok' : l.pct >= 70 ? '' : 'warn') + '</td></tr>').join('') +
    '</tbody></table></div>');
  if (i.toros) cuerpo += bloque('Análisis por toro', tablaPct(i.toros, 'Toro'));
  if (i.respuesta) cuerpo += bloque('Respuesta al tratamiento hormonal',
    '<div class="tw"><table><thead><tr><th>Momento</th><th class="num">Vientres</th><th class="num">% del lote</th></tr></thead><tbody>' +
    i.respuesta.map(r => '<tr><td><b>' + esc(r.n) + '</b></td><td class="num">' + r.v + '</td><td class="num">' + r.pct + '%</td></tr>').join('') +
    '</tbody></table></div>');
  if (i.momento) cuerpo += bloque('Preñez por momento de inseminación', tablaPct(i.momento.map(m => ({ n: m.n, tot: '—', pr: m.pr, pct: m.pct })), 'Momento'));
  if (i.dao) cuerpo += bloque('Diagnóstico de actividad ovárica',
    '<div class="tw"><table><thead><tr><th>Estado</th><th class="num">Vacas</th><th class="num">%</th><th></th></tr></thead><tbody>' +
    i.dao.map(d => '<tr><td><b>' + esc(d.n) + '</b></td><td class="num">' + d.v + '</td><td class="num">' + d.pct + '%</td>' +
      '<td style="width:130px">' + barra(d.pct, /profundo/i.test(d.n) ? 'bad' : /superficial/i.test(d.n) ? 'warn' : 'ok') + '</td></tr>').join('') +
    '</tbody></table></div>');
  if (i.rodeo) cuerpo += bloque('Situación del rodeo',
    '<div class="tw"><table><thead><tr><th>Estado</th><th class="num">Vacas</th><th class="num">%</th></tr></thead><tbody>' +
    i.rodeo.map(d => '<tr><td><b>' + esc(d.n) + '</b></td><td class="num">' + nf0.format(d.v) + '</td><td class="num">' + d.pct + '%</td></tr>').join('') +
    '</tbody></table></div>');
  if (i.origen) cuerpo += bloque('Comparativa por origen de los vientres',
    tablaPct(i.origen, 'Origen') +
    '<div style="margin-top:13px"><div class="tw"><table><thead><tr><th>Procedencia</th><th class="num">Total</th><th class="num">% preñez</th><th></th></tr></thead><tbody>' +
    i.detalle.map(d => '<tr><td><b>' + esc(d.n) + '</b></td><td class="num">' + nf0.format(d.tot) + '</td>' +
      '<td class="num"><b>' + d.pct + '%</b></td><td style="width:130px">' + barra(d.pct, d.pct >= 85 ? 'ok' : d.pct >= 75 ? '' : 'warn') + '</td></tr>').join('') +
    '</tbody></table></div></div>');
  if (i.costo) cuerpo += bloque('Costo de la inseminación',
    '<div class="tw"><table><thead><tr><th>Concepto</th><th class="num">Costo total</th><th class="num">Por vaca inseminada</th><th class="num">Por preñez lograda</th></tr></thead><tbody>' +
    [['Hormonas', i.costo.hormonas], ['Honorarios Reprogen', i.costo.reprogen], ['Semen', i.costo.semen]].map(([n, v]) =>
      '<tr><td><b>' + n + '</b></td><td class="num">' + usd(v) + '</td>' +
      '<td class="num">' + usd(+(v / i.tot.evaluadas).toFixed(1)) + '</td>' +
      '<td class="num">' + usd(+(v / i.tot.prenadas).toFixed(1)) + '</td></tr>').join('') +
    '<tr style="background:var(--panel-2)"><td><b>Total</b></td><td class="num"><b>' + usd(i.costo.total) + '</b></td>' +
    '<td class="num"><b>' + usd(i.costo.porIA) + '</b></td><td class="num"><b>' + usd(i.costo.porPrenez) + '</b></td></tr>' +
    '</tbody></table></div>' +
    '<div class="grid g3" style="margin-top:14px">' +
      kpi('Costo por preñez', usd(i.costo.porPrenez), 'Equivale a ' + i.costo.kgTernero + ' kg de ternero destetado') +
      kpi('Ingreso extra por ternero', usd(i.costo.ingresoExtra), '25 kg más al destete que el servicio natural', 'ok') +
      kpi('Margen por ternero', usd(i.costo.margen), 'La IATF se paga sola y deja', 'gold') +
    '</div>');

  cuerpo += '<div class="note note--ok">' + ic('libro') + '<div><b>Consideraciones finales.</b> ' + esc(i.cierre) + '</div></div>' +
    '<div style="text-align:center;margin-top:22px;color:var(--ink-3);font-weight:800;letter-spacing:.1em;font-size:12px">SIN MÁS Y A LA ORDEN · REPROGEN</div>';

  return { titulo: i.t, sub: c.n + ' · ' + c.productor + ' · ' + fecha(i.f, true),
    acciones:
      '<button class="btn btn--sm" data-accion="volverInformes">' + ic('atras') + '<span>Volver</span></button>' +
      '<button class="btn btn--sm" data-accion="csvInforme" data-id="' + i.id + '">' + ic('bajar') + '<span>Exportar</span></button>' +
      '<button class="btn btn--sm btn--p" data-accion="enviarInforme" data-id="' + i.id + '">' + ic('flecha') + '<span>Enviar al productor</span></button>',
    html: '<div class="card"><div class="card__b">' + cuerpo + '</div></div>' };
}

/* ---------------- ANALÍTICA ---------------- */
RENDER.analitica = () => {
  const porToro = preñezPorToro(), porDAO = preñezPorDAO();
  const perdidas = enCampo().filter(perdioPreñez);
  const bajas = enCampo().filter(v => /Baja/.test(v.estado));
  const bajasPreñadas = bajas.filter(v => {
    const e24 = v.ev.filter(e => e.camp === '2024');
    return e24.length && estadoPreñez(e24[e24.length - 1].res) === 'prenada';
  });
  const conDos = enCampo().filter(v => v.anios === '2');
  const repetidoras = conDos.filter(v => {
    const r = v.ev.map(e => estadoPreñez(e.res));
    return r.filter(x => x === 'prenada').length >= 2;
  });
  const campoOrden = S.campos.slice().sort((a, b) => b.resumen.pct - a.resumen.pct);
  const problemas = VOCABULARIO.reduce((s, v) => s + Object.keys(v.alias).length, 0);

  const html =
    '<div class="grid g4 mb">' +
      kpi('Preñez de la cartera', Math.round(100 * S.campos.reduce((s, c) => s + c.resumen.prenadas, 0) / S.campos.reduce((s, c) => s + c.resumen.evaluadas, 0)) + '%',
          'Sobre ' + nf0.format(S.campos.reduce((s, c) => s + c.resumen.evaluadas, 0)) + ' vientres evaluados', 'ok', 'eco') +
      kpi('Pérdida embrionaria', pct(100 * perdidas.length / Math.max(preñadasAl30().length, 1)),
          perdidas.length + ' de ' + preñadasAl30().length + ' preñeces caídas entre eco 30 y 90', 'bad', 'alerta') +
      kpi('Repiten preñez', pct(100 * repetidoras.length / Math.max(conDos.length, 1)),
          repetidoras.length + ' de ' + conDos.length + ' con dos campañas', 'ok', 'hist') +
      kpi('Valores mal escritos', String(problemas), 'Variantes que el sistema unifica solo', 'warn', 'tag') +
    '</div>' +

    '<div class="grid g2 mb">' +
      tarjeta('Preñez por toro', 'Sobre los vientres cargados en el sistema',
        porToro.length ? porToro.map(t =>
          '<div style="display:flex;align-items:center;gap:11px;padding:7px 0">' +
          '<b style="min-width:100px;font-size:13px">' + esc(t.n) + '</b>' +
          '<div style="flex:1">' + barra(t.pct, t.pct >= 85 ? 'ok' : t.pct >= 70 ? '' : 'warn') + '</div>' +
          '<b class="num" style="width:40px">' + t.pct + '%</b>' +
          '<span class="t-sub num" style="width:74px">' + t.pr + '/' + t.tot + '</span></div>').join('') +
          '<div class="note" style="margin-top:12px">' + ic('toro') +
          '<div>Entre el mejor y el peor toro hay <b>' + (porToro[0].pct - porToro[porToro.length - 1].pct) +
          ' puntos de preñez</b>. Sobre un lote de 250 vacas son ' +
          Math.round(250 * (porToro[0].pct - porToro[porToro.length - 1].pct) / 100) + ' terneros de diferencia.</div></div>'
          : vacio('Sin datos de toro', 'Cargá trabajos con toro asignado.')) +

      tarjeta('Preñez según actividad ovárica', 'Con el vocabulario ya unificado',
        porDAO.length ? porDAO.map(d =>
          '<div style="display:flex;align-items:center;gap:11px;padding:7px 0">' +
          '<b style="min-width:150px;font-size:13px">' + esc(d.n) + '</b>' +
          '<div style="flex:1">' + barra(d.pct, /profundo/i.test(d.n) ? 'warn' : /superficial/i.test(d.n) ? 'bad' : 'ok') + '</div>' +
          '<b class="num" style="width:40px">' + d.pct + '%</b>' +
          '<span class="t-sub num" style="width:74px">' + d.pr + '/' + d.tot + '</span></div>').join('') +
          '<div class="note note--info" style="margin-top:12px">' + ic('eco') +
          '<div>El anestro profundo con destete precoz preña casi igual que una vaca ciclando. La que peor termina es la de anestro superficial, que hoy no recibe ningún tratamiento.</div></div>'
          : vacio('Sin datos de DAO', 'Cargá trabajos con diagnóstico de actividad ovárica.')) +
    '</div>' +

    '<div class="grid g2 mb">' +
      tarjeta('Dónde se van las preñeces', 'Entre el diagnóstico y el parto',
        '<div class="grid g3" style="margin-bottom:14px">' +
          kpi('Perdidas', String(perdidas.length), 'Reabsorción o vacía al control', 'bad') +
          kpi('Costo hundido', usd(Math.round(perdidas.length * 47.7)), 'A USD 47,7 la preñez lograda', 'bad') +
          kpi('Terneros menos', String(perdidas.length), 'A USD 75 de ingreso cada uno', 'warn') +
        '</div>' +
        (perdidas.length ? '<div class="tw"><table><thead><tr><th>Caravana</th><th>Establecimiento</th><th>Toro</th><th>Eco 30</th><th>Control siguiente</th></tr></thead><tbody>' +
          perdidas.slice(0, 8).map(v => {
            const e30 = v.ev.find(x => /30/.test(x.tipo)), fin = v.ev[v.ev.length - 1];
            return '<tr class="clickable" data-accion="verFicha" data-i="' + v._i + '">' +
              '<td><b class="mono">' + esc(v.car) + '</b></td><td class="t-sub">' + esc(CAMPO(v.est).n) + '</td>' +
              '<td class="t-sub">' + esc(cap(e30 && e30.toro || '—')) + '</td>' +
              '<td>' + tag('ok', 'Preñada') + '</td>' +
              '<td>' + tag('bad', esc(normalizar(fin.res, 'Resultado de ecografía'))) + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '')) +

      tarjeta('Retención del rodeo', 'Qué pasa con los vientres entre campañas',
        '<div class="grid g2" style="margin-bottom:14px">' +
          kpi('Bajas del programa', String(bajas.length), 'No continuaron la campaña siguiente', 'warn') +
          kpi('Salieron preñadas', String(bajasPreñadas.length),
              pct(100 * bajasPreñadas.length / Math.max(bajas.length, 1)) + ' de las bajas', 'bad') +
        '</div>' +
        '<div class="note note--bad">' + ic('alerta') +
        '<div><b>La mitad de las bajas se va preñada, y ninguna tiene motivo cargado.</b> ' +
        'Una vaca vacía que sale del rodeo es una decisión de manejo. Una preñada que sale sin registro puede ser venta, muerte o error de lectura, y hoy no hay forma de distinguirlo. ' +
        'Con el motivo obligatorio al dar la baja, esta pregunta se responde sola el año que viene.</div></div>' +
        '<div class="sep"></div>' +
        '<div class="kv"><span>Vientres con dos campañas</span><b>' + conDos.length + '</b></div>' +
        '<div class="kv"><span>Preñadas las dos veces</span><b>' + repetidoras.length + '</b></div>' +
        '<div class="kv"><span>Tasa de repetición</span><b>' + pct(100 * repetidoras.length / Math.max(conDos.length, 1)) + '</b></div>') +
    '</div>' +

    '<div class="grid g2">' +
      tarjeta('Ranking de establecimientos', 'Preñez final de la campaña 2025-26',
        '<div class="tw"><table><thead><tr><th>#</th><th>Establecimiento</th><th class="num">Vientres</th><th class="num">Preñez</th><th></th></tr></thead><tbody>' +
        campoOrden.map((c, i) => '<tr class="clickable" data-accion="verCampo" data-id="' + c.id + '">' +
          '<td class="t-sub">' + (i + 1) + '</td><td><b>' + esc(c.n) + '</b><div class="t-sub">' + esc(c.productor) + '</div></td>' +
          '<td class="num">' + nf0.format(c.resumen.entoradas) + '</td>' +
          '<td class="num"><b>' + c.resumen.pct + '%</b></td>' +
          '<td style="width:120px">' + barra(c.resumen.pct, c.resumen.pct >= 85 ? 'ok' : c.resumen.pct >= 75 ? '' : 'warn') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="note" style="margin-top:12px">' + ic('graf') +
        '<div>Villa Lucero preñó ' + (campoOrden[0].resumen.pct - campoOrden[campoOrden.length - 1].resumen.pct) +
        ' puntos más que el último de la lista, con el mismo protocolo y el mismo equipo. Ahí hay una conversación técnica con el productor.</div></div>', null, false) +

      tarjeta('Calidad del dato', 'Lo que el vocabulario controlado arregla solo',
        VOCABULARIO.map(v =>
          '<div style="padding:9px 0;border-bottom:1px solid var(--line-2)">' +
          '<b style="font-size:13px">' + esc(v.campo) + '</b>' +
          '<div class="t-sub" style="margin:4px 0 6px">Valores admitidos: ' + v.validos.join(' · ') + '</div>' +
          '<div class="chips">' + Object.keys(v.alias).map(a =>
            '<span class="chip" style="cursor:default"><b style="color:var(--bad)">' + esc(a) + '</b> ' + ic('flecha') + ' ' + esc(v.alias[a]) + '</span>').join('') + '</div></div>').join('') +
        '<div class="note" style="margin-top:12px">' + ic('tag') +
        '<div>En la planilla de El Castillo, <b>1ERA ITAF</b> (288 animales) y <b>1ERA IATF</b> (282) son lo mismo mal tipeado: una cohorte de 570 partida al medio. Cualquier informe armado sobre eso miente.</div></div>') +
    '</div>';

  return { titulo: 'Analítica · ' + campoActual().n, sub: 'Campaña 2025-26 · ' + nf0.format(S.vientres.length) + ' fichas analizadas',
    acciones: '<button class="btn btn--sm" data-accion="csvAnalitica">' + ic('bajar') + '<span>Exportar</span></button>', html };
};

    acciones: '<button class="btn btn--sm" data-accion="csvHonorarios">' + ic('bajar') + '<span>Exportar</span></button>',
    html, luego: () => {
      const hc = $('#h-campo'); if (hc) hc.onchange = () => { S.campo = hc.value; render(); };
      ['hon', 'ext', 'via'].forEach(k => {
        const el = $('#h-' + k); if (!el) return;
        el.oninput = () => {
          const map = { hon: 'hon', ext: 'extra', via: 'viatico' };
          const v = parseFloat(el.value); if (isNaN(v)) return;
          S.tarifas[map[k]] = v; render();
          setTimeout(() => { const n = $('#h-' + k); if (n) n.focus(); }, 0);
        };
      });
    } };
};

        '</select></div></div>' +
        '<div class="row">' +
        '<div class="field"><label class="fl" for="al-origen">Origen</label><select class="inp" id="al-origen">' +

        '</select></div>' +

        const nuevo = {
          _i: S.vientres.length, car: car.replace(/\s/g, ''), est: campoId,

  cambioCaravana: () => ACCIONES.cambioCaravanaDe({ i: 0 }),
  /* Actualizacion por lista: se pega la columna de caravanas de la manga y
     cada una se cruza contra la base del campo. Las que no estan se dan de
     alta, asi la lista del dia entra completa de una sola vez. */
  porLista: () => {
    const c = campoActual();
    modal({
      titulo: 'Actualizar por lista de caravanas', sub: c.n + ' · campaña ' + S.camp, ancho: true,
      cuerpo:
        '<div class="note note--info">' + ic('subir') +
        '<div>Pegá la columna de caravanas tal como sale de la manga, una por línea. Se cruzan contra las ' +
        nf0.format(enCampo().length) + ' fichas del campo y se les anexa el evento.</div></div>' +
        '<div class="grid g2" style="margin-top:13px">' +
          '<div class="field"><label class="fl" for="pl-tipo">Evento</label><select class="inp" id="pl-tipo">' +
          ['Eco 30 días', 'Eco 90 días', 'Eco final', 'DAO', 'IATF'].map(x => '<option>' + x + '</option>').join('') +
          '</select></div>' +
          '<div class="field"><label class="fl" for="pl-res">Resultado</label><select class="inp" id="pl-res">' +
          ['Cabeza', 'Cuerpo', 'Cola', 'Vacía', 'Ciclando'].map(x => '<option>' + x + '</option>').join('') +
          '</select></div>' +
        '</div>' +
        '<div class="field"><label class="fl" for="pl-car">Caravanas</label>' +
        '<textarea class="inp mono" id="pl-car" rows="7" placeholder="858000049807986&#10;858000049808012&#10;858000049808144"></textarea></div>',
      acciones: [{ txt: 'Cancelar' }, { txt: 'Cruzar y actualizar', tipo: 'p', icono: 'check', fn: () => {
        const crudo = (($('#pl-car') || {}).value || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
        if (!crudo.length) { aviso('No pegaste ninguna caravana', 'bad'); return; }
        const tipo = ($('#pl-tipo') || {}).value || 'Eco final';
        const res = ($('#pl-res') || {}).value || 'Cabeza';
        const base = enCampo();
        let tocadas = 0, altas = 0, repes = 0;
        const vistas = {};
        crudo.forEach(car => {
          if (vistas[car]) { repes++; return; }
          vistas[car] = 1;
          /* La caravana anterior tambien encuentra: por eso el cambio no pierde datos. */
          const v = base.find(x => x.car === car || x.carAnterior === car);
          const ev = { f: hoyISO(HOY), tipo: tipo, camp: S.camp, lote: '', toro: '', eco30: '', res: res };
          if (v) { v.ev.push(ev); tocadas++; }
          else {
            S.vientres.push({ _i: S.vientres.length, car: car, est: S.est, cat: 'Sin lote',
              estado: 'Activa (' + S.camp + ') - ingresó este año', anios: '1', p: '2026', u: '2026', ev: [ev] });
            altas++;
          }
        });
        aviso(tocadas + ' fichas actualizadas' + (altas ? ' · ' + altas + ' altas' : ''), 'ok');
        setTimeout(() => modal({
          titulo: 'Lista cruzada', sub: c.n + ' · ' + tipo + ' · ' + res,
          cuerpo:
            '<div class="kv"><span>Caravanas en la lista</span><b>' + crudo.length + '</b></div>' +
            '<div class="kv"><span>Fichas actualizadas</span><b>' + tocadas + '</b></div>' +
            '<div class="kv"><span>Altas nuevas</span><b>' + altas + '</b></div>' +
            '<div class="kv"><span>Repetidas en la lista</span><b>' + repes + '</b></div>' +
            (altas ? '<div class="note">' + ic('alerta') + '<div>' +
              (altas === 1 ? 'La que no estaba quedó dada de alta' : 'Las ' + altas + ' que no estaban quedaron dadas de alta') +
              ' en ' + esc(c.n) + ', para revisarles el lote después.</div></div>' : '')
        }), 80);
        S.ficha = null; render();
      } }]
    });
  },

  cambioCaravanaDe: d => {
    const v = S.vientres[+d.i];
    modal({
      titulo: 'Cambio de caravana', sub: 'Re-identificación sin perder el historial',
      cuerpo:
        '<div class="note note--info">' + ic('swap') +
        '<div>Cuando un animal cambia de caravana electrónica, la ficha se mantiene entera bajo la identificación nueva. La vieja queda registrada como referencia, para que el historial no se corte.</div></div>' +
        '<div class="field" style="margin-top:14px"><label class="fl" for="cc-vieja">Caravana actual</label>' +
        '<input class="inp mono" id="cc-vieja" value="' + esc(v.car) + '"></div>' +
        '<div class="field"><label class="fl" for="cc-nueva">Caravana nueva</label>' +
        '<input class="inp mono" id="cc-nueva" placeholder="858000000000000" maxlength="15"></div>' +
        '<div class="field"><label class="fl" for="cc-motivo">Motivo</label><select class="inp" id="cc-motivo">' +
        ['Caravana perdida', 'Caravana ilegible', 'Recambio por rotura', 'Re-identificación SNIG'].map(x => '<option>' + x + '</option>').join('') +
        '</select></div>' +
        '<div class="t-sub">La ficha conserva ' + v.ev.length + ' eventos y ' + v.anios + ' campaña' + (v.anios === '2' ? 's' : '') + ' de historial.</div>',
