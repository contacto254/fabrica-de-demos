<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Austrey · customERP</title>
<meta name="description" content="Sistema de gestión agrícola y ganadera de Austrey SA — chacras, plan de siembra, labores, hacienda, feedlot, granos y finanzas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B5533'/%3E%3Cpath d='M8 22c6-1 10-5 11-13' stroke='%23C98A1E' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M19 9c-6 0-9 3-9 7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F7F2; --panel:#FFFFFF; --panel-2:#FAFCF9;
  --ink:#14281C; --ink-2:#4B6355; --ink-3:#83998B;
  --line:#DFE8DF; --line-2:#EDF2EC;
  --brand:#2C7A4B; --brand-deep:#1B5533; --brand-soft:#E3F1E7; --brand-2:#4E9A67;
  --gold:#C08319; --gold-soft:#FAF0DA;
  --warn:#D9971A; --warn-soft:#FCF2DC;
  --bad:#C4544A; --bad-soft:#FAE7E4;
  --info:#37719E; --info-soft:#E6EFF6;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(20,40,28,.05);
  --sh-pop:0 14px 40px rgba(20,40,28,.18);
  --nav-w:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--brand-deep)}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-lg{width:1.5em;height:1.5em}
:focus-visible{outline:2.5px solid var(--brand-2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estructura ---------- */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:none;background:var(--brand-deep);color:#DCEFE1;
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;
}
.nav-top{padding:16px 14px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.nav-top b{display:block;font-size:16px;color:#fff;letter-spacing:-.015em;line-height:1.1}
.nav-top span{display:block;font-size:11px;color:#8FBFA1;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav-group{margin-top:14px;padding:0 8px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#79AE8D;font-weight:700}
.nav .item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
  color:#CBE6D4;text-decoration:none;font-weight:600;font-size:13.6px;cursor:pointer;
  transition:background .14s,color .14s;border:0;background:none;width:100%;text-align:left;
}
.nav .item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav .item.on{background:var(--brand);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav .badge{margin-left:auto;background:var(--gold);color:#3A2705;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.nav-foot{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#8FBFA1}
.nav-foot b{color:#fff;display:block;font-size:13px}

.main{flex:1;min-width:0;margin-left:var(--nav-w);display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:rgba(243,247,242,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.top h1{font-size:19px}
.top .sub{font-size:12.5px;color:var(--ink-3);font-weight:600}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;color:var(--ink-3);cursor:pointer;font-size:13px;font-weight:600;
  transition:border-color .15s,box-shadow .15s;
}
.search:hover{border-color:var(--brand-2);box-shadow:var(--sh)}
.search kbd{background:var(--line-2);border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;font-weight:700;color:var(--ink-2)}
.view{padding:18px 20px 60px;max-width:1500px;width:100%}
.hide{display:none!important}

/* ---------- controles ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:var(--r);padding:7px 13px;font-weight:700;font-size:13.4px;cursor:pointer;
  transition:background .14s,border-color .14s,transform .08s;box-shadow:var(--sh);
}
.btn:hover{background:var(--panel-2);border-color:#CBDCCD}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2705}
.btn.gold:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:12.4px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#EED6D2}
.btn.danger:hover{background:var(--bad-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;
  font-size:13.6px;width:100%;transition:border-color .15s;
}
.inp:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.seg{display:inline-flex;background:var(--line-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 13px;border-radius:999px;font-size:12.8px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background .14s,color .14s}
.seg button.on{background:var(--panel);color:var(--brand-deep);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.6px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--brand-soft);border-color:#B9DCC6;color:var(--brand-deep)}

/* ---------- tarjetas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 17px 10px}
.card-h h3{font-size:15px}
.card-h .sub{font-size:12.2px;color:var(--ink-3);font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.card-b{padding:0 17px 16px}
.card-b.pad{padding:4px 17px 17px}
.grid{display:grid;gap:15px;min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:15px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .lbl{font-size:11.6px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;overflow-wrap:anywhere;font-weight:800;letter-spacing:-.025em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:700;color:var(--ink-3)}
.kpi .foot{font-size:12.2px;color:var(--ink-2);font-weight:600;margin-top:2px}
.kpi .spark{position:absolute;right:10px;bottom:8px;opacity:.5}
.kpi.tap{cursor:pointer;transition:border-color .14s,transform .1s}
.kpi.tap:hover{border-color:var(--brand-2);transform:translateY(-1px)}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line-2)}
table{border-collapse:collapse;width:100%;font-size:13.4px}
th{
  text-align:left;font-size:11.4px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:700;padding:9px 11px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--brand-deep)}
td{padding:9px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.tap{cursor:pointer}
tbody tr.tap:hover{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.str{font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.8px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--brand-soft);color:var(--brand-deep)}
.t-warn{background:var(--warn-soft);color:#8A5E07}
.t-bad{background:var(--bad-soft);color:#8E2F26}
.t-info{background:var(--info-soft);color:#22506F}
.t-mute{background:var(--line-2);color:var(--ink-2)}
.t-gold{background:var(--gold-soft);color:#7A5208}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bar{height:7px;background:var(--line-2);border-radius:999px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)} .bar i.g{background:var(--gold)}
.mini{font-size:12px;color:var(--ink-3);font-weight:600}
.empty{text-align:center;padding:36px 20px;color:var(--ink-3)}
.empty svg{width:36px;height:36px;stroke:var(--ink-3);opacity:.6;margin-bottom:8px}
.empty p{margin:0 0 12px;font-weight:600;font-size:13.4px}

/* ---------- listas / feed ---------- */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.feed li:last-child{border-bottom:0}
.av{width:31px;height:31px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:11.5px;background:var(--brand-soft);color:var(--brand-deep)}
.av.g{background:var(--gold-soft);color:#7A5208}
.av.i{background:var(--info-soft);color:#22506F}
.av.b{background:var(--bad-soft);color:#8E2F26}
.feed .txt{min-width:0;flex:1}
.feed .txt b{font-weight:700}
.feed .when{font-size:11.6px;color:var(--ink-3);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);margin-bottom:9px;cursor:pointer;transition:border-color .14s}
.alert:hover{border-color:var(--brand-2)}
.alert.bad{background:var(--bad-soft);border-color:#F0D4CF}
.alert.warn{background:var(--warn-soft);border-color:#F2E2BE}
.alert.info{background:var(--info-soft);border-color:#D3E3EF}
.alert .ic{margin-top:2px}
.alert b{display:block;font-size:13.4px}
.alert p{margin:1px 0 0;font-size:12.6px;color:var(--ink-2)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,30,20,.46);backdrop-filter:blur(2px);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:18px;box-shadow:var(--sh-pop);width:100%;max-width:560px;animation:pop .17s ease-out}
.modal.wide{max-width:900px}
.modal.xl{max-width:1120px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:17px 19px 12px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:17px}
.modal-h .sub{font-size:12.6px;color:var(--ink-3);font-weight:600;margin-top:1px}
.modal-b{padding:16px 19px;max-height:66vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 19px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.x{margin-left:auto;border:0;background:var(--line-2);border-radius:9px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.x:hover{background:#E2EAE2}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.4px;margin:0}
.dl dt{color:var(--ink-3);font-weight:700;font-size:12.4px}
.dl dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.toast{background:#14281C;color:#EAF5EC;border-radius:12px;padding:10px 15px;font-size:13.4px;font-weight:600;box-shadow:var(--sh-pop);display:flex;gap:9px;align-items:center;animation:up .2s ease-out;pointer-events:auto;max-width:100%}
.toast .ic{color:#8ED6A6}
.toast.bad .ic{color:#F0A79E}
.toast button{margin-left:6px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;padding:3px 9px;font-weight:700;font-size:12.2px;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Ctrl+K ---------- */
.cmdk{background:var(--panel);border-radius:16px;box-shadow:var(--sh-pop);width:100%;max-width:620px;overflow:hidden;animation:pop .16s ease-out}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.cmdk-in input{border:0;outline:none;font-size:16px;width:100%;background:none;font-weight:600}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-list .g{font-size:10.8px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:9px 11px 4px}
.cmdk-list button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.6px;font-weight:600}
.cmdk-list button:hover,.cmdk-list button.sel{background:var(--brand-soft)}
.cmdk-list button .s{margin-left:auto;font-size:11.6px;color:var(--ink-3);font-weight:700}

/* ---------- mapa ---------- */
.mapwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#5C6E52}
#mapa{display:block;width:100%;height:auto;touch-action:manipulation}
.chacra-shape{cursor:pointer;transition:opacity .14s}
.chacra-shape:hover{opacity:.78}
.chacra-shape.dim{opacity:.16}
.map-lbl{font-size:8.4px;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(12,26,16,.85);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.map-lbl.sm{font-size:7px}
.map-zone{font-size:11.5px;font-weight:800;fill:#F1F7EE;paint-order:stroke;stroke:rgba(12,26,16,.6);stroke-width:3px;letter-spacing:.06em;pointer-events:none}
.map-tools{position:absolute;bottom:11px;left:11px;display:flex;gap:6px}
.map-tools button,.map-legend{background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.6);border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.map-tools button{width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.map-legend{position:absolute;right:11px;bottom:11px;padding:9px 11px;font-size:11.6px;max-width:190px}
.map-legend b{display:block;font-size:10.6px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.map-legend div{display:flex;align-items:center;gap:6px;font-weight:700;padding:1px 0;cursor:pointer}
.map-legend div:hover{color:var(--brand-deep)}
.map-legend i{width:11px;height:11px;border-radius:3px;display:block;flex:none}
.timeline{display:flex;align-items:center;gap:13px;padding:11px 15px;flex-wrap:wrap}
.timeline input[type=range]{flex:1;min-width:190px;accent-color:var(--brand)}
.timeline .t{font-weight:800;font-size:14px}

/* ---------- kanban ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:13px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:150px;transition:background .15s,border-color .15s}
.col.over{background:var(--brand-soft);border-color:var(--brand-2)}
.col h4{font-size:12.4px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 3px}
.col h4 span{margin-left:auto;background:var(--line-2);border-radius:999px;padding:1px 8px;font-size:11.4px;color:var(--ink-2)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);transition:box-shadow .14s,transform .1s}
.tk:hover{box-shadow:0 4px 14px rgba(20,40,28,.1)}
.tk.drag{opacity:.45;transform:rotate(-1.4deg)}
.tk b{display:block;font-size:13.4px}
.tk .m{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tk .bl{height:4px;border-radius:999px;margin:-10px -11px 9px;border-radius:11px 11px 0 0}

/* ---------- varios ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:15px;align-items:start}
.split>*,.grid>*,.stack>*,.board>*{min-width:0}
.card,.kpi{min-width:0;overflow:hidden}
.card-h{flex-wrap:wrap}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hint{background:var(--brand-soft);border:1px solid #C7E2D1;color:#1D5137;border-radius:11px;padding:9px 12px;font-size:12.8px;font-weight:600;display:flex;gap:9px;align-items:flex-start;margin-bottom:13px}
.hint .ic{flex:none;margin-top:1px}
.stack{display:flex;flex-direction:column;gap:9px;min-width:0}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sep{height:1px;background:var(--line-2);margin:13px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}
.corral{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel);cursor:pointer;transition:border-color .14s,transform .1s}
.corral:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.corral .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.corral .t span{margin-left:auto}
.gauge{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.gauge b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tour{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh-pop);width:318px;max-width:calc(100vw - 36px);padding:15px 16px}
.tour h4{font-size:14.5px;display:flex;align-items:center;gap:8px}
.tour p{font-size:13px;color:var(--ink-2);margin:7px 0 12px;font-weight:500}
.tour .f{display:flex;gap:7px;align-items:center}
.tour .f .d{display:flex;gap:4px;margin-right:auto}
.tour .f .d i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.tour .f .d i.on{background:var(--brand)}
.navtoggle{display:none}
.scrim.right{align-items:stretch;justify-content:flex-end;padding:0}
.drawer{background:var(--panel);width:100%;max-width:520px;height:100vh;overflow-y:auto;box-shadow:var(--sh-pop);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

@media(max-width:760px){
  .grid.cols2,.grid.cols3{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:21px}
  .dl{grid-template-columns:1fr auto}
  .timeline{gap:9px}
  .map-legend{position:static;margin:8px 0 0;max-width:none;box-shadow:none}
  .mapwrap{background:none;border:0}
  .mapwrap #mapa{border-radius:14px;border:1px solid var(--line)}
}
@media(max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:transform .2s;width:250px;box-shadow:var(--sh-pop)}
  .nav.open{transform:none}
  .main{margin-left:0}
  .navtoggle{display:inline-flex}
  .view{padding:14px 13px 70px}
  .top{padding:9px 13px}
  .top h1{font-size:17px}
  .split{grid-template-columns:1fr}
  .search span.lbl{display:none}
}
</style>

const nf = (n, dec = 0) => new Intl.NumberFormat('es-UY', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n || 0);
const dec = (v) => v >= 1 ? nf(v, 2) : nf(v, 3);
const usd = (n, dec = 0) => 'USD ' + nf(n, dec);
const uyu = (n, dec = 0) => '$U ' + nf(n, dec);
const fecha = (x) => { const f = x instanceof Date ? x : new Date(x); return `${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`; };
const fechaCorta = (x) => { const f = x instanceof Date ? x : new Date(x); return `${f.getDate()} ${MESES[f.getMonth()]}`; };

/* ==========================================================================
   Mapa de chacras — SVG propio, sin librerías
   ========================================================================== */
// Reparto recursivo del rectángulo en proporción al área: da polígonos vecinos
// que comparten borde, como las chacras de verdad.
function repartir(items, x, y, w, h, out) {
  if (!items.length) return out;
  if (items.length === 1) { out.push({ it: items[0], x, y, w, h }); return out; }
  const total = suma(items, (i) => i.ha);
  let acum = 0, corte = 1;
  for (let i = 0; i < items.length; i++) {
    acum += items[i].ha;
    if (acum >= total / 2) { corte = Math.max(1, Math.min(items.length - 1, i + 1)); break; }
  }
  const a = items.slice(0, corte), b = items.slice(corte);
  const pa = suma(a, (i) => i.ha) / total;
  if (w >= h) { repartir(a, x, y, w * pa, h, out); repartir(b, x + w * pa, y, w * (1 - pa), h, out); }
  else { repartir(a, x, y, w, h * pa, out); repartir(b, x, y + h * pa, w, h * (1 - pa), out); }
  return out;
}

const jitterCache = {};
function jitter(x, y, amp) {
  const k = Math.round(x * 2) + ':' + Math.round(y * 2);
  if (!jitterCache[k]) {
    const r = rng(k);
    jitterCache[k] = [(r() - 0.5) * 2, (r() - 0.5) * 2];
  }
  return [x + jitterCache[k][0] * amp, y + jitterCache[k][1] * amp];
}

function poligono(x, y, w, h) {
  const amp = Math.min(4.5, Math.max(1.4, Math.min(w, h) * 0.13));
  const pts = [];
  const lados = [[x, y, x + w, y], [x + w, y, x + w, y + h], [x + w, y + h, x, y + h], [x, y + h, x, y]];
  lados.forEach(([x1, y1, x2, y2]) => {
    pts.push(jitter(x1, y1, amp));
    const largo = Math.hypot(x2 - x1, y2 - y1);
    const n = largo > 46 ? 2 : largo > 22 ? 1 : 0;
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      pts.push(jitter(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, amp * 0.8));
    }
  });
  return pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
}

let MAPA_CACHE = null;
function calcularMapa() {
  if (MAPA_CACHE) return MAPA_CACHE;
  const W = 1000, H = 620, pad = 12;
  const zonas = {};
  CHACRAS.forEach((c) => { (zonas[c.zona] = zonas[c.zona] || { nombre: c.zona, ha: 0, chacras: [] }); zonas[c.zona].ha += c.ha; zonas[c.zona].chacras.push(c); });
  const lista = Object.values(zonas).sort((a, b) => b.ha - a.ha);
  const cajas = repartir(lista, pad, 34, W - pad * 2, H - 34 - 42, []);
  const salida = [];
  cajas.forEach((z) => {
    const g = z.it.chacras.slice().sort((a, b) => b.ha - a.ha);
    const inner = 5;
    const sub = repartir(g, z.x + inner, z.y + inner, Math.max(10, z.w - inner * 2), Math.max(10, z.h - inner * 2), []);
    salida.push({
      zona: z.it.nombre, ha: z.it.ha, x: z.x, y: z.y, w: z.w, h: z.h,
      chacras: sub.map((s) => ({ ch: s.it, x: s.x, y: s.y, w: s.w, h: s.h, pts: poligono(s.x, s.y, s.w, s.h) })),
    });
  });
  MAPA_CACHE = { W, H, zonas: salida };
  return MAPA_CACHE;
}

    $$('[data-alerta]').forEach((el) => { el.onclick = () => al[+el.dataset.alerta].ir(); });
    $$('#mapa polygon').forEach((p) => { p.onclick = () => verChacra(p.dataset.ch); });
    $$('[data-leyenda]').forEach((el) => { el.onclick = () => { S.mapaCultivo = S.mapaCultivo === el.dataset.leyenda ? null : el.dataset.leyenda; render(); }; });

VISTAS.mapa = {
  titulo: 'Mapa de chacras', sub: () => `${nf(HA_TOTAL)} ha · ${CHACRAS.length} chacras`,
  acciones: () => [
    { t: 'Bajar el plano', ic: 'i-bajar', fn: () => bajarCSV('austrey-chacras.csv', [['Chacra','Zona','Región','Hectáreas','Invierno 26','Verano 26/27','Variedad','NDVI']].concat(CHACRAS.map((c) => [c.nombre, c.zona, c.region, c.ha, c.invierno, c.verano, c.variedad || '', c.ndvi]))) },
  ],
  html() {
    const porCultivo = haPorCultivo(S.mapaTemporada === 0 ? 'invierno' : 'verano');
    const orden = Object.keys(porCultivo).sort((a, b) => porCultivo[b] - porCultivo[a]);
    return `
    <div class="card" style="margin-bottom:15px">
      <div class="timeline">
        <div class="seg" id="segTemp">
          <button class="${S.mapaTemporada === 0 ? 'on' : ''}" data-temp="0">Invierno 26</button>
          <button class="${S.mapaTemporada === 1 ? 'on' : ''}" data-temp="1">Verano 26/27</button>
        </div>
        <span class="t">${S.mapaTemporada === 0 ? 'Lo que está en el suelo hoy' : 'Lo que se siembra ahora'}</span>
        <input type="range" min="0" max="1" step="1" value="${S.mapaTemporada}" id="rangeTemp" aria-label="Temporada">
        <div class="seg" id="segReg">
          <button class="${S.mapaRegion === 'todas' ? 'on' : ''}" data-reg="todas">Todo</button>
          <button class="${S.mapaRegion === 'Durazno' ? 'on' : ''}" data-reg="Durazno">Durazno</button>
          <button class="${S.mapaRegion === 'Tacuarembó' ? 'on' : ''}" data-reg="Tacuarembó">Tacuarembó</button>
          <button class="${S.mapaRegion === 'Rivera' ? 'on' : ''}" data-reg="Rivera">Rivera</button>
        </div>
      </div>
    </div>
    <div class="split">
      <div class="mapwrap">
        ${dibujarMapa({ zoom: S.mapaZoom || 1 })}
        <div class="map-tools">
          <button id="zMas" aria-label="Acercar"><svg class="ic"><use href="#i-lupa-mas"/></svg></button>
          <button id="zMenos" aria-label="Alejar"><svg class="ic"><use href="#i-lupa-menos"/></svg></button>
          <button id="zCentro" aria-label="Centrar"><svg class="ic"><use href="#i-centro"/></svg></button>
        </div>
        ${leyendaMapa()}
      </div>
      <div class="stack">
        <div class="card"><div class="card-h"><h3>Superficie por cultivo</h3><div class="sub">${S.mapaTemporada === 0 ? 'invierno 26' : 'verano 26/27'}</div></div>
          <div class="card-b">${barras(orden.map((k) => ({ n: k, v: porCultivo[k], c: colorCultivo(k), txt: nf(porCultivo[k]) + ' ha' })), { anchoEtiqueta: 118 })}
          <div class="hint" style="margin:13px 0 0"><svg class="ic"><use href="#i-info"/></svg><span>Tocá un cultivo de la leyenda del mapa para dejar sólo esas chacras encendidas.</span></div></div></div>
        <div class="card"><div class="card-h"><h3>Por zona</h3></div><div class="card-b"><div class="tw"><table>
          <thead><tr><th>Zona</th><th class="num">Chacras</th><th class="num">Hectáreas</th></tr></thead><tbody>
          ${Object.entries(CHACRAS.reduce((o, c) => { o[c.zona] = o[c.zona] || { n: 0, ha: 0 }; o[c.zona].n++; o[c.zona].ha += c.ha; return o; }, {}))
            .sort((a, b) => b[1].ha - a[1].ha)
            .map(([z, v]) => `<tr class="tap" data-zona="${esc(z)}"><td class="str">${esc(z)}</td><td class="num">${v.n}</td><td class="num">${nf(v.ha)}</td></tr>`).join('')}
          <tr><td class="str">Total</td><td class="num">${CHACRAS.length}</td><td class="num"><b>${nf(HA_TOTAL)}</b></td></tr>
          </tbody></table></div></div></div>
      </div>
    </div>`;
  },
  luego() {
    $$('#segTemp button').forEach((b) => { b.onclick = () => { S.mapaTemporada = +b.dataset.temp; render(); }; });
    $('#rangeTemp').oninput = (e) => { S.mapaTemporada = +e.target.value; render(); };
    $$('#segReg button').forEach((b) => { b.onclick = () => { S.mapaRegion = b.dataset.reg; render(); }; });
    $('#zMas').onclick = () => { S.mapaZoom = Math.min(3.2, (S.mapaZoom || 1) * 1.35); render(); };
    $('#zMenos').onclick = () => { S.mapaZoom = Math.max(1, (S.mapaZoom || 1) / 1.35); render(); };
    $('#zCentro').onclick = () => { S.mapaZoom = 1; S.mapaCultivo = null; S.mapaRegion = 'todas'; render(); toast('Mapa centrado, sin filtros.'); };
    $$('#mapa polygon').forEach((p) => { p.onclick = () => verChacra(p.dataset.ch); });
    $$('[data-leyenda]').forEach((el) => { el.onclick = () => { S.mapaCultivo = S.mapaCultivo === el.dataset.leyenda ? null : el.dataset.leyenda; render(); }; });
    $$('[data-zona]').forEach((el) => { el.onclick = () => { S.chacraFiltroZona = el.dataset.zona; irA('chacras'); }; });
  },
};

VISTAS.chacras = {
  titulo: 'Chacras', sub: () => `${nf(HA_TOTAL)} ha arrendadas`,
  acciones: () => [
    { t: 'Exportar', ic: 'i-bajar', fn: () => bajarCSV('austrey-chacras.csv', [['Chacra','Zona','Región','Hectáreas','Invierno 26','Verano 26/27','Variedad','Tecnología','NDVI','pH','P ppm','K meq']].concat(chacrasFiltradas().map((c) => [c.nombre, c.zona, c.region, c.ha, c.invierno, c.verano, c.variedad || '', c.tecnologia || '', c.ndvi, c.ph, c.fosforo, c.potasio]))) },
  ],
  html() {
    const zonas = ['todas'].concat(Array.from(new Set(CHACRAS.map((c) => c.zona))).sort());
    const lista = chacrasFiltradas();
    const o = S.chacraOrden;
    const th = (k, t, num) => `<th class="sortable${num ? ' num' : ''}" data-ord="${k}">${t} <svg class="ic" aria-hidden="true" style="opacity:${o.k === k ? 1 : .3}"><use href="#${o.k === k ? (o.dir > 0 ? 'i-sube' : 'i-baja') : 'i-orden'}"/></svg></th>`;
    return `
    <div class="pill-row">
      ${zonas.map((z) => `<button class="chip ${S.chacraFiltroZona === z ? 'on' : ''}" data-z="${esc(z)}">${z === 'todas' ? 'Todas las zonas' : esc(z)}</button>`).join('')}
    </div>
    <div class="grid kpis">
      <div class="kpi"><div class="lbl">Chacras a la vista</div><div class="val">${lista.length}</div><div class="foot">${nf(suma(lista, (c) => c.ha))} ha</div></div>
      <div class="kpi"><div class="lbl">Soja verano 26/27</div><div class="val">${nf(suma(CHACRAS.filter((c) => c.verano.startsWith('Soja')), (c) => c.ha))} <small>ha</small></div><div class="foot">1era, 2da e intermedia</div></div>
      <div class="kpi"><div class="lbl">Maíz verano 26/27</div><div class="val">${nf(suma(CHACRAS.filter((c) => c.verano.startsWith('Maiz')), (c) => c.ha))} <small>ha</small></div><div class="foot">de primera y de segunda</div></div>
      <div class="kpi"><div class="lbl">NDVI promedio</div><div class="val">${nf(suma(lista, (c) => c.ndvi) / (lista.length || 1), 2)}</div><div class="foot">imagen del 13/09/2026</div></div>
    </div>
    <div class="card"><div class="card-b pad"><div class="tw"><table>
      <thead><tr>${th('nombre','Chacra')}${th('zona','Zona')}${th('ha','Hectáreas',1)}${th('invierno','Invierno 26')}${th('verano','Verano 26/27')}<th>Variedad</th>${th('ndvi','NDVI',1)}<th></th></tr></thead>
      <tbody>${lista.map((c) => `
        <tr class="tap" data-ch="${c.id}">
          <td class="str">${esc(c.nombre)}<div class="mini">${esc(c.region)}</div></td>
          <td>${esc(c.zona)}</td>
          <td class="num">${nf(c.ha, c.ha % 1 ? 1 : 0)}</td>
          <td><span class="dot" style="background:${colorCultivo(c.invierno)}"></span>${esc(c.invierno)}</td>
          <td><span class="dot" style="background:${colorCultivo(c.verano)}"></span>${esc(c.verano)}</td>
          <td>${c.variedad ? esc(c.variedad) : '<span class="mini">—</span>'}</td>
          <td class="num">${nf(c.ndvi, 2)}</td>
          <td style="width:80px"><span class="bar"><i class="${c.ndvi > .6 ? '' : c.ndvi > .45 ? 'g' : 'w'}" style="width:${c.ndvi * 100}%"></i></span></td>
        </tr>`).join('')}</tbody>
      <tfoot><tr><th>Total</th><th></th><th class="num">${nf(suma(lista, (c) => c.ha))}</th><th colspan="5"></th></tr></tfoot>
    </table></div></div></div>`;
  },
  luego() {
    $$('[data-z]').forEach((b) => { b.onclick = () => { S.chacraFiltroZona = b.dataset.z; render(); }; });
    $$('[data-ord]').forEach((t) => { t.onclick = () => { const k = t.dataset.ord; S.chacraOrden = { k, dir: S.chacraOrden.k === k ? -S.chacraOrden.dir : 1 }; render(); }; });
    $$('[data-ch]').forEach((t) => { t.onclick = () => verChacra(t.dataset.ch); });
  },
};
function chacrasFiltradas() {
  let l = CHACRAS.filter((c) => S.chacraFiltroZona === 'todas' || c.zona === S.chacraFiltroZona);
  const { k, dir } = S.chacraOrden;
  return l.sort((a, b) => (typeof a[k] === 'number' ? a[k] - b[k] : String(a[k]).localeCompare(String(b[k]), 'es')) * dir);
}

VISTAS.siembra = {
  titulo: 'Plan de siembra', sub: () => 'Verano 26/27 · lo que se está sembrando',
  acciones: () => [
    { t: 'Exportar plan', ic: 'i-bajar', fn: () => bajarCSV('austrey-plan-siembra-26-27.csv', [['Chacra','Zona','Hectáreas','Cultivo','Variedad','Tecnología','Semilla estimada','Unidad']].concat(CHACRAS.filter((c) => (CULTIVOS[c.verano] || {}).tipo === 'verano').map((c) => { const s = semillaNecesaria(c); return [c.nombre, c.zona, c.ha, c.verano, c.variedad || '', c.tecnologia || '', s.cant, s.unidad]; }))) },
  ],
  html() {
    const verano = CHACRAS.filter((c) => (CULTIVOS[c.verano] || {}).tipo === 'verano');
    const porCultivo = {};
    verano.forEach((c) => { porCultivo[c.verano] = (porCultivo[c.verano] || 0) + c.ha; });
    const bolsasPorHibrido = {};
    verano.filter((c) => c.verano.startsWith('Maiz')).forEach((c) => { bolsasPorHibrido[c.variedad] = (bolsasPorHibrido[c.variedad] || 0) + semillaNecesaria(c).cant; });
    const kgPorVariedad = {};
    verano.filter((c) => c.verano.startsWith('Soja')).forEach((c) => { kgPorVariedad[c.variedad] = (kgPorVariedad[c.variedad] || 0) + semillaNecesaria(c).cant; });
    const sembrado = haSembrada();
    return `
    <div class="grid kpis">
      <div class="kpi"><div class="lbl">Superficie de verano</div><div class="val">${nf(suma(verano, (c) => c.ha))} <small>ha</small></div><div class="foot">${verano.length} chacras</div></div>
      <div class="kpi"><div class="lbl">Sembrado</div><div class="val">${nf(sembrado)} <small>ha</small></div><div class="foot">${nf((sembrado / suma(verano, (c) => c.ha)) * 100, 1)}% del plan</div></div>
      <div class="kpi"><div class="lbl">Bolsas de maíz</div><div class="val">${nf(suma(Object.values(bolsasPorHibrido)))}</div><div class="foot">de 80.000 semillas</div></div>
      <div class="kpi"><div class="lbl">Semilla de soja</div><div class="val">${nf(suma(Object.values(kgPorVariedad)) / 1000)} <small>t</small></div><div class="foot">a ${nf(57.1, 1)} - ${nf(65.3, 1)} kg/ha según fecha</div></div>
    </div>
    <div class="split">
      <div class="card"><div class="card-h"><h3>Chacra por chacra</h3><div class="sub">objetivo de siembra y semilla necesaria</div></div>
        <div class="card-b pad"><div class="tw"><table>
        <thead><tr><th>Chacra</th><th class="num">ha</th><th>Cultivo</th><th>Variedad</th><th>Tec.</th><th class="num">Semilla</th><th class="num">Avance</th></tr></thead>
        <tbody>${verano.map((c) => { const s = semillaNecesaria(c); const lab = LABORES.find((l) => l.tipo === 'Siembra' && l.chacra === c.id);
          const p = lab ? (lab.haHechas / lab.haPlan) * 100 : 0;
          return `<tr class="tap" data-ch="${c.id}">
            <td class="str">${esc(c.nombre)}<div class="mini">${esc(c.zona)}</div></td>
            <td class="num">${nf(c.ha, c.ha % 1 ? 1 : 0)}</td>
            <td><span class="dot" style="background:${colorCultivo(c.verano)}"></span>${esc(c.verano)}</td>
            <td>${c.variedad ? esc(c.variedad) : '<span class="mini">—</span>'}</td>
            <td><span class="mini">${c.tecnologia ? esc(c.tecnologia) : '—'}</span></td>
            <td class="num">${nf(s.cant)} <span class="mini">${s.unidad}</span></td>
            <td class="num">${p > 0 ? `<span class="tag ${p >= 100 ? 't-ok' : 't-info'}">${nf(p)}%</span>` : '<span class="tag t-mute">sin arrancar</span>'}</td>
          </tr>`; }).join('')}</tbody></table></div></div></div>
      <div class="stack">

function semillaNecesaria(c) {
  if (c.verano.startsWith('Maiz')) {
    const semHa = c.verano === 'Maiz 1era' ? 58000 : 68000;
    const logrado = semHa / (0.95 * 0.9);
    return { cant: Math.round((logrado / 80000) * c.ha), unidad: 'bolsas', detalle: `${nf(semHa)} sem/ha objetivo · 0,95 PG · 0,90 logro` };
  }
  if (c.verano.startsWith('Soja')) {
    const kgHa = c.verano === 'Soja 1era' ? 57.1 : c.verano === 'Soja intermedia' ? 61.2 : 65.3;
    return { cant: Math.round(kgHa * c.ha), unidad: 'kg', detalle: `${nf(kgHa, 1)} kg/ha · PMS 0,155 · logro 85%` };
  }
  return { cant: Math.round(c.ha * 12), unidad: 'kg', detalle: 'siembra de verdeo o sorgo' };
}

function moverLabor(id, estado) {
  const l = LABORES.find((x) => x.id === id);
  if (!l || l.estado === estado) return;
  const antes = l.estado, antesHa = l.haHechas;
  l.estado = estado;
  if (estado === 'hecha' || estado === 'fact') l.haHechas = l.haPlan;
  if (estado === 'plan') l.haHechas = 0;
  if (estado === 'curso' && l.haHechas === 0) l.haHechas = Math.round(l.haPlan * 0.2);
  const ch = chacra(l.chacra);
  ACTIVIDAD.unshift({ u: S.usuario, t: `Pasó <b>${l.tipo} · ${ch.nombre}</b> a ${ESTADOS_LABOR.find((e) => e.k === estado).t.toLowerCase()}.`, h: 0, k: estado === 'hecha' ? 'ok' : 'info' });
  render();
  toast(`<b>${esc(l.tipo)} · ${esc(ch.nombre)}</b> pasó a ${ESTADOS_LABOR.find((e) => e.k === estado).t.toLowerCase()}.`, {
    accion: 'Deshacer', alTocar: () => { l.estado = antes; l.haHechas = antesHa; ACTIVIDAD.shift(); render(); toast('Listo, lo dejé como estaba.'); },
  });
}

function pagar(id) {
  const m = MOVIMIENTOS.find((x) => x.id === id);
  if (!m || m.estado !== 'Pendiente') return;
  confirmar('Registrar el pago', `Vas a marcar <b>${esc(m.concepto)}</b> por ${m.moneda === 'USD' ? usd(m.monto) : uyu(m.monto)} como pagado. Sale de la cuenta en ${m.moneda}.`, 'Pagar', () => {
    m.estado = 'Pagado';
    const cta = CUENTAS.find((c) => c.moneda === m.moneda);
    if (cta) cta.saldo -= m.monto;
    ACTIVIDAD.unshift({ u: S.usuario, t: `Pagó <b>${m.concepto}</b> por ${m.moneda === 'USD' ? usd(m.monto) : uyu(m.monto)}.`, h: 0, k: 'g' });
    render();
    toast(`Pagado. La alerta de vencimiento desapareció sola.`);
  });
}

      <div class="kpi"><div class="lbl">Margen soja</div><div class="val" style="color:${ms.margen >= 0 ? 'var(--brand)' : 'var(--bad)'}">${usd(ms.margen)}<small>/ha</small></div><div class="foot">${nf(haSoja)} ha de soja, ${usd(ms.margen * haSoja)} en total</div></div>
      <div class="kpi"><div class="lbl">Margen maíz</div><div class="val" style="color:${mm.margen >= 0 ? 'var(--brand)' : 'var(--bad)'}">${usd(mm.margen)}<small>/ha</small></div><div class="foot">${nf(haMaiz)} ha de maíz, ${usd(mm.margen * haMaiz)} en total</div></div>
      <div class="kpi"><div class="lbl">Resultado de verano</div><div class="val" style="font-size:21px">${usd(ms.margen * haSoja + mm.margen * haMaiz)}</div><div class="foot">sobre ${nf(haSoja + haMaiz)} ha de verano</div></div>
      <div class="kpi"><div class="lbl">Capital de trabajo</div><div class="val" style="font-size:21px">${usd(ms.total * haSoja + mm.total * haMaiz)}</div><div class="foot">lo que hay que poner antes de cosechar</div></div>
    </div>
    <div class="grid cols2">
      ${bloque('Soja', 'Soja', S.margenSoja)}
      ${bloque('Maíz', 'Maiz', S.margenMaiz)}
    </div>`;
  },
  luego() {
    $$('[data-m]').forEach((inp) => {
      inp.oninput = () => {
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        const destino = inp.dataset.m === 'Soja' ? S.margenSoja : S.margenMaiz;
        destino[inp.dataset.campo] = v;
        CULTIVOS[inp.dataset.m === 'Soja' ? 'Soja 1era' : 'Maiz 1era'].rinde = inp.dataset.campo === 'rinde' ? v : CULTIVOS[inp.dataset.m === 'Soja' ? 'Soja 1era' : 'Maiz 1era'].rinde;
        const foco = inp.dataset.m + inp.dataset.campo;
        render();
        const nuevo = $(`[data-m="${inp.dataset.m}"][data-campo="${inp.dataset.campo}"]`);
        if (nuevo) nuevo.focus();
        void foco;
      };
    });
  },
};

function verCorral(id) {
  const c = CORRALES.find((x) => x.id === id);
  if (!c.cab) { encerrarTanda(id); return; }
  const dt = DIETAS.find((x) => x.nombre === c.dieta);
  const dd = -c.entrada;
  const kgProd = c.cab * (c.pesoHoy - c.pesoEntrada);
  const costoRacion = c.cab * c.consumo * dt.costoKgMS * dd;
  modal(`${cabezalModal(c.nombre, `${esc(c.cat)} · ${nf(c.cab)} cabezas · ${dd} días`)}
    <div class="modal-b"><dl class="dl">
      <dt>Peso de entrada</dt><dd>${nf(c.pesoEntrada)} kg</dd>
      <dt>Peso de hoy</dt><dd>${nf(c.pesoHoy)} kg</dd>
      <dt>Aumento diario</dt><dd><b>${nf(c.adpv, 2)} kg/día</b></dd>

function moverHacienda(rodeoId) {
  modal(`${cabezalModal('Mover hacienda', 'genera la guía de propiedad y tránsito')}
    <div class="modal-b">
      <label class="fld"><span>Rodeo</span><select class="inp" id="mhRodeo">
        ${RODEOS.map((r) => `<option value="${r.id}" ${r.id === rodeoId ? 'selected' : ''}>${esc(r.nombre)} · ${nf(r.cab)} cab · ${esc(campoGan(r.campo).nombre)}</option>`).join('')}</select></label>
      <div class="g2">
        <label class="fld"><span>Cabezas</span><input class="inp" type="number" id="mhCab" value="100" min="1"></label>
        <label class="fld"><span>Campo de destino</span><select class="inp" id="mhDest">
          ${CAMPOS_GAN.map((g) => `<option value="${g.id}">${esc(g.nombre)}</option>`).join('')}</select></label>
      </div>
    </div>
    <div class="modal-f"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okMh">Mover y emitir la guía</button></div>`,
    { luego: (sc) => {
      $('#okMh', sc).onclick = () => {
        const r = rodeo($('#mhRodeo', sc).value);
        const cab = Math.min(r.cab, Math.abs(parseInt($('#mhCab', sc).value, 10) || 0));
        const dest = campoGan($('#mhDest', sc).value);
        if (!cab) { toast('Poné cuántas cabezas se mueven.', { mal: true }); return; }
        const origen = campoGan(r.campo);
        if (origen.id === dest.id) { toast('El origen y el destino son el mismo campo.', { mal: true }); return; }
        r.cab -= cab;
        let destino = RODEOS.find((x) => x.campo === dest.id && x.cat === r.cat);
        if (destino) destino.cab += cab;
        else RODEOS.push({ id: uid(), nombre: `${r.cat} en ${dest.nombre}`, campo: dest.id, cat: r.cat, cab, preniadas: 0, pesoProm: r.pesoProm, dicose: 'D-0' + Math.floor(400 + Math.random() * 500) });
        ACTIVIDAD.unshift({ u: S.usuario, t: `Movió <b>${nf(cab)} ${r.cat.toLowerCase()}</b> de ${origen.nombre} a ${dest.nombre}.`, h: 0, k: 'info' });
        cerrarModal(); render();
        toast(`Guía emitida: <b>${nf(cab)} cabezas</b> de ${esc(origen.nombre)} a ${esc(dest.nombre)}.`);
      };
    } });
}

  const terneros = RODEOS.filter((r) => r.cat === 'Terneros' || r.cat === 'Novillos 1-2');
  modal(`${cabezalModal('Encerrar una tanda', 'de la recría al feedlot')}

        ACTIVIDAD.unshift({ u: S.usuario, t: `Encerró <b>${nf(cab)} cabezas</b> de ${r.nombre} en ${c.nombre}.`, h: 0, k: 'ok' });
        cerrarModal(); irA('feedlot');
        toast(`<b>${esc(c.nombre)}</b> con ${nf(cab)} cabezas. El aviso de corral vacío se apagó.`);
      };
    } });
}

function nuevoContrato() {
  modal(`${cabezalModal('Nuevo contrato de venta')}
    <div class="modal-b">
      <div class="g2">
        <label class="fld"><span>Comprador</span><select class="inp" id="kcComp">${COMPRADORES.map((c) => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></label>
        <label class="fld"><span>Grano</span><select class="inp" id="kcGrano"><option>Soja</option><option>Maíz</option><option>Trigo</option><option>Cebada</option><option>Colza</option></select></label>
      </div>
      <div class="g2">
        <label class="fld"><span>Toneladas</span><input class="inp" type="number" id="kcTon" value="2000" min="1"></label>
        <label class="fld"><span>Precio USD/t (0 = a fijar)</span><input class="inp" type="number" id="kcPrecio" value="420" min="0"></label>
      </div>
      <label class="fld"><span>Entrega</span><select class="inp" id="kcEnt">
        <option value="60">En dos meses</option><option value="120">En cuatro meses</option><option value="186" selected>Con la cosecha de soja</option></select></label>
    </div>
    <div class="modal-f"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okKc">Cerrar el contrato</button></div>`,
    { luego: (sc) => {
      $('#okKc', sc).onclick = () => {
        const precio = Math.abs(parseFloat($('#kcPrecio', sc).value) || 0);
        const k = { id: uid(), comprador: $('#kcComp', sc).value, grano: $('#kcGrano', sc).value, zafra: '26/27',
          ton: Math.abs(parseInt($('#kcTon', sc).value, 10) || 0), entregadas: 0, precio,
          entrega: +$('#kcEnt', sc).value, estado: precio ? 'Forward' : 'A fijar', puerto: 'Nueva Palmira' };
        CONTRATOS.push(k);
        ACTIVIDAD.unshift({ u: S.usuario, t: `Cerró ${nf(k.ton)} t de ${k.grano} con ${comprador(k.comprador).nombre}${precio ? ' a ' + usd(precio) + '/t' : ' a fijar'}.`, h: 0, k: 'g' });
        S.granoZafra = '26/27';
        cerrarModal(); irA('granos');
        toast(`Contrato cargado. La posición de ${esc(k.grano)} se movió sola.`);
      };
    } });
}

function nuevoMovimiento() {
  modal(`${cabezalModal('Registrar un movimiento')}
    <div class="modal-b">
      <label class="fld"><span>Concepto</span><input class="inp" id="nmCon" placeholder="Por ejemplo: pago de jornales de cosecha"></label>
      <div class="g2">
        <label class="fld"><span>Tipo</span><select class="inp" id="nmTipo"><option>Egreso</option><option>Ingreso</option></select></label>
        <label class="fld"><span>Categoría</span><select class="inp" id="nmCat">
          ${['Insumos','Fertilizante','Fitosanitario','Semilla','Combustible','Personal','Renta','Ganadería','Granos','Flete','Maquinaria','Impuestos','Financiero','Seguros'].map((c) => `<option>${c}</option>`).join('')}</select></label>
      </div>
      <div class="g2">
        <label class="fld"><span>Moneda</span><select class="inp" id="nmMon"><option>USD</option><option>UYU</option></select></label>
        <label class="fld"><span>Importe</span><input class="inp" type="number" id="nmMonto" value="25000" min="0"></label>
      </div>
      <label class="fld"><span>Vencimiento</span><select class="inp" id="nmVenc">
        <option value="0">Hoy</option><option value="7">En una semana</option><option value="30" selected>A 30 días</option><option value="60">A 60 días</option></select></label>
    </div>
    <div class="modal-f"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okNm">Registrar</button></div>`,
    { luego: (sc) => {
      $('#okNm', sc).onclick = () => {
        const m = { id: uid(), fecha: 0, concepto: $('#nmCon', sc).value.trim() || 'Movimiento de caja',
          tipo: $('#nmTipo', sc).value, cat: $('#nmCat', sc).value, moneda: $('#nmMon', sc).value,
          monto: Math.abs(parseFloat($('#nmMonto', sc).value) || 0), ref: null,
          estado: $('#nmTipo', sc).value === 'Ingreso' ? 'Cobrado' : 'Pendiente', venc: +$('#nmVenc', sc).value };
        MOVIMIENTOS.unshift(m);
        ACTIVIDAD.unshift({ u: S.usuario, t: `Registró <b>${m.concepto}</b> por ${m.moneda === 'USD' ? usd(m.monto) : uyu(m.monto)}.`, h: 0, k: 'g' });
        cerrarModal(); render();
        toast(`Movimiento registrado.`, { accion: 'Verlo', alTocar: () => verMovimiento(m.id) });
      };
    } });
}

/* ==========================================================================
   Navegación, buscador y arranque
   ========================================================================== */
const MENU = [
  { g: 'Campo' },
  { k: 'panel', t: 'Panel', ic: 'i-panel' },
  { k: 'mapa', t: 'Mapa de chacras', ic: 'i-mapa' },
  { k: 'chacras', t: 'Chacras', ic: 'i-chacra' },
  { k: 'siembra', t: 'Plan de siembra', ic: 'i-siembra' },
  { k: 'labores', t: 'Labores', ic: 'i-labor', badge: () => LABORES.filter((l) => l.estado === 'curso').length },
  { k: 'insumos', t: 'Insumos', ic: 'i-insumo', badge: () => INSUMOS.filter((i) => stockTotal(i) < i.minimo).length },
  { g: 'Ganadería' },
  { k: 'hacienda', t: 'Hacienda', ic: 'i-hacienda' },
  { k: 'feedlot', t: 'Feedlot', ic: 'i-feedlot' },
  { g: 'Negocio' },
  { k: 'granos', t: 'Granos', ic: 'i-grano' },
  { k: 'finanzas', t: 'Finanzas', ic: 'i-plata', badge: () => MOVIMIENTOS.filter((m) => m.estado === 'Pendiente' && m.venc <= 10).length },
  { k: 'margen', t: 'Costos y margen', ic: 'i-margen' },
  { k: 'arriendos', t: 'Arrendamientos', ic: 'i-contrato' },
  { g: 'Otros' },
  { k: 'equipo', t: 'Equipo', ic: 'i-equipo' },
  { k: 'config', t: 'Preferencias', ic: 'i-config' },
];

function pintarMenu() {
  $('#navScroll').innerHTML = MENU.map((m) => {
    if (m.g) return `<div class="nav-group">${esc(m.g)}</div>`;
    const b = m.badge ? m.badge() : 0;
    return `<button class="item ${S.vista === m.k ? 'on' : ''}" data-v="${m.k}">
      <svg class="ic"><use href="#${m.ic}"/></svg>${esc(m.t)}${b ? `<span class="badge">${b}</span>` : ''}</button>`;
  }).join('');
  $$('#navScroll [data-v]').forEach((b) => { b.onclick = () => irA(b.dataset.v); });
}

function irA(v) {
  if (!VISTAS[v]) return;
  S.vista = v;
  cerrarModal();
  $('#nav').classList.remove('open');
  render();
  $('#view').scrollIntoView({ block: 'start' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const v = VISTAS[S.vista];
  $('#vTitle').textContent = v.titulo;
  $('#vSub').innerHTML = v.sub ? v.sub() : '';
  const acciones = v.acciones ? v.acciones() : [];
  $('#topActions').innerHTML = acciones.map((a, i) => `<button class="btn ${a.cls || ''}" data-acc="${i}"><svg class="ic"><use href="#${a.ic}"/></svg>${esc(a.t)}</button>`).join('');
  $$('#topActions [data-acc]').forEach((b) => { b.onclick = () => acciones[+b.dataset.acc].fn(); });
  $('#view').innerHTML = v.html();
  v.luego && v.luego();
  pintarMenu();
  $$('[data-cerrar]').forEach((b) => { b.onclick = cerrarModal; });
}

/* ------------------------------- Ctrl + K ------------------------------- */
function indice() {
  const ix = [];
  MENU.filter((m) => m.k).forEach((m) => ix.push({ g: 'Ir a', t: m.t, ic: m.ic, s: 'vista', fn: () => irA(m.k) }));
  CHACRAS.forEach((c) => ix.push({ g: 'Chacras', t: c.nombre, ic: 'i-chacra', s: `${nf(c.ha)} ha · ${c.zona}`, fn: () => verChacra(c.id) }));
  RODEOS.forEach((r) => ix.push({ g: 'Hacienda', t: r.nombre, ic: 'i-hacienda', s: `${nf(r.cab)} cabezas`, fn: () => verRodeo(r.id) }));
  CORRALES.filter((c) => c.cab).forEach((c) => ix.push({ g: 'Feedlot', t: c.nombre, ic: 'i-feedlot', s: `${nf(c.cab)} cabezas`, fn: () => verCorral(c.id) }));
  INSUMOS.forEach((i) => ix.push({ g: 'Insumos', t: i.nombre, ic: 'i-insumo', s: `${nf(stockTotal(i))} ${i.unidad}`, fn: () => verInsumo(i.id) }));
  CONTRATOS.forEach((k) => ix.push({ g: 'Granos', t: `${k.grano} · ${comprador(k.comprador).nombre}`, ic: 'i-grano', s: `${nf(k.ton)} t · ${k.zafra}`, fn: () => verContrato(k.id) }));
  ARRIENDOS.forEach((a) => ix.push({ g: 'Arrendamientos', t: a.campo, ic: 'i-contrato', s: `${nf(a.ha)} ha · ${a.propietario}`, fn: () => verArriendo(a.id) }));
  EQUIPO.forEach((p) => ix.push({ g: 'Equipo', t: p.nombre, ic: 'i-equipo', s: p.rol, fn: () => irA('equipo') }));
  LABORES.forEach((l) => ix.push({ g: 'Labores', t: `${l.tipo} · ${chacra(l.chacra).nombre}`, ic: 'i-labor', s: haceTexto(l.fecha), fn: () => verLabor(l.id) }));
  ix.push({ g: 'Acciones', t: 'Cargar una labor', ic: 'i-mas', s: 'nuevo', fn: () => nuevaLabor() });
  ix.push({ g: 'Acciones', t: 'Nueva orden de compra', ic: 'i-mas', s: 'nuevo', fn: nuevaCompra });
  ix.push({ g: 'Acciones', t: 'Mover hacienda', ic: 'i-camion', s: 'guía de tránsito', fn: () => moverHacienda() });
  ix.push({ g: 'Acciones', t: 'Encerrar una tanda en el feedlot', ic: 'i-feedlot', s: 'nuevo', fn: () => encerrarTanda() });
  ix.push({ g: 'Acciones', t: 'Nuevo contrato de venta', ic: 'i-grano', s: 'nuevo', fn: nuevoContrato });
  ix.push({ g: 'Acciones', t: 'Registrar un movimiento', ic: 'i-plata', s: 'nuevo', fn: nuevoMovimiento });
  ix.push({ g: 'Acciones', t: 'Volver a ver el recorrido guiado', ic: 'i-info', s: 'ayuda', fn: () => { S.tour = 0; pintarTour(); } });
  return ix;
}
let IX = null, ixSel = 0;
function abrirK() {
  IX = IX || indice();
  ixSel = 0;
  const sc = modal(`<div class="cmdk">
    <div class="cmdk-in"><svg class="ic ic-lg" style="color:var(--ink-3)"><use href="#i-buscar"/></svg>
      <input id="kIn" placeholder="Buscá una chacra, un rodeo, un contrato o una acción…" autocomplete="off" aria-label="Buscar"></div>
    <div class="cmdk-list" id="kList"></div></div>`);
  const cont = sc.querySelector('.cmdk');
  cont.className = 'cmdk';
  const modalDiv = sc.querySelector('.modal');
  if (modalDiv) modalDiv.replaceWith(cont);
  const inp = $('#kIn'), list = $('#kList');
  const pintar = () => {
    const q = inp.value.trim().toLowerCase();
    const res = (q ? IX.filter((x) => (x.t + ' ' + x.g + ' ' + x.s).toLowerCase().includes(q)) : IX.filter((x) => x.g === 'Ir a' || x.g === 'Acciones')).slice(0, 26);
    ixSel = Math.min(ixSel, Math.max(0, res.length - 1));
    let g = '', h = '';
    res.forEach((x, i) => {
      if (x.g !== g) { g = x.g; h += `<div class="g">${esc(g)}</div>`; }
      h += `<button data-i="${i}" class="${i === ixSel ? 'sel' : ''}"><svg class="ic"><use href="#${x.ic}"/></svg>${esc(x.t)}<span class="s">${esc(x.s)}</span></button>`;
    });
    list.innerHTML = h || `<div class="empty"><p>No encontré nada con eso.</p></div>`;
    $$('#kList button').forEach((b) => { b.onclick = () => { cerrarModal(); res[+b.dataset.i].fn(); }; });
    list._res = res;
  };
  inp.oninput = () => { ixSel = 0; pintar(); };
  inp.onkeydown = (e) => {
    const res = list._res || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); ixSel = Math.min(res.length - 1, ixSel + 1); pintar(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); ixSel = Math.max(0, ixSel - 1); pintar(); }
    if (e.key === 'Enter' && res[ixSel]) { e.preventDefault(); cerrarModal(); res[ixSel].fn(); }
  };
  pintar();
  inp.focus();
}

/* ------------------------------- recorrido ------------------------------ */
const PASOS_TOUR = [
  { t: 'Esto es Austrey adentro del sistema', p: `Las ${CHACRAS.length} chacras con sus hectáreas, la rotación de invierno 26 y verano 26/27, y la planilla de costos, tal cual la manejan hoy.` },
  { t: 'El mapa piensa por chacra', p: 'Cada polígono es una chacra con su área real y el color del cultivo. Cambiá de temporada y el campo entero cambia.' },
  { t: 'Todo lo que tocás mueve otra cosa', p: 'Arrastrá una labor a Terminada, cambiá el rinde en Costos y margen o pagá un vencimiento: el panel, la posición de venta y las alertas se recalculan solos.' },
];
function pintarTour() {
  const p = PASOS_TOUR[S.tour];
  if (!p) { $('#tourRoot').innerHTML = ''; return; }
  $('#tourRoot').innerHTML = `<div class="tour">
    <h4><svg class="ic" style="color:var(--brand)"><use href="#i-hoja"/></svg>${esc(p.t)}</h4>
    <p>${esc(p.p)}</p>
    <div class="f"><span class="d">${PASOS_TOUR.map((_, i) => `<i class="${i === S.tour ? 'on' : ''}"></i>`).join('')}</span>
      <button class="btn sm ghost" id="tSalir">Cerrar</button>
      <button class="btn sm pri" id="tSig">${S.tour === PASOS_TOUR.length - 1 ? 'Listo' : 'Seguir'}</button></div></div>`;
  $('#tSalir').onclick = () => { $('#tourRoot').innerHTML = ''; };
  $('#tSig').onclick = () => {
    S.tour++;
    if (S.tour === 1) irA('mapa');
    if (S.tour === 2) irA('labores');
    if (S.tour >= PASOS_TOUR.length) { $('#tourRoot').innerHTML = ''; toast('Si querés volver a verlo, apretá Ctrl+K y buscá <b>recorrido</b>.'); return; }
    pintarTour();
  };
}

/* ------------------------------ vive solo ------------------------------- */
const NOVEDADES = [
  () => { const c = CORRALES.find((x) => x.cab); if (!c) return null; c.pesoHoy += Math.round(c.adpv); 
    return { t: `Pesada de rutina: <b>${c.nombre}</b> pasó a ${nf(c.pesoHoy)} kg promedio.`, u: 'u8', k: 'ok' }; },
  () => { const l = LABORES.find((x) => x.estado === 'curso'); if (!l) return null;
    l.haHechas = Math.min(l.haPlan, l.haHechas + Math.round(l.haPlan * 0.08));
    return { t: `Parte de labor desde la chacra: <b>${l.tipo} en ${chacra(l.chacra).nombre}</b> va por ${nf(l.haHechas)} ha.`, u: 'u4', k: 'info' }; },
  () => { const k = CONTRATOS.find((x) => x.estado === 'A fijar'); if (!k) return null;
    return { t: `${comprador(k.comprador).nombre} ofrece <b>${usd(CULTIVOS['Soja 1era'].precio + 6)}/t</b> para fijar las ${nf(k.ton)} t de ${k.grano}.`, u: 'u2', k: 'g' }; },
  () => { const i = INSUMOS.find((x) => stockTotal(x) < x.minimo); if (!i) return null;
    return { t: `Barraca Erro avisa que tiene <b>${i.nombre}</b> para entrega en 48 horas.`, u: 'u10', k: 'info' }; },
  () => ({ t: 'La estación de Santa Clara registró <b>6 mm</b> en la última hora.', u: 'u5', k: 'info' }),
];
let novedadIx = 0;
function latir() {
  const gen = NOVEDADES[novedadIx % NOVEDADES.length];
  novedadIx++;
  const n = gen();
  if (!n) return;
  ACTIVIDAD.unshift({ u: n.u, t: n.t, h: 0, k: n.k });
  if (ACTIVIDAD.length > 14) ACTIVIDAD.pop();
  if (!$('#modalRoot').firstChild) render();
  toast(n.t, { ms: 5200 });
}

/* -------------------------------- arranque ------------------------------ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); abrirK(); }
  if (e.key === 'Escape') cerrarModal();
});
$('#openK').onclick = abrirK;
$('#navToggle').onclick = () => $('#nav').classList.toggle('open');

pintarMenu();
render();
setTimeout(pintarTour, 900);
setInterval(latir, 38000);
</script>
</body>
</html>
